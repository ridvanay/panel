      summary: Yazıyı KALICI sil — geri alınamaz (ADMIN veya MANAGER)
      description: >
        `DELETE /admin/pages/{pageId}/permanent` ile aynı kural: yazı ÖNCE çöpte olmalı,
        değilse 409. Aynı transaction'da `ContentRevision` satırları
        (`entityType = BLOG_POST AND entityId = {postId}`) elle silinir; `PageView`
        cascade ile düşer; `AuditLog` (`blog_post.permanent_delete`) yazılır.
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İçerik çöpte değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/blog/bulk:
    post:
      tags: [Blog]
      summary: Blog yazılarında toplu işlem (ADMIN/MANAGER/EDITOR; permanent-delete ADMIN/MANAGER)
      description: >
        `POST /admin/pages/bulk` ile BİREBİR AYNI gövde, aynı yanıt, aynı atlama kuralları.
        Audit action öneki `blog_post.bulk_<action>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkContentActionRequest" }
      responses:
        "200":
          description: İşlem uygulandı (kısmi başarı dahil)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BulkContentActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/pages/{pageId}/revisions:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [ContentRevisions]
      summary: Sayfanın revizyon geçmişini listele (ADMIN/MANAGER/EDITOR)
      description: >
        Liste görünümü `snapshot` alanını İÇERMEZ (id, editedById, editedByName,
        createdAt) — tam snapshot için `GET .../revisions/{revisionId}`. En yeni
        revizyon önce gelir.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
