        `priceMonthlyCents` toplamıdır; `series[].churnedCount` bucket içinde `CANCELED`
        durumuna geçen (yaklaşık — `updatedAt` referans alınır) abonelik sayısıdır.
        Yıllık abonelikler ay karşılığına ÇEVRİLMEZ, olduğu gibi `priceMonthlyCents`
        kullanılır.
      parameters:
        - $ref: "#/components/parameters/StatsDays"
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/StatsGranularity"
        - $ref: "#/components/parameters/StatsCompare"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/RevenueStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/health:
    get:
      tags: [System]
      summary: Sistem sağlığı — DB ping/boyutu, medya depolama, sunucu belleği/yükü (yalnızca ADMIN)
      description: >
        Tüm alanlar gerçek zamanlı ölçülür (DB `SELECT 1` ping süresi, `pg_database_size`,
        `Media.sizeBytes` toplamı, Node `os`/`process` bellek-yük-uptime bilgisi) — sabit/uydurma
        değer içermez. `dbQuotaBytes`/`mediaStorageQuotaBytes`, ilgili ortam değişkeni
        (`DB_STORAGE_QUOTA_MB`/`MEDIA_STORAGE_QUOTA_MB`) tanımlı değilse `null` döner.
      responses:
        "200":
