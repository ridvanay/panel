  /checkout/session:
    post:
      tags: [Checkout]
      security: []
      summary: Stripe Checkout oturumu oluştur (public, kimliksiz)
      description: >
        **Hız sınırı: 10 istek/dakika (IP bazlı, route-level override)** — para hareketi
        başlatan bu uca özel sıkı bir üst sınırdır (bkz. ARCHITECTURE.md §10.9.3).


        Akış: `cart_token` çerezinden sepet okunur (yok/boşsa `409 CONFLICT`, "Sepetiniz
        boş."). **GÜVENLİK: fiyat/stok istemciden (sepetteki dondurulmuş fiyattan)
        ASLA kabul edilmez** — her satır, sipariş oluşturulmadan hemen önce `Product`
        tablosundan TAZE okunur; ürün artık yayında değilse/silinmişse veya stok
        yetersizse `409 CONFLICT` (kullanıcı dostu Türkçe mesajla, ör. `"\"X\" için
        yeterli stok yok."`) — sipariş HİÇ oluşturulmaz.


        Doğrulama geçerse: `status: PENDING` bir `Order` (+ `OrderItem` satırları,
        `productTitle`/`productSku`/`unitPriceCents` SNAPSHOT olarak) oluşturulur, ardından
        Stripe'ta `mode: payment` bir Checkout Session açılır. **Fiyatlar HER ZAMAN
        `price_data` ile dinamik gönderilir — Stripe Dashboard'da önceden tanımlı bir
        `Price` ID'si ASLA kullanılmaz** (mevcut abonelik akışının aksine, bkz.
        ARCHITECTURE.md §10.9.3 "neden price_data"), çünkü ürün fiyatı/kataloğu bizim
        DB'mizde yönetilir. `success_url`/`cancel_url` `FRONTEND_URL`'e göre üretilir.
        `checkoutUrl` alanına yönlendirme sonrası ödemenin ASIL sonucu webhook (`Webhooks`
        tag'i, `checkout.session.completed`) ile işlenir — bu uç YALNIZCA oturumu açar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartCheckoutSessionRequest" }
      responses:
        "201":
          description: Checkout oturumu oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CheckoutSessionResponse" }
        "404":
          description: "Modül kapalı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Sepet boş VEYA ürün(ler) artık satın alınamıyor/stok yetersiz (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/orders:
    get:
      tags: [Orders]
      summary: Siparişleri listele (yalnızca SiteRole=ADMIN)
      description: >
        Cursor sayfalı, `seq asc`. `status` ile filtrelenebilir. **`customerEmail`
        MASKELENİR** (`lib/pii-mask.ts::maskEmail`, ör. `a***@domain.com`) — gerekçe:
        liste ekranı toplu göz atma/triage amaçlıdır, tam e-posta burada gerekli
        değildir (bkz. detay ucundaki maskesiz davranışla karşıtlık).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OrderStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
                      meta: { $ref: "#/components/schemas/OrderListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Orders]
      summary: Sipariş detayı (yalnızca SiteRole=ADMIN)
      description: >
        **`customerEmail` MASKELENMEZ** (listeden farklı olarak) — detay ekranı fiilen
        kargo/iletişim amacıyla açılır, admin'in müşteriyle iletişime geçmesi (ör.
        teslimat sorunu) için tam adrese ihtiyacı vardır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/orders/{orderId}/status:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      tags: [Orders]
      summary: Sipariş durumunu değiştir (yalnızca SiteRole=ADMIN)
      description: >
        **Yalnızca İKİ geçişe izin verilir:** `PAID -> FULFILLED` (kargoya
        verildi/teslim edildi) ve `PENDING -> CANCELLED` (admin ödeme beklenmeden
        manuel iptal eder). Başka HER durum kombinasyonu (ör. `FAILED -> FULFILLED`,
        `CANCELLED -> PAID`) `409 CONFLICT` ile reddedilir.


        **Bu uç `-> REFUNDED` hedef durumunu KABUL ETMEZ** — manuel iade AYRI bir uçtan
        (`POST /admin/orders/{orderId}/refund`) yapılır, bkz. aşağıda. Audit log:
        `order.status_change` (`metadata: { from, to }`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İzin verilmeyen durum geçişi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/orders/{orderId}/refund:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      summary: Siparişi manuel iade et (yalnızca SiteRole=ADMIN)
      description: >
        Yalnızca `PAID`/`FULFILLED` durumundaki siparişlerde çalışır — başka bir
        durumdaysa VEYA `Order.stripePaymentIntentId` yoksa `409 CONFLICT`. **Gerçek
        parayı Stripe üzerinden geri öder** (`stripe.refunds.create`,
        `stripePaymentIntentId` üzerinden) — yalnızca `Order.status`'u değiştirip
        parayı olduğu gibi bırakan "sahte" bir iade DEĞİLDİR.


        **Çifte iade / race koruması:** durum geçişi `updateMany({ where: { status: {
        in: [PAID, FULFILLED] } } })` ile ATOMİK olarak "claim" edilir — iki eşzamanlı
        istekten yalnızca BİRİ Stripe'a gerçek iade isteği gönderebilir, diğeri
        `claim.count === 0` ile `409 CONFLICT` alır ve Stripe'a HİÇ gitmez. Ayrıca
        `stripe.refunds.create`'e siparişe göre DETERMİNİSTİK bir `idempotencyKey`
        (`order-refund-{orderId}`) verilir — bir retry (ağ hatası/timeout sonrası)
        AYNI Stripe iade kaydını döner, ikinci bir gerçek para hareketi TETİKLEMEZ.
        Stripe isteği BAŞARISIZ olursa claim geri alınır (`Order.status` eski haline
        döner) ve sipariş yeniden iade edilebilir kalır. Başarılıysa `Order.status =
        REFUNDED`. Audit log: `order.refund` (`metadata: { from, to, reason,
        stripeRefundId }`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundOrderRequest" }
      responses:
        "200":
          description: İade edildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Sipariş `PAID`/`FULFILLED` durumunda değil, Stripe ödeme kaydı yok, sipariş
            durumu claim sırasında değişti VEYA Stripe iade isteğini reddetti
            (`error.code: CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      summary: Stripe webhook alıcı (imza `Stripe-Signature` header ile doğrulanır)
      description: >
        Ham (parse edilmemiş) body üzerinde `stripe.webhooks.constructEvent` ile imza
        doğrulanır — bu route kendi `application/json` content-type parser'ını
        (`parseAs: buffer`) kayıt eder, uygulamanın geri kalanındaki JSON parse'ını
        ETKİLEMEZ. İmza eksik/geçersizse VEYA `STRIPE_WEBHOOK_SECRET` tanımsızsa `400`.


        `checkout.session.completed` artık İKİ farklı akıştan gelebilir (aynı Stripe
        hesabı hem org abonelikleri hem misafir ürün siparişleri için kullanılıyor):
        `session.mode === "subscription"` ise MEVCUT abonelik akışı (davranış
        DEĞİŞMEDİ); `session.mode === "payment"` ise `Checkout` tag'inin ürettiği
        sepet siparişi akışıdır — bkz. ARCHITECTURE.md §10.9.3 "stok concurrency".


        **Sepet siparişi akışı (`payment` mode) — idempotency + stok:**
        `session.metadata.orderId` ile `Order` bulunur, stok kontrolü + düşürme +
        `Order.status` güncellemesi TEK Serializable transaction'da (`runSerializable`,
        bkz. ARCHITECTURE.md §10.9.3) ATOMIK yapılır. `order.status !== PENDING` ise
        (Stripe aynı event'i birden fazla gönderebilir; ayrıca
        `Order.stripeCheckoutSessionId` `@unique` ikinci savunma hattıdır) sessizce
        döner — stok TEKRAR düşürülmez, e-posta TEKRAR gönderilmez. Stok yetersizse
        `Order.status = FAILED`, `errorSummary: "insufficient_stock"` yazılır (throw
        EDİLMEZ — para zaten Stripe üzerinden alınmış, admin panelden manuel
        müdahale gerekir). Yeterliyse stok düşürülür, `Order.status = PAID`,
        `paidAt = now()` ve (best-effort, webhook isteğini BOZMAZ) `ORDER_CONFIRMATION`
        e-postası gönderilir.


        `checkout.session.expired` (yalnızca `PENDING` durumundaki siparişi
        `EXPIRED` yapar, `updateMany` ile idempotent) ve
        `customer.subscription.updated`/`deleted` (mevcut abonelik akışı) de bu
        ucun işlediği diğer olay tipleridir; tanınmayan olay tipleri sessizce
        (200 ile) yok sayılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: İşlendi }
        "400": { description: Geçersiz imza }

  # ---------------------------------------------------------------------------
  # Localization (§10.5 — bkz. .claude/architect-scope-i18n.md)
  # ---------------------------------------------------------------------------

  /locales:
    get:
      tags: [Localization]
      security: []
      summary: Etkin dilleri listele (public)
      description: >
        Yalnızca `enabled: true` diller, `sortOrder` artan sırada döner. Varsayılan
        dil (`isDefault: true`) HER ZAMAN listenin içindedir ve devre dışı
        BIRAKILAMAZ (bkz. `DELETE /admin/locales/{code}`).


        Site header'daki dil değiştirici ve `app/[lang]` rota doğrulaması bu ucu
        okur. Önbellek politikası `GET /appearance` ile AYNIDIR (`revalidate: 60`) —
        dil listesi nadiren değişen, her istekte gereken bir yapılandırmadır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Locale" }

  /admin/locales:
    get:
      tags: [Localization]
      summary: Tüm dilleri listele (devre dışı olanlar DAHİL)
      description: "Okuma authenticated (herhangi bir SiteRole) — çeviri editörü sekmelerini kurmak için EDITOR de okur."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Locale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Localization]
      summary: Yeni dil ekle (yalnızca SiteRole=ADMIN)
      description: >
        **Şema değişikliği/migration GEREKTİRMEZ** — yalnızca bir satır eklenir.
        `code` benzersizdir ve normalize edilir (küçük harf, `_` → `-`); zaten varsa
        `409 CONFLICT`.


        Yeni dil eklemek MEVCUT içeriği ÇEVİRMEZ: tüm içerik, çevrilene kadar
        varsayılan dile düşer (bkz. `Content Fallback` kuralı, `ContentLocalization`
        şeması). `enabled: true` ile eklenen dil ANINDA public `/locales` yanıtına ve
        `[lang]` rota uzayına girer — bu yüzden yeni diller varsayılan olarak
        `enabled: false` ile eklenmeli, çeviri hazır olunca açılmalıdır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocaleUpsertRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Locale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Bu `code` zaten kayıtlı (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/locales/{code}:
    parameters:
      - $ref: "#/components/parameters/LocaleCode"
    patch:
      tags: [Localization]
      summary: Dili güncelle (yalnızca SiteRole=ADMIN)
      description: >
        `code` DEĞİŞTİRİLEMEZ (URL uzayının ve `ContentSlug` satırlarının kimliğidir);
        yeniden adlandırmak yerine yeni dil ekleyip eskisini silmek gerekir.


        `isDefault: true` gönderilirse işlem TEK bir transaction'da yürür: eski
        varsayılanın bayrağı düşürülür, yenisi kaldırılır. Varsayılan dil
        `enabled: false` YAPILAMAZ (422).


        Varsayılan dili değiştirmek **sitenin URL yapısını değiştirir** (prefix'siz
        servis edilen dil değişir). Bu yüzden admin UI, isteği GÖNDERMEDEN ÖNCE bir
        onay diyaloğu göstermek ZORUNDADIR.


        **Yanıt bir `warnings` alanı DÖNDÜRMEZ** (bu açıklamanın ilk hâli döndürdüğünü
        söylüyordu — yanlıştı, düzeltildi). Gerekçe: onay, isteğin ÖNCESİNDE alınmalıdır;
        yanıtla birlikte gelen bir uyarı, değişiklik ZATEN yapıldıktan sonra ulaşır ve
        onay amacına hizmet etmez. Etki bilgisi istemci tarafında `Locale.enabled` +
        `translatedContentCount` ve mevcut içerik sayaçlarından gösterilir; bunun için
        ek bir uç/alan GEREKMEZ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocaleUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Locale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Localization]
      summary: Dili sil (yalnızca SiteRole=ADMIN)
      description: >
        **Varsayılan dil SİLİNEMEZ** → `422` (`details.code`). Silme, o dile ait TÜM
        `ContentSlug` satırlarını ve içeriklerdeki `translations.<code>` JSON
        anahtarlarını KALICI olarak kaldırır (çöp kutusu YOK — geri alınamaz).


        Bu yıkıcı bir işlemdir: admin UI, silinecek çeviri sayısını `GET
        /admin/locales` yanıtındaki `translatedContentCount` ile göstermeli ve
        kullanıcıdan dil kodunu yazarak onaylamasını istemelidir. Audit action:
        `localization.locale_delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------------------
  # Public içerik uçları — bu uçlar KODDA mevcuttu ama sözleşmede TANIMSIZDI
  # (bkz. architect-scope-i18n.md §7, sözleşme boşluğu). Locale desteğiyle birlikte
  # buraya normalize edildi.
  # ---------------------------------------------------------------------------

  /pages:
    get:
      tags: [Pages]
      security: []
      summary: Yayınlanmış sayfaları listele (public)
      description: >
        Yalnızca `status: PUBLISHED` ve `deletedAt: null` sayfalar döner.
        `?locale=` verildiğinde alan bazlı çeviri uygulanır (bkz. `LocaleQuery`).
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Page" }

  /pages/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: >
          İstenen dildeki slug. Çözümleme sırası: (1) `ContentSlug(locale, slug)`
          tam eşleşme, (2) varsayılan dildeki kanonik `slug` kolonu. İkisi de
          tutmazsa `404`.
        schema: { type: string }
      - $ref: "#/components/parameters/LocaleQuery"
    get:
      tags: [Pages]
      security: []
      summary: Sayfa detayı — slug ile (public)
      description: "Yayınlanmamış/çöpteki sayfalar için `404 NOT_FOUND`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "404": { $ref: "#/components/responses/NotFound" }

  /blog:
    get:
      tags: [Blog]
      security: []
      summary: Yayınlanmış blog yazılarını listele (public)
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BlogPost" }

  /blog/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/LocaleQuery"
    get:
      tags: [Blog]
      security: []
      summary: Blog yazısı detayı — slug ile (public)
      description: "Slug çözümlemesi `/pages/{slug}` ile BİREBİR AYNIDIR."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogPost" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # §10.13.3 API Anahtarı Yönetimi — /admin/settings/api-keys
  # TÜM uçlar yalnızca SiteRole=ADMIN (OKUMA DAHİL).
  # ===========================================================================

  /admin/settings/api-keys:
    get:
      tags: [ApiKeys]
      summary: API anahtarlarını listele
      description: >
        Cursor sayfalı (`seq desc`). **`plainKey` ASLA dönmez** — yalnızca `keyPrefix`
        + `last4` ile maskeli gösterim mümkündür (§10.13.3 "tek seferlik gösterim").
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ApiKeyStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [ApiKeys]
      summary: Yeni API anahtarı oluştur
      description: >
        **Ham anahtar (`plainKey`) YALNIZCA BU YANITTA, BİR KEZ döner.** Sunucu
        yalnızca `sha256` hash'ini saklar (§10.13.3) — kaybedilen bir anahtar geri
        alınamaz, yenisi üretilmelidir. İstemci bu değeri kalıcı olarak saklamamalı,
        kullanıcıya kopyalatıp ekrandan kaldırmalıdır.


        Hız sınırı: `API_KEY_MANAGEMENT_RATE_LIMIT` (10/dk). Audit: `api_key.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Oluşturuldu — `plainKey` tek seferlik
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CreateApiKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/settings/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    patch:
      tags: [ApiKeys]
      summary: API anahtarı meta verisini güncelle
      description: >
        `name`/`description`/`scope`/`expiresAt` güncellenir. **Anahtarın kendisi
        DEĞİŞTİRİLEMEZ** (rotasyon = yeni anahtar oluştur + eskisini iptal et).
        Güncelleme doğrulama cache'ini anında temizler (§10.13.4).
        Audit: `api_key.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApiKeyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [ApiKeys]
      summary: API anahtarını kalıcı sil
      description: >
        Satırı tamamen kaldırır. **Önerilen akış önce `revoke`'tur** (denetim izi
        korunur); kalıcı silme yalnızca kaydı da temizlemek istendiğinde kullanılır.
        Her iki durumda da anahtar anında geçersizleşir (cache temizlenir).
        Audit: `api_key.delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/settings/api-keys/{keyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    post:
      tags: [ApiKeys]
      summary: API anahtarını iptal et (soft)
      description: >
        `status: REVOKED` + `revokedAt`/`revokedById` yazılır; satır KALIR.
        Anahtar **anında** geçersizleşir — süreç-içi doğrulama cache'inin girişi
        senkron olarak temizlenir, gecikme penceresi YOKTUR (§10.13.4).
        Zaten `REVOKED` bir anahtarda `409 CONFLICT`. Audit: `api_key.revoke`.
      responses:
        "200":
          description: İptal edildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===========================================================================
  # §10.13.8 Giden Webhook Yönetimi — /admin/settings/webhooks
  # TÜM uçlar yalnızca SiteRole=ADMIN (OKUMA DAHİL).
  # ===========================================================================

  /admin/settings/webhooks/events:
    get:
      tags: [OutboundWebhooks]
      summary: Abone olunabilecek olayların kayıt defteri
      description: >
        **Statik bir kod registry'sidir** (`lib/webhook-events.ts`), DB tablosu
        DEĞİLDİR — `GET /admin/settings/permissions` ve `GET /admin/appearance/presets`
        ile AYNI desen. Frontend olay listesini/etiketlerini HARDCODE ETMEZ; buradan
        okur. Böylece yeni bir olay eklendiğinde arayüz kendiliğinden günceldir.


        **Rota önceliği notu:** bu statik segment `/{webhookId}` parametreli rotadan
        önce eşleşir (Fastify radix router davranışı) — `events` geçerli bir UUID
        olmadığı için zaten çakışma yoktur.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookEventDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings/webhooks:
    get:
      tags: [OutboundWebhooks]
      summary: Webhook'ları listele
      description: "Cursor sayfalı (`seq desc`). Secret ASLA dönmez — yalnızca `secretLast4`."
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OutboundWebhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [OutboundWebhooks]
      summary: Yeni webhook tanımla
      description: >
        `url` **SSRF doğrulamasından geçer** (§10.13.7): yalnızca `https`, yalnızca
        port 443, literal IP YASAK, tek etiketli/`.local`/`.internal`/`localhost`
        adlar YASAK, DNS çözümlemesinin döndürdüğü TÜM adresler public unicast
        olmalıdır (`169.254.169.254` bulut metadata dahil tüm özel aralıklar
        reddedilir). Reddedilirse `422` + `error.details.url`; ayrıca
        `outbound_webhook.url_rejected` audit kaydı (status `FORBIDDEN`) yazılır.


        Site genelinde en fazla `WEBHOOK_MAX_COUNT` (20) webhook olabilir — aşımda
        `409 CONFLICT`. Hız sınırı: `WEBHOOK_MANAGEMENT_RATE_LIMIT` (20/dk).


        **`plainSecret` (`whsec_<64hex>`) YALNIZCA BU YANITTA, BİR KEZ döner.**
        Audit: `outbound_webhook.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOutboundWebhookRequest" }
      responses:
        "201":
          description: Oluşturuldu — `plainSecret` tek seferlik
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CreateOutboundWebhookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Webhook üst sınırı (20) aşıldı (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422":
          description: "Girdi doğrulama hatası VEYA SSRF kontrolünün reddi (`error.details.url`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/settings/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/OutboundWebhookId"
    get:
      tags: [OutboundWebhooks]
      summary: Webhook detayı
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/OutboundWebhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [OutboundWebhooks]
      summary: Webhook güncelle
      description: >
        `url` gönderilirse SSRF doğrulaması YENİDEN çalışır (POST ile aynı kurallar).
        `status: "ACTIVE"` gönderildiğinde `consecutiveFailureCount` **0'lanır** ve
        `autoDisabledAt` temizlenir — otomatik kapatılmış (§10.13.8) bir webhook'u
        elle yeniden etkinleştirmenin yolu budur.
        Audit: `outbound_webhook.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOutboundWebhookRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/OutboundWebhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Girdi doğrulama hatası VEYA SSRF kontrolünün reddi (`error.details.url`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [OutboundWebhooks]
      summary: Webhook sil
      description: >
        İlişkili `WebhookDelivery` kayıtları **cascade** silinir (`onDelete: Cascade`)
        — bekleyen/yeniden denenecek gönderimler dahil. Audit:
        `outbound_webhook.delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/settings/webhooks/{webhookId}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/OutboundWebhookId"
    post:
      tags: [OutboundWebhooks]
      summary: İmzalama secret'ını döndür (rotate)
      description: >
        Yeni bir `whsec_<64hex>` üretir, AES-256-GCM ile şifreleyip kaydeder ve
        **düz metnini bu yanıtta BİR KEZ** döner. Eski secret ANINDA geçersizdir —
        kademeli geçiş (grace period) YOKTUR; alıcı yeni secret'ı yüklemeden önceki
        gönderimler alıcı tarafında doğrulanamaz. Bu bilinçli bir sadeleştirmedir:
        iki aktif secret tutmak, sızmış bir secret'ın geçerli kalma penceresini
        uzatır.


        Hız sınırı: `WEBHOOK_MANAGEMENT_RATE_LIMIT`. Audit:
        `outbound_webhook.rotate_secret`.
      responses:
        "200":
          description: Rotasyon tamam — `plainSecret` tek seferlik
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/RotateWebhookSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/settings/webhooks/{webhookId}/test:
    parameters:
      - $ref: "#/components/parameters/OutboundWebhookId"
    post:
      tags: [OutboundWebhooks]
      summary: Test gönderimi kuyrukla (PING)
      description: >
        `PING` olayı için bir `WebhookDelivery` satırı oluşturur ve **202** döner —
        gönderim SENKRON DEĞİLDİR, dispatcher sweeper'ı en geç 15 sn içinde alır.
        İstemci sonucu `GET .../deliveries/{deliveryId}` ile yoklar.


        Webhook `PAUSED`/`DISABLED` olsa dahi test gönderimi YAPILIR (amaç, yeniden
        etkinleştirmeden önce uç noktayı doğrulamaktır), ancak `events` listesinde
        `PING` olmasa bile çalışır — test, abonelikten bağımsızdır.


        **En sıkı hız sınırı buradadır:** `WEBHOOK_TEST_RATE_LIMIT` (5/dk). Bu uç,
        sunucumuzu keyfi bir dış adrese istek atmaya ikna eden en doğrudan yoldur;
        URL zaten SSRF doğrulamasından geçmiş olsa da amplifikasyon vektörüdür.
        Audit: `outbound_webhook.test`.
      responses:
        "202":
          description: Kuyruklandı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EnqueueWebhookDeliveryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/settings/webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/OutboundWebhookId"
    get:
      tags: [OutboundWebhooks]
      summary: Gönderim logunu listele
      description: >
        Cursor sayfalı, `seq desc`. Liste DTO'su (`WebhookDeliverySummary`) **payload
        ve yanıt gövdesi TAŞIMAZ** — bunlar yalnızca detay ucunda döner (liste
        yanıtını şişirmemek ve PII'yi gereksiz yere dolaştırmamak için).


        Saklama (§10.13.8): webhook başına en yeni **100** kayıt, yaş tavanı **30
        gün**; `containsPii: true` kayıtların `payload`'ı **7 gün** sonra redakte
        edilir.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/WebhookDeliveryStatusFilter"
        - $ref: "#/components/parameters/WebhookEventFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookDeliverySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/settings/webhooks/{webhookId}/deliveries/{deliveryId}:
    parameters:
      - $ref: "#/components/parameters/OutboundWebhookId"
      - $ref: "#/components/parameters/WebhookDeliveryId"
    get:
      tags: [OutboundWebhooks]
      summary: Gönderim detayı
      description: >
        `payload` (gönderilen tam gövde) + `responseBodySnippet` (alıcı yanıtının ilk
        512 karakteri) döner. Route handler `deliveryId`'nin GERÇEKTEN o `webhookId`'ye
        ait olduğunu doğrular (IDOR koruması) — eşleşmezse `404` (bkz. `ImageId`
        parametresindeki AYNI desen).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/settings/webhooks/{webhookId}/deliveries/{deliveryId}/redeliver:
    parameters:
      - $ref: "#/components/parameters/OutboundWebhookId"
      - $ref: "#/components/parameters/WebhookDeliveryId"
    post:
      tags: [OutboundWebhooks]
      summary: Gönderimi elle yeniden gönder
      description: >
        Kaynak kaydın `payload`'ını **BİREBİR** kullanarak YENİ bir `WebhookDelivery`
        satırı oluşturur (`redeliveryOfId` ile kaynağa bağlanır) ve **202** döner.
        Kaynak satırın sayaçları/durumu DEĞİŞTİRİLMEZ — denetim izi değişmezdir.
        Yeni satır yeni bir `X-Webhook-Delivery` id'si taşır; imza yeni bir
        timestamp ile üretilir.


        Payload redakte edilmişse (§10.13.8, 7 gün) `409 CONFLICT`.
        Hız sınırı: `WEBHOOK_REDELIVER_RATE_LIMIT` (10/dk). Audit:
        `outbound_webhook.redeliver`.
      responses:
        "202":
          description: Kuyruklandı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EnqueueWebhookDeliveryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Payload redakte edilmiş, yeniden gönderilemez (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ===========================================================================
  # §10.13.5 Public API katmanı — /api/v1/public/*
  # SALT-OKUNUR. Kimlik: X-Api-Key (apiKeyAuth). bearerAuth KABUL EDİLMEZ.
  # ===========================================================================

  /public/me:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Çağıran anahtarın kendi bilgisi
      description: >
        Entegrasyon teşhisi için: anahtarın adı, scope'u ve o anki kota durumu.
        **Anahtarın kendisini/hash'ini/ön ekini DÖNMEZ** — çağıran zaten anahtara
        sahiptir, geri yansıtmak log/proxy yüzeyini gereksiz genişletir.
      responses:
        "200":
          description: OK
          headers:
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicApiKeyInfo" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/pages:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Yayındaki sayfaları listele
      description: >
        `status = PUBLISHED AND deletedAt IS NULL` sabittir ve **atlanamaz**.
        Sıralama `publishedAt desc, seq desc`. Cursor sayfalı.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: OK
          headers:
            x-ratelimit-limit: { $ref: "#/components/headers/RateLimitLimit" }
            x-ratelimit-remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            x-ratelimit-reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicPage" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "403": { $ref: "#/components/responses/ApiKeyForbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/pages/{slug}:
    parameters:
