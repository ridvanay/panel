      - $ref: "#/components/parameters/PublicSlug"
      - $ref: "#/components/parameters/LocaleQuery"
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Blog yazısı detayı — slug ile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
