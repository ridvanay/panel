          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicPortfolioItem" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "403": { $ref: "#/components/responses/ApiKeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/portfolio/categories:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Portföy kategorilerini listele
      description: "`portfolio` modülü kapalıysa `404`."
      responses:
        "200":
          description: OK
          content:
