        **Hız sınırı:** 120 istek / 1 dakika (route-level, diğer admin GET uçlarının
        paylaştığı global limitten BAĞIMSIZ — hızlı veri dökümü/scraping'e karşı
        savunma derinliği VE bu ucun diğer admin trafiğinin (health polling, dashboard)
        global bütçeyi tüketmesinden bağımsız erişilebilir kalması için, bkz.
        `logs.routes.ts::LOGS_RATE_LIMIT` ile AYNI desen). Aşım → 429.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MediaFolderFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Media]
      summary: Görsel yükle (ADMIN/EDITOR)
      description: >
        `multipart/form-data`, tek dosya. Editör (blog/sayfa) içerik bloklarına ve
        kapak görseline BURADAN eklenir.


        **Güvenlik — çift doğrulama:** yalnızca JPEG/PNG/WEBP/GIF kabul edilir. SVG
        kasıtlı olarak allow-list'te YOKTUR: metin tabanlıdır, magic byte imzası
        taşımaz ve içine `<script>` gömülebildiği için depolanmış-XSS riski taşır.
        `file`'ın beyan ettiği `Content-Type` GÜVENİLMEZ — gerçek tür, dosya
        içeriğinin ilk baytlarından (magic bytes) tespit edilir; beyan edilenle
        UYUŞMUYORSA ya da tanınmıyorsa/SVG ise istek `422` ile reddedilir
        (`POST /admin/import/jobs` ile AYNI kod yolu, bkz. `lib/mime-detect.ts`).


        **Boyut limiti:** global multipart limiti (`MAX_UPLOAD_BYTES`, 5 MB) —
        `POST /admin/import/jobs`'un aksine bu ucun kendine özgü bir route-level
        override'ı YOKTUR. Aşım → `413 PAYLOAD_TOO_LARGE`.


        **Klasör (§10.11):** opsiyonel `folderId` alanı gönderilirse yükleme doğrudan
        o klasöre düşer (kullanıcı bir klasörün içindeyken yüklediğinde beklenen
        davranış); gönderilmezse `folderId: null` = "Kategorisiz". Klasör bulunamazsa
        `404` — bu kontrol dosya DİSKE YAZILMADAN ÖNCE yapılır, aksi hâlde DB kaydı
        olmayan yetim dosya kalır.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadMediaRequest" }
      responses:
        "201":
          description: Yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`folderId` gönderildi ama böyle bir klasör YOK (dosya diske yazılmadan reddedilir)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            Dosya yok / desteklenmeyen tür beyan edildi / dosya içeriği tanınan bir
            görsel biçimiyle eşleşmiyor (SVG dahil) / beyan edilen tür ile tespit
            edilen tür UYUŞMUYOR (`error.details.file`) / `folderId` UUID değil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    patch:
      tags: [Media]
      summary: Görselin alt metnini güncelle (ADMIN/EDITOR)
      description: >
        Faz 2 içerik editörü — editör içi görsellerde erişilebilirlik/SEO alt metni
        zorunluluğu. v1'de TEK güncellenebilir alan `altText`'tir; dosyanın kendisi,
        `url`/`filename`/`mimeType` DEĞİŞTİRİLEMEZ (yeniden yüklemek gerekir).


        **Bu uç `folderId` KABUL ETMEZ (karar, §10.11)** — klasör değiştirmenin TEK
        yolu `POST /admin/media/move`'dur. Gerekçe: taşımanın tekil ve toplu hâli tek
        kod yolunda kalsın, "kısmi başarı" semantiği tek yerde tanımlansın ve istemci
        tarafında "hangi ucu kullanayım?" ikiliği doğmasın. Gövdeye `folderId`
        eklenirse `422` (bilinmeyen alan).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMediaAltTextRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Media]
      summary: Görseli KALICI sil — geri alınamaz (yalnızca ADMIN)
      description: >
        `Media` soft-delete DESTEKLEMEZ (Page/BlogPost'un aksine `deletedAt`/çöp kutusu
        YOKTUR) — bu uç DB kaydını VE depolanan dosyayı KALICI olarak siler. Dosya
        silme en iyi-çaba (best-effort) yapılır: depolama katmanındaki hata istek
        sonucunu ETKİLEMEZ (DB kaydı yine de silinir).
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # MEDYA KLASÖRLERİ (§10.11) — AJAN KAPSAM NOTU (architect, bağlayıcı)
  #
  #   db-agent       : `MediaFolder` modeli (id, seq, name, parentId, createdAt),
  #                    self-relation onDelete: SetNull, `Media.folderId` nullable FK
  #                    onDelete: SetNull, @@index([parentId]) + @@index([folderId]),
  #                    tek migration. İş kuralı/validasyon YAZMAZ.
  #   backend-agent  : Aşağıdaki 5 uç + Zod şemaları + mapper (`toMediaFolderDto`).
  #                    Derinlik/döngü/isim-çakışması kurallarını UYGULAR, şema TASARLAMAZ.
  #   frontend-agent : Klasör ağacı paneli (admin medya sayfası + MediaPicker AYNI
  #                    veri kaynağı), `folderId` query'si ile listeleme, seçim
  #                    kısayolları (shift/ctrl/cmd + Ctrl+A), "Klasöre Taşı" aksiyonu.
  #   ui-designer    : Ağaç satırı / seçim çubuğu / "Kategorisiz" durumu için
  #                    tasarım tokenleri + boş-durum metinleri. Kod YAZMAZ.
  #   qa-agent       : Klasör silme → medyanın Kategorisiz'e düşmesi, alt klasörün
  #                    köke çıkması, kısmi başarı (skippedIds) senaryoları.
  #
  # Fastify yönlendirme notu: `/admin/media/folders` ve `/admin/media/move` STATİK
  # segmentlerdir; find-my-way statik segmenti `/:mediaId` parametresine göre ÖNCELİKLİ
  # eşleştirir — çakışma YOKTUR (ayrıca `mediaId` uuid doğrulandığı için "folders"
  # zaten 422 verirdi).
  # ---------------------------------------------------------------------------

  /admin/media/folders:
    get:
      tags: [Media]
      summary: Medya klasörlerini listele — DÜZ dizi + parentId (authenticated)
      description: >
        **Karar — düz (flat) dizi, iç içe JSON ağacı DEĞİL** (`NavigationItem` ile AYNI
        patern, bkz. §10.10.1): (1) DB zaten satır bazlıdır, ağaç yazma anında
        düzleştirilmek zorunda kalırdı; (2) özyinelemeli şema Zod/`fastify-type-provider-zod`
        tarafında `z.lazy` + tip çıkarımı sorunları doğurur ve OpenAPI istemci üreticilerinde
        kırılgandır; (3) tüketici (admin sayfası VE `MediaPicker`) ağacı tek geçişte
        `parentId`'ye göre kurar. Sunucu `(parentId NULLS FIRST, name ASC)` sıralar —
        kök klasörler her zaman alt klasörlerden ÖNCE gelir, tek geçişli ağaç kurulumu
        güvenlidir.


        **Sayfalama YOKTUR** (cursor/limit almaz) — v1 varsayımı klasör sayısının küçük
        (~200 altı) olmasıdır ve ağaç panelinin doğru çizilebilmesi için TÜM düğümlere
        aynı anda ihtiyaç vardır. Aynı gerekçeyle **klasör adı araması FRONTEND-only'dir**
        (query param YOKTUR): tüm liste zaten bellektedir, sunucuya gitmek ek gecikme
        dışında bir şey kazandırmaz.


        `mediaCount` her klasörün DOĞRUDAN içindeki medya sayısıdır (alt klasörler HARİÇ)
        ve tek sorguda (`include: { _count: { select: { media: true } } }`) hesaplanır —
        N+1 sorgu YASAK. "Kategorisiz" (`folderId IS NULL`) bir klasör kaydı DEĞİLDİR,
        listede DÖNMEZ; sayısı gerekiyorsa `GET /admin/media?folderId=none` ile alınır.


        **Hız sınırı:** `GET /admin/media` ile AYNI (120 istek / 1 dakika) — `MediaPicker`
        her açılışında bu ucu çağırır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MediaFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Media]
      summary: Klasör oluştur (ADMIN/EDITOR)
      description: >
        Yetki eşiği `POST /admin/media` (yükleme) ile AYNI — klasör oluşturmak
        içerik düzenleme işidir, yıkıcı değildir.


        `parentId` verilirse hedef klasörün KENDİ `parentId`'si null OLMALIDIR
        (maksimum derinlik 2 — kök + bir alt seviye, §10.11) → aksi hâlde `422`.
        Aynı `parentId` altında büyük/küçük harf duyarsız aynı isim → `409 CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMediaFolderRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/MediaFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`parentId` gönderildi ama böyle bir klasör YOK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Aynı üst klasör altında aynı isim (case-insensitive) — `error.code: CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/media/folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/MediaFolderId"
    patch:
      tags: [Media]
      summary: Klasörü yeniden adlandır / başka klasörün altına taşı (ADMIN/EDITOR)
      description: >
        En az bir alan gönderilmelidir (`name` ve/veya `parentId`); ikisi de yoksa `422`.
        `parentId: null` gönderilmesi "klasörü köke taşı" demektir — alanın HİÇ
        gönderilmemesi ise "üst klasörü değiştirme" demektir (ikisi FARKLIDIR).


        Doğrulama kuralları (hepsi `422`, `error.details` ile):

        - klasör kendi `parentId`'si olamaz;

        - hedef üst klasörün `parentId`'si null OLMALIDIR (derinlik 2);

        - klasörün KENDİ alt klasörleri varsa başka bir klasörün altına taşınamaz
          (derinlik aşımı) — önce alt klasörler köke taşınmalıdır.


        Bu üç kural birlikte döngüyü (cycle) YAPISAL olarak imkânsız kılar; özyinelemeli
        ata (ancestor) gezintisi GEREKMEZ. İsim çakışması → `409`.


        **Not (v1 kapsam):** frontend v1'de yalnızca yeniden adlandırmayı zorunlu olarak
        sunar; klasör taşıma UI'ı (sürükle-bırak) opsiyoneldir — kontrat şimdiden hazırdır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMediaFolderRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/MediaFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Aynı üst klasör altında aynı isim (case-insensitive) — `error.code: CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Media]
      summary: Klasörü sil — içindeki medya SİLİNMEZ (yalnızca ADMIN)
      description: >
        Yetki eşiği `DELETE /admin/media/{mediaId}` ile AYNI (yalnızca ADMIN) — klasör
        silmek medyayı yok etmese de organizasyon bilgisini geri alınamaz biçimde kaybeder.


        **Silmenin iki yan etkisi de KAYIPSIZDIR (karar, §10.11):**

        - **İçindeki medya:** `Media.folderId` `SetNull` ile boşalır → görseller
          "Kategorisiz"e düşer. Görseller ASLA silinmez, disk dosyalarına DOKUNULMAZ.

        - **Alt klasörler:** CASCADE **DEĞİL** — alt klasörlerin `parentId`'si `SetNull`
          ile boşalır, yani KÖKE çıkarlar (içerikleriyle birlikte korunurlar). Cascade
          reddedildi: tek bir tıklamayla görünmeyen bir alt ağacın tüm organizasyonunu
          silmek, "medyayı silmiyoruz" güvencesiyle çelişen sürpriz bir veri kaybı
          olurdu; ayrıca derinlik 2 sınırında alt klasörün köke çıkması HER ZAMAN
          geçerli bir durumdur (ek doğrulama gerekmez).


        Her iki etki de FK `onDelete: SetNull` ile DB seviyesinde ifade edilir — servis
        katmanında elle `updateMany` GEREKMEZ (backend-agent döngü yazmasın).


        İstemci, silme onay diyaloğunda etkiyi açıkça yazmalıdır ("N görsel Kategorisiz'e
        taşınacak, M alt klasör en üst seviyeye çıkacak").
      responses:
        "204": { description: "Silindi (medya ve alt klasörler korundu)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/media/move:
    post:
      tags: [Media]
      summary: Medyayı klasöre taşı — tekil ve toplu TEK uç (ADMIN/EDITOR)
      description: >
        **Karar — ayrı bir `/move-bulk` ucu YOKTUR:** gövde her zaman `mediaIds` dizisi
        alır, tekil taşıma tek elemanlı dizidir. Gerekçe: taşıma mantığı (varlık kontrolü,
        hedef klasör doğrulaması, kısmi başarı) tek kod yolunda kalır; iki uç iki ayrı
        davranış sapması ve iki ayrı test yüzeyi demektir. `POST /admin/pages/bulk`
        ailesiyle aynı felsefe.


        **Kısmi başarı bir hata DEĞİLDİR:** bulunamayan id'ler `skippedIds`'e düşer,
        yanıt yine `200`. Zaten hedef klasörde olan medya "taşındı" sayılır (idempotent,
        `movedCount`'a dahildir) — atlanmaz.


        `folderId: null` = "Kategorisiz'e taşı" (klasörden çıkar). Alan ZORUNLUDUR ama
        değeri null OLABİLİR; hiç gönderilmemesi `422`'dir (kazara "klasörden çıkarma"
        olmasın diye niyet açıkça belirtilmelidir).


        Hedef klasör verilmiş ama YOKSA istek TAMAMEN reddedilir (`404`) — kısmi
        uygulama YAPILMAZ. Yazma tek `updateMany` ile yapılır (id başına sorgu YASAK).


        **AuditLog yazılmaz (v1 kararı):** mevcut medya modülünde upload/delete de audit
        yazmıyor; taşıma daha az yıkıcı bir işlem olduğu için tutarlılık korunur. İleride
        eklenirse eylem öneki `media.move` olacaktır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveMediaRequest" }
      responses:
        "200":
          description: Taşındı (kısmi başarı dahil)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/MoveMediaResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Hedef klasör (`folderId`) bulunamadı — hiçbir medya taşınmadı."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates:
    get:
      tags: [EmailTemplates]
      summary: Tüm e-posta şablonlarını listele (yalnızca ADMIN)
