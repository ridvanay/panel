        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/products:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Yayındaki ürünleri listele
      description: >
        `products` modülü **kapalıysa `404 NOT_FOUND`** — mevcut `/products` ucuyla
        BİREBİR aynı davranış (`requireModuleEnabled`, bkz. `Modules` tag'i). Modülün
        kapalı olduğu 403 ile sızdırılmaz.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LocaleQuery"
        - $ref: "#/components/parameters/SearchQuery"
