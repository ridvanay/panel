  /admin/pages:
    get:
      tags: [Pages]
      summary: Sayfaları listele — çöp filtresi + sekme sayaçları (authenticated)
      description: >
        **Çöp kutusu (soft-delete) semantiği:** varsayılan `trashed=exclude`, yani
        `deletedAt IS NULL` olan kayıtlar döner. `trashed=include` çöptekiler DAHİL
        tümünü, `trashed=only` yalnızca çöptekileri döner.


        **Sekme sayaçları:** `meta.counts` HER ZAMAN döner ve `trashed`/`status`/
        `cursor`/`limit` parametrelerinden ETKİLENMEZ — tablo genelinde tek bir
        `groupBy` ile hesaplanır. Frontend'in 4 sekmesinin (Tümü/Yayınlanmış/Taslak/Çöp)
        rakamları BURADAN okunur; client-side sayım YAPILMAZ (100'lük sayfa limitinin
        ötesinde yanlış sonuç verirdi).


        **v1 frontend kullanımı:** `?trashed=include&limit=100` ile çekilir, satır
        filtreleme/arama/sayfalama client-side yapılır (`useFilteredList`). Toplam kayıt
        100'ü aşarsa frontend `meta.nextCursor` boşalana kadar döngüyle devam sayfalarını
        çeker (`counts.all + counts.trashed` beklenen toplamı verir). `status` parametresi
        API tüketicileri ve ileride sunucu-taraflı sayfalamaya geçiş için vardır;
        v1 frontend'i KULLANMAZ.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/TrashedFilter"
        - $ref: "#/components/parameters/ContentStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Page" }
                      meta: { $ref: "#/components/schemas/ContentListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Pages]
      summary: Yeni sayfa oluştur (ADMIN/EDITOR)
      description: >
        `slug` verilmezse `title`'dan üretilir. `authorId` verilmezse giriş yapmış
        kullanıcı yazar olur; BAŞKA bir kullanıcıyı yazar atamak yalnızca ADMIN'e
        açıktır (EDITOR gönderirse 403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePageRequest" }
      responses:
        "201":
          description: Sayfa oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Pages]
      summary: Sayfa detayı (authenticated)
      description: >
        Çöpteki sayfayı da döner (geri yükleme/onay ekranları için) — çağıran taraf
        `deletedAt` alanına bakarak davranışını belirler.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Pages]
      summary: Sayfayı güncelle — tam düzenleme VE hızlı düzenleme (ADMIN/EDITOR)
      description: >
        **Hızlı Düzenle (Quick Edit) için AYRI UÇ YOKTUR** — liste ekranındaki inline
        mini form da bu ucu kısmi gövdeyle çağırır: `{ title?, slug?, status? }`.
        Böylece slug tekilliği, revizyon snapshot'ı ve `publishedAt` mantığı tek yerde kalır.


        Kurallar:

        - Her başarılı PATCH, güncellemeden önceki hali `ContentRevision` olarak kaydeder (§10.1).

        - Çöpteki bir sayfa DÜZENLENEMEZ → `409 CONFLICT` (`"Çöpteki içerik düzenlenemez.
        Önce geri yükleyin."`). Önce `POST .../restore`.

        - `status: PUBLISHED` ve `publishedAt` boşsa `publishedAt = now()` set edilir.
        Taslağa geri alma `publishedAt`'i TEMİZLEMEZ (ilk yayın tarihi kalıcıdır).

        - `authorId` alanını yalnızca ADMIN değiştirebilir; EDITOR gönderirse 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePageRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Slug çakışması VEYA çöpteki içeriği düzenleme girişimi
            (`error.code: CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Pages]
      summary: Sayfayı ÇÖPE TAŞI — soft delete (ADMIN/EDITOR)
      description: >
        **DAVRANIŞ DEĞİŞİKLİĞİ:** bu uç artık kalıcı silmez, `deletedAt = now()` set eder.
        Kalıcı silme için `DELETE /admin/pages/{pageId}/permanent` (yalnızca ADMIN).


        - İdempotenttir: zaten çöpte olan sayfa için de 204 döner.

        - Çöpe taşınan sayfa `SiteSettings.homePageId` ise, aynı transaction içinde
        `homePageId = null` yapılır (public site kırılmasın). Geri yükleme bunu GERİ ALMAZ.

        - Yetki eşiği ADMIN-only'den ADMIN/EDITOR'e GENİŞLETİLMİŞTİR (çöp geri
        alınabilir bir işlemdir); kalıcı silme ADMIN-only kalır.
      responses:
        "204": { description: Çöpe taşındı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/pages/{pageId}/autosave:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Pages]
      summary: Sayfayı otomatik kaydet — 3sn debounce (ADMIN/EDITOR)
      description: >
        Faz 3 (autosave). `PATCH /admin/pages/{pageId}`'ten BİLİNÇLİ olarak AYRIDIR:
        `ContentRevision` snapshot'ı ÜRETMEZ ve `AuditLog` YAZMAZ — aksi halde 3sn'lik
        debounce ile tetiklenen her otomatik kayıt, entity başına revizyon tavanını
        (`MAX_REVISIONS_PER_ENTITY`) doldurup kullanıcının bilinçli "Kaydet" ile ürettiği
        anlamlı geçmişi silerdi (bkz. backend `lib/content-revisions.ts`).


        Gövde `UpdatePageRequest`'in DAR bir alt kümesidir — yalnızca aktif düzenlenen
        `title`/`blocks` korunur; `status`/`slug`/SEO/çeviri/`scheduledAt` bu uçtan
        DEĞİŞTİRİLEMEZ.


        Çöpteki bir sayfa autosave EDİLEMEZ → `409 CONFLICT` (`PATCH` ile aynı mesaj:
        `"Çöpteki içerik düzenlenemez. Önce geri yükleyin."`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutosavePageRequest" }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AutosaveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği autosave etme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/pages/{pageId}/restore:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Pages]
      summary: Sayfayı çöpten geri yükle (ADMIN/EDITOR)
      description: >
        `deletedAt = null` yapar. `status` DEĞİŞTİRİLMEZ — sayfa çöpe taşındığındaki
        durumuna (DRAFT/PUBLISHED) geri döner. İdempotenttir: çöpte olmayan sayfa için
        de 200 ve mevcut kayıt döner.
      responses:
        "200":
          description: Geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/pages/{pageId}/permanent:
    parameters:
      - $ref: "#/components/parameters/PageId"
    delete:
      tags: [Pages]
      summary: Sayfayı KALICI sil — geri alınamaz (yalnızca ADMIN)
      description: >
        Güvenlik bariyeri: sayfa ÖNCE çöpte olmalıdır. `deletedAt IS NULL` ise
        `409 CONFLICT` (`"Kalıcı silmeden önce içeriği çöpe taşıyın."`).


        Aynı transaction içinde temizlenmesi ZORUNLU yan kayıtlar:

        - `ContentRevision` satırları (polymorphic, FK YOK → elle silinmeli:
        `entityType = PAGE AND entityId = {pageId}`).

        - `PageView` satırları FK cascade ile otomatik silinir.

        - `SiteSettings.homePageId` FK `onDelete: SetNull` ile otomatik boşalır.

        - `AuditLog` kaydı yazılır (`page.permanent_delete`).
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İçerik çöpte değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/pages/bulk:
    post:
      tags: [Pages]
      summary: Sayfalarda toplu işlem (ADMIN/EDITOR; permanent-delete yalnızca ADMIN)
      description: >
        Liste ekranındaki toplu işlem menüsü ve "Çöpü Boşalt" bu ucu kullanır —
        ayrı bir "çöpü boşalt" ucu YOKTUR (frontend çöpteki id'leri
        `action: permanent-delete` ile gönderir).


        **Kısmi başarı bir hata DEĞİLDİR:** uygulanamayan id'ler `skippedIds`'e düşer
        ve yanıt yine 200 olur. Atlama sebepleri:

        - id bulunamadı,

        - `trash` → zaten çöpte,

        - `restore` → zaten çöpte değil,

        - `publish`/`draft` → kayıt çöpte (önce geri yüklenmeli),

        - `permanent-delete` → kayıt çöpte değil.


        `permanent-delete` yalnızca ADMIN içindir; EDITOR gönderirse tüm istek 403 olur
        (kısmi uygulama yapılmaz). Her toplu işlem tek bir `AuditLog` kaydı yazar
