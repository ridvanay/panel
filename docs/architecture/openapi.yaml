info:
  title: SaaS Platform API
  version: "1.0"
  description: >
    Frontend (Next.js) ve backend (Node.js/Fastify) ajanlarının uyacağı API
    kontratı. Kaynak doğruluk: bu dosya + ../shared-types.ts + ARCHITECTURE.md.
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local

x-site-rbac:
  description: >
    **5 KADEMELİ SİTE-GENELİ RBAC (bağlayıcı — `.claude/architect-scope-rbac-5-tier.md`).**
    `SiteRole` = `ADMIN` | `MANAGER` | `EDITOR` | `CUSTOMER` | `USER`. (`VIEWER` KALDIRILDI —
    mevcut veri `USER`'a eşlendi.)


    - **ADMIN** (Süper Yönetici): her şey. Sistem, ayarlar, kullanıcılar, kimlik bilgileri,
      denetim izi ve **blok yapısını değiştirebilen TEK rol**.

    - **MANAGER** (Yönetici): ADMIN'in tüm yetkileri EKSİ beş kategori — (a) ayrıcalık
      yükseltme yüzeyi (`/admin/users`, `/admin/settings` PATCH, `/admin/settings/permissions`,
      `/admin/import/*`), (b) kimlik bilgisi yüzeyi (`api-keys`, `webhooks`), (c) keyfi kod
      yürütme (`/admin/appearance/custom-code/*`), (d) site-geneli kill switch
      (`PATCH /admin/modules/{key}`, `GET /admin/health`), (f) denetim izi (`/admin/logs`) —
      VE blok yapısı (`canUseAdvancedBuilder: false`).

    - **EDITOR** (Editör): YALNIZCA `blog` (tam CRUD) + `media` + `pages` (yalnızca içerik
      alanları). Diğer TÜM admin modüllerinde `403`.

    - **CUSTOMER** (Müşteri) ve **USER** (Standart Üye): `/admin/*` altındaki HİÇBİR uca
      erişemez → **`403`** (`requirePanelAccess()` kapısı). İkisi arasındaki fark API'de
      YOKTUR, yalnızca ön yüz sunumundadır (bkz. `GET /users/me/orders`).


    **`/admin/*` kapısı:** `ADMIN|MANAGER|EDITOR` dışındaki her rol 403 alır. Bu kapının
    İKİ İSTİSNASI vardır ve liste genişletilemez: `/admin/settings/security/2fa` ve
    `/admin/settings/security/sessions` — bunlar self-servis (kendi 2FA'n / kendi
    oturumların) uçlarıdır, `authenticated` kalır ve 5 rolün hepsi erişir.


    **Varsayılan rol:** `USER` (public `POST /auth/register` ile açılan her hesap; sıfırdan
    kurulan bir ortamda İLK hesap `ADMIN`). `USER → CUSTOMER` terfisi, kimliği doğrulanmış
    bir kullanıcının siparişi ÖDENDİĞİNDE otomatik gerçekleşir; başka hiçbir rol otomatik
    değiştirilmez.

tags:
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Plans
  - name: Billing
  - name: Webhooks
  - name: Health
  - name: AdminUsers
    description: >
      Org'dan bağımsız site-geneli kullanıcı/rol yönetimi (`/admin/users`) — **yalnızca
      SiteRole=ADMIN, OKUMA DAHİL.** MANAGER/EDITOR → 403. Gerekçe (tartışmaya kapalı):
      bu uçlara yazabilen bir MANAGER kendini `ADMIN` yapabilirdi — dikey ayrıcalık
      yükseltmesi; ayrıca kullanıcı listesi bütünüyle PII'dir.
  - name: Logs
    description: >
      Audit log (`/admin/logs`) — **yalnızca SiteRole=ADMIN.** MANAGER bilinçli olarak
      DIŞARIDA: denetim izi, ADMIN eylemlerinin kurcalanamaz kaydıdır (denetleyen ile
      denetlenenin ayrılığı ilkesi).
  - name: Navigation
    description: >
      Site header/nav/footer yapılandırması (`/navigation`, `/admin/navigation`).
      `/navigation` public'tir (site header/nav/footer bunu okur); `/admin/navigation`
      yönetim ekranı içindir: `GET` SiteRole=ADMIN/MANAGER/EDITOR (panel kapısı),
      `PUT` SiteRole=ADMIN veya MANAGER.
  - name: Pages
    description: >
      CMS sayfa yönetimi (`/admin/pages`). Soft-delete (çöp kutusu), toplu işlem
      ve SEO tamlık skoru için bkz. ARCHITECTURE.md §10.7.


      **§10.21 ÜÇ KATMANLI YETKİ (bağlayıcı — `.claude/architect-scope-rbac-5-tier.md` §6).**
      Sayfa modülü TEK bir rol eşiğiyle ifade EDİLEMEZ:


      - **Katman 1 — Blok YAPISI: yalnızca `ADMIN`.** Blok ekleme/silme/taşıma/sıralama,
        `container.settings`, `reveal`, `custom-html.data.html`, `isLegalDocument`,
        `authorId`. Uç seviyesinde DEĞİL, `PATCH`/`autosave` gövdesinin İÇİNDE
        (`assertTemplateEditAllowed` diff'i) uygulanır; ihlal → `403 FORBIDDEN`.
        `editMode` değerinden BAĞIMSIZDIR.

      - **Katman 2 — Sayfa YAŞAM DÖNGÜSÜ ve KİMLİĞİ: `ADMIN`, `MANAGER`.** Çöpe atma,
        geri yükleme, kalıcı silme, `bulk`, revizyon-restore; gövdede `slug` ve `editMode`.

      - **Katman 3 — Blok İÇERİĞİ ve sayfa META'sı: `ADMIN`, `MANAGER`, `EDITOR`.** Okuma,
        `PATCH`, `autosave`, revizyon okuma; gövdede `title`/SEO alanları/`status`/
        `scheduledAt`/`translations`.


      | Uç | SiteRole |
      |---|---|
      | `GET /admin/pages`, `GET /admin/pages/{pageId}` | ADMIN, MANAGER, EDITOR |
      | `POST /admin/pages` | **ADMIN** (istisna — bkz. aşağıdaki not) |
      | `PATCH /admin/pages/{pageId}` | ADMIN, MANAGER, EDITOR (+ Katman 1 gövde kontrolü) |
      | `POST /admin/pages/{pageId}/autosave` | ADMIN, MANAGER, EDITOR (+ Katman 1 gövde kontrolü) |
      | `DELETE /admin/pages/{pageId}` | ADMIN, MANAGER |
      | `POST /admin/pages/{pageId}/restore` | ADMIN, MANAGER |
      | `DELETE /admin/pages/{pageId}/permanent` | ADMIN, MANAGER |
      | `POST /admin/pages/bulk` | ADMIN, MANAGER |
      | `GET .../revisions`, `GET .../revisions/{revisionId}` | ADMIN, MANAGER, EDITOR |
      | `POST .../revisions/{revisionId}/restore` | ADMIN, MANAGER |


      **`POST /admin/pages` neden Katman 2 değil, yalnızca ADMIN:** Katman 1 gereği MANAGER
      blok EKLEYEMEZ; oluşturduğu boş sayfayı asla dolduramaz. Yetkiyi vermek kırık bir akış
      üretirdi. Anlamlı bir oluşturma yolu için takip kalemi:
      `feature/page-duplicate-from-template`.


      **`requireAdvancedBuilder()` middleware'i KALDIRILDI** —
      `canUseAdvancedBuilder === (role === "ADMIN")` olduğu için uç seviyesinde artık düz rol
      listeleri kullanılır; `canUseAdvancedBuilder` yalnızca Katman 1 gövde kararı ve UI için
      kalır.
  - name: Blog
    description: >
      Blog yazısı yönetimi (`/admin/blog`, `/admin/blog/categories`, `/admin/blog/tags`).
      Çöp/toplu işlem/SEO skoru davranışı `Pages` ile BİREBİR AYNIDIR (ARCHITECTURE.md §10.7),
      **ama yetki eşiği FARKLIDIR:** blog, EDITOR'ün TAM CRUD sahibi olduğu tek içerik
      modülüdür.


      Oluşturma, güncelleme, **yayınlama**, çöpe atma, geri yükleme, toplu işlem, revizyon
      (okuma + restore), kategori/etiket oluşturma-güncelleme → **SiteRole=ADMIN, MANAGER
      veya EDITOR**. Kalıcı silme (`DELETE /admin/blog/{postId}/permanent`) ve kategori/etiket
      silme → **ADMIN veya MANAGER** (geri alınamaz veri yıkımı EDITOR'e açılmaz).
  - name: ContentRevisions
    description: >
      İçerik sürüm kontrolü (`/admin/pages/{pageId}/revisions`,
      `/admin/blog/{postId}/revisions`) — bkz. ARCHITECTURE.md §10.1. Ayrı bir router
      DEĞİLDİR; kapsayıcı entity'nin eşiğini MİRAS ALIR: blog → ADMIN/MANAGER/EDITOR (restore
      dahil), pages → okuma ADMIN/MANAGER/EDITOR, **restore yalnızca ADMIN/MANAGER**
      (`Pages` Katman 2).
  - name: Media
    description: >
      Editör içi görsel yönetimi (`/admin/media`) — blog/sayfa içerik bloklarına ve
      kapak görsellerine BURADAN yüklenir. Okuma, yükleme ve alt metin güncelleme
      **SiteRole=ADMIN, MANAGER veya EDITOR**; kalıcı silme **ADMIN veya MANAGER**. `Page`/
      `BlogPost`'un aksine soft-delete/çöp kutusu YOKTUR.


      **Klasör sistemi (`/admin/media/folders`, `/admin/media/move`)** — bkz.
      ARCHITECTURE.md §10.11. Klasör okuma/oluşturma/yeniden adlandırma/taşıma
      ADMIN, MANAGER veya EDITOR (admin medya sayfası VE `MediaPicker` AYNI ucu paylaşır);
      klasör silme ADMIN veya MANAGER. Klasör silmek MEDYA SİLMEZ.
  - name: ContactForms
    description: >
      §10.16 İletişim Formu — tek (singleton) form yapılandırması
      (`/admin/contact/form`, `/admin/contact/form/fields`), gönderim kutusu
      (`/admin/contact/submissions`) ve PUBLIC uçlar (`/contact/form`,
      `/contact/submissions`). **TÜM admin uçları SiteRole=ADMIN veya MANAGER'dır**
      (form yapılandırması, gönderim okuma/durum güncelleme ve gönderim silme dahil).
      **EDITOR bu modülden ÇIKARILDI** (eskiden gönderim okuma/durum güncelleme yetkisi
      vardı): gönderimler ziyaretçi PII'si taşır ve EDITOR'ün kapsamı blog+medya+sayfa
      içeriğiyle sınırlıdır.
      Public gönderim ucu kimlik doğrulama İSTEMEZ, IP tabanlı rate limit + honeypot
      ile korunur (bkz. ARCHITECTURE.md §10.16.9).
  - name: EmailTemplates
    description: >
      E-posta & bildirim şablonu yönetimi (`/admin/notifications/templates`) — bkz.
      ARCHITECTURE.md §10.3 (temel) ve §10.16 (blok editörü genişletmesi). Tüm uçlar
      SiteRole=ADMIN veya MANAGER (GET dahil); EDITOR → 403.


      **BREAKING (§10.16.6):** şablonlar artık `{key}` ile DEĞİL `{templateId}` (uuid)
      ile adreslenir — kullanıcının oluşturduğu şablonların `key`'i `null`'dır.
      `editorMode=BLOCKS` şablonlarında gövde HTML'i İSTEMCİDEN KABUL EDİLMEZ; istemci
      yalnızca yapısal `blocks` gönderir, HTML'i sunucu üretir
      (`lib/email-renderer.ts`) — bkz. §10.16.4.
  - name: Import
    description: >
      Toplu içe aktarma (`/admin/import/*`) — bkz. ARCHITECTURE.md §10.8. Sayfa/blog
      (CSV+JSON), WordPress WXR (XML), kullanıcı (CSV) ve medya (ZIP) içe aktarımı.

      **TÜM uçlar İSTİSNASIZ yalnızca SiteRole=ADMIN'dir** — içerik yazma eşiği normalde
      daha geniş olsa da (bkz. `Pages`/`Blog`), toplu içe aktarma kayıt-bazlı incelemeyi
      atlar, mevcut içeriğin ÜZERİNE yazabilir, keyfi `authorId` atayabilir ve (kullanıcı
      içe aktarımında) **hesap oluşturup ROL VEREBİLİR**. Bu son madde nedeniyle MANAGER da
      bilinçli olarak DIŞARIDA bırakılmıştır (ayrıcalık yükseltme yüzeyi). MANAGER/EDITOR/
      CUSTOMER/USER → 403.

      **Dışa aktarma için uç YOKTUR (karar):** CSV dışa aktarma tamamen client-side'dır
      (`frontend/src/lib/export-csv.ts::exportToCsv`) — admin listeleri zaten tüm kayıtları
      `meta.nextCursor` döngüsüyle belleğe çeker, ayrı bir sunucu ucu ikinci bir doğruluk
      kaynağı yaratırdı. Bkz. ARCHITECTURE.md §10.8 "Dışa aktarma". (Bu, `Pages`/`Blog`/
      `AdminUsers` LİSTE ekranlarının CSV dışa aktarımı içindir — analitik/raporlama dışa
      aktarımı için bkz. `Reports` tag'i, `/admin/reports/exports`.)
  - name: Stats
    description: >
      Admin analitik/raporlama verisi (`/admin/stats/*`) — bkz. ARCHITECTURE.md §10.8.10.
      **TÜM uçlar SiteRole=ADMIN veya MANAGER'dır** (içerik analitiği ve kullanıcı/gelir
      verisi ayrımı YETKİ açısından KALDIRILDI — MANAGER siparişleri de görebildiği için
      gelir verisini ondan saklamak tutarsız olurdu). **EDITOR bu modülden ÇIKARILDI**
      (eskiden `/views`, `/breakdown`, `/top-content`, `/live-visitors` uçlarına erişiyordu).


      **Frontend sonucu (atlanması kolay):** `/admin` gösterge paneli bu uçları çağırır →
      EDITOR için render EDİLMEZ, EDITOR girişte `/admin/blog`'a yönlendirilir.
  - name: Reports
    description: >
      Analitik rapor dışa aktarma (`/admin/reports/exports`) — bkz. ARCHITECTURE.md
      §10.8.10. **TÜM uçlar İSTİSNASIZ SiteRole=ADMIN veya MANAGER'dır** (rapor türü fark
      etmeksizin — `Stats` ile AYNI eşik). EDITOR → 403. Süreç-içi worker ile asenkron üretilir (kuyruk
      altyapısı yok, §10.8.1 ile aynı desen); oluşturma ucu 10 istek/10 dakika ile
      sınırlıdır (429).
  - name: Settings
    description: >
      Site geneli tekil (singleton) ayarlar (`/settings`, `/admin/settings`) — bkz.
      ARCHITECTURE.md §10.9.5. `/settings` public'tir (site header/nav bunu okur),
      `/admin/settings` yönetim ekranı içindir: `GET /admin/settings` SiteRole=ADMIN/MANAGER/
      EDITOR (panel kapısı), **`PATCH /admin/settings` yalnızca SiteRole=ADMIN** (site-geneli
      kill switch — `homePageId`, `siteTemplate`, entegrasyonlar; MANAGER bilinçli olarak
      DIŞARIDA). `GET /admin/settings/permissions` de **yalnızca ADMIN**'dir (izin matrisi =
      ayrıcalık yüzeyi haritası).


      **`/admin/settings/security/2fa` ve `/admin/settings/security/sessions` bu eşiğe
      TABİ DEĞİLDİR** — bunlar self-servis uçlardır (kullanıcının KENDİ 2FA'sı / KENDİ
      oturumları), `authenticated` kalır ve **5 rolün hepsi (CUSTOMER/USER dahil) erişir**.
      Bu, `/admin/*` panel kapısının İKİ istisnasından biridir ve liste genişletilemez;
      `/users/me/security/*` altına taşınmaları takip kalemidir
      (`chore/relocate-self-service-security-routes`).


      **Kapsam sınırı (§10.12):** `Settings` sitenin NASIL ÇALIŞTIĞINI tutar
      (`siteName`, `homePageId`, `siteTemplate`, rol matrisi, entegrasyonlar).
      Sitenin NASIL GÖRÜNDÜĞÜ `Appearance` tag'ine (`/appearance`,
      `/admin/appearance`), NEREYE GİDİLDİĞİ ise `Navigation` tag'ine aittir.
      `SiteSettings` şeması bu bölümle GENİŞLETİLMEZ — bkz. `Appearance` tag'i.
  - name: Appearance
    description: >
      Site Özelleştirme / görünüm ayarları (`/appearance`, `/admin/appearance`) — bkz.
      ARCHITECTURE.md §10.12. Renk, tipografi, sayfa başlığı düzeni, tema ön ayarı,
      görünüm anahtarları (toggle), 404 sayfası ve özel CSS/JS.


      **Yetki (§10.21):** okuma (`GET /admin/appearance`, `/presets`, `/custom-code`)
      SiteRole=ADMIN/MANAGER/EDITOR (panel kapısı); `PATCH /admin/appearance` ve
      `POST /admin/appearance/reset` **ADMIN veya MANAGER**;
      `PUT /admin/appearance/custom-code/css` ve `.../js` **yalnızca ADMIN**.
      EDITOR tüm yazma uçlarında 403; MANAGER yalnızca özel CSS/JS'te 403.
      Bu bölünmenin gerekçesi: renk/tipografi/tema bir SİTE YÖNETİMİ işidir (MANAGER),
      ama özel CSS/JS **keyfi kod yürütmedir** ve MANAGER'ın dışında bırakıldığı beş
      kategoriden biridir (ayrıca bkz. ARCHITECTURE.md §10.12.6).


      **Bu ayarlar YALNIZCA ziyaretçi (public) tarafını etkiler; admin panelinin
      kendi teması/vurgu rengi bu uçlardan ASLA değiştirilemez.** Admin teması
      `next-themes` + `AccentProvider` ile kullanıcı-başına yönetilir ve
      `.admin-shell` altında ayrı token'lar kullanır (bkz. §10.12.4).
  - name: Modules
    description: >
      Eklenti/Modül Yönetimi (`/admin/modules`, `/modules`) — bkz. ARCHITECTURE.md
      §10.9.1. Modül TANIMLARI (`key`/`label`/`description`/`recommendedFor`) kod içi
      statik bir registry'dir; yalnızca aktif/pasif DURUM DB'de tutulur. `GET
      /admin/modules` SiteRole=ADMIN/MANAGER/EDITOR, **`PATCH /admin/modules/{key}`
      yalnızca ADMIN** (bir modülü kapatmak ilgili TÜM public uçları 404'e düşürür — bu bir
      site-geneli kill switch'tir, MANAGER bilinçli olarak DIŞARIDA). `GET /modules`
      public'tir (site header/nav hangi modüllerin aktif olduğunu buradan okur).
  - name: Products
    description: >
      Ürünler modülü (`/admin/products`, `/products`) — bkz. ARCHITECTURE.md §10.9.2.
      Çöp/SEO skoru davranışı `Pages`/`Blog` ile BİREBİR AYNIDIR (§10.7), üzerine
      e-ticaret alanları (fiyat/stok/SKU) eklenmiştir.
      **Yetki (§10.21): TÜM admin uçları — okuma dahil — SiteRole=ADMIN veya MANAGER'dır.
      EDITOR bu modülden ÇIKARILDI** (eskiden yazma yetkisi vardı); EDITOR'ün kapsamı
      blog + medya + sayfa içeriğiyle sınırlıdır. Public uçlar
      (`/products*`) yalnızca `products` modülü AKTİFSE yanıt verir — kapalıyken TÜM
      public uçlar `404 NOT_FOUND` döner (bkz. `Modules` tag'i); admin uçları modül
      durumundan BAĞIMSIZDIR (veri korunumu).
  - name: Portfolio
    description: >
      Portföy modülü (`/admin/portfolio`, `/portfolio`) — bkz. ARCHITECTURE.md §10.9.4.
      `Products` ile BİREBİR AYNI patern (fiyat/stok/SKU yerine `clientName`/
      `projectUrl`/`completedAt`/manuel `order` sıralaması) — **yetki eşiği de aynı:
      TÜM admin uçları (okuma dahil) SiteRole=ADMIN veya MANAGER; EDITOR → 403.**
      Public uçlar yalnızca
      `portfolio` modülü AKTİFSE yanıt verir — kapalıyken 404 (bkz. `Modules` tag'i).
  - name: Cart
    description: >
      Misafir alışveriş sepeti (`/cart`) — bkz. ARCHITECTURE.md §10.9.3. Kimlik
      doğrulama GEREKTİRMEZ; opak, httpOnly bir çerez (`cart_token`) ile takip edilir.
      Yalnızca `products` modülü AKTİFSE yanıt verir — kapalıyken 404.
  - name: Checkout
    description: >
      Stripe Checkout oturumu oluşturma (`/checkout/session`) — bkz. ARCHITECTURE.md
      §10.9.3. Kimlik doğrulama GEREKTİRMEZ. Yalnızca `products` modülü AKTİFSE yanıt
      verir — kapalıyken 404. Route-level hız sınırı: 10 istek/dakika (IP bazlı).
  - name: Orders
    description: >
      Admin sipariş yönetimi (`/admin/orders`) — bkz. ARCHITECTURE.md §10.9.3. **TÜM
      uçlar İSTİSNASIZ SiteRole=ADMIN veya MANAGER'dır** (EDITOR/CUSTOMER/USER → 403).
      Müşterinin KENDİ siparişlerini görmesi için ayrı bir uç vardır: `GET /users/me/orders`
      (sahiplik filtresi, rol guard'ı YOK). Modül durumundan BAĞIMSIZDIR
      (`products` modülü kapatılsa dahi geçmiş siparişler görüntülenebilir — veri
      korunumu, `Products`/`Portfolio` admin uçlarıyla AYNI karar). `customerEmail`
      LİSTEDE maskelenir, DETAYDA maskesiz döner (bkz. uç açıklaması).
  - name: Localization
    description: >
      Çoklu dil yapılandırması (`/locales`, `/admin/locales`) — bkz. ARCHITECTURE.md
      §10.5 ve `.claude/architect-scope-i18n.md`. Desteklenen diller VERİDİR (kod
      değil): yeni bir dil eklemek `Locale` tablosuna bir SATIR eklemekle olur, şema
      değişikliği/migration/deploy GEREKTİRMEZ.


      `GET /locales` public'tir (site dil değiştirici ve `[lang]` rota doğrulaması
      bunu okur); `/admin/locales` yönetim içindir: `GET` SiteRole=ADMIN/MANAGER/EDITOR
      (çeviri editörü sekmelerini kurmak için EDITOR de okur), **yazma uçları
      SiteRole=ADMIN veya MANAGER**'dır (EDITOR dahi dil ekleyemez — dil eklemek sitenin URL
      uzayını ve sitemap'ini genişleten yapısal bir karardır).


      **Terminoloji (bağlayıcı):** `locale` = BCP-47 dil kodu, HER ZAMAN küçük harf
      (`tr`, `en`, `de`, `en-gb`). Veritabanı, API, URL prefix'i ve `<html lang>` bu
      TEK gösterimi kullanır. `translations` JSON'undaki ESKİ büyük-harf anahtarlar
      (`{"EN": {...}}`) geriye dönük uyumluluk için okunur ama YENİ yazımlarda
      KULLANILMAZ (bkz. migration notu, architect-scope-i18n.md §2.4).
  - name: ApiKeys
    description: >
      API anahtarı yönetimi (`/admin/settings/api-keys`) — bkz. ARCHITECTURE.md §10.13.3.
      Üçüncü parti entegrasyonların (`PublicApi`) kimlik doğrulaması için kullanılan
      anahtarlar burada üretilir/iptal edilir.


      **TÜM uçlar İSTİSNASIZ yalnızca SiteRole=ADMIN'dir — OKUMA DAHİL.**
      MANAGER/EDITOR/CUSTOMER/USER → 403. Gerekçe: anahtar listesi (adlar, ön ekler,
      scope'lar) saldırı yüzeyi haritasıdır (bkz. §10.13.10); ayrıca kimlik bilgisi
      yüzeyi, MANAGER'ın bilinçli olarak dışında bırakıldığı beş kategoriden biridir.


      **Ham anahtar YALNIZCA `POST` (201) yanıtında `plainKey` olarak BİR KEZ döner**;
      DB'de `sha256` hash'i saklanır (§10.13.3), başka hiçbir uçtan geri okunamaz.
      Liste/detay yanıtları yalnızca `keyPrefix` + `last4` taşır.
  - name: OutboundWebhooks
    description: >
      **GİDEN** webhook yönetimi (`/admin/settings/webhooks`) — bkz. ARCHITECTURE.md
      §10.13.8/§10.13.9. Bir olay gerçekleştiğinde BİZİM dış bir URL'e HMAC ile
      imzalanmış POST attığımız sistemdir.


      **`Webhooks` tag'i İLE KARIŞTIRILMAMALI:** o tag `POST /webhooks/stripe`
      içindir, yani BİZE GELEN (inbound) webhook'tur. İki sistem birbirinin tersidir;
      ne modül, ne tip, ne uç adı paylaşırlar.


      **TÜM uçlar İSTİSNASIZ yalnızca SiteRole=ADMIN'dir — OKUMA DAHİL.**
      MANAGER/EDITOR/CUSTOMER/USER → 403 (kimlik bilgisi yüzeyi, `ApiKeys` ile aynı
      gerekçe). Secret
      (`whsec_…`) yalnızca oluşturma (201) ve `rotate-secret` yanıtlarında
      `plainSecret` olarak BİR KEZ döner; DB'de AES-256-GCM ile ŞİFRELİ saklanır
      (hash DEĞİL — HMAC üretimi için geri çözülebilir olmak ZORUNDADIR, gerekçe
      §10.13.9). URL'ler SSRF'e karşı hem oluşturmada hem her teslimatta doğrulanır
      (§10.13.7).
  - name: PublicApi
    description: >
      Üçüncü parti entegrasyonlar için **SALT-OKUNUR** public API katmanı
      (`/api/v1/public/*`) — bkz. ARCHITECTURE.md §10.13.4/§10.13.5. Admin API'sinden
      ve mevcut kimliksiz site uçlarından (`/pages`, `/blog`, `/products`,
      `/portfolio`) **AYRI** bir katmandır.


      **Kimlik doğrulama: `X-Api-Key: cmsk_…` — TEK kabul edilen biçim.**
      `Authorization: Bearer` bu katmanda KABUL EDİLMEZ (401); simetrik olarak bir API
      anahtarı da `/admin/*` uçlarında kabul edilmez. Kimlik bilgisi türlerinin
      karışması yapısal olarak imkânsız kılınmıştır (§10.13.4).


      **Yalnızca `GET`.** Tüm sorgular `status = PUBLISHED AND deletedAt IS NULL` ile
      başlar; `?status=`/`?trashed=` gibi filtreler bu katmanda YOKTUR (422). Ürün/
      portföy uçları ilgili modül kapalıysa `404` döner (`Modules` tag'i ile aynı
      davranış).


      **Hız sınırı iki katmanlıdır (§10.13.6):** IP tabanı 300/dk (atlanamaz) +
      doğrulanmış anahtar başına 120/dk (burst 20/sn). `x-ratelimit-*` header'ları
      anahtar kotasını yansıtır.


      **DTO'lar AYRIDIR** (`PublicPage`, `PublicBlogPost`, `PublicProduct`,
      `PublicPortfolioItem`): admin DTO'larındaki `author` (personel **e-postası**
      içerir), `authorId`, `seoScore`, `deletedAt`, `viewCount`, `translations`
      alanları BU KATMANDA DÖNMEZ (§10.13.5).


      **Sunucudan-sunucuya kullanım içindir** — CORS `origin: "*"` AÇILMAZ; tarayıcı
      içi JavaScript'ten API anahtarı kullanmak anahtarı ifşa eder.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      security: []
      summary: Servis sağlık kontrolü
      responses:
        "200":
          description: Servis ayakta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Yeni kullanıcı kaydı
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Kayıt başarılı, oturum açıldı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: E-posta/şifre ile giriş
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Giriş başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh cookie ile yeni access token al (rotasyonlu)
      security: []
      description: Refresh token httpOnly cookie üzerinden okunur, body gerekmez.
      responses:
        "200":
          description: Yeni access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Oturumu kapat (refresh token'ı iptal et)
      responses:
        "204": { description: Çıkış yapıldı }

  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Şifre sıfırlama e-postası gönder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: İstek alındı (e-posta enumeration önlemek için her zaman 202) }

  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Şifreyi token ile sıfırla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "204": { description: Şifre güncellendi }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Mevcut oturumun kullanıcı ve üyelik bilgisi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/orders:
    get:
      tags: [Users]
      summary: Kendi siparişlerim (authenticated — TÜM roller)
      description: >
        §10.21 — ön yüzdeki `/siparislerim` ekranını besleyen uç. `Order.siteUserId = me`
        filtresiyle cursor sayfalı liste döner (`seq desc`, en yeni önce).


        **ROL GUARD'I YOKTUR ve EKLENMEYECEKTİR (bağlayıcı).** Yetkilendirmenin gerçek
        kontrolü **sahipliktir** (`siteUserId = me`), rol değil. `requireSiteRole("CUSTOMER")`
        eklemek ikinci ve gereksiz bir kontroldür; `USER → CUSTOMER` terfisi Stripe webhook'u
        üzerinden gerçekleştiği için gecikirse kullanıcı kendi siparişini göremez hale
        gelirdi. Bir `USER` bu ucu çağırırsa **boş liste** döner (403 değil).


        `/siparislerim` bağlantısının navigasyonda görünmesi bir SUNUM kararıdır
        (`role === "CUSTOMER"`), yetki kararı değil.


        **`customerEmail` MASKELENMEZ** — kullanıcı zaten kendi verisini okuyor
        (`GET /admin/orders` listesindeki maskeleme, üçüncü bir tarafın toplu göz atması
        içindir; burada geçerli değildir).


        **Misafir siparişleri BU LİSTEDE GÖRÜNMEZ:** `Order.siteUserId` yalnızca kimliği
        doğrulanmış bir çağıranın `POST /checkout/session` isteğinde doldurulur. Geçmiş
        misafir siparişlerini bir hesaba bağlamak KAPSAM DIŞIDIR
        (takip: `feature/order-account-linking`).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
                      meta: { $ref: "#/components/schemas/OrderListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    get:
      tags: [Users]
      summary: Profilimi getir
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Users]
      summary: Profilimi güncelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Kendi şifremi değiştir
      description: >
        Oturum açmış kullanıcı KENDİ şifresini değiştirir (site-rol şartı YOK, `authenticate`
        yeterli). `currentPassword` argon2 ile doğrulanır; hatalıysa 401 döner ve
        `security.password_change` audit kaydı `status: FAILURE` ile yazılır. Başarılı olursa
        `passwordHash` güncellenir ve **mevcut oturum hariç** tüm `RefreshToken` kayıtları
        iptal edilir (bkz. `/admin/settings/security/2fa/disable` ile aynı politika) —
        yani diğer cihazlardaki oturumlar zorla kapanır, isteği yapan cihaz açık kalır.
        Hassas uç: route-level rate limit uygulanır (5 istek / 1 dakika).
        Şifre sıfırlama (token ile, oturumsuz) akışı için bkz. `/auth/reset-password`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Şifre değiştirildi (gövde yok) }
        "401":
          description: >
            `currentPassword` hatalı veya oturum geçersiz. Mesaj, hangi alanın hatalı
            olduğunu sızdırmayacak şekilde sabittir ("Şifre hatalı.").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /organizations:
    get:
      tags: [Organizations]
      summary: Üyesi olduğum organizasyonları listele
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
    post:
      tags: [Organizations]
      summary: Yeni organizasyon oluştur (oluşturan OWNER olur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Organization" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organizations]
      summary: Organizasyon detayı
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Organizations]
      summary: Organizasyonu güncelle (ADMIN/OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Organizations]
      summary: Organizasyonu sil (yalnızca OWNER)
      responses:
        "204": { description: Silindi }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Members]
      summary: Organizasyon üyelerini listele
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Membership" }

  /organizations/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Members]
      summary: Üye rolünü değiştir (ADMIN/OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMembershipRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Members]
      summary: Üyeyi organizasyondan çıkar (ADMIN/OWNER)
      responses:
        "204": { description: Çıkarıldı }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Invitations]
      summary: Bekleyen davetleri listele (ADMIN/OWNER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invitation" }
    post:
      tags: [Invitations]
      summary: Yeni üye davet et (ADMIN/OWNER)
      description: >
        `role` şema seviyesinde zaten `ADMIN|MEMBER` ile sınırlıdır (`OWNER` gönderilirse
        422). Buna EK olarak yetkilendirme seviyesinde savunma-derinliği kontrolü vardır:
        davet eden `OWNER` DEĞİLSE (yani `ADMIN` ise) ve `role: "OWNER"` isterse 403 döner
        — bugün şema zaten bu durumu engellediği için bu dal fiilen ölü koddur, ama kontrat
        ileride `OWNER`'ı `role` enum'una eklerse tek başına yeterli olması için tutulur
        (bkz. security-agent denetimi). Başarılı istek `invitation.create` audit kaydı yazar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Davet gönderildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Invitation" }
        "403":
          description: >
            Davet eden `OWNER` değilken `role: "OWNER"` istedi (savunma-derinliği —
            bkz. yukarıdaki açıklama).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }

  /invitations/{token}/accept:
    post:
      tags: [Invitations]
      summary: Daveti kabul et (giriş yapmış kullanıcı)
      description: >
        Başarılı kabulde `invitation.accept` audit kaydı yazılır (`targetType: "Membership"`).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Kabul edildi, üyelik oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Membership" }
        "410": { description: Davet süresi dolmuş/iptal edilmiş }

  /plans:
    get:
      tags: [Plans]
      security: []
      summary: Herkese açık plan listesi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Plan" }

  /organizations/{orgId}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Billing]
      summary: Organizasyonun abonelik durumu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Subscription" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{orgId}/subscription/checkout-session:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Billing]
      summary: Stripe Checkout oturumu oluştur (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckoutSessionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CheckoutSessionResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/subscription/portal-session:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Billing]
      summary: Stripe Billing Portal oturumu oluştur (OWNER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BillingPortalResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users:
    get:
      tags: [AdminUsers]
      summary: Site kullanıcılarını listele (yalnızca ADMIN)
      description: >
        **Varsayılan olarak `status: DELETED` kullanıcılar DÖNMEZ** (yumuşak silme —
        bkz. `DELETE /admin/users/{userId}`). Silinmiş kullanıcıları görmek (ve
        `POST /admin/users/{userId}/restore` ile geri almak) için `includeDeleted=true`
        gönderilmelidir. Bu, listenin admin panelde "silinmiş" kullanıcılarla dolmasını
        engeller ama kaydın geri alınabilirliğini korur.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: includeDeleted
          in: query
          required: false
          description: >
            `true` ise `DELETED` durumundaki kullanıcılar da listeye dahil edilir.
            Varsayılan `false`.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [AdminUsers]
      summary: Yeni site kullanıcısı oluştur (yalnızca ADMIN)
      description: >
        Kullanılamaz rastgele bir şifreyle oluşturulur; kullanıcı gerçek şifresini
        dönen `setPasswordUrl` üzerinden belirler (MVP/dev-only: e-posta sağlayıcısı
        entegre edilene kadar bağlantı doğrudan response'ta döner).


        **Hız sınırı:** 20 istek / 1 dakika (route-level, `ADMIN_USERS_RATE_LIMIT`
        — savunma-derinliği, ele geçirilmiş bir admin oturumunun toplu istismarını
        sınırlar). Aşım → 429.


        **Yumuşak silme etkileşimi:** silme `User` satırını KORUDUĞU ve `email`
        benzersiz olduğu için, `DELETED` durumundaki bir kullanıcının e-postasıyla
        yeni kullanıcı oluşturulamaz → `409 CONFLICT`
        ("Bu e-posta silinmiş bir kullanıcıya ait. Önce kullanıcıyı geri alın."):
        admin `includeDeleted=true` ile kullanıcıyı bulup
        `POST /admin/users/{userId}/restore` çağırmalıdır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminUserRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CreateAdminUserResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [AdminUsers]
      summary: Kullanıcının rolünü değiştir (yalnızca ADMIN)
      description: >
        Hedef kullanıcı sistemdeki tek aktif ADMIN ise ve yeni rol ADMIN değilse
        409 CONFLICT döner ("en az bir yönetici kalmalı" kuralı).


        **Silme ile ilişkisi:** `PATCH /status` ile TUTARLI olarak, hâlihazırda
        `DELETED` olan bir kullanıcının rolü bu uçla değiştirilemez → `404`
        (kayıt silinmiş sayılır). Bu, soft-delete edilmiş ve varsayılan listede
        görünmeyen bir hesabın rolünün sessizce değiştirilip, `POST
        /admin/users/{userId}/restore` ile geri alındığında kimsenin fark
        etmediği bir ayrıcalık değişikliğiyle geri dönmesini önler
        (security-agent denetimi). Rol değişikliği için önce kullanıcı restore
        edilmelidir.


        **Hız sınırı:** 20 istek / 1 dakika (route-level, `ADMIN_USERS_RATE_LIMIT`
        — bkz. `POST /admin/users`). Aşım → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserRoleRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >
            Kullanıcı bulunamadı (`NOT_FOUND`). `DELETED` olan bir kullanıcı
            da 404 döner — bkz. yukarıdaki "Silme ile ilişkisi".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # KALDIRILDI (§10.21): `PATCH /admin/users/{userId}/builder-access`.
  # `User.advancedBuilderEnabled` kolonu, bu uç ve `UpdateAdminUserBuilderAccessRequest`
  # şeması 5 rollü modelde ölü kaldı — `canUseAdvancedBuilder` artık saf bir rol türevidir
  # (`role === "ADMIN"`). Gerekçe: `.claude/architect-scope-rbac-5-tier.md` §3.
  # İstemciler bu ucu çağırmayı BIRAKMALIDIR (404 döner).

  /admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [AdminUsers]
      summary: Kullanıcının durumunu (ACTIVE/SUSPENDED) değiştir (yalnızca ADMIN)
      description: >
        Kendi hesabınızı askıya alamazsınız (her zaman 409). Hedef kullanıcı
        sistemdeki tek aktif ADMIN ise ve yeni durum SUSPENDED ise de 409 döner.


        **Silme ile ilişkisi:** gövde yalnızca `ACTIVE|SUSPENDED` kabul eder —
        `DELETED` göndermek `422 VALIDATION_ERROR` verir; silme YALNIZCA
        `DELETE /admin/users/{userId}` ile yapılır (silmenin oturum iptali gibi yan
        etkileri bu uçta uygulanmaz). Simetrik olarak, hâlihazırda `DELETED` olan bir
        kullanıcının durumu bu uçla değiştirilemez → `404` (kayıt silinmiş sayılır);
        geri alma için `POST /admin/users/{userId}/restore` kullanılır.


        **Hız sınırı:** 20 istek / 1 dakika (route-level, `ADMIN_USERS_RATE_LIMIT`
        — bkz. `POST /admin/users`). Aşım → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserStatusRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [AdminUsers]
      summary: Kullanıcıyı sil — YUMUŞAK SİLME (yalnızca ADMIN)
      description: >
        Kullanıcıyı `status: DELETED` durumuna alır ve `deletedAt` damgasını yazar.
        **Satır veritabanından FİZİKSEL OLARAK SİLİNMEZ** (architect kararı — gerekçe
        aşağıda); işlem `POST /admin/users/{userId}/restore` ile geri alınabilir.


        **Neden hard delete değil:** (1) `Organization.ownerId` ZORUNLU bir ilişkidir ve
        `onDelete` tanımlı değildir (Prisma varsayılanı `Restrict`) — organizasyon sahibi
        bir kullanıcının fiziksel silinmesi FK hatasıyla 500 üretirdi; (2) `BlogPost`,
        `Page`, `Product`, `PortfolioItem` yazarlıkları `onDelete: SetNull`'dır — fiziksel
        silme, yayındaki içeriğin yazar bilgisini geri dönüşsüz koparırdı; (3)
        `AuditLog.actorId` de `SetNull`'dır — denetim izinin aktör bağı kopardı, oysa
        ARCHITECTURE.md §10.8.8.1 madde 4 audit kayıtlarının silme talebiyle otomatik
        kaybolmaMAsını şart koşar.


        **Yan etkiler (atomik, tek Serializable transaction içinde):**

        - `status = DELETED`, `deletedAt = now()`

        - Kullanıcının TÜM `RefreshToken` kayıtları iptal edilir (aktif oturumlar anında düşer)

        - Kullanıcının bekleyen TÜM `PasswordResetToken` kayıtları geçersizleşir

        - `AuditLog`'a `user.delete` aksiyonu yazılır

        - İçerik/medya/organizasyon kayıtları DEĞİŞTİRİLMEZ (yazarlık korunur)


        **Kimlik doğrulama etkisi (backend-agent için ZORUNLU):** `DELETED` kullanıcı
        `SUSPENDED` ile birebir aynı şekilde giriş yapamaz ve mevcut access token'ı
        kabul edilmez — `middleware/authenticate.ts` ve `auth.service.ts` içindeki
        `SUSPENDED` kontrolleri `DELETED`'ı da kapsayacak biçimde genişletilmelidir.
        Aksi hâlde silinen kullanıcı token ömrü boyunca sistemi kullanmaya devam eder.


        **KVKK/GDPR sınırı — DİKKAT:** Bu uç bir **yönetimsel silme**dir
        ("bu kişi artık ekipte değil"); KVKK m.11 / GDPR Art. 17 **unutulma hakkını
        KARŞILAMAZ**, çünkü ad/e-posta gibi kişisel veriler satırda durmaya devam eder.
        Geri döndürülemez anonimleştirme ayrı bir akıştır (compliance-agent + db-agent,
        ayrı görev — bkz. ARCHITECTURE.md §10.18.1) ve bu uç öyleymiş gibi
        sunulMAMALIdır.


        **Hız sınırı:** 20 istek / 1 dakika (route-level, `ADMIN_USERS_RATE_LIMIT`
        — bkz. `POST /admin/users`). Aşım → 429.
      responses:
        "200":
          description: >
            Silindi (yumuşak). Güncel kullanıcı kaydı `status: DELETED` ve dolu
            `deletedAt` ile döner — frontend listesini bu yanıtla günceller.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >
            Kullanıcı bulunamadı (`NOT_FOUND`, "Kullanıcı bulunamadı."). ZATEN
            `DELETED` olan bir kullanıcı da 404 döner — silme idempotent DEĞİLDİR,
            silinmiş kayıt yalnızca `includeDeleted=true` ile görünür.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: >
            `CONFLICT` — iki ayrı kural, ikisi de mevcut PATCH uçlarıyla BİREBİR tutarlı:

            (a) "Kendi hesabınızı silemezsiniz." — hedef, isteği yapan admin'in kendisi
            (`PATCH /status`'taki self-suspend yasağının aynısı);

            (b) "Sistemde en az bir yönetici kalmalı." — hedef sistemdeki tek aktif
            ADMIN (`assertNotLastActiveAdmin`, admin-users.routes.ts). Kontrol, TOCTOU
            yarışını önlemek için silme yazımıyla AYNI Serializable transaction içinde
            yapılmalıdır.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/users/{userId}/restore:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [AdminUsers]
      summary: Silinmiş kullanıcıyı geri al (yalnızca ADMIN)
      description: >
        `DELETED` durumundaki kullanıcıyı `status: ACTIVE`'e döndürür ve `deletedAt`
        alanını `null`'a çeker. Rolü silme öncesindeki değeriyle korunur (silme rolü
        değiştirmez).


        Geri alma, jenerik `PATCH /status` üzerinden DEĞİL ayrı bir uçla yapılır:
        böylece kendi denetim aksiyonunu (`user.restore`) alır ve `PATCH /status`
        gövdesi `ACTIVE|SUSPENDED` ile sınırlı kalır — yani bir admin, durum değiştirme
        ucunu "yan etki" olarak kullanıp bir kullanıcıyı sessizce diriltemez.


        Geri alınan kullanıcının oturumları geri GELMEZ (silme sırasında iptal edilen
        refresh token'lar kalıcı olarak geçersizdir); kullanıcı yeniden giriş yapar.


        **Hız sınırı:** 20 istek / 1 dakika (route-level, `ADMIN_USERS_RATE_LIMIT`).
      responses:
        "200":
          description: >
            Geri alındı — kayıt `status: ACTIVE` ve `deletedAt: null` ile döner.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `CONFLICT` — "Bu kullanıcı silinmemiş." Hedef kullanıcı `DELETED`
            durumunda değil (ACTIVE/SUSPENDED); geri alınacak bir şey yok.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

