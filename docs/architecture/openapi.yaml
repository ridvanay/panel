            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContentRevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Yazıyı bu revizyondaki hale geri döndür (ADMIN/EDITOR)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon
        olarak kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.
      responses:
        "200":
          description: Yazı geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogPost" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/notifications/templates:
    get:
      tags: [EmailTemplates]
      summary: Tüm e-posta şablonlarını listele (yalnızca ADMIN)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/notifications/templates/{key}:
    parameters:
      - $ref: "#/components/parameters/TemplateKey"
    get:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu getir (yalnızca ADMIN)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu güncelle (yalnızca ADMIN)
      description: "Audit log: `notifications.template_update`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmailTemplateRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates/{key}/preview:
    parameters:
      - $ref: "#/components/parameters/TemplateKey"
    post:
      tags: [EmailTemplates]
      summary: Şablonu örnek değerlerle render ederek önizle (yalnızca ADMIN, DB'ye yazmaz)
      description: >
        Değişken render'ı allow-list'e dayalı, güvenli string replace ile yapılır
        (`EmailTemplate.availableVariables`) — bir template engine/`eval` kullanılmaz.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewEmailTemplateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PreviewEmailTemplateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      summary: Stripe webhook alıcı (imza `Stripe-Signature` header ile doğrulanır)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: İşlendi }
        "400": { description: Geçersiz imza }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrashedFilter:
      name: trashed
      in: query
      required: false
      description: >
        Çöp kutusu filtresi (§10.7). `exclude` (varsayılan) = yalnızca
        `deletedAt IS NULL`; `include` = çöptekiler dahil tümü; `only` = yalnızca çöp.
      schema:
        type: string
        enum: [exclude, include, only]
        default: exclude
    ContentStatusFilter:
      name: status
      in: query
      required: false
      description: >
        Sunucu tarafı durum filtresi. v1 admin liste ekranı KULLANMAZ (sekmeler
        client-side filtreler) — API tüketicileri ve ileride sunucu-taraflı sayfalama için.
      schema: { type: string, enum: [DRAFT, PUBLISHED] }
    TemplateKey:
      name: key
      in: path
      required: true
      description: "ör. WELCOME, PASSWORD_RESET, SYSTEM_ANNOUNCEMENT"
      schema: { type: string }

  responses:
    Unauthorized:
      description: Kimlik doğrulama yok/geçersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Forbidden:
      description: Yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    NotFound:
      description: Kaynak bulunamadı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Conflict:
      description: Çakışma (ör. e-posta zaten kayıtlı)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ValidationError:
      description: Girdi doğrulama hatası
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    TooManyRequests:
      description: "Hız sınırı aşıldı (`error.code: RATE_LIMITED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            nextCursor: { type: string, nullable: true }

    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  VALIDATION_ERROR,
                  CONFLICT,
                  RATE_LIMITED,
                  PAYLOAD_TOO_LARGE,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
        createdAt: { type: string, format: date-time }

    AdminUser:
      description: "`/admin/users` uçlarında dönen genişletilmiş kullanıcı DTO'su — yalnızca ADMIN görebilir."
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            status: { type: string, enum: [ACTIVE, SUSPENDED] }
            lastLoginAt: { type: string, format: date-time, nullable: true }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        actorEmail: { type: string, nullable: true }
        action: { type: string, example: "user.role_change" }
        status: { type: string, enum: [SUCCESS, FAILURE, FORBIDDEN] }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAdminUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER], default: EDITOR }

    CreateAdminUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        setPasswordUrl: { type: string, format: uri }

    UpdateAdminUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }

    UpdateAdminUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

    PermissionsMatrix:
      type: object
      properties:
        roles:
          type: array
          items: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
        modules:
          type: array
          items:
            type: object
            properties:
              module: { type: string }
              label: { type: string }
              actions:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string, enum: [ADMIN, EDITOR, VIEWER] }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED] }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER] }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceMonthlyCents: { type: integer }
        priceYearlyCents: { type: integer }
        currency: { type: string, example: TRY }
        limits:
          type: object
          additionalProperties: { type: integer }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/Plan" }
        status: { type: string, enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE] }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }

    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              role: { type: string, enum: [OWNER, ADMIN, MEMBER] }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/AuthTokens" }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    UpdateUserRequest:
      description: >
        Kendi profilini güncelleme (`PATCH /users/me`). Yalnızca `name` ve `avatarUrl`
        değiştirilebilir — `email`, `role`, `status` BU UÇTAN DEĞİŞTİRİLEMEZ (rol/durum
        için bkz. `/admin/users/{userId}/role|status`). `avatarUrl: null` gönderilirse
        avatar kaldırılır (boş string `""` GEÇERSİZDİR, 422 döner).
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri, nullable: true }

    ChangePasswordRequest:
      description: >
        `POST /users/me/change-password` gövdesi. `newPassword` kuralı `RegisterRequest`
        ve `/auth/reset-password` ile AYNIDIR (min 8 karakter) — tek kaynak: bu kontrat.
        `newPassword === currentPassword` ise 422 (`details.newPassword`) döner.
        Yeni şifre tekrarı (`confirm`) YALNIZCA istemci tarafı doğrulamasıdır, gövdede
        GÖNDERİLMEZ.
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    UpdateOrganizationRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER] }

    UpdateMembershipRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }

    CreateCheckoutSessionRequest:
      type: object
      required: [planId, billingCycle, successUrl, cancelUrl]
      properties:
        planId: { type: string, format: uuid }
        billingCycle: { type: string, enum: [monthly, yearly] }
        successUrl: { type: string, format: uri }
        cancelUrl: { type: string, format: uri }

    CheckoutSessionResponse:
      type: object
      properties:
        checkoutUrl: { type: string, format: uri }

    BillingPortalResponse:
      type: object
      properties:
        portalUrl: { type: string, format: uri }

    NavigationItem:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string }
        order: { type: integer }

    SocialLink:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [TWITTER, GITHUB, LINKEDIN, INSTAGRAM, FACEBOOK, YOUTUBE, OTHER] }
        url: { type: string }
        order: { type: integer }

    FooterLink:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string }
        order: { type: integer }

    FooterColumn:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        order: { type: integer }
        links:
          type: array
          items: { $ref: "#/components/schemas/FooterLink" }

    NavigationConfig:
      type: object
      properties:
        headerCtaLabel: { type: string, nullable: true }
        headerCtaHref: { type: string, nullable: true }
        footerCopyrightText: { type: string, nullable: true }
        navigationItems:
          type: array
          items: { $ref: "#/components/schemas/NavigationItem" }
        socialLinks:
          type: array
          items: { $ref: "#/components/schemas/SocialLink" }
        footerColumns:
          type: array
          items: { $ref: "#/components/schemas/FooterColumn" }

    UpdateNavigationConfigRequest:
      description: >
        Tam değiştirme (replace) semantiği — `navigationItems`/`socialLinks`/`footerColumns`
        dizileri gönderilen haliyle mevcut kayıtların tamamının yerini alır; `id` alanları
        istemciden gönderilmez (sunucu yeniden üretir).
      type: object
      required: [navigationItems, socialLinks, footerColumns]
      properties:
        headerCtaLabel: { type: string, maxLength: 60, nullable: true }
        headerCtaHref:
          type: string
          maxLength: 500
          nullable: true
          description: "yalnızca http(s)://, / veya # ile başlayan yollar kabul edilir"
        footerCopyrightText: { type: string, maxLength: 200, nullable: true }
        navigationItems:
          type: array
          maxItems: 20
          items:
            type: object
            required: [label, href, order]
            properties:
              label: { type: string, minLength: 1, maxLength: 80 }
              href: { type: string, minLength: 1, maxLength: 500 }
              order: { type: integer, minimum: 0 }
        socialLinks:
          type: array
          maxItems: 15
          items:
            type: object
            required: [platform, url, order]
            properties:
              platform: { type: string, enum: [TWITTER, GITHUB, LINKEDIN, INSTAGRAM, FACEBOOK, YOUTUBE, OTHER] }
              url: { type: string, minLength: 1, maxLength: 500 }
              order: { type: integer, minimum: 0 }
        footerColumns:
          type: array
          maxItems: 8
          items:
            type: object
            required: [title, order, links]
            properties:
              title: { type: string, minLength: 1, maxLength: 80 }
              order: { type: integer, minimum: 0 }
              links:
                type: array
                maxItems: 20
                items:
                  type: object
                  required: [label, href, order]
                  properties:
                    label: { type: string, minLength: 1, maxLength: 80 }
                    href: { type: string, minLength: 1, maxLength: 500 }
                    order: { type: integer, minimum: 0 }


    DailyViewStats:
      type: object
      properties:
        date: { type: string, format: date, example: "2026-07-30" }
        pageViews: { type: integer }
        postViews: { type: integer }

    LiveVisitors:
      type: object
      properties:
        count:
          type: integer
          description: >
            Son 60 saniye içinde bir görüntülenme endpoint'ini çağıran benzersiz
            IP+User-Agent sayısı (süreç-içi/in-memory, dağıtık değil).

    DeviceBreakdownEntry:
      type: object
      properties:
        type: { type: string, enum: [MOBILE, DESKTOP, TABLET, UNKNOWN] }
        count: { type: integer }

    CountryBreakdownEntry:
      type: object
      properties:
        country:
          type: string
          description: >
            ISO 3166-1 alpha-2 ülke kodu, bilinmiyorsa "UNKNOWN"; ilk 10 dışında
            kalan ülkelerin toplamı "OTHER" olarak tek satırda döner.
        count: { type: integer }

    ViewsBreakdown:
      type: object
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceBreakdownEntry" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountryBreakdownEntry" }

    SystemHealth:
      type: object
      description: Tüm alanlar gerçek zamanlı ölçülür — sabit/uydurma değer içermez.
      properties:
        dbPingMs: { type: number, description: "`SELECT 1` sorgusunun ölçülen süresi (ms)" }
        dbSizeBytes: { type: number, description: "`pg_database_size(current_database())`" }
        dbQuotaBytes:
          type: number
          nullable: true
          description: "DB_STORAGE_QUOTA_MB tanımlı değilse null"
        mediaStorageBytes: { type: number, description: "Media.sizeBytes toplamı" }
        mediaStorageQuotaBytes:
          type: number
          nullable: true
          description: "MEDIA_STORAGE_QUOTA_MB tanımlı değilse null"
        memoryUsedBytes: { type: number }
        memoryTotalBytes: { type: number }
        processMemoryBytes: { type: number, description: "process.memoryUsage().rss" }
        loadAverage:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
          description: "os.loadavg() — [1dk, 5dk, 15dk]; Windows'ta her zaman [0,0,0] döner (platform kısıtı)"
        platform: { type: string, example: "linux" }
        uptimeSeconds: { type: number }
        checkedAt: { type: string, format: date-time }

    BlogCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    Page:
      description: >
        `/admin/pages` ve `/pages` uçlarında dönen sayfa DTO'su. `translations.EN`
        yalnızca override'ları taşır (bkz. ARCHITECTURE.md §10.5); `?locale=EN` ile
        okunan public GET'lerde bu alanlar zaten TR'ye alan-bazlı fallback edilmiş
        olarak gelir.
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          description: "ör. { \"EN\": { \"title\": \"...\", \"blocks\": [...] } } — bkz. shared-types.ts::PageTranslations"
          additionalProperties:
            type: object
            additionalProperties: true
        publishedAt: { type: string, format: date-time, nullable: true }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # ---- §10.7 İçerik Yönetim Listesi ----
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Soft-delete zaman damgası. `null` = aktif, dolu = ÇÖPTE. Public uçlar
            (`/pages`, `/pages/{slug}`, view sayacı, `SiteSettings.homePage`) bu alanı
            `null` olarak FİLTRELEMEK ZORUNDADIR.
        authorId: { type: string, format: uuid, nullable: true }
        author:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
          description: >
            Yazar özeti. Mevcut kayıtlarda backfill YAPILMAZ → eski sayfalarda `null`
            gelir, UI "—" gösterir. `authorId` ile birlikte döner: form/dropdown
            `authorId`'ye bağlanır, tablo `author`'ı render eder.
        seoScore:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Backend'de HER OKUMADA hesaplanan basit SEO tamlık skoru (persist EDİLMEZ,
            ekstra DB sorgusu yapılmaz). 5 kriter × 20 puan — bkz.
            `#/components/schemas/SeoScoreIssue` ve ARCHITECTURE.md §10.7.
            Rozet renk eşiği (frontend): <50 kırmızı, 50–79 sarı, ≥80 yeşil.
        seoScoreIssues:
          type: array
          description: >
            Puan kaybettiren kriterler. Boş dizi = 100 puan. Rozete tıklanınca bu liste
            gösterilir. Sıra deterministiktir (kriter numarasına göre).
          items: { $ref: "#/components/schemas/SeoScoreIssue" }

    BlogPost:
      description: >
        `/admin/blog` ve `/blog` uçlarında dönen yazı DTO'su. `translations.EN` yalnızca
        override'ları taşır (bkz. ARCHITECTURE.md §10.5).
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        category:
          allOf:
            - $ref: "#/components/schemas/BlogCategory"
          nullable: true
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          description: "ör. { \"EN\": { \"title\": \"...\", \"contentHtml\": \"...\" } } — bkz. shared-types.ts::BlogPostTranslations"
          additionalProperties:
            type: object
            additionalProperties: true
        publishedAt: { type: string, format: date-time, nullable: true }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # ---- §10.7 İçerik Yönetim Listesi ----
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Soft-delete zaman damgası. Public uçlar (`/blog`, `/blog/{slug}`, view
            sayacı) `deletedAt: null` FİLTRESİ UYGULAMAK ZORUNDADIR.
        authorId: { type: string, format: uuid, nullable: true }
        author:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
          description: >
            **Şema zaten vardı (`BlogPost.authorId` + `author` ilişkisi), DTO'da EKSİKTİ**
            — bu sürümle DTO'ya ve mapper'a eklenir.
        seoScore:
          type: integer
          minimum: 0
          maximum: 100
          description: "Bkz. `Page.seoScore` — aynı algoritma, entity'ye özgü girdilerle."
        seoScoreIssues:
          type: array
          items: { $ref: "#/components/schemas/SeoScoreIssue" }

    UserSummary:
      description: >
        Kullanıcının listelerde gösterilen minimum özeti — hassas alan (rol/durum/
        e-posta doğrulaması) TAŞIMAZ. Yazar sütunu ve yazar dropdown'ı bunu kullanır.
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }

    ContentCounts:
      description: >
        Sekme sayaçları — tablo genelinde hesaplanır, istek filtrelerinden ETKİLENMEZ.
        WordPress semantiği: "Tümü" çöptekileri İÇERMEZ.
      type: object
      required: [all, published, draft, trashed]
      properties:
        all: { type: integer, description: "deletedAt IS NULL olan tüm kayıtlar (= published + draft)" }
        published: { type: integer, description: "status = PUBLISHED AND deletedAt IS NULL" }
        draft: { type: integer, description: "status = DRAFT AND deletedAt IS NULL" }
        trashed: { type: integer, description: "deletedAt IS NOT NULL" }

    ContentListMeta:
      description: "`GET /admin/pages` ve `GET /admin/blog` yanıtlarının `meta` zarfı."
      type: object
      required: [counts]
      properties:
        nextCursor: { type: string, nullable: true }
        counts: { $ref: "#/components/schemas/ContentCounts" }

    SeoScoreIssueCode:
      type: string
      description: >
        Kararlı makine-okunur kod. Frontend/qa mantığı BU KODA bağlanır; `label`
        yalnızca gösterim içindir (metni değişebilir).
      enum:
        - SEO_TITLE_MISSING
        - SEO_TITLE_LENGTH
        - SEO_DESCRIPTION_MISSING
        - SEO_DESCRIPTION_LENGTH
        - COVER_IMAGE_MISSING
        - IMAGE_MISSING
        - IMAGE_ALT_MISSING
        - CONTENT_TOO_SHORT

    SeoScoreIssue:
      description: >
        **Puanlama (toplam 100, 5 kriter × 20p):**


        1. Meta başlık: yok → 0p `SEO_TITLE_MISSING`; var ama uzunluk 50–60 dışında →
        10p `SEO_TITLE_LENGTH`; 50–60 arası → 20p.

        2. Meta açıklama: yok → 0p `SEO_DESCRIPTION_MISSING`; var ama 120–160 dışında →
        10p `SEO_DESCRIPTION_LENGTH`; 120–160 arası → 20p.

        3. Kapak görseli: yoksa 0p `COVER_IMAGE_MISSING`, varsa 20p.
        BlogPost → `coverImageUrl`, boşsa `ogImageUrl`.
        Page → `ogImageUrl`, boşsa ilk `image` bloğunun `data.url` değeri.

        4. Alt-metinli görsel: hiç görsel yoksa 0p `IMAGE_MISSING`; görsel var ama
        hiçbirinde dolu alt yoksa 0p `IMAGE_ALT_MISSING`; en az biri alt'lıysa 20p.
        Page → `blocks` içindeki `image`/`gallery` bloklarının `data.alt` (gallery'de
        herhangi bir öğenin alt'ı). BlogPost → `contentHtml` içindeki `<img alt="...">`;
        kapak görseli bu kriteri KARŞILAMAZ (3. kriterle çift sayılmasın diye).

        5. İçerik uzunluğu: kelime sayısı eşiğin altındaysa 0p `CONTENT_TOO_SHORT`,
        değilse 20p. Eşik: **Page ≥ 100**, **BlogPost ≥ 300** kelime. Kelime =
        HTML/etiketler ayıklandıktan sonra boşlukla ayrılmış boş olmayan token.
        Page metni: blokların `data.text`/`data.title`/`data.subtitle`/`data.html`
        alanlarının birleşimi. BlogPost metni: `contentHtml`.


        Skor yalnızca TR/kanonik kolonlardan hesaplanır (`translations` v1'de dikkate
        alınmaz). Hesap saf ve senkron olmalıdır — liste yanıtında satır başına çalışır.
      type: object
      required: [code, label]
      properties:
        code: { $ref: "#/components/schemas/SeoScoreIssueCode" }
        label:
          type: string
          description: "Kullanıcıya gösterilecek Türkçe metin, ör. \"Meta açıklama 120–160 karakter olmalı (şu an 84).\""

    BulkContentActionRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: "Tekrarlı id'ler sunucuda teklenir (dedupe)."
        action:
          type: string
          enum: [trash, restore, publish, draft, permanent-delete]
          description: >
            `trash` = çöpe taşı; `restore` = geri yükle; `publish`/`draft` = durum
            değiştir (çöptekiler atlanır); `permanent-delete` = kalıcı sil
            (yalnızca ADMIN, yalnızca çöptekiler).

    BulkContentActionResult:
      type: object
      required: [action, requestedCount, affectedCount, skippedIds]
      properties:
        action: { type: string, enum: [trash, restore, publish, draft, permanent-delete] }
        requestedCount: { type: integer, description: "dedupe sonrası gönderilen id sayısı" }
        affectedCount: { type: integer }
        skippedIds:
          type: array
          items: { type: string, format: uuid }
          description: "Uygulanamayan id'ler (bulunamayan veya durumu uygun olmayan). Hata DEĞİLDİR."

    CreatePageRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, description: "verilmezse title'dan slugify edilir" }
        status: { type: string, enum: [DRAFT, PUBLISHED], default: DRAFT }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
        seoTitle: { type: string }
        seoDescription: { type: string }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean, default: false }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: >
            §10.7 — verilmezse giriş yapmış kullanıcı atanır. Giriş yapmış kullanıcıdan
            FARKLI bir id yalnızca ADMIN tarafından gönderilebilir (EDITOR → 403);
            var olmayan kullanıcı → 422.

    UpdatePageRequest:
      description: >
        Tüm alanlar opsiyoneldir. Hızlı Düzenle (Quick Edit) bu şemanın
        `{ title, slug, status }` alt kümesini gönderir — ayrı bir uç/şema YOKTUR.
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: "Yalnızca ADMIN değiştirebilir (EDITOR gönderirse 403). `null` = yazarı kaldır."

    CreateBlogPostRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        excerpt: { type: string }
        contentHtml: { type: string }
        coverImageUrl: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED], default: DRAFT }
        categoryId: { type: string, format: uuid, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean, default: false }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: >
            §10.7 — `CreatePageRequest.authorId` ile aynı kural. **Mevcut kod bunu
            gövdeden okumadan `request.user.id` olarak sabitliyor**; yeni kuralda
            gövdeden gelen değer (ADMIN ise) önceliklidir.

    UpdateBlogPostRequest:
      description: "Tüm alanlar opsiyonel; Hızlı Düzenle `{ title, slug, status }` alt kümesini gönderir."
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        excerpt: { type: string, nullable: true }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        categoryId: { type: string, format: uuid, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: "Yalnızca ADMIN değiştirebilir."

    ContentEntityType:
      type: string
      enum: [PAGE, BLOG_POST]

    ContentRevisionSummary:
      description: >
        Revizyon liste görünümü — `snapshot` alanını İÇERMEZ (bkz. ARCHITECTURE.md §10.1).
      type: object
      properties:
        id: { type: string, format: uuid }
        editedById: { type: string, format: uuid, nullable: true }
        editedByName: { type: string, description: "silinen kullanıcı için okunabilir ad snapshot'ı" }
        createdAt: { type: string, format: date-time }

    ContentRevision:
      allOf:
        - $ref: "#/components/schemas/ContentRevisionSummary"
        - type: object
          properties:
            entityType: { $ref: "#/components/schemas/ContentEntityType" }
            entityId: { type: string }
            snapshot:
              type: object
              description: >
                Güncellemeden HEMEN ÖNCEKİ tam alan seti — Page için `{ title, slug,
                blocks, seoTitle, seoDescription, ogTitle, ogImageUrl, canonicalUrl,
                noIndex, translations }`; BlogPost için `{ title, slug, excerpt,
                contentHtml, coverImageUrl, categoryId, seoTitle, seoDescription,
                ogTitle, ogImageUrl, canonicalUrl, noIndex, translations }`.
              additionalProperties: true

    EmailTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: WELCOME }
        name: { type: string }
        subject: { type: string }
        bodyHtml: { type: string }
        availableVariables:
          type: array
          items: { type: string }
          description: "salt bilgi amaçlı, ör. [\"user_name\", \"reset_link\"]"
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    UpdateEmailTemplateRequest:
      type: object
      properties:
        subject: { type: string, minLength: 1 }
        bodyHtml: { type: string }

    PreviewEmailTemplateRequest:
      type: object
      required: [sampleValues]
      properties:
        sampleValues:
          type: object
          additionalProperties: { type: string }

    PreviewEmailTemplateResponse:
      type: object
      properties:
        renderedSubject: { type: string }
        renderedHtml: { type: string }
