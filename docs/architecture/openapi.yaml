    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED] }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER] }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceMonthlyCents: { type: integer }
        priceYearlyCents: { type: integer }
        currency: { type: string, example: TRY }
        limits:
          type: object
          additionalProperties: { type: integer }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/Plan" }
        status: { type: string, enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE] }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }

    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              role: { type: string, enum: [OWNER, ADMIN, MEMBER] }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/AuthTokens" }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    UpdateUserRequest:
      description: >
        Kendi profilini güncelleme (`PATCH /users/me`). Yalnızca `name` ve `avatarUrl`
        değiştirilebilir — `email`, `role`, `status` BU UÇTAN DEĞİŞTİRİLEMEZ (rol/durum
        için bkz. `/admin/users/{userId}/role|status`). `avatarUrl: null` gönderilirse
        avatar kaldırılır (boş string `""` GEÇERSİZDİR, 422 döner).
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri, nullable: true }

    ChangePasswordRequest:
      description: >
        `POST /users/me/change-password` gövdesi. `newPassword` kuralı `RegisterRequest`
        ve `/auth/reset-password` ile AYNIDIR (min 8 karakter) — tek kaynak: bu kontrat.
        `newPassword === currentPassword` ise 422 (`details.newPassword`) döner.
        Yeni şifre tekrarı (`confirm`) YALNIZCA istemci tarafı doğrulamasıdır, gövdede
        GÖNDERİLMEZ.
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    UpdateOrganizationRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER] }

    UpdateMembershipRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }

    CreateCheckoutSessionRequest:
      type: object
      required: [planId, billingCycle, successUrl, cancelUrl]
      properties:
        planId: { type: string, format: uuid }
        billingCycle: { type: string, enum: [monthly, yearly] }
        successUrl: { type: string, format: uri }
        cancelUrl: { type: string, format: uri }

    CheckoutSessionResponse:
      type: object
      properties:
        checkoutUrl:
          type: string
          format: uri
          description: "Stripe Checkout'un barındırdığı ödeme sayfası URL'i — istemci buraya yönlendirir."

    BillingPortalResponse:
      type: object
      properties:
        portalUrl: { type: string, format: uri }

    NavigationItem:
      description: >
        Hiyerarşik (iç içe geçebilen) menü öğesi. Yapı DÜZ BİR DİZİ + `parentId` ile ifade
        edilir (iç içe/nested JSON ağacı DEĞİL) — WordPress'in kendi veri modeliyle ve
        dnd-kit "nested sortable" paterniyle aynı. Tüketici ağacı `parentId`'ye göre kurar.
        Maksimum derinlik 2'dir: `parentId` dolu olan bir öğe yalnızca `parentId`'si null
        olan (kök) bir öğeyi işaret edebilir; dolayısıyla döngü/kendine referans imkânsızdır.
        `order` KARDEŞ-KAPSAMLIDIR (aynı `parentId` grubu içinde 0'dan artar), global sıra
        değildir — tüketici önce `parentId`'ye göre gruplamalı, sonra `order`'a göre
        sıralamalıdır. Sunucu diziyi `(parentId NULLS FIRST, order)` ile döner, yani kök
        öğeler her zaman alt öğelerden önce gelir (tek geçişli ağaç kurulumu güvenlidir).
      type: object
      required: [id, label, href, order, parentId]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        href: { type: string }
        order:
          type: integer
          description: "Kardeşler arası sıra (aynı `parentId` içinde 0'dan artan)."
        parentId:
          type: string
          format: uuid
          nullable: true
          description: "Üst öğenin `id`'si; null ise kök seviye öğedir."

    SocialLink:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [TWITTER, GITHUB, LINKEDIN, INSTAGRAM, FACEBOOK, YOUTUBE, OTHER] }
        url: { type: string }
        order: { type: integer }

    FooterLink:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string }
        order: { type: integer }

    FooterColumn:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        order: { type: integer }
        links:
          type: array
          items: { $ref: "#/components/schemas/FooterLink" }

    NavigationConfig:
      type: object
      properties:
        headerCtaLabel: { type: string, nullable: true }
        headerCtaHref: { type: string, nullable: true }
        footerCopyrightText: { type: string, nullable: true }
        navigationItems:
          type: array
          items: { $ref: "#/components/schemas/NavigationItem" }
        socialLinks:
          type: array
          items: { $ref: "#/components/schemas/SocialLink" }
        footerColumns:
          type: array
          items: { $ref: "#/components/schemas/FooterColumn" }

    UpdateNavigationConfigRequest:
      description: >
        Tam değiştirme (replace) semantiği — `navigationItems`/`socialLinks`/`footerColumns`
        dizileri gönderilen haliyle mevcut kayıtların tamamının yerini alır.
        `socialLinks`/`footerColumns` için `id` istemciden GÖNDERİLMEZ (sunucu üretir).
        `navigationItems` bunun İSTİSNASIDIR: hiyerarşi (`parentId`) aynı payload içinde
        çözülebilsin diye istemci her öğe için kendi ürettiği bir UUID'yi (`crypto.randomUUID()`)
        `id` olarak gönderebilir ve bu değer gerçek `NavigationItem.id` olarak yazılır
        (geçici→kalıcı id eşleme adımı yoktur). `id` gönderilmezse sunucu üretir; ancak
        BAŞKA BİR ÖĞENİN `parentId`'si tarafından işaret edilen bir öğe için `id` ZORUNLUDUR.
      type: object
      required: [navigationItems, socialLinks, footerColumns]
      properties:
        headerCtaLabel: { type: string, maxLength: 60, nullable: true }
        headerCtaHref:
          type: string
          maxLength: 500
          nullable: true
          description: "yalnızca http(s)://, / veya # ile başlayan yollar kabul edilir"
        footerCopyrightText: { type: string, maxLength: 200, nullable: true }
        navigationItems:
          type: array
          maxItems: 20
          description: >
            DÜZ dizi (nested JSON ağacı değil); hiyerarşi `parentId` ile kurulur.
            `maxItems: 20` TÜM SEVİYELERİN TOPLAMIDIR (kök + alt öğeler) — nesting bu
            limiti değiştirmez. 422 ile reddedilen ek kurallar: (1) `id` değerleri payload
            içinde benzersiz olmalı; (2) `parentId`, aynı payload'daki bir öğenin `id`'siyle
            eşleşmeli (DB'deki eski bir id'ye referans geçersizdir — kayıt tam-replace'tir);
            (3) maksimum derinlik 2 — `parentId` ile işaret edilen öğenin kendi `parentId`'si
            null OLMALIDIR; (4) bir öğe kendi `id`'sini `parentId` olarak veremez.
          items:
            type: object
            required: [label, href, order]
            properties:
              id:
                type: string
                format: uuid
                description: >
                  İstemcinin ürettiği UUID; gerçek `NavigationItem.id` olarak yazılır.
                  Opsiyoneldir, ancak öğe bir `parentId` tarafından işaret ediliyorsa zorunludur.
              label: { type: string, minLength: 1, maxLength: 80 }
              href: { type: string, minLength: 1, maxLength: 500 }
              order:
                type: integer
                minimum: 0
                description: "Kardeşler arası sıra (aynı `parentId` grubu içinde 0'dan artan)."
              parentId:
                type: string
                format: uuid
                nullable: true
                description: "Üst öğenin `id`'si; yok/null ise kök seviye öğe."
        socialLinks:
          type: array
          maxItems: 15
          items:
            type: object
            required: [platform, url, order]
            properties:
              platform: { type: string, enum: [TWITTER, GITHUB, LINKEDIN, INSTAGRAM, FACEBOOK, YOUTUBE, OTHER] }
              url: { type: string, minLength: 1, maxLength: 500 }
              order: { type: integer, minimum: 0 }
        footerColumns:
          type: array
          maxItems: 8
          items:
            type: object
            required: [title, order, links]
            properties:
              title: { type: string, minLength: 1, maxLength: 80 }
              order: { type: integer, minimum: 0 }
              links:
                type: array
                maxItems: 20
                items:
                  type: object
                  required: [label, href, order]
                  properties:
                    label: { type: string, minLength: 1, maxLength: 80 }
                    href: { type: string, minLength: 1, maxLength: 500 }
                    order: { type: integer, minimum: 0 }


    DailyViewStats:
      type: object
      properties:
        date: { type: string, format: date, example: "2026-07-30" }
        pageViews: { type: integer }
        postViews: { type: integer }

    LiveVisitors:
      type: object
      properties:
        count:
          type: integer
          description: >
            Son 60 saniye içinde bir görüntülenme endpoint'ini çağıran benzersiz
            IP+User-Agent sayısı (süreç-içi/in-memory, dağıtık değil).

    DeviceBreakdownEntry:
      type: object
      properties:
        type: { type: string, enum: [MOBILE, DESKTOP, TABLET, UNKNOWN] }
        count: { type: integer }

    CountryBreakdownEntry:
      type: object
      properties:
        country:
          type: string
          description: >
            ISO 3166-1 alpha-2 ülke kodu, bilinmiyorsa "UNKNOWN"; ilk 10 dışında
            kalan ülkelerin toplamı "OTHER" olarak tek satırda döner.
        count: { type: integer }

    ViewsBreakdown:
      type: object
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceBreakdownEntry" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountryBreakdownEntry" }

    Granularity:
      type: string
      enum: [day, week, month]
      description: "`PageView`/kullanıcı/gelir günlük bucket'ının toplama seçeneği."

    TopContentItem:
      type: object
      required: [contentType, id, title, slug, views]
      properties:
        contentType: { type: string, enum: [page, post] }
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        views: { type: integer }

    TopContentListMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

    SummaryCompare:
      type: object
      description: "`GET /admin/stats/summary?compare=true` yanıtındaki karşılaştırma deltası."
      required: [pageViews, postViews, newUsers]
      properties:
        pageViews: { type: integer }
        postViews: { type: integer }
        newUsers: { type: integer }

    SummaryStats:
      type: object
      required: [from, to, granularity, pageViews, postViews, newUsers, activeSubscriptions, mrrCents, compare]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        granularity: { $ref: "#/components/schemas/Granularity" }
        pageViews: { type: integer }
        postViews: { type: integer }
        newUsers: { type: integer }
        activeSubscriptions:
          type: integer
          description: "ANLIK (şimdiki zaman) durum — dönem sonuna göre DEĞİL."
        mrrCents:
          type: integer
          description: >
            ANLIK MRR, yalnızca `Plan.priceMonthlyCents` toplamı — `Subscription`
            faturalama periyodunu (aylık/yıllık) ayrı bir alanda TUTMADIĞI için yıllık
            abonelikler ay karşılığına ÇEVRİLMEDEN, olduğu gibi toplanır.
        compare:
          allOf:
            - $ref: "#/components/schemas/SummaryCompare"
          nullable: true
          description: >
            `compare=true` istendiyse dolu, aksi hâlde `null`. `activeSubscriptions`/
            `mrrCents` için delta BİLEREK YOKTUR — `Subscription` geçmiş durum geçmişi
            tutan bir tablo değil, yalnızca ANLIK durumu taşıyor; geçmiş bir dönem için
            "o an aktif olan abonelik sayısı" güvenilir biçimde yeniden inşa edilemiyor.

    UserSeriesPoint:
      type: object
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    RoleDistributionEntry:
      type: object
      properties:
        role: { type: string, enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER] }
        count: { type: integer }

    UsersStats:
      type: object
      required: [from, to, granularity, series, roleDistribution]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        granularity: { $ref: "#/components/schemas/Granularity" }
        series:
          type: array
          items: { $ref: "#/components/schemas/UserSeriesPoint" }
        roleDistribution:
          type: array
          description: "Dönemle SINIRLI DEĞİL — kullanıcı tablosunun ANLIK rol dağılımı."
          items: { $ref: "#/components/schemas/RoleDistributionEntry" }

    RevenueSeriesPoint:
      type: object
      properties:
        date: { type: string, format: date }
        newMrrCents:
          type: integer
          description: "Bucket içinde OLUŞTURULAN aboneliklerin `priceMonthlyCents` toplamı (\"yeni MRR\")."
        churnedCount:
          type: integer
          description: "Bucket içinde `CANCELED` durumuna geçen (yaklaşık — `updatedAt` referans alınır) abonelik sayısı."

    RevenueStats:
      type: object
      required: [from, to, granularity, activeSubscriptions, mrrCents, series]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        granularity: { $ref: "#/components/schemas/Granularity" }
        activeSubscriptions: { type: integer, description: "ANLIK toplam — bkz. `SummaryStats.activeSubscriptions`." }
        mrrCents: { type: integer, description: "ANLIK toplam — bkz. `SummaryStats.mrrCents`." }
        series:
          type: array
          items: { $ref: "#/components/schemas/RevenueSeriesPoint" }

    SystemHealth:
      type: object
      description: Tüm alanlar gerçek zamanlı ölçülür — sabit/uydurma değer içermez.
      properties:
        dbPingMs: { type: number, description: "`SELECT 1` sorgusunun ölçülen süresi (ms)" }
        dbSizeBytes: { type: number, description: "`pg_database_size(current_database())`" }
        dbQuotaBytes:
          type: number
          nullable: true
          description: "DB_STORAGE_QUOTA_MB tanımlı değilse null"
        mediaStorageBytes: { type: number, description: "Media.sizeBytes toplamı" }
        mediaStorageQuotaBytes:
          type: number
          nullable: true
          description: "MEDIA_STORAGE_QUOTA_MB tanımlı değilse null"
        memoryUsedBytes: { type: number }
        memoryTotalBytes: { type: number }
        processMemoryBytes: { type: number, description: "process.memoryUsage().rss" }
        loadAverage:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
          description: "os.loadavg() — [1dk, 5dk, 15dk]; Windows'ta her zaman [0,0,0] döner (platform kısıtı)"
        platform: { type: string, example: "linux" }
        uptimeSeconds: { type: number }
        checkedAt: { type: string, format: date-time }

    BlogCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    BlogTag:
      description: >
        §10.14 Blog Etiketi. Kategoriden (`BlogCategory`) FARKI: bir yazı **birden çok**
        etiket taşıyabilir (çoka-çok, `blog_post_tags` ara tablosu). Şema `BlogCategory`
        ile birebir simetriktir, tek fark `postCount`'tur.
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
        postCount:
          type: integer
          minimum: 0
          description: >
            Bu etiketi taşıyan, **çöpte OLMAYAN** (`deletedAt: null`) yazı sayısı. `0`
            olması yetim bir etikettir — yetimler OTOMATİK SİLİNMEZ (§10.14.2), bu alan
            yöneticinin onları görüp elle temizlemesi içindir. Yalnızca
            `GET /admin/blog/tags` yanıtında doldurulur; `BlogPost.tags[]` içinde
            gömülü gelen etiketlerde **bulunmaz** (N+1 sorgu doğururdu).

    CreateBlogTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { type: string, minLength: 1, description: "verilmezse name'den slugify edilir" }

    UpdateBlogTagRequest:
      description: "Yalnızca gönderilen alan güncellenir; `name` değişince `slug` OTOMATİK değişmez (bağlantı kırmamak için)."
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { type: string, minLength: 1 }

    CreateBlogCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, description: "verilmezse name'den slugify edilir" }

    UpdateBlogCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }

    PageStatus:
      description: >
        `Page` ve `BlogPost` için ORTAK durum enum'ı (bkz. backend `schemas/entities.ts::
        PageStatusSchema`) — TEK kaynak, `Page`/`BlogPost` DTO'ları ile create/update
        istek gövdeleri ve `ContentStatusFilter` parametresi BURAYA referans verir.
        `SCHEDULED` = **zamanlanmış yayın**: içerik `scheduledAt` alanındaki gelecek
        tarihte otomatik `PUBLISHED`'e geçer (Faz 4). `scheduledAt` ile çapraz-alan
        kuralı için ilgili create/update şemalarındaki `scheduledAt` açıklamasına bakın.
      type: string
      enum: [DRAFT, PUBLISHED, SCHEDULED]

    PageEditMode:
      description: >
        Sayfanın tasarım niyetini belirten **KOZMETİK bir etikettir**. Ziyaretçiye giden
        public çıktıda hiçbir karşılığı YOKTUR (`GET /pages`, `GET /pages/{slug}` bu
        alandan ETKİLENMEZ).


        - `FREEFORM` — serbest tasarım (**varsayılan**, mevcut tüm sayfaların değeri).
        - `TEMPLATE` — "bu sayfa bir şablon olarak tasarlandı, içerik ekibine
          devredilebilir" bilgisi.


        **HİÇBİR YETKİLENDİRME KARARI BU ALANI OKUMAZ (bağlayıcı).** 2026-08-23'teki
        genişletmeden bu yana yapısal kilit `editMode`'dan TAMAMEN bağımsızdır: tek
        belirleyici `canUseAdvancedBuilder`'dır, yani `role === "ADMIN"` (§10.21).
        `TEMPLATE_EDITABLE_FIELDS` diff'i, ADMIN olmayan HER kullanıcının HER sayfadaki
        (FREEFORM dahil) `PATCH`/`autosave` isteğinde çalışır. Alan yalnızca UI'da bir
        rozet/ipucu olarak gösterilir.


        İzin verilen içerik alanlarının blok tipi başına tam listesi backend'de tek bir
        sabittedir (`lib/page-template-fields.ts::TEMPLATE_EDITABLE_FIELDS`) ve frontend
        onu BİREBİR aynalar. Liste `blocks` JSON'unun İÇİNDE TUTULMAZ — orası isteğin
        kendi gövdesidir ve kullanıcı kendi kendini yetkilendirebilirdi (gerekçe:
        `.claude/architect-scope-page-editor-roles.md` §3.1).
      type: string
      enum: [FREEFORM, TEMPLATE]
      default: FREEFORM

    Page:
      description: >
        `/admin/pages` ve `/pages` uçlarında dönen sayfa DTO'su. `translations`
        yalnızca override'ları taşır (bkz. ARCHITECTURE.md §10.5); `?locale=` ile
        okunan public GET'lerde bu alanlar zaten varsayılan dile alan-bazlı fallback
        edilmiş olarak gelir — **`isLegalDocument: true` HARİÇ** (bkz. o alanın
        açıklaması).
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/PageStatus" }
        editMode:
          allOf: [{ $ref: "#/components/schemas/PageEditMode" }]
          description: >
            Kozmetik rozet. **İstemci sade (standart) düzenleyiciye geçip geçmeyeceğini
            BU ALANDAN TÜRETMEZ** — tek ifade `!user.canUseAdvancedBuilder`'dır (§10.21).
            v1'deki `editMode === "TEMPLATE" && !user.canUseAdvancedBuilder` ifadesi
            ARTIK YANLIŞTIR.
        blocks:
          type: array
          items: { $ref: "#/components/schemas/PageBlock" }
          description: >
            `GET`'ten HAM JSON olarak döner — sunucu bunu yeniden doğrulamaz/normalize
            etmez (bkz. `pages.routes.ts`). **Legacy `columns` düğümleri içerebilir**
            (bir sonraki WRITE'a kadar kanonik `container`'a çevrilmez); istemci
            `normalizePageNodes()` ile normalize ETMELİDİR (§10.19.7 — okuma-anında
            normalizasyon).
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        isLegalDocument:
          type: boolean
          default: false
          description: >
            Bu sayfa bir HUKUKİ BELGE mi (gizlilik politikası, KVKK aydınlatma metni,
            çerez politikası, kullanım koşulları, mesafeli satış sözleşmesi...).


            **Çeviri davranışını DEĞİŞTİRİR (bağlayıcı, KVKK m.10 / GDPR m.12):**
            `true` ise §5'in "sessiz fallback" kuralı bu sayfaya UYGULANMAZ.
            Varsayılan olmayan bir dilde bu sayfanın çevirisi YOKSA
            (`localizations[locale].translated == false`), public GET yanıtında
            çevrilebilir gövde alanları (`blocks`) **BOŞ** döner. Çevrilmemiş bir
            hukuki metni ziyaretçiye o dildeymiş gibi göstermek şeffaflık
            yükümlülüğünün ihlalidir.


            Bu boşaltma **sunucu tarafında** yapılır (istemcinin bayrağı kontrol
            etmesine GÜVENİLMEZ) — fail-safe. Yalnızca public okumaları etkiler;
            `/admin/pages/*` yanıtları ham kaydı döndürür ve düzenleme bozulmaz.


            İstemci bu durumu `isLegalDocument && !localizations[locale].translated`
            ile tespit eder ve gövde yerine "bu belge bu dilde mevcut değil +
            varsayılan dildeki sürüme bağlantı" bildirimi gösterir. AYRI bir yanıt
            alanı YOKTUR — durum mevcut alanlardan türetilebilir.


            **Yalnızca SiteRole=ADMIN değiştirebilir** (MANAGER/EDITOR dahi DEĞİL): bu bayrağı
            kaldırmak, hukuki metinlerde sessiz çeviri fallback'ini yeniden
            etkinleştirmek demektir — uyumluluk sonucu olan bir karardır ve
            denetlenir (`content.legal_flag_change`).
        translations: { $ref: "#/components/schemas/ContentTranslations" }
        localizations:
          type: array
          description: >
            Bu sayfanın TÜM etkin dillerdeki slug'ı ve çeviri durumu — hreflang ve
            sitemap `alternates` üretimi için. Public uçlarda HER ZAMAN döner.
          items: { $ref: "#/components/schemas/ContentLocalization" }
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: "Zamanlanmış yayın hedef tarihi — yalnızca status=SCHEDULED iken anlamlı, aksi halde null."
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # ---- §10.7 İçerik Yönetim Listesi ----
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Soft-delete zaman damgası. `null` = aktif, dolu = ÇÖPTE. Public uçlar
            (`/pages`, `/pages/{slug}`, view sayacı, `SiteSettings.homePage`) bu alanı
            `null` olarak FİLTRELEMEK ZORUNDADIR.
        authorId: { type: string, format: uuid, nullable: true }
        author:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
          description: >
            Yazar özeti. Mevcut kayıtlarda backfill YAPILMAZ → eski sayfalarda `null`
            gelir, UI "—" gösterir. `authorId` ile birlikte döner: form/dropdown
            `authorId`'ye bağlanır, tablo `author`'ı render eder.
        seoScore:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Backend'de HER OKUMADA hesaplanan basit SEO tamlık skoru (persist EDİLMEZ,
            ekstra DB sorgusu yapılmaz). 5 kriter × 20 puan — bkz.
            `#/components/schemas/SeoScoreIssue` ve ARCHITECTURE.md §10.7.
            Rozet renk eşiği (frontend): <50 kırmızı, 50–79 sarı, ≥80 yeşil.
        seoScoreIssues:
          type: array
          description: >
            Puan kaybettiren kriterler. Boş dizi = 100 puan. Rozete tıklanınca bu liste
            gösterilir. Sıra deterministiktir (kriter numarasına göre).
          items: { $ref: "#/components/schemas/SeoScoreIssue" }

    BlogPost:
      description: >
        `/admin/blog` ve `/blog` uçlarında dönen yazı DTO'su. `translations.EN` yalnızca
        override'ları taşır (bkz. ARCHITECTURE.md §10.5).
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PageStatus" }
        category:
          allOf:
            - $ref: "#/components/schemas/BlogCategory"
          nullable: true
        tags:
          type: array
          description: >
            §10.14 — bu yazının etiketleri. **HER ZAMAN dizi**, etiket yoksa `[]`
            (asla `null`). Sıra DETERMİNİSTİKTİR: `seq ASC` (etiketin oluşturulma
            sırası) — sıra garanti edilmezse liste/editör chip'leri istekler arasında
            yer değiştirir. Buradaki `BlogTag` nesneleri `postCount` TAŞIMAZ.
          items: { $ref: "#/components/schemas/BlogTag" }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations: { $ref: "#/components/schemas/ContentTranslations" }
        localizations:
          type: array
          items: { $ref: "#/components/schemas/ContentLocalization" }
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: "Zamanlanmış yayın hedef tarihi — yalnızca status=SCHEDULED iken anlamlı, aksi halde null."
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # ---- §10.7 İçerik Yönetim Listesi ----
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Soft-delete zaman damgası. Public uçlar (`/blog`, `/blog/{slug}`, view
            sayacı) `deletedAt: null` FİLTRESİ UYGULAMAK ZORUNDADIR.
        authorId: { type: string, format: uuid, nullable: true }
        author:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
          description: >
            **Şema zaten vardı (`BlogPost.authorId` + `author` ilişkisi), DTO'da EKSİKTİ**
            — bu sürümle DTO'ya ve mapper'a eklenir.
        seoScore:
          type: integer
          minimum: 0
          maximum: 100
          description: "Bkz. `Page.seoScore` — aynı algoritma, entity'ye özgü girdilerle."
        seoScoreIssues:
          type: array
          items: { $ref: "#/components/schemas/SeoScoreIssue" }

    Media:
      description: >
        `/admin/media` uçlarında dönen yüklenen görsel DTO'su. Editör içi görseller
        (blog/sayfa içerik bloklarına eklenenler) ve kapak görselleri BURADAN seçilir.
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        filename: { type: string }
        mimeType:
          type: string
          description: "Gerçek dosya İÇERİĞİNDEN (magic bytes) tespit edilir — beyan edilen Content-Type GÜVENİLMEZ. bkz. POST açıklaması."
          enum: [image/jpeg, image/png, image/webp, image/gif]
        sizeBytes: { type: integer }
        width:
          type: integer
          nullable: true
          description: >
            Görsel piksel genişliği — upload anında hesaplanır. Eski kayıtlarda veya
            hesaplanamayan (bozuk/desteklenmeyen) dosyalarda `null`.
        height:
          type: integer
          nullable: true
          description: >
            Görsel piksel yüksekliği — upload anında hesaplanır. Eski kayıtlarda veya
            hesaplanamayan (bozuk/desteklenmeyen) dosyalarda `null`.
        altText:
          type: string
          nullable: true
          description: >
            Erişilebilirlik/SEO alt metni. Yüklemede `null` gelir; `PATCH
            /admin/media/{mediaId}` ile ayrıca set edilir. `SeoScoreIssue`'nun
            `IMAGE_ALT_MISSING` kriteri BU ALANA DEĞİL, içeriğe gömülü `<img alt>`/blok
            `data.alt` alanına bakar (bkz. `SeoScoreIssue` açıklaması) — ikisi AYRI
            kavramlardır.
        folderId:
          type: string
          format: uuid
          nullable: true
          description: >
            Ait olduğu `MediaFolder`. `null` = "Kategorisiz" (§10.11) — bu bir klasör
            KAYDI değil, klasörsüzlüğün ta kendisidir. Klasör silinirse FK `SetNull` ile
            otomatik `null` olur. DTO klasör ADINI TAŞIMAZ (karar): istemci klasör
            listesini zaten `GET /admin/media/folders` ile bir kez çeker ve id→ad
            eşlemesini bellekte yapar; adı her medya satırına gömmek gereksiz join +
            iki kopyalı doğruluk kaynağı olurdu.
        createdAt: { type: string, format: date-time }

    MediaFolder:
      description: >
        Medya kütüphanesi klasörü (§10.11). Hiyerarşi DÜZ DİZİ + `parentId` ile ifade
        edilir (`NavigationItem` ile aynı patern, iç içe JSON ağacı DEĞİL). **Maksimum
        derinlik 2'dir** (kök + bir alt seviye): `parentId` dolu olan bir klasör yalnızca
        `parentId`'si null olan bir klasörü işaret edebilir — döngü yapısal olarak
        imkânsızdır. Sunucu `(parentId NULLS FIRST, name ASC)` sıralı döner.
      type: object
      required: [id, name, parentId, mediaCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: "Üst klasörün `id`'si; null ise kök seviye klasördür."
        mediaCount:
          type: integer
          description: >
            DOĞRUDAN bu klasördeki medya sayısı — alt klasörlerdekiler DAHİL DEĞİLDİR
            (kümülatif/rollup sayaç bilinçli olarak yok: `GET /admin/media?folderId=`
            de özyinelemeli olmadığı için sayı, tıklandığında görülecek liste uzunluğuyla
            BİREBİR eşleşir). Tek sorguda `_count` ile hesaplanır, N+1 YASAK.
        createdAt: { type: string, format: date-time }

    CreateMediaFolderRequest:
      description: "`POST /admin/media/folders` gövdesi."
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: >
            Baştaki/sondaki boşluklar sunucuda kırpılır (trim); kırpma sonrası boş
            kalırsa `422`. Aynı üst klasör altında case-insensitive benzersiz olmalıdır
            (`409`).
        parentId:
          type: string
          format: uuid
          nullable: true
          default: null
          description: "Verilmezse/null ise kök seviye. Hedefin kendi `parentId`'si null OLMALIDIR (derinlik 2) → aksi hâlde 422."

    UpdateMediaFolderRequest:
      description: >
        `PATCH /admin/media/folders/{folderId}` gövdesi. En az bir alan gönderilmelidir;
        boş gövde `422`. Alanın GÖNDERİLMEMESİ "değiştirme", `parentId: null` ise
        "köke taşı" demektir.
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        parentId: { type: string, format: uuid, nullable: true }

    MoveMediaRequest:
      description: "`POST /admin/media/move` gövdesi — tekil taşıma tek elemanlı `mediaIds` dizisidir."
      type: object
      required: [mediaIds, folderId]
      properties:
        mediaIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: >
            Tekrarlı id'ler sunucuda teklenir (dedupe). Üst sınır `BulkContentActionRequest`
            ile AYNI (100) — daha fazlası için istemci parçalara böler.
        folderId:
          type: string
          format: uuid
          nullable: true
          description: >
            Hedef klasör; `null` = "Kategorisiz'e taşı". Alan ZORUNLUDUR (değeri null
            olabilir) — kazara klasörden çıkarmayı önlemek için niyet açıkça belirtilir.

    MoveMediaResult:
      type: object
      required: [folderId, requestedCount, movedCount, skippedIds]
      properties:
        folderId: { type: string, format: uuid, nullable: true, description: "İsteğin hedef klasörü (yankı)." }
        requestedCount: { type: integer, description: "dedupe sonrası gönderilen id sayısı" }
        movedCount:
          type: integer
          description: "Güncellenen kayıt sayısı. Zaten hedef klasörde olan medya da DAHİLDİR (idempotent)."
        skippedIds:
          type: array
          items: { type: string, format: uuid }
          description: "Bulunamayan medya id'leri. Hata DEĞİLDİR (`200` döner)."

    UpdateMediaAltTextRequest:
      description: >
        `PATCH /admin/media/{mediaId}` gövdesi — TEK güncellenebilir alan. `folderId`
        BİLEREK yoktur; klasör değişimi yalnızca `POST /admin/media/move` ile yapılır.
      type: object
      required: [altText]
      properties:
        altText: { type: string, minLength: 1, description: "Boş string kabul edilmez → 422." }

    UploadMediaRequest:
      description: "`multipart/form-data` gövdesi — `POST /admin/media`."
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >
            Tek dosya. Yalnızca JPEG/PNG/WEBP/GIF — beyan edilen `Content-Type` GÜVENİLMEZ,
            gerçek tür dosya içeriğinin ilk baytlarından (magic bytes) tespit edilir; SVG
            İSTİSNASIZ REDDEDİLİR (stored-XSS riski, bkz. POST açıklaması). Boyut limiti
            uç açıklamasındadır.
        folderId:
          type: string
          format: uuid
          description: >
            Opsiyonel — yükleme doğrudan bu klasöre düşer (§10.11). Verilmezse
            "Kategorisiz". Multipart alanı olarak string gelir; klasör yoksa `404`
            (dosya diske YAZILMADAN ÖNCE kontrol edilir).

    UserSummary:
      description: >
        Kullanıcının listelerde gösterilen minimum özeti — hassas alan (rol/durum/
        e-posta doğrulaması) TAŞIMAZ. Yazar sütunu ve yazar dropdown'ı bunu kullanır.
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }

    ContentCounts:
      description: >
        Sekme sayaçları — tablo genelinde hesaplanır, istek filtrelerinden ETKİLENMEZ.
        WordPress semantiği: "Tümü" çöptekileri İÇERMEZ.
      type: object
      required: [all, published, draft, trashed]
      properties:
        all: { type: integer, description: "deletedAt IS NULL olan tüm kayıtlar (= published + draft)" }
        published: { type: integer, description: "status = PUBLISHED AND deletedAt IS NULL" }
        draft: { type: integer, description: "status = DRAFT AND deletedAt IS NULL" }
        trashed: { type: integer, description: "deletedAt IS NOT NULL" }

    ContentListMeta:
      description: "`GET /admin/pages` ve `GET /admin/blog` yanıtlarının `meta` zarfı."
      type: object
      required: [counts]
      properties:
        nextCursor: { type: string, nullable: true }
        counts: { $ref: "#/components/schemas/ContentCounts" }

    SeoScoreIssueCode:
      type: string
      description: >
        Kararlı makine-okunur kod. Frontend/qa mantığı BU KODA bağlanır; `label`
        yalnızca gösterim içindir (metni değişebilir).
      enum:
        - SEO_TITLE_MISSING
        - SEO_TITLE_LENGTH
        - SEO_DESCRIPTION_MISSING
        - SEO_DESCRIPTION_LENGTH
        - COVER_IMAGE_MISSING
        - IMAGE_MISSING
        - IMAGE_ALT_MISSING
        - CONTENT_TOO_SHORT

    SeoScoreIssue:
      description: >
        **Puanlama (toplam 100, 5 kriter × 20p):**


        1. Meta başlık: yok → 0p `SEO_TITLE_MISSING`; var ama uzunluk 50–60 dışında →
        10p `SEO_TITLE_LENGTH`; 50–60 arası → 20p.

        2. Meta açıklama: yok → 0p `SEO_DESCRIPTION_MISSING`; var ama 120–160 dışında →
        10p `SEO_DESCRIPTION_LENGTH`; 120–160 arası → 20p.

        3. Kapak görseli: yoksa 0p `COVER_IMAGE_MISSING`, varsa 20p.
        BlogPost → `coverImageUrl`, boşsa `ogImageUrl`.
        Page → `ogImageUrl`, boşsa ilk `image` bloğunun `data.url` değeri.

        4. Alt-metinli görsel: hiç görsel yoksa 0p `IMAGE_MISSING`; görsel var ama
        hiçbirinde dolu alt yoksa 0p `IMAGE_ALT_MISSING`; en az biri alt'lıysa 20p.
        Page → `blocks` içindeki `image`/`gallery` bloklarının `data.alt` (gallery'de
        herhangi bir öğenin alt'ı). BlogPost → `contentHtml` içindeki `<img alt="...">`;
        kapak görseli bu kriteri KARŞILAMAZ (3. kriterle çift sayılmasın diye).

        5. İçerik uzunluğu: kelime sayısı eşiğin altındaysa 0p `CONTENT_TOO_SHORT`,
        değilse 20p. Eşik: **Page ≥ 100**, **BlogPost ≥ 300** kelime. Kelime =
        HTML/etiketler ayıklandıktan sonra boşlukla ayrılmış boş olmayan token.
        Page metni: blokların `data.text`/`data.title`/`data.subtitle`/`data.html`
        alanlarının birleşimi. BlogPost metni: `contentHtml`.


        **§10.19 not:** kriter 4/5 için Page taraması `flattenPageBlocks()` üzerinden
        çalışır — bu fonksiyon `container.children`'ı (iç içe konteynerler DAHİL, KONTEYNER
        DERİNLİĞİNDEN BAĞIMSIZ) ve legacy `columns.data.columns[].blocks`'u aynı iteratif
        yürüyüşle düzleştirir. Yani bir konteynerin 3. seviyesine taşınan bir görsel/metin,
        1. seviyedekiyle AYNI şekilde sayılır — derinlik SEO puanını sessizce düşürmez.


        Skor yalnızca TR/kanonik kolonlardan hesaplanır (`translations` v1'de dikkate
        alınmaz). Hesap saf ve senkron olmalıdır — liste yanıtında satır başına çalışır.
      type: object
      required: [code, label]
      properties:
        code: { $ref: "#/components/schemas/SeoScoreIssueCode" }
        label:
          type: string
          description: "Kullanıcıya gösterilecek Türkçe metin, ör. \"Meta açıklama 120–160 karakter olmalı (şu an 84).\""

    BulkContentActionRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: "Tekrarlı id'ler sunucuda teklenir (dedupe)."
        action:
          type: string
          enum: [trash, restore, publish, draft, permanent-delete]
          description: >
            `trash` = çöpe taşı; `restore` = geri yükle; `publish`/`draft` = durum
            değiştir (çöptekiler atlanır); `permanent-delete` = kalıcı sil
            (ADMIN veya MANAGER, yalnızca çöptekiler).

    BulkContentActionResult:
      type: object
      required: [action, requestedCount, affectedCount, skippedIds]
      properties:
        action: { type: string, enum: [trash, restore, publish, draft, permanent-delete] }
        requestedCount: { type: integer, description: "dedupe sonrası gönderilen id sayısı" }
        affectedCount: { type: integer }
        skippedIds:
          type: array
          items: { type: string, format: uuid }
          description: "Uygulanamayan id'ler (bulunamayan veya durumu uygun olmayan). Hata DEĞİLDİR."

    # ---- §10.17 (v1/v2, SUPERSEDE edildi) → §10.19 (v3) Sayfa içerik bloklarında
    # hiyerarşik `container` mimarisi ----
    # Bağlayıcı kaynak: `.claude/design-notes-page-builder-containers.md` +
    # ARCHITECTURE.md §10.19. `PageBlock` şema ADI KORUNDU (5 yerden `$ref` ediliyor);
    # yalnızca `type` enum'u ve alan sözleşmesi genişledi (additive, kırıcı DEĞİL).

    PageBlock:
      type: object
      description: >
        Sayfa içerik/ağaç düğümü (`Page.blocks`, `Page.translations.<LOCALE>.blocks`).
        **YALNIZCA `Page` içindir — `BlogPost`'un blok sistemi YOKTUR** (blog içeriği
        `contentHtml` TipTap zengin metnidir, bkz. ARCHITECTURE.md §10.17.1 — hâlâ geçerli).


        `type` değerleri: `hero` · `text` · `image` · `gallery` · `cta` ·
        `featured-products` · `featured-portfolio` · **`container`** (kanonik konteyner
        düğümü, §10.19) · `columns` (**deprecated**, salt okuma/geçiş, aşağıya bkz.).


        **`data` alanı YALNIZCA içerik bloklarıdır** (`hero`/`text`/`image`/`gallery`/`cta`/
        `featured-*`) — `type: "container"` düğümlerinde `data` YOKTUR, bunun yerine
        `settings` (§`PageContainerSettings`) + `children` (`PageBlock[]`, kendi türünden,
        iç içe) taşırlar. Bir içerik bloğunun `settings`'i, bir konteynerin `data`'sı YOKTUR —
        bu ayrım bilinçlidir (bkz. tasarım notu §3.3): sanitize/`settings`↔`data` sorumluluğu
        karışmaz.


        Backend `type` ∉ {`container`, `columns`, `gallery`} için `data` şemasını BİLİNÇLİ
        olarak serbest bırakır (`z.record(z.unknown())` — mevcut davranış korunur); yalnızca
        `container`/`columns`/`gallery` DAR doğrulamadan geçer.


        `type: "text"` bloklarının `data.html`'i DB'ye yazılmadan önce
        `lib/html-sanitize.ts::sanitizeRichHtml`'den geçer — **konteyner İÇİNDEKİLER DAHİL**
        (iteratif tarama + özyinelemeli sanitize, derinlik `MAX_CONTAINER_DEPTH` ile
        sınırlı; bu özyineleme yapılmazsa stored XSS oluşur, bkz. §10.19.6).
      required: [id, type, data]
      properties:
        id: { type: string }
        type:
          type: string
          enum:
            [
              hero,
              text,
              image,
              gallery,
              cta,
              featured-products,
              featured-portfolio,
              container,
              columns,
            ]
        data:
          type: object
          additionalProperties: true
          description: >
            YALNIZCA içerik blokları için anlamlıdır (`type ∉ {container}`). `type:
            "columns"` için bkz. `PageColumnsBlockData` (**deprecated**). `type:
            "container"` düğümlerinde bu alan YOKTUR — bkz. `PageContainerNode`.

    PageContainerSettings:
      type: object
      description: >
        §10.19 (v3) — kanonik `container` düğümünün sunum ayarları. Render motorunda
        DOĞRUDAN inline `style`'a beslendiği için TÜM sayısal/serbest görünen alanlar
        BİLİNÇLİ olarak dar tiplerle (kapalı enum, sayısal aralık, regex/protokol beyaz
        listesi) kilitlenmiştir — hiçbir alan serbest CSS string'i DEĞİLDİR (bkz. tasarım
        notu §5.3, security-agent ön denetimi §13.3).
      properties:
        layout:
          type: string
          enum: [boxed, full-width]
          default: boxed
          description: "`boxed` = ortalanmış içerik kuyusu (+ `customWidth`); `full-width` = kenardan kenara."
        customWidth:
          type: integer
          minimum: 320
          maximum: 1920
          description: >
            YALNIZCA `layout: "boxed"` iken anlamlıdır. Verilmezse
            `DEFAULT_CONTAINER_MAX_WIDTH` (1170) uygulanır. Inline `maxWidth` — Tailwind
            arbitrary sınıfı DEĞİL (derleme-zamanı statik tarama dinamik değeri yakalayamaz).
        minHeight:
          type: object
          nullable: true
          description: >
            KASITLI OLARAK serbest bir `string` DEĞİLDİR (mimarın kullanıcı isteğini
            reddetmesi, §5.3) — `settings`'in tamamı inline `style`'a beslenir ve
            `sanitizePageBlocks` yalnızca `data.html`'e bakar, `settings`'e HİÇ bakmaz;
            serbest bir string CSS enjeksiyon yüzeyi olurdu. Sayısal değer + kapalı birim
            enum'uyla enjeksiyon yapısal olarak imkânsız hale gelir.
          required: [value, unit]
          properties:
            value: { type: number, minimum: 0, maximum: 5000 }
            unit: { type: string, enum: [px, vh], default: px }
        direction: { type: string, enum: [row, column], default: column }
        justifyContent:
          type: string
          enum: [start, center, end, between, around, evenly]
          default: start
        alignItems:
          type: string
          enum: [stretch, start, center, end]
          default: stretch
        gap:
          type: integer
          minimum: 0
          maximum: 128
          default: 16
          description: "Piksel. `gap-*` Tailwind sınıfı DEĞİL — dinamik değer, inline style."
        padding: { $ref: "#/components/schemas/PageContainerSpacing" }
        margin: { $ref: "#/components/schemas/PageContainerSpacing" }
        background: { $ref: "#/components/schemas/PageContainerBackground" }
        widthFr:
          type: number
          exclusiveMinimum: 0
          maximum: 12
          description: >
            Bu konteynerin, `direction: "row"` olan EBEVEYNİ içindeki göreli genişlik
            ağırlığı. CSS: `flex: <widthFr> 1 0%` — v2'deki `PageColumn.width` (`fr`) ile
            sayısal olarak birebir aynı anlam. Ebeveyn `direction: "column"` ise veya
            düğüm kökteyse YOK SAYILIR. `customWidth` ile KARIŞTIRILMAMALI (o, konteynerin
            KENDİ dış max-width'idir).

    PageContainerSpacing:
      type: object
      description: >
        Dört kenar, piksel cinsinden tam sayı. **Negatif değer YASAK** (0–200) — iki
        gerekçe: (1) editör içi UX-tuzağı (bir bloğun kendi ebeveyninin dışına taşıp
        komşu kontrolleri örtmesi), (2) güvenlik: negatif margin, düşük yetkili bir
        Editor'ün YAYINLANMIŞ/public sayfada bir elemanı başka bir elemanın üzerine
        görünmez şekilde taşıyıp ziyaretçilere yönelik bir UI-redressing/tıklama-tuzağı
        deseni üretmesine izin verirdi (security-agent ön denetimi §13.4).
      properties:
        top: { type: integer, minimum: 0, maximum: 200, default: 0 }
        right: { type: integer, minimum: 0, maximum: 200, default: 0 }
        bottom: { type: integer, minimum: 0, maximum: 200, default: 0 }
        left: { type: integer, minimum: 0, maximum: 200, default: 0 }

    PageContainerBackground:
      type: object
      description: >
        Ayrık birlik (discriminated union, `type` alanına göre). `color`'ın `value`'su
        `#rgb`/`#rrggbb`/`#rrggbbaa` regex'iyle sınırlıdır. `image`'ın `value`'su bir
        protokol BEYAZ LİSTESİNDEN geçer — yalnızca `/` (relative) veya `https://`/`http://`
        ile başlayabilir; `javascript:`/`vbscript:`/`data:` şemaları (baştaki boşluk/kontrol
        karakteri toleranslı, case-insensitive) VE CSS-bağlamından-kaçış karakterleri
        (`"'()\;{}<>` + boşluk) AÇIKÇA reddedilir — salt karakter kara listesi `%`
        (URL-encoding) ile atlatılabileceği için (security-agent ön denetimi §13.3) protokol
        beyaz listesi ayrı/bağımsız bir savunma katmanı olarak eklendi.
      required: [type]
      properties:
        type: { type: string, enum: [none, color, image] }
        value:
          type: string
          description: "`type: color` iken hex renk; `type: image` iken URL (yukarıdaki kısıtlarla)."
        position: { type: string, enum: [center, top, bottom, left, right], default: center }
        size: { type: string, enum: [cover, contain, auto], default: cover }
        repeat: { type: string, enum: [no-repeat, repeat], default: no-repeat }

    PageContainerNode:
      type: object
      description: >
        Kanonik konteyner düğümü (§10.19, `PageNode` ağacındaki iç düğüm). `Page.blocks`
        KÖK dizisi hâlâ `PageBlock[]`'tur (kök şekli DEĞİŞMEDİ — bkz. `CreatePageRequest.
        blocks` açıklaması); bir `container`'ın kendisi bu dizinin bir ÖĞESİ ya da başka bir
        `container`'ın `children`'ı olabilir.
      required: [id, type, settings, children]
      properties:
        id: { type: string }
        type: { type: string, enum: [container] }
        settings: { $ref: "#/components/schemas/PageContainerSettings" }
        children:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/PageBlock" }
          description: >
            `MAX_CHILDREN_PER_CONTAINER = 24` — yalnızca GERÇEK `container.children`
            dizilerine uygulanır (kök `Page.blocks` dizisi bir "konteyner" DEĞİLDİR, bu
            sınıra TABİ DEĞİLDİR — yalnızca toplam düğüm (300) ve gövde-boyutu (256 KB)
            tavanlarına tabidir, architect onaylı netleştirme).

    PageColumnsBlockData:
      type: object
      deprecated: true
      description: >
        **DEPRECATED (§10.17 v2 — §10.19/v3'te `PageContainerNode`'a normalize edilir).**
        Yeni kod bu şekli ASLA üretmez; yalnızca ÖNCEDEN kaydedilmiş sayfaların okunması/
        kabul edilmesi için desteklenir (`type: "columns"`, salt okuma/geçiş şekli).


        Bir `WRITE` isteğinde (`POST`/`PATCH`/autosave) bu şekil sessizce kanonik bir
        `container` ağacına çevrilir ve DB'ye **`container` olarak** yazılır — 422 VERİLMEZ.
        Eşleme (mimarın `legacyColumnsToContainer`'ı, backend/frontend'de birebir aynı):
        `gap` token'ı (`none/sm/md/lg`) → piksel (`0/8/16/32`), `verticalAlign` →
        `alignItems` (`top→start`, `center→center`, `bottom→end`), her sütunun `width`'i →
        alt konteynerin `widthFr`'i (v1 `ratio` da aynı ağırlık tablosundan geçer:
        `2-1`→`[2,1]`, `1-2`→`[1,2]`, aksi halde eşit ağırlık). Dış sarmalayıcı `layout:
        "boxed"`, `customWidth: 1024` (v2'nin `max-w-5xl`'i) ile eşdeğer geometriyi korur.


        **Derinlik en fazla `MAX_CONTAINER_DEPTH = 4`** (§10.19 — v2'nin "derinlik en fazla
        1" kısıtı KALDIRILDI; `hero` dahil HERHANGİ bir içerik bloğu artık bir konteyner
        içine konabilir, bkz. tasarım notu §3.4).


        Mobil yığılma bir VERİ ALANI DEĞİLDİR — tamamen CSS'tir (`flex-col` tabanı, §10.19.5).
        `stackOnMobile` gibi her zaman `true` olan gizli bir bayrak YOKTUR.
      required: [gap, verticalAlign, columns]
      properties:
        gap: { type: string, enum: [none, sm, md, lg], default: md }
        verticalAlign: { type: string, enum: [top, center, bottom], default: top }
        columns:
          type: array
          minItems: 2
          maxItems: 24
          items:
            type: object
            required: [id, blocks]
            properties:
              id: { type: string }
              width:
                type: number
                default: 1
                description: "Göreli genişlik ağırlığı — normalize sonrası alt konteynerin `widthFr`'ine taşınır."
              blocks:
                type: array
                maxItems: 20
                items: { $ref: "#/components/schemas/PageBlock" }
                description: >
                  v2'de `type` ∈ {`columns`, `hero`} OLAMAZ kısıtı vardı; bu kısıt normalize
                  sonrası kanonik `container` modelinde YOKTUR (§10.19 — yalnızca derinlik
                  sınırı geçerlidir).

    CreatePageRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, description: "verilmezse title'dan slugify edilir" }
        status: { allOf: [{ $ref: "#/components/schemas/PageStatus" }], default: DRAFT }
        editMode:
          allOf: [{ $ref: "#/components/schemas/PageEditMode" }]
          description: >
            Verilmezse `FREEFORM`. Bu ucun TAMAMI zaten `SiteRole=ADMIN` şartına tabidir
            (§10.21, bkz. uç açıklaması), bu yüzden burada ek bir alan-bazlı 403 kuralı
            YOKTUR.
        blocks:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/PageBlock" }
          description: >
            §10.19 (v3). Üst sınır (`MAX_TOTAL_PAGE_NODES = 300`, v2'nin 200'ünden
            yükseltildi) İÇ İÇE konteynerler DAHİL sayılır (DoS koruması). Ayrıca:
            konteyner iç içe geçme derinliği en fazla `MAX_CONTAINER_DEPTH = 4` (kök
            seviye = 1), bir konteynerin doğrudan çocuk sayısı en fazla
            `MAX_CHILDREN_PER_CONTAINER = 24`, `blocks`'un serileştirilmiş JSON gövdesi en
            fazla **256 KB**. İhlal → `422 VALIDATION_ERROR` (`error.details.blocks`).
            Doğrulama SIRASI bağlayıcıdır (iteratif yapı taraması → byte tavanı →
            özyinelemeli şema parse'ı) — aksi halde derinlik sınırının kendisi bir
            stack-overflow DoS'una dönüşür (bkz. ARCHITECTURE.md §10.19.4).
        seoTitle: { type: string }
        seoDescription: { type: string }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean, default: false }
        isLegalDocument:
          type: boolean
          default: false
          description: "Yalnızca SiteRole=ADMIN gönderebilir (EDITOR → `403`). Bkz. `Page.isLegalDocument`."
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: >
            §10.7 — verilmezse giriş yapmış kullanıcı atanır. Giriş yapmış kullanıcıdan
            FARKLI bir id yalnızca SiteRole=ADMIN tarafından gönderilebilir (MANAGER/EDITOR → 403);
            var olmayan kullanıcı → 422.
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Faz 4 (zamanlanmış yayın). **Çapraz-alan kuralı (OpenAPI şeması TEK BAŞINA
            ifade edemez — zod `.refine()` ile uygulanır, bkz. backend
            `schemas/common.ts::refineScheduledAt`):** `status: SCHEDULED` gönderilmişse
            bu alan ZORUNLUDUR ve şu andan İLERİDE bir tarih olmalıdır; aksi halde
            `422 VALIDATION_ERROR` döner (`error.details.scheduledAt`) ve kayıt hiç
            OLUŞTURULMAZ. `status` `SCHEDULED` DEĞİLSE (ör. `DRAFT`/`PUBLISHED`/hiç
            gönderilmemiş) bu alan gönderilse dahi YOK SAYILIR.

    UpdatePageRequest:
      description: >
        Tüm alanlar opsiyoneldir. Hızlı Düzenle (Quick Edit) bu şemanın
        `{ title, slug, status }` alt kümesini gönderir — ayrı bir uç/şema YOKTUR.
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug:
          type: string
          minLength: 1
          description: >
            **§10.21 — Katman 2 (sayfa kimliği): yalnızca `ADMIN` ve `MANAGER`
            gönderebilir; `EDITOR` gönderirse `403 FORBIDDEN`.** Sayfanın URL'i yapısal
            bir özelliktir. Kural `editMode`'dan BAĞIMSIZDIR.
        status: { $ref: "#/components/schemas/PageStatus" }
        editMode:
          allOf: [{ $ref: "#/components/schemas/PageEditMode" }]
          description: >
            **§10.21 — Katman 2: yalnızca `ADMIN` ve `MANAGER` gönderebilir; `EDITOR`
            gönderirse `403 FORBIDDEN`** (`isLegalDocument`/`authorId` ile AYNI alan-bazlı
            guard deseni, ama o ikisi ADMIN-only'dir).


            AYRICALIK YÜKSELTMESİ YOKTUR: `editMode` artık hiçbir yetkilendirme kararını
            etkilemeyen kozmetik bir etikettir (bkz. `PageEditMode`), dolayısıyla değeri
            değiştirmek hiç kimseye yeni bir yetki KAZANDIRMAZ.


            Değeri DEĞİŞTİREN her istek `content.edit_mode_change` audit kaydı üretir.
        blocks:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/PageBlock" }
          description: >
            `CreatePageRequest.blocks` ile AYNI doğrulama seti (§10.19): 300 düğüm tavanı,
            derinlik ≤4, konteyner başına ≤24 çocuk, gövde ≤256 KB, aynı bağlayıcı
            doğrulama sırası.


            **§10.21 EK KURALI — Katman 1, yapısal diff.** Çağıran **ADMIN DEĞİLSE**
            (`canUseAdvancedBuilder === false`, yani MANAGER veya EDITOR), sayfanın
            `editMode` değeri NE OLURSA OLSUN gelen ağaç kayıtlı ağaçla
            karşılaştırılır (`lib/page-template-guard.ts::assertTemplateEditAllowed`):
            düğüm sayısı, `id` sırası ve her düğümün `type`'ı AYNI kalmalı; `container`
            düğümlerinin `settings`/`reveal`'ı DEĞİŞMEMELİ; içerik bloklarında yalnızca
            `TEMPLATE_EDITABLE_FIELDS[type]` alanları farklı olabilir. İhlal →
            **`403 FORBIDDEN`** (`422` DEĞİL: gövde geçerlidir, izin yoktur),
            `error.details.blocks` içinde ihlal eden `nodeId`/alan adları (en fazla 10).


            Bu kural ZOD'DA UYGULANAMAZ (kural kayıtlı duruma GÖRELİDİR, şema gövdeyi
            izole doğrular) — route katmanında, şema parse'ından SONRA ve DB yazımından
            ÖNCE çalışır. `PageBlockListSchema` için ikinci/dar bir şema varyantı
            YAZILMAZ.
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean }
        isLegalDocument:
          type: boolean
          description: >
            Yalnızca SiteRole=ADMIN gönderebilir (EDITOR → `403`). Değeri DEĞİŞTİREN
            her istek `content.legal_flag_change` audit kaydı üretir. Bkz.
            `Page.isLegalDocument`.
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
          description: >
            §10.21 — `translations.<locale>.blocks` de bir blok ağacıdır ve Katman 1
            yapısal diff'ine (bkz. `blocks`) TABİDİR; aksi halde ADMIN olmayan bir
            kullanıcı yapıyı çeviri sekmesi üzerinden değiştirerek kısıtı baypas ederdi. Karşılaştırma referansı:
            o locale'in KAYITLI `blocks`'u; kayıtlı çeviri henüz yoksa **kanonik**
            `blocks`. Böylece çeviri eklemek "metin doldurmak" olur, "yapı klonlamak" değil.
        authorId:
          type: string
          format: uuid
          nullable: true
          description: "Yalnızca SiteRole=ADMIN değiştirebilir (MANAGER/EDITOR gönderirse 403). `null` = yazarı kaldır."
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Faz 4 (zamanlanmış yayın) — çapraz-alan kuralı `CreatePageRequest.scheduledAt`
            ile AYNIDIR (`status: SCHEDULED` iken zorunlu + gelecekte olmalı, aksi halde
            422; `refineScheduledAt`). EK OLARAK: istekte `status` alanı GÖNDERİLMİŞSE ve
            değeri `SCHEDULED` DEĞİLSE, sunucu eski bir zamanlama artığı kalmasın diye
            `scheduledAt`'i sunucu tarafında `null`'a temizler (bu istekte `status`
            gönderilmediyse mevcut zamanlamaya DOKUNULMAZ).

    CreateBlogPostRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        excerpt: { type: string }
        contentHtml: { type: string }
        coverImageUrl: { type: string }
        status: { allOf: [{ $ref: "#/components/schemas/PageStatus" }], default: DRAFT }
        categoryId: { type: string, format: uuid, nullable: true }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: >
            §10.14.4 — yazının etiket seti. Verilmezse yazı etiketsiz oluşur. Var olmayan
            bir id → `422`. Tekrar eden id'ler sessizce tekilleştirilir.
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean, default: false }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: >
            §10.7 — `CreatePageRequest.authorId` ile aynı kural. **Mevcut kod bunu
            gövdeden okumadan `request.user.id` olarak sabitliyor**; yeni kuralda
            gövdeden gelen değer (ADMIN ise) önceliklidir.
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Faz 4 (zamanlanmış yayın) — çapraz-alan kuralı `CreatePageRequest.scheduledAt`
            ile AYNIDIR (`status: SCHEDULED` iken zorunlu + gelecekte olmalı, aksi halde
            422; `refineScheduledAt`).

    UpdateBlogPostRequest:
      description: >
        Tüm alanlar opsiyonel. Hızlı Düzenle §10.7.2 ile `{ title, slug, status,
        categoryId, tagIds }` alt kümesini gönderir (Sayfa/Ürün/Portföy Hızlı Düzenle'si
        `{ title, slug, status }` ile SINIRLIDIR — kategori/etiket yalnızca blogda vardır).
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        excerpt: { type: string, nullable: true }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PageStatus" }
        categoryId: { type: string, format: uuid, nullable: true }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: >
            §10.14.4 — **TAM SET (replace), delta DEĞİL.** Gönderilen dizi yazının yeni
            etiket setidir; listede olmayan mevcut etiketler KALDIRILIR. `[]` tüm
            etiketleri kaldırır. Alanı **hiç göndermemek** (`undefined`) etiketlere
            DOKUNMAZ — `[]` ile `undefined` arasındaki bu fark bağlayıcıdır ve Hızlı
            Düzenle'nin kısmi gövde sözleşmesi buna dayanır.
            Var olmayan bir id → `422`. Çöpteki yazıda → `409` (§10.7).
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: "Yalnızca ADMIN değiştirebilir."
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Faz 4 (zamanlanmış yayın) — çapraz-alan kuralı `CreatePageRequest.scheduledAt`
            ile AYNIDIR. EK OLARAK: istekte `status` alanı GÖNDERİLMİŞSE ve değeri
            `SCHEDULED` DEĞİLSE, sunucu eski bir zamanlama artığı kalmasın diye
            `scheduledAt`'i sunucu tarafında `null`'a temizler (`status` gönderilmediyse
            mevcut zamanlamaya DOKUNULMAZ) — bkz. `UpdatePageRequest.scheduledAt`.

    AutosavePageRequest:
      description: >
        Faz 3 (autosave) — `POST /admin/pages/{pageId}/autosave` gövdesi. `UpdatePageRequest`'in
        BİLİNÇLİ olarak DAR bir alt kümesidir: yalnızca kullanıcının aktif düzenlediği
        metin alanları korunur; `status`/`slug`/SEO/çeviri gibi alanlar kapsam DIŞIDIR
        (bu uçtan gönderilse dahi kabul EDİLMEZ, şema seviyesinde yoktur).
      type: object
      properties:
        title: { type: string, minLength: 1 }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
          description: >
            Autosave "gevşek" bir doğrulama YOLU DEĞİLDİR (§10.19) — bu alan da tam
            `CreatePageRequest.blocks` şemasından (300 düğüm tavanı, derinlik ≤4,
            konteyner başına ≤24 çocuk, gövde ≤256 KB, `container`/`columns`/`gallery`
            şekil doğrulaması) geçer; ihlal aynı şekilde `422 VALIDATION_ERROR` döner.


            **§10.21 (ZORUNLU, atlanması bir güvenlik açığıdır):** Katman 1 yapısal diff'i
            (`UpdatePageRequest.blocks`) BU YOLDA DA uygulanır. Autosave `PATCH`'ten
            AYRI bir kod yoludur ve `blocks` yazar; kontrol burada unutulursa 3 saniyelik
            debounce üzerinden TÜM şablon kısıtı sessizce baypas edilir. İhlal →
            `403 FORBIDDEN`.

    AutosaveBlogPostRequest:
      description: >
        Faz 3 (autosave) — `POST /admin/blog/{postId}/autosave` gövdesi. `AutosavePageRequest`
        ile AYNI niyet, `BlogPost` şemasına uyarlanmış alan seti (`blocks` yerine
        `excerpt`/`contentHtml` — `BlogPost`'ta `blocks` alanı YOKTUR).
      type: object
      properties:
        title: { type: string, minLength: 1 }
        excerpt: { type: string, nullable: true }
        contentHtml: { type: string }

    AutosaveProductRequest:
      description: >
        `POST /admin/products/{productId}/autosave` gövdesi. `AutosavePageRequest` ile
        AYNI niyet, `Product` şemasına uyarlanmış alan seti. **Ticari alanlar BİLİNÇLİ
        olarak KAPSAM DIŞIDIR** (`priceCents`, `discountPriceCents`, `currency`,
        `taxRatePercent`, `sku`, `stockQuantity`, `status`, `slug`, SEO, çeviri,
        `scheduledAt`): fiyat/indirim çapraz-alan kuralı ve `sku` tekilliği yarım kalmış
        bir taslak üzerinde 3 saniyede bir doğrulanamaz — bu alanlar yalnızca bilinçli
        `PATCH` ile yazılır. Bu uçtan gönderilseler dahi kabul EDİLMEZLER (şema
        seviyesinde yokturlar).
      type: object
      properties:
        title: { type: string, minLength: 1 }
        excerpt: { type: string, nullable: true }
        descriptionHtml: { type: string }

    AutosavePortfolioItemRequest:
      description: >
        `POST /admin/portfolio/{itemId}/autosave` gövdesi. `AutosaveProductRequest` ile
        AYNI niyet, `PortfolioItem` şemasına uyarlanmış alan seti (`excerpt`/
        `descriptionHtml` yerine `summary`/`contentHtml`). `status`/`slug`/`order`/
        `clientName`/`projectUrl`/`completedAt`/SEO/çeviri kapsam DIŞIDIR.
      type: object
      properties:
        title: { type: string, minLength: 1 }
        summary: { type: string, nullable: true }
        contentHtml: { type: string }

    AutosaveResponse:
      description: >
        `POST /admin/{blog,pages,products,portfolio}/{id}/autosave` ortak yanıt şeması. **BİLİNÇLİ olarak
        minimaldir: autosave `ContentRevision` ÜRETMEZ ve `AuditLog` YAZMAZ** (bkz.
        backend `lib/content-revisions.ts`, `MAX_REVISIONS_PER_ENTITY`) — aksi halde
        3sn'lik debounce ile tetiklenen her otomatik kayıt, entity başına revizyon
        tavanını doldurup kullanıcının bilinçli "Kaydet" ile ürettiği anlamlı geçmişi
        silerdi. Bu yüzden tam entity DTO'su DÖNMEZ — istemci yalnızca en son kayıt
        zamanını bilmek ister.
      type: object
      required: [savedAt]
      properties:
        savedAt: { type: string, format: date-time }

    ContentEntityType:
      type: string
      description: >
        Revizyon tutulan içerik türleri. `PRODUCT`/`PORTFOLIO_ITEM` DB enum'ında zaten
        vardı (yazma tarafı çalışıyordu); artık okuma/geri yükleme uçları da mevcuttur —
        dördü de `ContentRevisions` tag'i kapsamındadır (bkz. ARCHITECTURE.md §10.1).
      enum: [PAGE, BLOG_POST, PRODUCT, PORTFOLIO_ITEM]

    ContentRevisionSummary:
      description: >
        Revizyon liste görünümü — `snapshot` alanını İÇERMEZ (bkz. ARCHITECTURE.md §10.1).
      type: object
      properties:
        id: { type: string, format: uuid }
        editedById: { type: string, format: uuid, nullable: true }
        editedByName: { type: string, description: "silinen kullanıcı için okunabilir ad snapshot'ı" }
        createdAt: { type: string, format: date-time }

    ContentRevision:
      allOf:
        - $ref: "#/components/schemas/ContentRevisionSummary"
        - type: object
          properties:
            entityType: { $ref: "#/components/schemas/ContentEntityType" }
            entityId: { type: string }
            snapshot:
              type: object
              description: >
                Güncellemeden HEMEN ÖNCEKİ tam alan seti — Page için `{ title, slug,
                blocks, seoTitle, seoDescription, ogTitle, ogImageUrl, canonicalUrl,
                noIndex, translations }`; BlogPost için `{ title, slug, excerpt,
                contentHtml, coverImageUrl, categoryId, seoTitle, seoDescription,
                ogTitle, ogImageUrl, canonicalUrl, noIndex, translations }`; Product
                için `{ title, slug, excerpt, descriptionHtml, priceCents, currency,
                taxRatePercent, discountPriceCents, sku, stockQuantity, categoryId,
                coverMediaId, seoTitle, seoDescription, ogTitle, ogImageUrl,
                canonicalUrl, noIndex, translations }`; PortfolioItem için `{ title,
                slug, summary, contentHtml, clientName, projectUrl, completedAt, order,
                categoryId, coverMediaId, seoTitle, seoDescription, ogTitle, ogImageUrl,
                canonicalUrl, noIndex, translations }`.


                **Galeri (`images[]`) snapshot'a DAHİL DEĞİLDİR** — ayrı uçlardan
                (`.../images`) yönetilen bir ilişki koleksiyonudur ve `PATCH` ile
                değişmez; dolayısıyla revizyon geri yükleme galeriye DOKUNMAZ.


                **Page `blocks` snapshot'ları (§10.19):** snapshot'lar **kaydedildikleri
                dönemin şeklini** taşır — aynı sayfanın farklı revizyonları v1
                (`columnCount`/`ratio`), v2 (`columns`+`width`) ve v3 (`container`) şekilleri
                KARIŞIK içerebilir. Geri yükleme (`restore`) yazma yolundan (`PageBlockListSchema`)
                geçtiği için sonuç her zaman kanonik `container` şekline normalize edilir; ancak
                bir snapshot'ı restore ETMEDEN doğrudan görüntüleyen/önizleyen bir istemci
                (ör. diff/karşılaştırma ekranı) legacy şekli kendisi normalize etmelidir.
              additionalProperties: true

    EmailTemplatePurpose:
      type: string
      description: >
        Şablonun KULLANILDIĞI YER. `CUSTOM` dışındaki her amaç için en fazla BİR şablon
        `isActive=true` olabilir (§10.16.3 — kısmi unique index + servis transaction'ı ile
        iki katmanda zorlanır). Gönderim tetikleyicileri şablonu ANAHTARA göre değil
        AMACA göre çözer.
      enum:
        - WELCOME
        - PASSWORD_RESET
        - SYSTEM_ANNOUNCEMENT
        - ORDER_CONFIRMATION
        - ORG_INVITATION
        - CONTACT_FORM_NOTIFICATION
        - CUSTOM

    EmailTemplateEditorMode:
      type: string
      description: >
        `RAW` = §10.3'ten devralınan ham HTML şablonu (`bodyHtml` kaynak; seed'lenmiş
        5 sistem şablonu bu moddadır ve davranışları BİT DÜZEYİNDE korunur).
        `BLOCKS` = §10.16 blok editörü (`blocks` kaynak; `bodyHtml` KULLANILMAZ ve boş
        string'tir). Yeni şablonlar HER ZAMAN `BLOCKS` olarak oluşturulur; mod
        sonradan DEĞİŞTİRİLEMEZ.
      enum: [RAW, BLOCKS]

    EmailBlockType:
      type: string
      enum: [logo-header, heading, text, button, image, divider, footer]

    EmailBlockStyle:
      type: object
      description: >
        Her blokta bulunan temel stil ayarları. Değerler KAPALI kümedir; renkler
        `^#[0-9a-fA-F]{6}$` ile doğrulanır. Kullanıcı HİÇBİR KOŞULDA ham CSS yazamaz —
        satır-içi `style` çıktısını yalnızca sunucudaki `lib/email-renderer.ts` üretir.
      required: [align, paddingY, paddingX]
      properties:
        align: { type: string, enum: [left, center, right], default: left }
        backgroundColor: { type: string, nullable: true, pattern: "^#[0-9a-fA-F]{6}$" }
        textColor: { type: string, nullable: true, pattern: "^#[0-9a-fA-F]{6}$" }
        paddingY: { type: string, enum: [none, sm, md, lg], default: md }
        paddingX: { type: string, enum: [none, sm, md, lg], default: md }

    EmailBlock:
      type: object
      description: >
        E-posta içerik bloğu. `data` şekli `type`'a göre değişir (bkz. ARCHITECTURE.md
        §10.16.4 tablosu — backend `zod` discriminated union ile DAR doğrular).
        **İç içe blok YOKTUR** — e-posta blok listesi düzdür; §10.17'deki sayfa
        `columns` bloğuyla KARIŞTIRILMAMALI, iki sistem tip/registry paylaşmaz.


        Şablon başına en fazla 50 blok; `blocks` gövdesi en fazla 256 KB.
      required: [id, type, style, data]
      properties:
        id: { type: string, description: "İstemcinin ürettiği uuid — dnd-kit sıralama anahtarı." }
        type: { $ref: "#/components/schemas/EmailBlockType" }
        style: { $ref: "#/components/schemas/EmailBlockStyle" }
        data:
          type: object
          additionalProperties: true
          description: >
            `logo-header`: `{ useSiteLogo, logoUrl, height (16–120) }` ·
            `heading`: `{ text (1–200), level: 1|2|3 }` ·
            `text`: `{ html (≤20 000 krk) }` — `sanitizeEmailRichText()` ile temizlenir ·
            `button`: `{ label (1–80), href, backgroundColor, textColor, radius: none|sm|full }` ·
            `image`: `{ mediaId, url, alt (1–200, ZORUNLU), width }` ·
            `divider`: `{ thickness: 1|2|4, color }` ·
            `footer`: `{ text (≤1000) }`.


            Değişken (`{{...}}`) kabul eden alanlar: `heading.text`, `text.html`,
            `button.label`, `button.href`, `footer.text` (+ şablonun `subject`'i).
            `button.href` ya `http(s)`/`mailto` olmalı ya da TAMAMEN tek bir değişken
            olmalıdır (`^\\{\\{\\w+\\}\\}$`); `javascript:`/`data:` her koşulda reddedilir.

    EmailVariableDefinition:
      type: object
      description: >
        `lib/email-variables.ts` statik registry'sinden gelir. Anahtarlar İngilizce
        snake_case'tir (mimar hakemliği, §10.16.1 — mevcut seed/çağrı yerleriyle
        uyum ZORUNLU); `label` Türkçedir ve UI'da BİRİNCİL gösterilir.
      required: [key, label, sampleValue, source]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$", example: user_name }
        label: { type: string, example: "Kullanıcı Adı" }
        sampleValue: { type: string, example: "Ayşe Yılmaz" }
        source:
          type: string
          enum: [system, custom, contact-field]
          description: >
            `contact-field` = iletişim formu alanından TÜRETİLDİ (yalnızca
            `purpose=CONTACT_FORM_NOTIFICATION`). Admin forma "telefon" alanı
            eklediğinde `{{telefon}}` hiçbir ek işlem olmadan burada belirir.

    EmailCustomVariable:
      type: object
      description: >
        Kullanıcı tanımlı değişken (şablon başına en fazla 20). `key` **ASCII olmak
        ZORUNDADIR**: `lib/template-render.ts` kalıbı `/\\{\\{(\\w+)\\}\\}/g` ve JS `\\w` =
        `[A-Za-z0-9_]` — `{{kullanici_adi}}` çalışır, `{{çalışan_adı}}` ÇALIŞMAZ (sessizce
        ham metin olarak e-postaya basılır). Sistem değişkenleriyle çakışma 422.
      required: [key, label, sampleValue]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        sampleValue: { type: string, maxLength: 200 }

    EmailTemplateSummary:
      type: object
      description: "Liste yanıtı — `blocks`/`bodyHtml`/`variables` DÖNMEZ."
      required: [id, name, purpose, editorMode, isSystem, isActive, subject, updatedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          nullable: true
          description: "Yalnızca `isSystem=true` satırlarda dolu (seed idempotency'si); kullanıcı şablonlarında `null`."
          example: WELCOME
        name: { type: string }
        purpose: { $ref: "#/components/schemas/EmailTemplatePurpose" }
        editorMode: { $ref: "#/components/schemas/EmailTemplateEditorMode" }
        isSystem: { type: boolean }
        isActive: { type: boolean }
        subject: { type: string }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    EmailTemplate:
      allOf:
        - $ref: "#/components/schemas/EmailTemplateSummary"
        - type: object
          required: [bodyHtml, blocks, availableVariables, customVariables, variables]
          properties:
            bodyHtml:
              type: string
              description: "Yalnızca `editorMode=RAW` için anlamlı. `BLOCKS` modunda her zaman boş string — render ÖNBELLEKLENMEZ (§10.16.2)."
            blocks:
              type: array
              items: { $ref: "#/components/schemas/EmailBlock" }
            availableVariables:
              type: array
              items: { type: string }
              description: >
                §10.3'ten devralındı, salt bilgi amaçlı. **İstemciden ARTIK KABUL
                EDİLMEZ** — her yazmada registry'den türetilip yazılır.
            customVariables:
              type: array
              items: { $ref: "#/components/schemas/EmailCustomVariable" }
            variables:
              type: array
              items: { $ref: "#/components/schemas/EmailVariableDefinition" }
              description: >
                HESAPLANMIŞ alan (DB'de tutulmaz): sistem registry'si (amaca göre) +
                global (`site_name`, `site_url`) + `customVariables` +
                (`CONTACT_FORM_NOTIFICATION` ise) iletişim formu alanları.
                Değişken panelinin TEK veri kaynağıdır.

    CreateEmailTemplateRequest:
      type: object
      required: [name, purpose]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        purpose: { $ref: "#/components/schemas/EmailTemplatePurpose" }
        subject: { type: string, minLength: 1, maxLength: 200 }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/EmailBlock" }
          description: "Verilmezse sunucu amaca uygun bir başlangıç blok seti üretir."

    UpdateEmailTemplateRequest:
      type: object
      description: >
        `bodyHtml` YALNIZCA `editorMode=RAW`, `blocks` YALNIZCA `BLOCKS` şablonda kabul
        edilir (yanlış moda gönderim → 422). `purpose`/`editorMode`/`key`/`isSystem`/
        `availableVariables` bu uçtan DEĞİŞTİRİLEMEZ.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        bodyHtml: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/EmailBlock" }
        customVariables:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/EmailCustomVariable" }
        isActive:
          type: boolean
          description: >
            YALNIZCA `purpose=CUSTOM` şablonlarda kabul edilir — aksi halde 422
            (`error.details.isActive`). `purpose != CUSTOM` şablonlarda aktiflik
            YALNIZCA `POST .../activate` ile değişir (§10.16.3 teklik kuralı,
            transaction + kısmi unique index). CUSTOM'da teklik kuralı yoktur, bu
            yüzden burada doğrudan değiştirilebilir — bu alan olmadan bir CUSTOM
            şablon bir kez aktif edildikten sonra deaktif/silinemez hale gelirdi.

    PreviewEmailTemplateRequest:
      type: object
      description: >
        DURUMSUZ taslak önizleme gövdesi — kaydedilmemiş editör durumunu taşır.
        `sampleValues` verilmeyen değişkenler için registry'deki `sampleValue` kullanılır
        (kullanıcı "örnek verilerle dolu" önizlemeyi hiçbir şey girmeden görür).
      required: [purpose, editorMode, subject]
      properties:
        purpose: { $ref: "#/components/schemas/EmailTemplatePurpose" }
        editorMode: { $ref: "#/components/schemas/EmailTemplateEditorMode" }
        subject: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/EmailBlock" }
        bodyHtml: { type: string }
        customVariables:
          type: array
          items: { $ref: "#/components/schemas/EmailCustomVariable" }
        sampleValues:
          type: object
          additionalProperties: { type: string }

    PreviewEmailTemplateResponse:
      type: object
      properties:
        renderedSubject: { type: string }
        renderedHtml:
          type: string
          description: >
            Satır-içi stilli, tablo tabanlı e-posta HTML'i. `sanitizeRichHtml`'den
            GEÇMEZ (geçemez — `style` allow-list dışıdır). İstemci bunu
            `dangerouslySetInnerHTML` ile BASMAZ, `<iframe sandbox="" srcDoc>` içinde
            gösterir (§10.16.11).


            Çıktının SONUNDA, kullanıcının `footer` bloğundan BAĞIMSIZ olarak zorunlu
            KVKK footer'ı bulunur: site adı + yayınlanan `Page.isLegalDocument`
            sayfalarının bağlantıları. Kullanıcı bunu silemez/kapatamaz (§10.16.4).

    TestSendEmailTemplateRequest:
      type: object
      description: >
        **`to` alanı YOKTUR ve KABUL EDİLMEZ** — alıcı her zaman `request.user.email`.
        Bilinçli güvenlik kararı (§10.16.6): keyfi HTML'i keyfi adrese gönderen bir uç,
        ADMIN arkasında bile spam-relay/phishing vektörüdür.
      properties:
        sampleValues:
          type: object
          additionalProperties: { type: string }

    TestSendEmailTemplateResponse:
      type: object
      required: [sentTo, messageId]
      properties:
        sentTo: { type: string, format: email, description: "Her zaman isteği yapan kullanıcının adresi." }
        messageId: { type: string }
        previewUrl:
          type: string
          nullable: true
          description: "Yalnızca dev ortamında (Ethereal test hesabı) dolu — bkz. lib/mail.ts."

    # ---- §10.16 İletişim Formu ----

    ContactFieldType:
      type: string
      enum: [TEXT, EMAIL, PHONE, TEXTAREA, SELECT, CHECKBOX]

    ContactSubmissionStatus:
      type: string
      enum: [NEW, READ, ARCHIVED, SPAM]

    ContactFormField:
      type: object
      required: [id, order, key, label, type, required, options, isSystem]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, description: "Dizideki indeks — `PUT` gövdesinden türetilir." }
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: "E-posta şablonunda `{{key}}` değişkeni olarak OTOMATİK görünür (§10.16.5)."
        label: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: "#/components/schemas/ContactFieldType" }
        required: { type: boolean }
        placeholder: { type: string, nullable: true }
        helpText: { type: string, nullable: true }
        options:
          type: array
          description: "Yalnızca `type=SELECT` için; diğer tiplerde boş dizi."
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        maxLength: { type: integer, nullable: true }
        isSystem:
          type: boolean
          description: >
            `name`/`email`/`message` — SİLİNEMEZ, `key`/`type` DEĞİŞTİRİLEMEZ
            (label/sıra/placeholder serbest).

    ContactForm:
      type: object
      required: [id, title, submitLabel, successMessage, isEnabled, consentRequired, retentionDays, fields]
      properties:
        id: { type: string, example: singleton }
        title: { type: string }
        description: { type: string, nullable: true }
        submitLabel: { type: string }
        successMessage: { type: string }
        isEnabled: { type: boolean, description: "`false` iken public `GET /contact/form` ve `POST /contact/submissions` 404 döner." }
        notifyEmail:
          type: string
          format: email
          nullable: true
          description: "`null` ise bildirim GÖNDERİLMEZ — gönderim yine de kaydedilir."
        notificationTemplateId:
          type: string
          format: uuid
          nullable: true
          description: "`null` ise `purpose=CONTACT_FORM_NOTIFICATION` olan AKTİF şablona düşülür."
        consentRequired: { type: boolean }
        consentText: { type: string }
        consentLegalPageId:
          type: string
          format: uuid
          nullable: true
          description: >
            Onay metnindeki "Aydınlatma Metni" bağlantısının hedefi — `isLegalDocument=true`
            olan bir `Page`. Sayfa silinirse `SetNull`.
        retentionDays:
          type: integer
          minimum: 0
          description: >
            Gönderimlerin saklama süresi (gün, varsayılan 180). `0` = süresiz —
            compliance-agent onayı gerektiren özel durum. PII (`ipAddress`/`userAgent`)
            bundan BAĞIMSIZ olarak 30 günde redakte edilir (§10.16.10).
        fields:
          type: array
          items: { $ref: "#/components/schemas/ContactFormField" }
        updatedAt: { type: string, format: date-time }

    UpdateContactFormRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        submitLabel: { type: string, minLength: 1, maxLength: 60 }
        successMessage: { type: string, minLength: 1, maxLength: 500 }
        isEnabled: { type: boolean }
        notifyEmail: { type: string, format: email, nullable: true }
        notificationTemplateId: { type: string, format: uuid, nullable: true }
        consentRequired: { type: boolean }
        consentText: { type: string, maxLength: 2000 }
        consentLegalPageId: { type: string, format: uuid, nullable: true }
        retentionDays: { type: integer, minimum: 0, maximum: 3650 }

    ReplaceContactFormFieldsRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 30
          items:
            type: object
            required: [key, label, type]
            properties:
              key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
              label: { type: string, minLength: 1, maxLength: 120 }
              type: { $ref: "#/components/schemas/ContactFieldType" }
              required: { type: boolean, default: false }
              placeholder: { type: string, nullable: true }
              helpText: { type: string, nullable: true }
              maxLength: { type: integer, nullable: true, minimum: 1, maximum: 10000 }
              options:
                type: array
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value: { type: string }
                    label: { type: string }

    ContactSubmissionSummary:
      type: object
      description: "Liste yanıtı — `data`/`consentTextSnapshot`/`userAgent` DÖNMEZ."
      required: [id, name, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, description: "Admin listesinde MASKELENMEZ (iş gereği — admin cevap yazacak)." }
        status: { $ref: "#/components/schemas/ContactSubmissionStatus" }
        notifiedAt: { type: string, format: date-time, nullable: true }
        notificationError:
          type: string
          nullable: true
          description: "Dolu ise bildirim e-postası GİTMEDİ — arayüz bunu görünür bir uyarı olarak gösterir."
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ContactSubmission:
      allOf:
        - $ref: "#/components/schemas/ContactSubmissionSummary"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: { type: string }
              description: >
                Gönderim ANINDAKİ tüm alanların key→value anlık görüntüsü. Alan sonradan
                silinse bile veri KORUNUR (bu yüzden FK değil snapshot).
            consentAt: { type: string, format: date-time, nullable: true }
            consentTextSnapshot:
              type: string
              nullable: true
              description: "Gönderim anında gösterilen onay metninin birebir kopyası (KVKK ispat yükümlülüğü)."
            ipAddress: { type: string, nullable: true, description: "30 gün sonra `null`'lanır (§10.16.10)." }
            userAgent: { type: string, nullable: true, description: "30 gün sonra `null`'lanır." }
            piiRedactedAt: { type: string, format: date-time, nullable: true }

    UpdateContactSubmissionRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ContactSubmissionStatus" }

    PublicContactForm:
      type: object
      description: >
        Public form tanımı. `notifyEmail`, `notificationTemplateId` ve `retentionDays`
        BİLİNÇLİ OLARAK DIŞARIDA BIRAKILIR — iç yapılandırma ziyaretçiye sızdırılmaz.
      required: [title, submitLabel, consentRequired, fields]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        submitLabel: { type: string }
        consentRequired: { type: boolean }
        consentText: { type: string }
        consentLegalPage:
          type: object
          nullable: true
          description: "Onay metnindeki hukuki belge bağlantısı — yayında değilse `null`."
          properties:
            title: { type: string }
            slug: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ContactFormField" }

    CreateContactSubmissionRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: { type: string }
          description: >
            Alan `key` → değer. TANIMSIZ anahtarlar SESSİZCE ATILIR (kayda girmez) —
            kötü niyetli bir istemci `data`'yı şişiremesin. Serileştirilmiş boyut ≤ 32 KB.
        consent:
          type: boolean
          description: "`consentRequired=true` ise ZORUNLU ve `true` olmalı, aksi halde 422."
        website:
          type: string
          description: >
            **Honeypot** — CSS ile gizli, `tabindex=-1`, `autocomplete=off`. Dolu gelirse
            yanıt yine **201 (sahte başarı)** olur, kayıt `status: SPAM` yazılır ve
            e-posta GÖNDERİLMEZ. Bota "başarısız oldum" sinyali verilmez.

    CreateContactSubmissionResponse:
      type: object
      required: [id, message]
      properties:
        id: { type: string, format: uuid }
        message: { type: string, description: "`ContactForm.successMessage`." }

    # ---- §10.8 Toplu İçe Aktarma (Import) ----

    ImportJobType:
      type: string
      description: >
        İçe aktarmanın HEDEFİ (dosya formatı değil — o `ImportSourceFormat`'tır).
        `WORDPRESS` tek bir WXR dosyasından hem `Page` hem `BlogPost` hem `BlogCategory`
        üretebilir; diğerleri tek hedeflidir.


        **`PRODUCTS` (WooCommerce) — neden `WORDPRESS`'ten AYRI bir tip (mimar kararı
        2A):** İkisi de AYNI WXR/XML formatını okur; fark, `wp:post_type` filtresidir —
        `WORDPRESS` `post`/`page`/`attachment`'ı işler, `PRODUCTS` yalnızca `product`'ı.
        Aynı dosya her iki tiple de yüklenebilir ve farklı sonuç verir. `WORDPRESS`'e
        sessizce "bir de ürün varsa onu da içe aktar" davranışı EKLENMEMİŞTİR: bugün
        WooCommerce'li bir WXR'ı `WORDPRESS` olarak yükleyen bir kullanıcı yalnızca
        sayfa/yazı bekler; o akışa ürün yazmak **sessiz bir yan etki** (silent side
        effect) olurdu — üstelik `Products` modülü kapalıyken bile kayıt üretirdi.
        Ayrı tip; ayrı önizleme, ayrı sayaç, ayrı onay, ayrı `AuditLog` demektir.
        `WORDPRESS` tipinde bulunan `product` item'ları ATLANIR ve önizlemede
        `WP_PRODUCTS_SKIPPED` uyarısıyla kullanıcı doğru tipe yönlendirilir.


        `PRODUCTS` yalnızca `Product` (+ `ProductCategory` upsert) üretir; WooCommerce
        siparişleri/müşterileri (`shop_order`, `shop_coupon`, `customer`) **ASLA** içe
        aktarılmaz (`WC_ORDERS_IGNORED` — PII ve ödeme verisi kapsam dışıdır). Portföy
        içe aktarımı v1 KAPSAM DIŞIDIR (karar 2B — WordPress tarafında karşılığı olan
        standart bir post-type yoktur; her tema kendi CPT'sini uydurur).
      enum: [PAGES, BLOG, WORDPRESS, PRODUCTS, USERS, MEDIA]

    ImportSourceFormat:
      type: string
      description: >
        Sunucunun dosya İÇERİĞİNDEN türettiği format (istemci GÖNDERMEZ, gönderse de
        yok sayılır). Geçerlilik matrisi: PAGES,BLOG → CSV|JSON · WORDPRESS → XML ·
        **PRODUCTS → XML** · USERS → CSV · MEDIA → ZIP.


        `PRODUCTS` bilinçli olarak yalnızca XML (WooCommerce WXR) kabul eder; ürün
        CSV/JSON içe aktarımı ayrı bir alan-eşleme problemidir (varyasyon, öznitelik,
        çoklu para birimi) ve bu fazın KAPSAMI DIŞINDADIR.
      enum: [CSV, JSON, XML, ZIP]

    ImportJobStatus:
      type: string
      description: >
        - `PENDING` — dosya yüklendi ve ayrıştırıldı, önizleme hazır, KULLANICI ONAYI
        bekleniyor. Hiçbir kayıt YAZILMAMIŞTIR. 24 saat onaylanmazsa iş ve kaynak dosya
        otomatik temizlenir (tembel süpürme: her yeni yüklemede çalışır, cron YOK).

        - `QUEUED` — onaylandı, süreç-içi kuyrukta sırasını bekliyor (aynı anda tek iş).

        - `PROCESSING` — işleniyor; sayaçlar 25 kayıtta bir güncellenir.

        - `COMPLETED` — bitti. `errorCount > 0` OLABİLİR — kısmi başarı bir hata DEĞİLDİR
        (`POST /admin/pages/bulk` ile aynı felsefe).

        - `FAILED` — hiç kayıt yazılamadan çöktü (bozuk dosya, DB hatası) VEYA sunucu
        işlem sırasında yeniden başladı (bkz. `errorSummary`).

        - `CANCELLED` — kullanıcı iptal etti; o ana kadar yazılanlar KALIR.
      enum: [PENDING, QUEUED, PROCESSING, COMPLETED, FAILED, CANCELLED]

    ImportDuplicateStrategy:
      type: string
      description: >
        Var olan bir kayıtla çakışma bulunduğunda ne yapılacağı. Eşleştirme anahtarı:
        `PAGES`/`BLOG`/`WORDPRESS` → `slug` · **`PRODUCTS` → `sku` (varsa), `sku` boşsa
        `slug`** · `USERS` → `email` · `MEDIA` → `Media.filename`.


        **`PRODUCTS`'ta neden `sku` önceliklidir:** SKU bir mağazanın stok kimliğidir;
        aynı ürünün adı/slug'ı değişebilir ama SKU sabittir. Slug'a bakıp SKU'yu yok
        saymak, ikinci içe aktarımda AYNI ürünü ikinci kez yaratır ve `Product.sku`
        unique kısıtı yüzünden satırı hataya düşürürdü.


        - `skip` (VARSAYILAN) — mevcut kayıt korunur, satır `skippedCount`'a yazılır.

        - `overwrite` — mevcut kayıt güncellenir. Page/BlogPost/Product'ta bu, normal
        `PATCH` gibi ÖNCE bir `ContentRevision` snapshot'ı yazar (§10.1) — geri dönüş
        mümkün kalsın diye. ÇÖPTEKİ (`deletedAt != null`) kayıt ASLA overwrite edilmez,
        atlanır (`TARGET_TRASHED`).

        - `createNew` — slug'a `-2`, `-3` … eklenerek yeni kayıt açılır. `USERS` ve
        `MEDIA` için GEÇERSİZDİR.


        **`PRODUCTS` + `createNew` + SKU çakışması → SATIR ATLANIR (karar 2E).**
        `createNew`, `PRODUCTS` tipinde de seçilebilir ve slug çakışmalarını normal
        şekilde `-2`/`-3` ile çözer; ANCAK çakışma `sku` üzerindeyse satır YAZILMAZ,
        `DUPLICATE_SKIPPED` (`severity: skipped`) ile `skippedCount`'a düşer. Gerekçe:
        `Product.sku` DB seviyesinde uniquedir — slug gibi "sonuna sayı ekleyip yeni
        kayıt aç" davranışı SKU için ANLAMSIZDIR (`ABC-1` ile `ABC-1-2` iki ayrı stok
        kalemi demektir ve mağazanın envanterini sessizce bozar). Tercih edilen davranış
        "uydurulmuş SKU ile yanlış kayıt" değil, "atla ve raporla"dır. Bu, `createNew`'i
        `PRODUCTS` için 422 ile YASAKLAMAKTAN da farklıdır: SKU'suz ürünler (`sku: null`)
        `createNew` ile sorunsuz çoğaltılabilir.


        **`USERS` için yalnızca `skip` kabul edilir; `overwrite`/`createNew` → 422.**
        Gerekçe: CSV ile mevcut bir kullanıcının rolünü değiştirebilmek doğrudan bir
        yetki yükseltme (privilege escalation) vektörüdür — rol değişikliği tek yolla,
        `PATCH /admin/users/{userId}/role` ile yapılır.
      enum: [skip, overwrite, createNew]

    CreateImportJobRequest:
      description: "`multipart/form-data` gövdesi — `POST /admin/import/jobs`."
      type: object
      required: [file, type]
      properties:
        file:
          type: string
          format: binary
          description: "Tek dosya. Boyut limitleri uç açıklamasındadır."
        type: { $ref: "#/components/schemas/ImportJobType" }

    ImportFieldMapping:
      description: >
        CSV/JSON içe aktarımında **kaynak alan adı → hedef şema alanı** eşlemesi
        (`{ "Baslik": "title", "Icerik": "contentHtml" }`). Anahtar = dosyadaki sütun/
        özellik adı, değer = hedef alan adı (`ImportJobPreview.targetFields` içindeki
        değerlerden biri) ya da `null` (bu sütunu YOK SAY).


        `WORDPRESS`, `PRODUCTS` ve `MEDIA` için ANLAMSIZDIR ve yok sayılır — WXR
        eşleştirmesi sabit ve kurallıdır (bkz. ARCHITECTURE.md §10.8.6 WordPress ve
        §10.8.9 WooCommerce eşleştirme tabloları).
      type: object
      additionalProperties:
        type: string
        nullable: true

    ImportPreviewField:
      description: "Önizleme ekranındaki 'hangi alan eşleşti / eşleşmedi' satırı."
      type: object
      required: [sourceField, targetField, status]
      properties:
        sourceField:
          type: string
          description: "Dosyadaki sütun/özellik adı (CSV başlığı, JSON anahtarı, WXR eleman adı)."
        targetField:
          type: string
          nullable: true
          description: "Otomatik eşleşen hedef şema alanı; eşleşmediyse `null`."
        status:
          type: string
          description: >
            - `matched` — otomatik eşleşti (birebir ad veya bilinen eş anlamlı).

            - `unmatched` — hedefi bulunamadı; kullanıcı `fieldMapping` ile atayabilir,
            atamazsa bu sütun YOK SAYILIR (hata değildir).

            - `ignored` — bizim şemamızda karşılığı OLMADIĞI bilinen alan (ör. WordPress
            `post_tag`, `wp:comment`); UI bunu bilgi olarak gösterir.

            - `missingRequired` — ZORUNLU hedef alan (`title`; `USERS` için `email`)
            dosyada bulunamadı → iş başlatılamaz, `preview.canStart: false`.
          enum: [matched, unmatched, ignored, missingRequired]

    ImportJobPreview:
      description: >
        `POST /admin/import/jobs` sonrası dönen, ONAY EKRANINI besleyen özet. Yalnızca
        okuma amaçlıdır; hiçbir kayıt yazılmamıştır.
      type: object
      required: [totalCount, canStart, fields, targetFields, suggestedMapping, samples, warnings]
      properties:
        totalCount:
          type: integer
          description: "Dosyada bulunan İŞLENEBİLİR kayıt sayısı (atlanacağı şimdiden bilinenler hariç)."
        canStart:
          type: boolean
          description: >
            `false` ise `POST .../start` 422 döner (ör. zorunlu alan eşleşmedi, kayıt yok).
            UI onay butonunu bu alana göre pasifleştirir.
        fields:
          type: array
          items: { $ref: "#/components/schemas/ImportPreviewField" }
        targetFields:
          type: array
          description: >
            Bu `type` için atanabilecek hedef şema alanlarının listesi — eşleştirme
            dropdown'ını besler. Ör. `BLOG` → [title, slug, excerpt, contentHtml,
            coverImageUrl, status, categoryName, seoTitle, seoDescription, ogTitle,
            ogImageUrl, canonicalUrl, noIndex, publishedAt, authorEmail].
          items: { type: string }
        suggestedMapping:
          allOf:
            - $ref: "#/components/schemas/ImportFieldMapping"
          description: "Otomatik eşleşmenin sonucu — `StartImportJobRequest.fieldMapping` gönderilmezse bu kullanılır."
        samples:
          type: array
          description: "Dosyanın İLK 5 kaydı, eşleştirme uygulanmış hâliyle (kullanıcı gözle doğrulasın diye)."
          maxItems: 5
          items: { type: object, additionalProperties: true }
        breakdown:
          type: object
          description: >
            Yalnızca XML (WXR) tabanlı tipler — `WORDPRESS` ve `PRODUCTS` — için:
            `wp:post_type` kırılımı. Frontend "12 sayfa, 340 yazı, 87 medya bağlantısı,
            5 kategori bulundu" (veya `PRODUCTS`'ta "214 ürün bulundu") özetini bundan
            üretir. Her iki tipte de AYNI şema döner; ilgisiz alanlar `0`'dır — `type`
            neyi YAZACAĞINI belirler, `breakdown` dosyada NE OLDUĞUNU anlatır. Bu sayede
            `WORDPRESS` yüklemesinde `products > 0` görülürse kullanıcı `PRODUCTS` tipine
            yönlendirilebilir (`WP_PRODUCTS_SKIPPED`) ve tersi de geçerlidir.
          properties:
            pages: { type: integer }
            posts: { type: integer }
            attachments: { type: integer }
            categories: { type: integer }
            products:
              type: integer
              description: >
                `wp:post_type: product` sayısı (WooCommerce). `PRODUCTS` tipinde
                işlenecek kayıt sayısıdır; `WORDPRESS` tipinde bilgi amaçlıdır ve bu
                item'lar ATLANIR (`skipped`'a da sayılır). Ürün VARYASYONLARI
                (`product_variation`) buraya DAHİL DEĞİLDİR — desteklenmez, `skipped`'a
                yazılır ve `WC_VARIATIONS_UNSUPPORTED` uyarısı üretilir.
            skipped:
              type: integer
              description: "Desteklenmeyen `wp:post_type` (nav_menu_item, revision, custom_css, wp_block, product_variation, shop_order …) + `wp:status: trash|inherit`."
        warnings:
          type: array
          description: >
            İşi ENGELLEMEYEN ama kullanıcıya onaydan ÖNCE gösterilmesi ZORUNLU uyarılar.
            Kararlı kod + Türkçe metin (`SeoScoreIssue` ile aynı desen).
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                description: >
                  `WC_*` ön ekli kodlar YALNIZCA `PRODUCTS` (WooCommerce) tipinde,
                  `WP_PRODUCTS_SKIPPED` ise yalnızca `WORDPRESS` tipinde üretilir
                  (bkz. ARCHITECTURE.md §10.8.9):

                  - `WP_PRODUCTS_SKIPPED` — dosyada `wp:post_type: product` item'ları
                  var ama tip `WORDPRESS`; bunlar ATLANIYOR. Mesaj kullanıcıyı aynı
                  dosyayı `PRODUCTS` tipiyle yeniden yüklemeye yönlendirir.

                  - `WC_TAX_NOT_IMPORTED` — WooCommerce vergi SINIFI (`_tax_class`,
                  `_tax_status`) taşır, oran değil; oranlar mağaza ayarındadır ve
                  export'ta YOKTUR → `Product.taxRatePercent` `null` bırakılır.

                  - `WC_STOCK_NOT_MANAGED` — `_manage_stock: no` olan ürünlerde
                  `_stock` yoktur; `stockQuantity` `_stock_status`'a göre 0/1'e
                  düşürülür (bkz. §10.8.9 eşleme tablosu).

                  - `WC_VARIATIONS_UNSUPPORTED` — `product_variation` item'ları ve
                  `variable` tipli ürünlerin varyantları desteklenmez; yalnızca ANA
                  ürün yazılır, varyasyonlar `skippedCount`'a düşer.

                  - `WC_GALLERY_NOT_IMPORTED` — `_product_image_gallery`/
                  `_thumbnail_id` kaynak sitedeki attachment'lara işaret eder;
                  `WP_MEDIA_NOT_DOWNLOADED` ile AYNI SSRF gerekçesiyle dosya
                  İNDİRİLMEZ, `ProductImage` satırı OLUŞTURULMAZ (§10.8.9).

                  - `WC_ORDERS_IGNORED` — dosyada `shop_order`/`shop_coupon`/`customer`
                  item'ları var; bunlar KİŞİSEL VERİ ve ödeme verisidir, hiçbir tipte
                  içe aktarılmaz.

                  - `UNKNOWN_LOCALE` — dosyadaki `locale` sütunu (veya WXR
                  `<language>` elemanı) `Locale` tablosunda KAYITLI OLMAYAN bir dil
                  kodu içeriyor. İlgili satırlar **varsayılan dile** aktarılır (iş
                  DURDURULMAZ). Mesaj, tanınmayan kodların KÜMESİNİ ve etkilenen satır
                  sayısını içerir — satır başına ayrı kayıt ÜRETİLMEZ (bkz.
                  `.claude/architect-scope-i18n.md` §8.1). Kullanıcı, dili önce
                  `/admin/locales`'ten ekleyip içe aktarmayı tekrarlayabilir.
                enum:
                  - WP_MEDIA_NOT_DOWNLOADED
                  - WP_TAGS_UNSUPPORTED
                  - WP_AUTHOR_UNMATCHED
                  - WP_PRIVATE_AS_DRAFT
                  - WP_SCHEDULED_AS_DRAFT
                  - WP_PRODUCTS_SKIPPED
                  - WC_TAX_NOT_IMPORTED
                  - WC_STOCK_NOT_MANAGED
                  - WC_VARIATIONS_UNSUPPORTED
                  - WC_GALLERY_NOT_IMPORTED
                  - WC_ORDERS_IGNORED
                  - HTML_WILL_BE_SANITIZED
                  - SLUG_COLLISION
                  - MEDIA_SVG_REJECTED
                  - UNMAPPED_COLUMNS
                  - UNKNOWN_LOCALE
              message: { type: string, description: "Gösterime hazır Türkçe metin." }
              count: { type: integer, description: "Kaç kaydı etkiliyor (varsa)." }

    ImportJobSummary:
      description: >
        `GET /admin/import/jobs` liste görünümü — `ImportJob`'ın `preview` alanı
        ÇIKARILMIŞ hâli (liste yanıtını şişirmemek için).
      type: object
      required: [id, type, format, status, filename, sizeBytes, totalCount, processedCount, successCount, errorCount, skippedCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ImportJobType" }
        format: { $ref: "#/components/schemas/ImportSourceFormat" }
        status: { $ref: "#/components/schemas/ImportJobStatus" }
        duplicateStrategy:
          allOf:
            - $ref: "#/components/schemas/ImportDuplicateStrategy"
          nullable: true
          description: "`PENDING` işlerde `null` (henüz seçilmedi)."
        filename:
          type: string
          description: >
            Kullanıcının yüklediği ORİJİNAL dosya adı — yalnızca GÖSTERİM içindir.
            Diskteki ad ilişkisizdir (rastgele UUID) ve API'de HİÇBİR ZAMAN dönmez.
        sizeBytes: { type: integer }
        totalCount: { type: integer, description: "Dosyadaki işlenebilir kayıt sayısı (`preview.totalCount` ile aynı)." }
        processedCount: { type: integer, description: "İşlenmiş kayıt = success + error + skipped. İlerleme çubuğu: processedCount / totalCount." }
        successCount: { type: integer }
        errorCount: { type: integer }
        skippedCount: { type: integer, description: "Çakışma nedeniyle (strateji `skip`) veya desteklenmeyen tür nedeniyle atlananlar." }
        errorSummary:
          type: string
          nullable: true
          description: "İşin TAMAMINI başarısız kılan hata (`FAILED`) için tek satırlık Türkçe açıklama; satır-bazlı hatalar burada DEĞİL `GET .../errors`'tadır."
        createdById: { type: string, format: uuid, nullable: true }
        createdBy:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    ImportJob:
      description: "Tekil iş DTO'su — `ImportJobSummary` + `preview`."
      allOf:
        - $ref: "#/components/schemas/ImportJobSummary"
        - type: object
          properties:
            preview:
              allOf:
                - $ref: "#/components/schemas/ImportJobPreview"
              nullable: true
              description: "İş sonlandıktan sonra da korunur (rapor ekranı geçmişte de açılabilsin diye)."

    StartImportJobRequest:
      description: "Onay ekranının seçimleri. Gövde HİÇ gönderilmezse tüm varsayılanlar uygulanır."
      type: object
      properties:
        fieldMapping:
          allOf:
            - $ref: "#/components/schemas/ImportFieldMapping"
          description: "Verilmezse `preview.suggestedMapping` kullanılır. `WORDPRESS`/`PRODUCTS`/`MEDIA`'da yok sayılır."
        duplicateStrategy:
          allOf:
            - $ref: "#/components/schemas/ImportDuplicateStrategy"
          description: "Varsayılan `skip`."
        defaultStatus:
          type: string
          enum: [DRAFT, PUBLISHED]
          description: >
            `PAGES`/`BLOG` içe aktarımında kaynakta `status` alanı YOKSA/BOŞSA uygulanacak
            varsayılan. **Varsayılanın varsayılanı `DRAFT`'tır** — içe aktarılan içerik
            gözden geçirilmeden public siteye düşmesin. `WORDPRESS`'te yok sayılır
            (orada `wp:status` bağlayıcıdır).


            **`PRODUCTS`'ta anlamı GENİŞTİR (karar 2C):** `WORDPRESS`'in aksine yok
            SAYILMAZ ve yalnızca "boş durum" için değil, **TÜM ürünler için** uygulanır —
            WooCommerce'te `wp:status: publish` olan bir ürün dahi bizde varsayılan olarak
            `DRAFT` açılır. Gerekçe: bir ürünün yayına girmesi, bir yazının yayına
            girmesinden farklıdır — fiyat/KDV/stok/kargo doğrulanmadan public mağazaya
            düşen ürün doğrudan yanlış fiyatla SATIŞ demektir; ayrıca içe aktarım
            sırasında görseller kaynak siteye işaret eder (`WC_GALLERY_NOT_IMPORTED`).
            Operatör bilinçli olarak `PUBLISHED` gönderirse WooCommerce'teki `publish`
            durumundaki ürünler yayınlanır, `draft`/`pending`/`private` olanlar yine
            `DRAFT` kalır (durum YÜKSELTİLMEZ). `wp:status: trash` her koşulda ATLANIR.
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3
          default: TRY
          description: >
            YALNIZCA `PRODUCTS` için. WooCommerce WXR'ı para birimini **item düzeyinde
            TAŞIMAZ** (`_price` yalnızca sayıdır; para birimi mağaza ayarıdır ve export'a
            girmez) — bu yüzden `Product.currency` dosyadan TÜRETİLEMEZ ve operatörden
            alınır. Verilmezse `TRY`. ISO-4217 3 harfli kod, büyük harfe normalize edilir;
            tanınmayan kod → 422 (`error.details.defaultCurrency`). Diğer tiplerde yok
            sayılır.
        defaultAuthorId:
          type: string
          format: uuid
          nullable: true
          description: >
            Yazarı çözümlenemeyen kayıtlara atanacak kullanıcı. Verilmezse `null` kalır
            (UI "—" gösterir). **İçe aktarma HİÇBİR KOŞULDA kendiliğinden kullanıcı
            OLUŞTURMAZ** — `USERS` içe aktarımı bunun tek istisnası ve tek yoludur.
        defaultCategoryId:
          type: string
          format: uuid
          nullable: true
          description: "`BLOG` (CSV/JSON) için kategorisi çözümlenemeyen yazılara atanacak kategori. `WORDPRESS`'te kategoriler WXR'dan upsert edilir, bu alan yok sayılır."

    ImportJobErrorCode:
      type: string
      description: >
        Kararlı, makine-okunur satır hatası kodu — frontend gruplama/rozet mantığı ve
        qa testleri BU KODA bağlanır, `message` yalnızca gösterimdir (`SeoScoreIssueCode`
        ile aynı sözleşme).


        **Bu liste yalnızca GERÇEKTEN tetiklenen kodları içerir.** Yazar/kategori
        çözümlenemediğinde satır hatası ÜRETİLMEZ — kayıt `defaultAuthorId`/
        `defaultCategoryId`'ye, o da yoksa `null`'a sessizce düşer ve BAŞARILI sayılır
        (bkz. ARCHITECTURE.md §10.8.7). Başarılı bir satır için "uyarı" üretmek
        `successCount`/`errorCount` özetini yanıltıcı kılardı; hata modelinde bilinçli
        olarak `WARNING` severity YOKTUR. Operatörün kontrolü `StartImportJobRequest`
        içindeki default alanlarıdır; WXR'da ayrıca onay ÖNCESİ agregat uyarı gösterilir
        (`ImportJobPreview.warnings[].code = WP_AUTHOR_UNMATCHED`).
      enum:
        - REQUIRED_FIELD_MISSING
        - INVALID_VALUE
        - INVALID_EMAIL
        - INVALID_ROLE
        - INVALID_DATE
        - INVALID_URL
        - DUPLICATE_SKIPPED
        - TARGET_TRASHED
        - SLUG_CONFLICT
        - UNSUPPORTED_POST_TYPE
        - UNSUPPORTED_STATUS
        - UNSUPPORTED_MIME
        - FILE_TOO_LARGE
        - EMAIL_DELIVERY_FAILED
        - DB_ERROR

    ImportJobError:
      description: >
        Tek bir kaydın başarısız olma/atlanma nedeni. **Atlama (`skipped`) da burada
        raporlanır** — kullanıcı "3 kayıt neden atlandı?" sorusunu tek listeden yanıtlar;
        `severity` alanı ikisini ayırır.
      type: object
      required: [id, rowNumber, code, message, severity, createdAt]
      properties:
        id: { type: string, format: uuid }
        rowNumber:
          type: integer
          description: >
            KAYNAK DOSYADAKİ 1-tabanlı sıra. CSV'de başlık satırı HARİÇ (ilk veri satırı
            = 1). JSON'da dizi indeksi + 1. WXR'da `<item>` sırası. ZIP'te arşiv içindeki
            giriş sırası.
        code: { $ref: "#/components/schemas/ImportJobErrorCode" }
        message: { type: string, description: "Gösterime hazır Türkçe açıklama." }
        severity:
          type: string
          enum: [error, skipped]
          description: "`error` → `errorCount`'a, `skipped` → `skippedCount`'a sayılır."
        field:
          type: string
          nullable: true
          description: "Hataya yol açan hedef alan adı (varsa), ör. `email`, `slug`."
        sourceRef:
          type: string
          nullable: true
          description: "Kaynaktaki tanımlayıcı — WXR'da `wp:post_id`, ZIP'te arşiv içi dosya adı, CSV/JSON'da varsa `slug`/`email`."
        rawData:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Satırın ham hâli (yeniden deneme/düzeltme için). **8 KB'a kırpılır** ve
            KİŞİSEL VERİ İÇEREBİLİR → ADMIN-only olması yeterli değildir, saklama süresi
            compliance-agent kararına tabidir (bkz. ARCHITECTURE.md §10.8).
        createdAt: { type: string, format: date-time }

    ImportJobErrorListMeta:
      description: "`GET /admin/import/jobs/{jobId}/errors` yanıtının `meta` zarfı."
      type: object
      required: [truncated]
      properties:
        nextCursor: { type: string, nullable: true }
        truncated:
          type: boolean
          description: >
            `true` ise iş başına 1.000 satırlık saklama tavanı aşılmıştır ve hata
            satırlarının bir kısmı DB'ye YAZILMAMIŞTIR (`ImportJob.errorCount` yine de
            gerçek toplamı gösterir). UI bunu açıkça belirtir.

    # ---- §10.8.10 Analitik Rapor Dışa Aktarma (Export) ----

    ExportJobType:
      type: string
      description: >
        Dışa aktarılan rapor kaynağı — ilgili `/admin/stats/*` ucuyla BİREBİR eşleşir
        (`TOP_CONTENT` → `GET /admin/stats/top-content`, vb.).
      enum: [VIEWS, BREAKDOWN, SUMMARY, TOP_CONTENT, USERS, REVENUE]

    ExportFileFormat:
      type: string
      enum: [CSV, PDF]

    ExportJobStatus:
      type: string
      description: >
        `ImportJobStatus`'tan daha sadedir (`QUEUED`/`CANCELLED` YOKTUR) — export
        satır-satır işlenen bir toplu içe aktarma değil, tek seferlik rapor üretimidir.


        - `PENDING` — iş oluşturuldu, worker sırasını bekliyor.

        - `PROCESSING` — rapor üretiliyor.

        - `COMPLETED` — dosya hazır, `GET .../download` ile indirilebilir.

        - `FAILED` — hiç dosya üretilmeden başarısız oldu (bkz. `errorSummary`).
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    ExportFilters:
      type: object
      description: >
        Yalnızca ilgili `type` için anlamlıdır — diğer tiplerde gönderilse de worker
        tarafından YOK SAYILIR.
      properties:
        role:
          type: string
          enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER]
          description: "Yalnızca `type: USERS` için."
        subscriptionStatus:
          type: string
          enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE]
          description: "Yalnızca `type: REVENUE` için."

    CreateExportJobRequest:
      type: object
      required: [type, format, from, to]
      properties:
        type: { $ref: "#/components/schemas/ExportJobType" }
        format: { $ref: "#/components/schemas/ExportFileFormat" }
        from: { type: string, format: date-time, description: "ISO-8601 (UTC). `to` ile BİRLİKTE zorunludur." }
        to:
          type: string
          format: date-time
          description: "ISO-8601 (UTC). Aralık en fazla 366 gün olabilir ve `from` <= `to` olmalıdır — aşımı 422, iş OLUŞTURULMAZ."
        granularity:
          allOf:
            - $ref: "#/components/schemas/Granularity"
          description: "Varsayılan `day`. `type: TOP_CONTENT`/`VIEWS`/`BREAKDOWN` raporlarında worker tarafında yok sayılabilir (ilgili `/admin/stats/*` ucunun granularity kullanımıyla TUTARLI)."
        filters:
          allOf:
            - $ref: "#/components/schemas/ExportFilters"
          description: "Varsayılan `{}`."
        unmaskPii:
          type: boolean
          default: false
          description: >
            `true` verilirse `USERS`/`REVENUE` raporlarındaki PII alanları (ör. e-posta)
            MASKELENMEDEN dönülür. AYRI bir onay akışı YOKTUR (zaten ADMIN-only bir uç)
            ama `reports.export.unmasked_pii` audit kaydı yazılır, `ExportJob.containsPii`
            `true` set edilir ve dosyanın saklama süresi 7 günden 48 saate DÜŞER
            (compliance-agent kararı, bkz. ARCHITECTURE.md §10.8.10).

    ExportJob:
      type: object
      required: [id, type, format, status, filters, containsPii, errorSummary, createdById, expiresAt, startedAt, finishedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ExportJobType" }
        format: { $ref: "#/components/schemas/ExportFileFormat" }
        status: { $ref: "#/components/schemas/ExportJobStatus" }
        filters:
          type: object
          additionalProperties: true
          description: "İstek parametrelerinin tamamı (`from`/`to`/`granularity`/`filters`/`unmaskPii`) — bkz. `CreateExportJobRequest`."
        containsPii:
          type: boolean
          description: >
            `USERS`/`REVENUE` gibi kişisel veri içerebilecek türlerde `true` (maskeli
            export'larda DA `true`dur — maskeleme durumunu YANSITMAZ; ham/maskelenmemiş
            erişim yalnızca `reports.export.unmasked_pii` audit kaydıyla izlenir).
        errorSummary: { type: string, nullable: true }
        createdById: { type: string, format: uuid, nullable: true }
        createdBy:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: "İndirme linkinin/dosyanın süre sonu — bu süreden sonra `GET .../download` 404 döner."
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # NOT: `storagePath` (gizli depodaki dosya referansı) BİLEREK burada YOK — API'de
        # ASLA dönmez, dosya yalnızca `GET .../download` üzerinden akıtılır.

    ExportJobListMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

    # ---- §10.9 Eklenti/Modül Yönetimi ----

    SiteTemplate:
      description: >
        §10.9.5 Site Şablonu — bkz. `SiteSettings.siteTemplate` ve
        `SiteModule.recommendedFor`. **SADECE tavsiye niteliğindedir**, hiçbir modülü
        otomatik açmaz/kapatmaz (bkz. ARCHITECTURE.md §10.9.5). `SHOWCASE` = Tanıtım
        Sitesi (varsayılan, özel bir modül önerisi YOK), `COMMERCE` = Satış Sitesi
        (`products` modülü önerilir), `PORTFOLIO` = Portföy Sitesi (`portfolio` modülü
        önerilir).
      type: string
      enum: [SHOWCASE, COMMERCE, PORTFOLIO]

    SiteSettings:
      description: "`/settings` ve `/admin/settings` uçlarında dönen tekil (singleton) site ayarları DTO'su."
      type: object
      properties:
        siteName:
          type: string
          description: "Boş string (`\"\"`) de geçerlidir — zorunlu bir alan DEĞİLDİR (bkz. UpdateSiteSettingsRequest.siteName notu)."
        logoUrl: { type: string, nullable: true }
        tagline: { type: string, nullable: true, description: "Site sloganı/açıklaması (WordPress \"Site Identity\" > Tagline benzeri), en fazla 160 karakter." }
        headerLogoHeight: { type: integer, nullable: true, minimum: 16, maximum: 96, description: "Header logo render yüksekliği (px) — null ise frontend varsayılanı 32 kullanır." }
        headerLogoMaxWidth: { type: integer, nullable: true, minimum: 40, maximum: 400, description: "Header logo maks. genişliği (px) — null ise genişlik tavanı yok (sınırsız)." }
        homePageId: { type: string, format: uuid, nullable: true }
        siteTemplate: { $ref: "#/components/schemas/SiteTemplate" }

    UpdateSiteSettingsRequest:
      description: "`PATCH /admin/settings` gövdesi — tüm alanlar opsiyoneldir, satır yoksa `DEFAULTS` ile birlikte oluşturulur (upsert)."
      type: object
      properties:
        siteName:
          type: string
          maxLength: 200
          description: "**`minLength` KASITLI olarak YOK** — boş string gönderilebilir (kullanıcı site adını temizleyebilir), doğrulama hatası fırlatmaz."
        logoUrl: { type: string, nullable: true }
        tagline: { type: string, nullable: true, maxLength: 160 }
        headerLogoHeight: { type: integer, nullable: true, minimum: 16, maximum: 96, description: "Header logo render yüksekliği (px) — null ise frontend varsayılanı 32 kullanır." }
        headerLogoMaxWidth: { type: integer, nullable: true, minimum: 40, maximum: 400, description: "Header logo maks. genişliği (px) — null ise genişlik tavanı yok (sınırsız)." }
        homePageId: { type: string, format: uuid, nullable: true }
        siteTemplate: { $ref: "#/components/schemas/SiteTemplate" }

    SiteModule:
      description: >
        `GET /admin/modules` ve `PATCH /admin/modules/{key}` yanıtı — kod içi statik
        `MODULE_REGISTRY` TANIMI (`key`/`label`/`description`/`recommendedFor`) ile
        `SiteModule` tablosundaki (varsa) durum satırının BİRLEŞİMİ (bkz.
        ARCHITECTURE.md §10.9.1).
      type: object
      properties:
        key: { type: string, example: products }
        label: { type: string, example: "Ürünler" }
        description: { type: string }
        enabled:
          type: boolean
          description: "DB'de satır varsa oradaki değer; satır YOKSA (hiç toggle edilmemiş) registry'deki `defaultEnabled` fallback olur."
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
          description: "Satır yoksa (hiç toggle edilmemiş) `null`."
        recommendedFor:
          type: array
          items: { $ref: "#/components/schemas/SiteTemplate" }
          description: "Bu modülün hangi `siteTemplate` değer(ler)i için ÖNERİLDİĞİ — backend davranışını ETKİLEMEZ, yalnızca frontend kurulum sihirbazı okur. Tanımsız/boş olabilir (ör. SHOWCASE için özel bir modül önerisi YOK)."

    PublicSiteModule:
      description: "`GET /modules` (public) yanıtı — `label`/`description`/`updatedBy` TAŞIMAZ, yalnızca nav/layout kararı için."
      type: object
      properties:
        key: { type: string }
        enabled: { type: boolean }

    UpdateModuleRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    # ---- §10.12 Site Özelleştirme (Görünüm) ----
    #
    # İSİMLENDİRME KURALI (bağlayıcı): bu bölümdeki HER alan YALNIZCA ziyaretçi
    # (public) sitesini etkiler. Alan adlarında `site` ön eki KULLANILMAZ (tablo/uç/DTO
    # adı `SiteAppearance` zaten kapsamı taşır, `SiteAppearance.sitePrimaryColor`
    # kekemelik olurdu); ayrım bunun yerine RENDER katmanında zorlanır: bu değerler
    # DAİMA `--site-*` ön ekli CSS değişkenlerine ve `.site-scope` sınıfına yazılır.
    # Admin panelinin token'ları (`--primary` vb., `.admin-shell` altında) bu uçlardan
    # ASLA türetilmez. Bkz. ARCHITECTURE.md §10.12.4.

    SiteFont:
      description: >
        İzin verilen yazı tipleri — **serbest metin DEĞİL, kapalı bir enum (karar).**
        Teknik zorunluluk: frontend fontları `next/font/google` ile yükler ve bu API
        font adının DERLEME ZAMANINDA bilinmesini gerektirir; çalışma zamanında gelen
        keyfi bir dize `next/font` ile YÜKLENEMEZ. Ek fayda: keyfi ad, kontrolsüz bir
        üçüncü taraf isteğine ve öngörülemeyen sayfa düzenine yol açardı.


        `SYSTEM` = harici istek YOK, işletim sistemi font yığını (varsayılan).
        Yeni bir font eklemek = bu enum + frontend eşleştirme tablosu + ui-designer
        onayı (üç yerde birden), kasıtlı olarak sürtünmeli bir işlemdir.


        **Admin panelinin Geist fontu bu enum'dan BAĞIMSIZDIR ve bu ayarla
        DEĞİŞTİRİLEMEZ** (bkz. `app/layout.tsx`).
      type: string
      enum: [SYSTEM, INTER, ROBOTO, OPEN_SANS, MONTSERRAT, POPPINS, LORA, PLAYFAIR_DISPLAY, SOURCE_SERIF_4]

    PageHeaderStyle:
      description: >
        Sayfa/blog yazısı başlık bloğunun düzeni. `PLAIN` = sade metin başlık
        (varsayılan), `BANNER` = arka plan rengi/görseli olan geniş blok,
        `HIDDEN` = başlık bloğu hiç render edilmez (başlık yalnızca `<title>`/SEO
        meta'sında kalır — SEO kaybı YOKTUR).


        Site GENELİNDE tek bir değerdir; v1'de sayfa-başına geçersiz kılma (override)
        YOKTUR. İstenirse `Page`/`BlogPost` üzerine nullable bir override kolonu
        eklenmesi gerekir — önce kontrat güncellenir.
      type: string
      enum: [PLAIN, BANNER, HIDDEN]

    SocialShareNetwork:
      description: >
        Yazı/sayfa altındaki paylaşım butonları. **`SocialPlatform` enum'undan
        AYRIDIR ve onunla BİRLEŞTİRİLMEMELİDİR** (bkz. `Navigation` tag'i): o enum
        sitenin KENDİ hesaplarının footer linklerini tanımlar (GITHUB gibi paylaşım
        hedefi olmayan değerler içerir), bu enum ise ziyaretçinin içeriği NEREYE
        paylaşabileceğini tanımlar (`COPY_LINK` gibi bir hesabı olmayan değerler
        içerir). İki liste zamanla farklı yönlere evrilir.
      type: string
      enum: [TWITTER, FACEBOOK, LINKEDIN, WHATSAPP, EMAIL, COPY_LINK]

    HexColor:
      description: >
        Kanonik 6 haneli hex renk. Kısaltma (`#abc`), alfa kanalı (`#rrggbbaa`),
        isimli renk (`red`) ve `oklch()`/`rgb()` KABUL EDİLMEZ — tek kanonik biçim,
        renk seçicisinden DB'ye ve CSS değişkenine kayıpsız gidiş-dönüş sağlar ve
        değere kaçış (escape) uygulamadan CSS'e gömülmesini güvenli kılar.
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      example: "#4f46e5"

    AppearancePreset:
      description: >
        `GET /admin/appearance/presets` öğesi — kod içi statik `lib/appearance-presets.ts`
        kaydı (DB tablosu YOKTUR). `values`, `PATCH /admin/appearance` gövdesine
        OLDUĞU GİBİ gönderilebilecek alanları taşır.
      type: object
      properties:
        key: { type: string, example: modern }
        label: { type: string, example: "Modern" }
        description: { type: string, example: "Yüksek kontrastlı, geniş boşluklu, sans-serif." }
        values:
          description: "Ön ayarın uyguladığı alanlar — SADECE renk ve tipografi. Ön ayarlar ASLA görünüm anahtarlarını (bakım modu/çerez bandı), 404 metinlerini veya özel kodu değiştirmez."
          allOf: [{ $ref: "#/components/schemas/UpdateSiteAppearanceRequest" }]

    SiteAppearance:
      description: >
        `GET /admin/appearance` ve `PATCH /admin/appearance` yanıtı — tekil (singleton)
        görünüm ayarları DTO'su. Satır yoksa sabit `DEFAULTS` döner (lazy-upsert,
        `SiteSettings` ile AYNI desen).
      type: object
      properties:
        presetKey:
          type: string
          nullable: true
          description: "En son uygulanan ön ayarın anahtarı; `null` = özel (kullanıcı alanları elle değiştirdi). CANLI BİR BAĞ DEĞİLDİR — bkz. `PATCH /admin/appearance` açıklaması."
        # --- §3 Sayfa Başlığı Düzeni ---
        pageHeaderStyle: { $ref: "#/components/schemas/PageHeaderStyle" }
        pageHeaderBackgroundColor:
          allOf: [{ $ref: "#/components/schemas/HexColor" }]
          nullable: true
          description: "Yalnızca `pageHeaderStyle: BANNER` iken kullanılır. Hem renk hem görsel doluysa GÖRSEL kazanır, renk görsel yüklenene kadarki yedek (fallback) zemindir."
        pageHeaderBackgroundMediaId:
          type: string
          format: uuid
          nullable: true
          description: "Medya kütüphanesinden seçilir — serbest URL alanı DEĞİL (mevcut `coverMediaId` paterni). Görsel silinirse FK `onDelete: SetNull` ile boşalır ve banner sessizce renge/sade metne düşer."
        pageHeaderBackgroundUrl:
          type: string
          nullable: true
          description: "**Yanıta özel, YAZILAMAZ alan** — `pageHeaderBackgroundMediaId`'nin sunucuda çözümlenmiş URL'i. Public site tüketicisinin ayrıca medya sorgusu yapmasını önler."
        pageHeaderOverlayOpacity:
          type: integer
          minimum: 0
          maximum: 100
          description: "Banner görselinin üzerine binen koyu katmanın yüzdesi (varsayılan 40). Erişilebilirlik alanıdır: görsel üzerindeki başlık metninin okunabilir kalmasını sağlar."
        # --- §4 Stil / Genel Renk (SADECE ziyaretçi sitesi) ---
        primaryColor: { $ref: "#/components/schemas/HexColor" }
        secondaryColor: { $ref: "#/components/schemas/HexColor" }
        buttonColor: { $ref: "#/components/schemas/HexColor" }
        buttonTextColor:
          allOf: [{ $ref: "#/components/schemas/HexColor" }]
          description: "Buton zemini üzerindeki metin rengi — ayrı bir alandır çünkü otomatik türetim (siyah/beyaz seçimi) orta tonlu zeminlerde AA kontrastını güvenilir biçimde sağlayamaz."
        linkColor: { $ref: "#/components/schemas/HexColor" }
        # --- §6 Yazı Tipi ---
        headingFont: { $ref: "#/components/schemas/SiteFont" }
        bodyFont: { $ref: "#/components/schemas/SiteFont" }
        baseFontSize:
          type: integer
          minimum: 14
          maximum: 20
          description: "Gövde metni temel boyutu (px, varsayılan 16). Alt sınır 14'tür — daha küçüğü okunabilirlik/erişilebilirlik eşiğinin altına düşerdi."
        # --- §5 Sosyal Medya Paylaşımı (HESAP LİNKLERİ BURADA DEĞİL — bkz. Navigation) ---
        socialShareEnabled:
          type: boolean
          description: "Yazı/sayfa altındaki paylaşım butonları. **Sitenin kendi sosyal hesap LİNKLERİ bu uçta DEĞİLDİR** — onlar `SocialLink` modeli ve `/admin/navigation` ekranında yaşar (§10.12.1: taşınmadı, derin link verildi)."
        socialShareNetworks:
          type: array
          items: { $ref: "#/components/schemas/SocialShareNetwork" }
          description: "`socialShareEnabled: false` iken de saklanır (kullanıcı tekrar açtığında seçimi kaybolmaz). Boş dizi geçerlidir ve butonların hiçbirinin gösterilmemesi demektir."
        # --- §7 Ekstra Özellikler (görünüm anahtarları) ---
        backToTopEnabled: { type: boolean }
        stickyHeaderEnabled: { type: boolean }
        cookieBannerEnabled:
          type: boolean
          description: "**v1'de BİLGİLENDİRME bandıdır, ONAY YÖNETİCİSİ DEĞİLDİR** — hiçbir script'i/çerezi engellemez veya koşullu yüklemez. Arayüz metni bunu vaat ETMEMELİDİR (compliance-agent doğrular, bkz. §10.12.5)."
        cookieBannerText: { type: string, nullable: true, maxLength: 500 }
        cookieBannerPolicyHref: { type: string, nullable: true, maxLength: 2048, description: "Gizlilik/çerez politikası sayfasına bağlantı (genelde bir dahili `/slug`)." }
        maintenanceModeEnabled:
          type: boolean
          description: >
            Ziyaretçi sitesinde bakım sayfası gösterir. **SUNUM KATMANI anahtarıdır,
            bir GÜVENLİK/ERİŞİM kontrolü DEĞİLDİR:** API'yi kapatmaz ve hiçbir veriyi
            korumaz. `/admin` rotaları BAŞKA bir route grubundadır ve bu anahtardan
            ETKİLENMEZ — yönetici kendini asla kilitleyemez (bkz. §10.12.5).
        maintenanceMessage: { type: string, nullable: true, maxLength: 500 }
        # --- §9 404 Sayfası ---
        notFoundTitle: { type: string, nullable: true, maxLength: 120, description: "`null` ise frontend'in sabit Türkçe varsayılanı kullanılır (tüm 404 alanları için aynı kural)." }
        notFoundMessage: { type: string, nullable: true, maxLength: 500 }
        notFoundButtonLabel: { type: string, nullable: true, maxLength: 60 }
        notFoundButtonHref: { type: string, nullable: true, maxLength: 2048, description: "Varsayılan `/`. Butonun gösterilmesi için `notFoundButtonLabel` ve `notFoundButtonHref` İKİSİNİN DE dolu olması gerekir (`headerCta*` ile aynı kural)." }
        updatedAt: { type: string, format: date-time, nullable: true, description: "Hiç kaydedilmemişse (DEFAULTS) `null`." }

    PublicSiteAppearance:
      description: >
        `GET /appearance` (public) yanıtı. `SiteAppearance`'tan FARKLARI: `presetKey`,
        `pageHeaderBackgroundMediaId` ve `updatedAt` TAŞIMAZ (yalnızca yönetim
        ekranını ilgilendirir); buna karşılık `customCss`/`customJs` İÇERİR — çünkü
        `(site)` layout'u bu iki değeri her SSR render'ında ihtiyaç duyar ve ikinci
        bir istek gereksiz gecikme olurdu.
      type: object
      properties:
        pageHeaderStyle: { $ref: "#/components/schemas/PageHeaderStyle" }
        pageHeaderBackgroundColor: { allOf: [{ $ref: "#/components/schemas/HexColor" }], nullable: true }
        pageHeaderBackgroundUrl: { type: string, nullable: true }
        pageHeaderOverlayOpacity: { type: integer, minimum: 0, maximum: 100 }
        primaryColor: { $ref: "#/components/schemas/HexColor" }
        secondaryColor: { $ref: "#/components/schemas/HexColor" }
        buttonColor: { $ref: "#/components/schemas/HexColor" }
        buttonTextColor: { $ref: "#/components/schemas/HexColor" }
        linkColor: { $ref: "#/components/schemas/HexColor" }
        headingFont: { $ref: "#/components/schemas/SiteFont" }
        bodyFont: { $ref: "#/components/schemas/SiteFont" }
        baseFontSize: { type: integer, minimum: 14, maximum: 20 }
        socialShareEnabled: { type: boolean }
        socialShareNetworks:
          type: array
          items: { $ref: "#/components/schemas/SocialShareNetwork" }
        backToTopEnabled: { type: boolean }
        stickyHeaderEnabled: { type: boolean }
        cookieBannerEnabled: { type: boolean }
        cookieBannerText: { type: string, nullable: true }
        cookieBannerPolicyHref: { type: string, nullable: true }
        maintenanceModeEnabled: { type: boolean }
        maintenanceMessage: { type: string, nullable: true }
        notFoundTitle: { type: string, nullable: true }
        notFoundMessage: { type: string, nullable: true }
        notFoundButtonLabel: { type: string, nullable: true }
        notFoundButtonHref: { type: string, nullable: true }
        customCss:
          type: string
          nullable: true
          description: "`(site)` layout'unda `<style>` olarak gömülür. **ASLA kök `app/layout.tsx`'te DEĞİL** — kök layout admin panelini de sarmalar ve site CSS'i admin arayüzünü bozardı (bkz. §10.12.6)."
        customJs:
          type: string
          nullable: true
          description: "`CUSTOM_CODE_ENABLED=false` iken HER ZAMAN `null` (kill switch). Enjeksiyon kuralları `customCss` ile aynıdır; ek olarak `</script` dizisi kaçırılmak ZORUNDADIR."

    UpdateSiteAppearanceRequest:
      description: >
        `PATCH /admin/appearance` gövdesi — TÜM alanlar opsiyoneldir, yalnızca
        gönderilenler yazılır (satır yoksa `DEFAULTS` ile birlikte oluşturulur).
        Panelin her bölümü SADECE kendi alanlarını gönderir.


        **`customCss`/`customJs` bu gövdede KASITLI olarak YOKTUR** — kendi PUT
        uçları vardır (farklı onay/denetim/hız-sınırı politikası).
        **`pageHeaderBackgroundUrl` de YOKTUR** (türetilmiş, salt-okunur alan);
        gönderilirse 422 alınır.
      type: object
      properties:
        presetKey: { type: string, nullable: true }
        pageHeaderStyle: { $ref: "#/components/schemas/PageHeaderStyle" }
        pageHeaderBackgroundColor: { allOf: [{ $ref: "#/components/schemas/HexColor" }], nullable: true }
        pageHeaderBackgroundMediaId: { type: string, format: uuid, nullable: true, description: "Var olmayan bir medya id'si → `404 NOT_FOUND` (kısmi yazma YAPILMAZ)." }
        pageHeaderOverlayOpacity: { type: integer, minimum: 0, maximum: 100 }
        primaryColor: { $ref: "#/components/schemas/HexColor" }
        secondaryColor: { $ref: "#/components/schemas/HexColor" }
        buttonColor: { $ref: "#/components/schemas/HexColor" }
        buttonTextColor: { $ref: "#/components/schemas/HexColor" }
        linkColor: { $ref: "#/components/schemas/HexColor" }
        headingFont: { $ref: "#/components/schemas/SiteFont" }
        bodyFont: { $ref: "#/components/schemas/SiteFont" }
        baseFontSize: { type: integer, minimum: 14, maximum: 20 }
        socialShareEnabled: { type: boolean }
        socialShareNetworks:
          type: array
          items: { $ref: "#/components/schemas/SocialShareNetwork" }
          description: "Tam değiştirme (replace) semantiği — gönderilen dizi mevcut seçimin YERİNE geçer, birleştirilmez. Yinelenen değerler sunucuda tekilleştirilir."
        backToTopEnabled: { type: boolean }
        stickyHeaderEnabled: { type: boolean }
        cookieBannerEnabled: { type: boolean }
        cookieBannerText: { type: string, nullable: true, maxLength: 500 }
        cookieBannerPolicyHref: { type: string, nullable: true, maxLength: 2048 }
        maintenanceModeEnabled: { type: boolean }
        maintenanceMessage: { type: string, nullable: true, maxLength: 500 }
        notFoundTitle: { type: string, nullable: true, maxLength: 120 }
        notFoundMessage: { type: string, nullable: true, maxLength: 500 }
        notFoundButtonLabel: { type: string, nullable: true, maxLength: 60 }
        notFoundButtonHref: { type: string, nullable: true, maxLength: 2048 }

    ResetAppearanceRequest:
      type: object
      properties:
        presetKey:
          type: string
          nullable: true
          description: "Verilirse o ön ayarın değerlerine, verilmezse/`null` ise fabrika `DEFAULTS`'una dönülür. Özel CSS/JS HİÇBİR durumda etkilenmez."

    SiteCustomCode:
      description: >
        `GET /admin/appearance/custom-code` ve iki PUT ucunun yanıtı. Gövdelerin yanı
        sıra "kim/ne zaman" denetim izini taşır — özel kodun kaynağını izlemek olay
        müdahalesinin (incident response) ilk adımıdır.
      type: object
      properties:
        css: { type: string, nullable: true }
        js:
          type: string
          nullable: true
          description: "`CUSTOM_CODE_ENABLED=false` iken saklanan değer KORUNUR ve bu yönetim ucunda GÖRÜNÜR (yönetici ne kaydedildiğini görebilmelidir); yalnızca public `GET /appearance` `null` döner ve yazma 403'tür."
        cssUpdatedAt: { type: string, format: date-time, nullable: true }
        cssUpdatedBy:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
          description: "Kullanıcı silinmişse `null` (FK `onDelete: SetNull`) — denetim satırı yine de korunur."
        jsUpdatedAt: { type: string, format: date-time, nullable: true }
        jsUpdatedBy:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        customCodeEnabled:
          type: boolean
          description: "Ortamın kill switch durumu (`CUSTOM_CODE_ENABLED`). Arayüz `false` iken editörleri devre dışı bırakır ve nedenini açıklar — kullanıcı 403'ü ancak kaydettikten sonra görmemelidir."

    UpdateCustomCssRequest:
      type: object
      required: [css, acknowledged]
      properties:
        css:
          type: string
          nullable: true
          maxLength: 50000
          description: "Belgenin TAMAMI (PUT). `null` veya `\"\"` = özel CSS'i kaldır."
        acknowledged:
          type: boolean
          description: >
            Arayüzdeki "bu kodun ne yaptığını anlıyorum" onayının kontrattaki
            karşılığı. `css` BOŞ DEĞİLSE `true` OLMAK ZORUNDADIR, aksi hâlde
            `422 VALIDATION_ERROR`. Kod temizlenirken (`null`/`""`) değeri
            YOK SAYILIR. Sunucuda zorlanır — yalnızca arayüzde kalan bir onay,
            doğrudan API çağrısıyla atlanabilirdi.

    UpdateCustomJsRequest:
      type: object
      required: [js, acknowledged]
      properties:
        js:
          type: string
          nullable: true
          maxLength: 20000
          description: "Belgenin TAMAMI (PUT). `null` veya `\"\"` = özel JS'i kaldır. Sınır CSS'ten (50.000) düşüktür: bu metin her sayfaya gömülür ve doğrudan sayfa ağırlığıdır."
        acknowledged:
          type: boolean
          description: "`UpdateCustomCssRequest.acknowledged` ile AYNI kural."

    # ---- §10.9.2 Ürünler Modülü ----

    ProductCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    ProductImage:
      description: >
        Sıralı ürün galerisi öğesi. `coverMediaId`'nin AKSİNE, `POST`/`PATCH
        /admin/products` gövdelerinden SET EDİLEMEZ — kendi ayrı uçları vardır:
        `POST /admin/products/{productId}/images` (ekle, `mediaId` zaten galerideyse
        409) ve `DELETE /admin/products/{productId}/images/{imageId}` (kaldır, IDOR
        korumalı — bkz. ARCHITECTURE.md §10.9.2 "galeri yönetimi").
      type: object
      properties:
        id: { type: string, format: uuid }
        media: { $ref: "#/components/schemas/Media" }
        order: { type: integer }

    Product:
      description: >
        `/admin/products` ve `/products` uçlarında dönen ürün DTO'su. `BlogCategory`/
        `BlogPost` (§10.7) ile BİREBİR AYNI çöp kutusu/yazar/SEO skoru alan seti +
        e-ticaret alanları (fiyat/stok/SKU). `translations.EN` yalnızca override'ları
        taşır (bkz. ARCHITECTURE.md §10.5).
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        descriptionHtml: { type: string }
        priceCents:
          type: integer
          description: "HER ZAMAN kuruş/cent cinsinden pozitif tam sayı — float KESİNLİKLE YOK (ödeme hassasiyeti)."
        currency: { type: string, example: TRY }
        taxRatePercent:
          type: number
          nullable: true
          description: "KDV fiyata DAHİLDİR — bu alan yalnızca fatura/gösterim amaçlı ayrıştırma içindir, `priceCents`'e AYRICA eklenmez."
        discountPriceCents:
          type: integer
          nullable: true
          description: "Doluysa `priceCents`'ten KÜÇÜKTÜR (create/update sırasında sunucu tarafında doğrulanır)."
        sku: { type: string, nullable: true }
        stockQuantity: { type: integer }
        status: { $ref: "#/components/schemas/PageStatus" }
        category:
          allOf:
            - $ref: "#/components/schemas/ProductCategory"
          nullable: true
        coverMedia:
          allOf:
            - $ref: "#/components/schemas/Media"
          nullable: true
        images:
          type: array
          items: { $ref: "#/components/schemas/ProductImage" }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations: { $ref: "#/components/schemas/ContentTranslations" }
        localizations:
          type: array
          items: { $ref: "#/components/schemas/ContentLocalization" }
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: "Zamanlanmış yayın hedef tarihi — yalnızca status=SCHEDULED iken anlamlı, aksi halde null."
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: "Soft-delete zaman damgası. Public uçlar (`/products`, `/products/{slug}`) `deletedAt: null` FİLTRESİ UYGULAMAK ZORUNDADIR."
        authorId: { type: string, format: uuid, nullable: true }
        author:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
        seoScore:
          type: integer
          minimum: 0
          maximum: 100
          description: "Bkz. `Page.seoScore` — aynı algoritma, entity'ye özgü girdilerle (kapak görseli = `coverMedia`)."
        seoScoreIssues:
          type: array
          items: { $ref: "#/components/schemas/SeoScoreIssue" }

    CreateProductRequest:
      type: object
      required: [title, priceCents]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, description: "verilmezse title'dan slugify edilir" }
        excerpt: { type: string }
        descriptionHtml: { type: string }
        priceCents: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 1, default: TRY }
        taxRatePercent: { type: number, minimum: 0, maximum: 100, nullable: true }
        discountPriceCents:
          type: integer
          minimum: 1
          nullable: true
          description: "Verilmişse `priceCents`'ten KÜÇÜK olmalı, aksi halde 422 (`error.details.discountPriceCents`)."
        sku: { type: string, minLength: 1, nullable: true }
        stockQuantity: { type: integer, minimum: 0, default: 0 }
        status: { allOf: [{ $ref: "#/components/schemas/PageStatus" }], default: DRAFT }
        categoryId: { type: string, format: uuid, nullable: true }
        coverMediaId: { type: string, format: uuid, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean, default: false }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId:
          type: string
          format: uuid
          nullable: true
          description: "§10.7 — verilmezse giriş yapmış kullanıcı atanır; BAŞKA bir kullanıcı yalnızca SiteRole=ADMIN tarafından atanabilir (MANAGER/EDITOR → 403)."
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: "Faz 4 (zamanlanmış yayın) — `CreatePageRequest.scheduledAt` ile AYNI çapraz-alan kuralı (`refineScheduledAt`)."

    UpdateProductRequest:
      description: "Tüm alanlar opsiyoneldir. Hızlı Düzenle `{ title, slug, status }` alt kümesini gönderir."
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        excerpt: { type: string, nullable: true }
        descriptionHtml: { type: string }
        priceCents: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 1 }
        taxRatePercent: { type: number, minimum: 0, maximum: 100, nullable: true }
        discountPriceCents:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Yalnızca bu istekte GÖNDERİLİRSE doğrulanır — istekte `priceCents`
            gönderilmese dahi mevcut kayıttaki fiyata göre çapraz kontrol edilir
            (bkz. `products.routes.ts::assertDiscountBelowPrice`).
        sku: { type: string, minLength: 1, nullable: true }
        stockQuantity: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/PageStatus" }
        categoryId: { type: string, format: uuid, nullable: true }
        coverMediaId: { type: string, format: uuid, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId: { type: string, format: uuid, nullable: true, description: "Yalnızca ADMIN değiştirebilir." }
        scheduledAt: { type: string, format: date-time, nullable: true }

    AdjustProductStockRequest:
      description: "`PATCH /admin/products/{productId}/stock` gövdesi — adminin ELLE stok düzeltmesi, checkout'un otomatik düşürmesiyle KARIŞTIRILMAMALIDIR."
      type: object
      required: [stockQuantity]
      properties:
        stockQuantity: { type: integer, minimum: 0 }

    CreateProductCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, description: "verilmezse name'den slugify edilir" }

    UpdateProductCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }

    AddProductImageRequest:
      description: "`POST /admin/products/{productId}/images` gövdesi — galeriye tek bir `Media` ekler."
      type: object
      required: [mediaId]
      properties:
        mediaId: { type: string, format: uuid }

    # ---- §10.9.4 Portföy Modülü ----

    PortfolioCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    PortfolioImage:
      description: >
        `ProductImage` ile AYNI patern — sıralı galeri öğesi, kendi ayrı yazma uçları
        vardır: `POST /admin/portfolio/{itemId}/images` (ekle, duplicate `mediaId` →
        409) ve `DELETE /admin/portfolio/{itemId}/images/{imageId}` (kaldır, IDOR
        korumalı).
      type: object
      properties:
        id: { type: string, format: uuid }
        media: { $ref: "#/components/schemas/Media" }
        order: { type: integer }

    PortfolioItem:
      description: >
        `/admin/portfolio` ve `/portfolio` uçlarında dönen portföy öğesi DTO'su.
        `Product`'ın (§10.9.2) BİREBİR paterni — ticari alanlar (fiyat/stok/SKU) yerine
        `clientName`/`projectUrl`/`completedAt`/manuel `order` sıralaması.
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string, nullable: true }
        contentHtml: { type: string }
        clientName: { type: string, nullable: true }
        projectUrl: { type: string, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        order:
          type: integer
          description: "Manuel sıralama (kullanıcı kararı) — `viewCount`/iç `seq` sayacıyla KARIŞTIRILMAMALIDIR. Public liste BUNA göre `asc` sıralanır."
        status: { $ref: "#/components/schemas/PageStatus" }
        category:
          allOf:
            - $ref: "#/components/schemas/PortfolioCategory"
          nullable: true
        coverMedia:
          allOf:
            - $ref: "#/components/schemas/Media"
          nullable: true
        images:
          type: array
          items: { $ref: "#/components/schemas/PortfolioImage" }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations: { $ref: "#/components/schemas/ContentTranslations" }
        localizations:
          type: array
          items: { $ref: "#/components/schemas/ContentLocalization" }
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: "Zamanlanmış yayın hedef tarihi — yalnızca status=SCHEDULED iken anlamlı, aksi halde null."
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: "Soft-delete zaman damgası. Public uçlar (`/portfolio`, `/portfolio/{slug}`) `deletedAt: null` FİLTRESİ UYGULAMAK ZORUNDADIR."
        authorId: { type: string, format: uuid, nullable: true }
        author:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
        seoScore: { type: integer, minimum: 0, maximum: 100 }
        seoScoreIssues:
          type: array
          items: { $ref: "#/components/schemas/SeoScoreIssue" }

    CreatePortfolioItemRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1, description: "verilmezse title'dan slugify edilir" }
        summary: { type: string }
        contentHtml: { type: string }
        clientName: { type: string, minLength: 1, nullable: true }
        projectUrl: { type: string, format: uri, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        order: { type: integer, description: "Manuel sıralama — bkz. `PortfolioItem.order`." }
        status: { allOf: [{ $ref: "#/components/schemas/PageStatus" }], default: DRAFT }
        categoryId: { type: string, format: uuid, nullable: true }
        coverMediaId: { type: string, format: uuid, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean, default: false }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId: { type: string, format: uuid, nullable: true, description: "§10.7 — `CreatePageRequest.authorId` ile AYNI kural." }
        scheduledAt: { type: string, format: date-time, nullable: true }

    UpdatePortfolioItemRequest:
      description: "Tüm alanlar opsiyoneldir. Hızlı Düzenle `{ title, slug, status }` alt kümesini gönderir."
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        summary: { type: string, nullable: true }
        contentHtml: { type: string }
        clientName: { type: string, minLength: 1, nullable: true }
        projectUrl: { type: string, format: uri, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        order: { type: integer }
        status: { $ref: "#/components/schemas/PageStatus" }
        categoryId: { type: string, format: uuid, nullable: true }
        coverMediaId: { type: string, format: uuid, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, format: uri, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        authorId: { type: string, format: uuid, nullable: true, description: "Yalnızca ADMIN değiştirebilir." }
        scheduledAt: { type: string, format: date-time, nullable: true }

    CreatePortfolioCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }

    UpdatePortfolioCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }

    AddPortfolioImageRequest:
      description: "`POST /admin/portfolio/{itemId}/images` gövdesi — galeriye tek bir `Media` ekler."
      type: object
      required: [mediaId]
      properties:
        mediaId: { type: string, format: uuid }

    # ---- §10.9.3 Sepet + Stripe Checkout ----

    CartItem:
      description: >
        `GET /cart` yanıtındaki her satır — sepete eklenme anında DONDURULAN
        (`frozenUnitPriceCents`, `CartItem.unitPriceCents`) fiyat ile DB'den taze
        okunan `currentPriceCents` AYRI döner; ikisi farklıysa frontend kullanıcıya
        "fiyat değişti" uyarısı gösterebilir (checkout DB'den TEKRAR taze okuyup
        kendi hesabını yapar — burası yalnızca gösterim amaçlıdır).
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        product:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            slug: { type: string }
            coverImageUrl: { type: string, nullable: true }
            stockQuantity: { type: integer }
        quantity: { type: integer }
        frozenUnitPriceCents: { type: integer }
        currentPriceCents: { type: integer }
        lineTotalCents: { type: integer }

    Cart:
      description: "Cookie yoksa/geçersizse (henüz hiçbir şey eklenmemiş) boş sepet döner (`currency: null`)."
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        currency: { type: string, nullable: true }
        subtotalCents:
          type: integer
          description: "Dondurulmuş fiyatlar (`frozenUnitPriceCents * quantity`) üzerinden toplam — checkout'un hesaplayacağı nihai tutarla AYNI mantık, ama checkout kendi hesabını yeniden yapar."

    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }

    CartCheckoutSessionRequest:
      description: >
        `CreateCheckoutSessionRequest` (abonelik/`Billing` akışı, `planId`/`billingCycle`
        tabanlı) İLE KARIŞTIRILMAMALI — bu, sepet/ürün tabanlı tek seferlik ödeme akışına
        özgü AYRI bir şemadır. GÜVENLİK: bu uç PUBLIC + kimliksiz — üst sınırsız string
        alanlar DB'ye/Stripe'a/e-posta şablonuna aşırı büyük payload sızdırabilir (kaba bir
        DoS vektörü), bu yüzden `customerEmail`/`customerName` üst sınırlıdır (RFC 5321
        e-posta üst sınırı 254 karakter).
      type: object
      required: [customerEmail]
      properties:
        customerEmail: { type: string, format: email, maxLength: 254 }
        customerName: { type: string, minLength: 1, maxLength: 200 }

    OrderStatus:
      description: >
        `Order.status` yaşam döngüsü — `PENDING` (checkout session açıldı, ödeme
        bekleniyor) → `PAID` (webhook onayladı) → `FULFILLED` (admin elle işaretler).
        `FAILED` = webhook'ta stok yetersiz çıktı (para alınmış olabilir, admin manuel
        müdahale eder); `CANCELLED` = admin `PENDING`'ken elle iptal etti; `EXPIRED` =
        Stripe Checkout Session'ı ödeme tamamlanmadan süresi doldu (webhook otomatik
        işler). `REFUNDED` = admin `POST /admin/orders/{orderId}/refund` ile manuel
        iade etti (yalnızca `PAID`/`FULFILLED` kaynak durumlardan ulaşılabilir, bkz.
        ARCHITECTURE.md §10.9.3 "manuel iade akışı") — `PATCH
        /admin/orders/{orderId}/status` bu uçtan HEDEF DEĞER OLARAK KABUL ETMEZ,
        yalnızca ayrı `refund` ucundan ulaşılır.
      type: string
      enum: [PENDING, PAID, FAILED, CANCELLED, EXPIRED, REFUNDED, FULFILLED]

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId:
          type: string
          format: uuid
          nullable: true
          description: "Ürün kalıcı silinirse `SetNull` ile `null` olur — sipariş geçmişi BOZULMAZ (aşağıdaki alanlar zaten SNAPSHOT)."
        productTitle: { type: string, description: "SNAPSHOT — ürün silinse/değişse bile sipariş geçmişi bozulmasın diye." }
        productSku: { type: string, nullable: true }
        unitPriceCents: { type: integer }
        quantity: { type: integer }
        lineTotalCents: { type: integer }

    Order:
      description: >
        `/admin/orders` (ADMIN/MANAGER) ve `GET /users/me/orders` (sahiplik filtresi,
        tüm roller) uçlarında dönen sipariş DTO'su.
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: "ORD-LXK3F2-A1B2", description: "Müşteriye/faturaya gösterilen okunabilir sipariş numarası." }
        status: { $ref: "#/components/schemas/OrderStatus" }
        customerEmail:
          type: string
          format: email
          description: "LİSTEDE (`GET /admin/orders`) maskelenir (`a***@domain.com`); DETAYDA (`GET /admin/orders/{orderId}`) maskesiz döner. `GET /users/me/orders`'ta MASKELENMEZ — kullanıcı kendi verisini okur."
        customerName: { type: string, nullable: true }
        currency: { type: string }
        subtotalCents: { type: integer }
        discountCents: { type: integer }
        taxCents: { type: integer, description: "KDV fiyata DAHİLDİR — sadece fatura/gösterim amaçlı ayrıştırma, `totalCents`'e AYRICA eklenmez." }
        totalCents: { type: integer }
        errorSummary: { type: string, nullable: true, description: "Yalnızca `status: FAILED` iken anlamlı (ör. `insufficient_stock`)." }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    UpdateOrderStatusRequest:
      description: >
        `PATCH /admin/orders/{orderId}/status` gövdesi — yalnızca hedef durum olarak
        `FULFILLED` (kaynak `PAID` olmalı) veya `CANCELLED` (kaynak `PENDING` olmalı)
        kabul edilir; şema seviyesinde diğer `OrderStatus` değerleri (`REFUNDED` dahil)
        zaten REDDEDİLİR (422). Kaynak/hedef eşleşmezse route handler `409 CONFLICT`
        döner.
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [FULFILLED, CANCELLED] }

    RefundOrderRequest:
      description: >
        `POST /admin/orders/{orderId}/refund` gövdesi — `reason` yalnızca audit log
        (`order.refund` metadata) + Stripe'a gönderilen iade kaydı için bilgi amaçlıdır,
        Stripe'ın kendi `reason` enum'ına EŞLENMEZ (Stripe tarafına her zaman sabit
        `requested_by_customer` gönderilir).
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    OrderListMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

    # -------------------------------------------------------------------------
    # §10.13 Üçüncü Parti Entegrasyon — API Anahtarları
    # -------------------------------------------------------------------------

    ApiKeyScope:
      type: string
      description: >
        `READ` = yalnızca okuma. `READ_WRITE` = okuma + yazma.


        **v1'de public katmanda yazma ucu YOKTUR** — dolayısıyla iki değer arasında
        şu an gözlemlenebilir bir davranış farkı bulunmaz. Enum ve doğrulama hattı
        yine de ŞİMDİDEN vardır (kullanıcı gereksinimi, §10.13.4 madde 5): yazma ucu
        eklendiğinde yeni bir migration ve yeni bir yetki ekseni icat edilmesin diye.
      enum: [READ, READ_WRITE]

    ApiKeyStatus:
      type: string
      description: >
        `REVOKED` **soft** iptaldir — satır silinmez, denetim izi korunur. İptal
        ANINDA etkilidir (doğrulama cache girişi senkron temizlenir, §10.13.4).
      enum: [ACTIVE, REVOKED]

    ApiKey:
      type: object
      description: >
        `/admin/settings/api-keys` uçlarında dönen DTO. **Ham anahtarı ASLA
        içermez** — yalnızca `keyPrefix` (gizli olmayan tanıtıcı parça) ve `last4`.
      required: [id, name, keyPrefix, last4, maskedKey, scope, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Mobil Uygulama" }
        description: { type: string, nullable: true }
        keyPrefix:
          type: string
          example: "cmsk_7f3ka9dm2q0x"
          description: >
            Ham anahtarın GİZLİ OLMAYAN tanıtıcı parçası (`cmsk_` + 12 hex).
            Doğrulamada indeks araması buna göre yapılır; admin panelinde ve destek
            akışlarında "hangi anahtar?" sorusunu secret'ı ifşa etmeden cevaplar.
        last4:
          type: string
          minLength: 4
          maxLength: 4
          example: "9f2c"
          description: "Ham anahtarın son 4 karakteri — maskeli gösterim için."
        maskedKey:
          type: string
          readOnly: true
          example: "cmsk_7f3ka9dm2q0x…9f2c"
          description: "Sunucuda türetilen hazır gösterim dizesi (`keyPrefix` + `…` + `last4`) — istemci kendi maskeleme mantığını YAZMAZ."
        scope: { $ref: "#/components/schemas/ApiKeyScope" }
        status: { $ref: "#/components/schemas/ApiKeyStatus" }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        lastUsedIp:
          type: string
          nullable: true
          description: >
            **MASKELENMİŞ** istemci IP'si (`lib/pii-mask.ts::maskIp`). Ham IP DB'ye
            YAZILMAZ (veri minimizasyonu, §10.13.10). Amaç: sızmış bir anahtarın
            beklenmedik bir konumdan kullanıldığını fark etmek.


            Yazma kısıtlıdır: `lastUsedAt` boşsa veya 60 sn'den eskiyse güncellenir —
            aksi hâlde her okuma isteği bir yazma isteği doğururdu (§10.13.4 madde 7).
        expiresAt: { type: string, format: date-time, nullable: true, description: "null = süresiz." }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdById: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true, description: "Oluşturan kullanıcının ADI. E-posta BİLİNÇLİ olarak DÖNMEZ." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: "Zapier Entegrasyonu" }
        description: { type: string, maxLength: 500, nullable: true }
        scope:
          allOf:
            - $ref: "#/components/schemas/ApiKeyScope"
          default: READ
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: "Verilirse GELECEKTE olmalıdır (aksi hâlde 422). null/verilmemiş = süresiz."

    CreateApiKeyResponse:
      type: object
      description: >
        **`plainKey` YALNIZCA BURADA, BİR KEZ döner.** Sunucu yalnızca `sha256`
        hash'ini saklar (§10.13.3); kaybedilirse geri alınamaz, yeni anahtar
        üretilmelidir. İstemci bu değeri localStorage/state'te KALICI TUTMAZ.
      required: [apiKey, plainKey]
      properties:
        apiKey: { $ref: "#/components/schemas/ApiKey" }
        plainKey:
          type: string
          example: "cmsk_7f3ka9dm2q0x_4b1e…"
          description: "Ham anahtar (82 karakter, `cmsk_<12hex>_<64hex>`). `X-Api-Key` header'ında AYNEN kullanılır."

    UpdateApiKeyRequest:
      type: object
      description: "Anahtarın KENDİSİ değiştirilemez — rotasyon = yeni anahtar + eskisini iptal."
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        scope: { $ref: "#/components/schemas/ApiKeyScope" }
        expiresAt: { type: string, format: date-time, nullable: true }

    PublicApiKeyInfo:
      type: object
      description: >
        `GET /public/me` yanıtı. Anahtarın kendisini/hash'ini/ön ekini DÖNMEZ —
        çağıran zaten anahtara sahiptir; geri yansıtmak log/proxy yüzeyini
        gereksiz genişletir.
      required: [name, scope, rateLimit]
      properties:
        name: { type: string }
        scope: { $ref: "#/components/schemas/ApiKeyScope" }
        expiresAt: { type: string, format: date-time, nullable: true }
        rateLimit:
          type: object
          description: "Katman 2 (anahtar başına kota) durumu — `x-ratelimit-*` header'larıyla AYNI değerler."
          required: [limit, remaining, resetSeconds]
          properties:
            limit: { type: integer, example: 120 }
            remaining: { type: integer, example: 118 }
            resetSeconds: { type: integer, example: 42 }

    # -------------------------------------------------------------------------
    # §10.13 Üçüncü Parti Entegrasyon — Giden (Outbound) Webhook'lar
    # -------------------------------------------------------------------------

    WebhookEvent:
      type: string
      description: >
        Abone olunabilecek olaylar. **Wire gösterimi Prisma enum adıyla BİREBİR
        AYNIDIR (SCREAMING_SNAKE)** — `blog_post.published` gibi ikinci bir
        nokta-notasyonu gösterim BİLİNÇLİ olarak tanımlanmadı; projedeki tüm
        enum'lar (`OrderStatus`, `PageStatus`, `ImportJobType`) wire'da bu biçimi
        kullanır ve iki gösterim kaçınılmaz olarak birbirinden sapardı.


        **`PING` gerçek bir olay değildir** — yalnızca `POST .../test` ile üretilir;
        abonelik listesinde yer alması GEREKMEZ.


        **`*_PUBLISHED` olayları yalnızca duruma GEÇİŞTE tetiklenir**
        (`DRAFT`/`SCHEDULED` → `PUBLISHED`). Zaten yayında olan içeriğin tekrar
        kaydedilmesi bu olayı ÜRETMEZ (onun için `*_UPDATED` vardır) — §10.13.8.
      enum:
        - PING
        - PAGE_PUBLISHED
        - BLOG_POST_PUBLISHED
        - BLOG_POST_UPDATED
        - PRODUCT_CREATED
        - PRODUCT_UPDATED
        - PRODUCT_DELETED
        - PORTFOLIO_ITEM_PUBLISHED
        - ORDER_CREATED
        - ORDER_PAID
        - ORDER_STATUS_CHANGED

    WebhookEventDefinition:
      type: object
      description: >
        `GET /admin/settings/webhooks/events` öğesi — statik kod registry'sinden
        gelir (`lib/webhook-events.ts`), DB'den DEĞİL. Frontend olay listesini ve
        Türkçe etiketleri BURADAN okur, hardcode etmez.
      required: [event, label, description, containsPii]
      properties:
        event: { $ref: "#/components/schemas/WebhookEvent" }
        label: { type: string, example: "Blog yazısı yayınlandı" }
        description: { type: string, example: "Bir blog yazısı ilk kez PUBLISHED durumuna geçtiğinde tetiklenir." }
        containsPii:
          type: boolean
          description: "Bu olayın payload'ı kişisel veri taşır mı (ör. `ORDER_*` → müşteri e-postası). Arayüz bu bayrağa göre uyarı gösterir."
        payloadSchema:
          type: string
          nullable: true
          description: "`data` alanının şeması için referans ad (ör. `PublicBlogPost`, `WebhookOrderPayload`) — dokümantasyon amaçlı."

    OutboundWebhookStatus:
      type: string
      description: >
        `PAUSED` = admin elle duraklattı. `DISABLED` = **sistem** üst üste 20
        başarısız gönderim sonrası otomatik kapattı (§10.13.8); yeniden
        etkinleştirme ELLEdir ve sayacı sıfırlar.
      enum: [ACTIVE, PAUSED, DISABLED]

    OutboundWebhook:
      type: object
      description: "`/admin/settings/webhooks` uçlarında dönen DTO. Secret ASLA dönmez — yalnızca `secretLast4`."
      required: [id, name, url, events, status, secretLast4, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        url: { type: string, format: uri, example: "https://hooks.example.com/cms" }
        secretLast4: { type: string, minLength: 4, maxLength: 4 }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WebhookEvent" }
        status: { $ref: "#/components/schemas/OutboundWebhookStatus" }
        consecutiveFailureCount:
          type: integer
          description: "Art arda başarısız gönderim sayacı; ilk başarılı gönderimde 0'lanır. 20'ye ulaşınca `status: DISABLED`."
        autoDisabledAt: { type: string, format: date-time, nullable: true }
        lastTriggeredAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        createdById: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateOutboundWebhookRequest:
      type: object
      description: >
        `url` §10.13.7 SSRF kurallarının TAMAMINDAN geçmelidir: yalnızca `https`,
        yalnızca port 443, kimlik bilgisi içeremez, literal IP olamaz, tek etiketli/
        `.local`/`.internal`/`.localhost`/`.lan`/`.home.arpa`/`.cluster.local`
        olamaz ve DNS çözümlemesinin döndürdüğü **TÜM** adresler public unicast
        olmalıdır (özel/loopback/link-local/CGNAT/multicast aralıkları ve
        IPv4-mapped/NAT64/6to4 sarmalamaları dahil). İhlalde `422` +
        `error.details.url`.
      required: [name, url, events]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        url: { type: string, format: uri, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          maxItems: 20
          description: "Boş dizi YASAKTIR (422). Tekrarlanan değerler sunucuda teklenir."
          items: { $ref: "#/components/schemas/WebhookEvent" }
        status:
          allOf:
            - $ref: "#/components/schemas/OutboundWebhookStatus"
          default: ACTIVE
          description: "Oluştururken `DISABLED` GÖNDERİLEMEZ (422) — o değer yalnızca sistemin otomatik kapatmasıyla oluşur."

    CreateOutboundWebhookResponse:
      type: object
      description: "**`plainSecret` YALNIZCA BURADA (ve `rotate-secret` yanıtında), BİR KEZ döner.**"
      required: [webhook, plainSecret]
      properties:
        webhook: { $ref: "#/components/schemas/OutboundWebhook" }
        plainSecret:
          type: string
          example: "whsec_4b1e…"
          description: >
            `whsec_` + 64 hex. Alıcı bu değeri `X-Webhook-Signature` doğrulamasında
            HMAC anahtarı olarak kullanır (§10.13.9). DB'de AES-256-GCM ile şifreli
            saklanır — hash DEĞİL, çünkü imza üretimi için geri çözülebilirlik
            ZORUNLUDUR.

    UpdateOutboundWebhookRequest:
      type: object
      description: >
        `status: "ACTIVE"` gönderilmesi, otomatik kapatılmış bir webhook'u yeniden
        etkinleştirir ve `consecutiveFailureCount`'u **0'lar**. `DISABLED` değeri
        istemciden GÖNDERİLEMEZ (422).
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        url: { type: string, format: uri, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/WebhookEvent" }
        status: { type: string, enum: [ACTIVE, PAUSED] }

    RotateWebhookSecretResponse:
      type: object
      required: [webhook, plainSecret]
      properties:
        webhook: { $ref: "#/components/schemas/OutboundWebhook" }
        plainSecret: { type: string, description: "Yeni secret. Eski secret ANINDA geçersizdir — grace period YOKTUR (§10.13.9)." }

    EnqueueWebhookDeliveryResponse:
      type: object
      description: >
        `POST .../test` ve `POST .../deliveries/{id}/redeliver` ortak yanıtı (202).
        Gönderim SENKRON DEĞİLDİR; istemci sonucu `GET .../deliveries/{deliveryId}`
        ile yoklar (dispatcher sweeper aralığı 15 sn).
      required: [deliveryId]
      properties:
        deliveryId: { type: string, format: uuid }

    WebhookDeliveryStatus:
      type: string
      description: >
        `PENDING` sıraya alındı · `SENDING` gönderiliyor (çökme kurtarması bu durumu
        arar) · `RETRYING` en az bir deneme başarısız, `nextAttemptAt` dolu ·
        `SUCCEEDED` 2xx alındı · `FAILED` kalıcı hata VEYA deneme hakkı tükendi.
      enum: [PENDING, SENDING, RETRYING, SUCCEEDED, FAILED]

    WebhookDeliverySummary:
      type: object
      description: >
        Delivery LİSTE DTO'su — `payload` ve `responseBodySnippet` **TAŞIMAZ**
        (liste yanıtını şişirmemek ve PII'yi gereksiz dolaştırmamak için). Bunlar
        yalnızca detay ucunda döner.
      required: [id, event, status, attemptCount, maxAttempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: "`X-Webhook-Delivery` header'ında gönderilen değer — alıcının idempotency anahtarı."
        event: { $ref: "#/components/schemas/WebhookEvent" }
        status: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        attemptCount: { type: integer }
        maxAttempts: { type: integer, example: 5 }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        responseStatus: { type: integer, nullable: true, description: "Alıcının HTTP status kodu; ağ/DNS/TLS hatasında null." }
        errorCode:
          type: string
          nullable: true
          description: >
            Makine-okunur hata sınıfı: `timeout` · `dns_failure` ·
            `connection_refused` · `tls_error` · `redirect_not_followed` ·
            `ssrf_blocked` · `http_error` · `unknown`.
        errorMessage: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        containsPii: { type: boolean, description: "true ise `payload` 7 gün sonra redakte edilir (§10.13.10)." }
        redeliveryOfId: { type: string, format: uuid, nullable: true, description: "Elle yeniden gönderimde kaynak kaydın id'si." }
        firstAttemptAt: { type: string, format: date-time, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    WebhookDelivery:
      allOf:
        - $ref: "#/components/schemas/WebhookDeliverySummary"
        - type: object
          description: "Detay DTO'su — `GET .../deliveries/{deliveryId}`."
          properties:
            payload:
              allOf:
                - $ref: "#/components/schemas/WebhookPayloadEnvelope"
              description: >
                Gönderilen gövdenin TAMAMI. Yeniden denemelerde BİREBİR AYNI baytlar
                gönderilir (olay anındaki durum yeniden hesaplanmaz).
                `containsPii: true` kayıtlarda 7 gün sonra `{"redacted": true}`
                ile değiştirilir — o durumda `redeliver` ucu `409` döner.
            responseBodySnippet:
              type: string
              nullable: true
              description: >
                Alıcı yanıtının **ilk 512 karakteri**. Tam gövde ASLA saklanmaz —
                alıcının hata sayfası kendi iç bilgisini sızdırabilir. Okuma 8 KiB
                ile sınırlıdır (yavaş/devasa yanıt bir DoS vektörüdür).

    WebhookPayloadEnvelope:
      type: object
      description: >
        **Giden POST gövdesi — tüm olaylarda AYNI zarf** (§10.13.9). İmzalanan dize
        `${X-Webhook-Timestamp}.${rawBody}` olup gövdenin gönderilen baytlarıyla
        birebir aynı serileştirmesi kullanılır.
      required: [id, event, apiVersion, createdAt, data]
      properties:
        id: { type: string, format: uuid, description: "= `WebhookDelivery.id` = `X-Webhook-Delivery`. Alıcı BUNU idempotency anahtarı olarak kullanır." }
        event: { $ref: "#/components/schemas/WebhookEvent" }
        apiVersion: { type: string, enum: ["v1"] }
        createdAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: >
            Olay kaynağının gövdesi. **Public API DTO'larıyla AYNI şekildedir** —
            tek dış kontrat, sıfır sapma: `PAGE_*` → `PublicPage`, `BLOG_POST_*` →
            `PublicBlogPost`, `PRODUCT_CREATED|UPDATED` → `PublicProduct`,
            `PORTFOLIO_ITEM_*` → `PublicPortfolioItem`.


            İstisnalar: `ORDER_*` → `WebhookOrderPayload` (public API'de sipariş ucu
            yoktur; sipariş webhook'unun tüm anlamı müşteri/tutar bilgisidir).
            `PRODUCT_DELETED` → `{ id, slug }` (kaynak artık yok).
            `PING` → `{ message: "ping", webhookId }`.

    WebhookOrderPayload:
      type: object
      description: >
        `ORDER_*` olaylarının `data` alanı. **Kişisel veri içerir** (`customerEmail`,
        `customerName`) → `WebhookDelivery.containsPii = true` ve payload 7 gün sonra
        redakte edilir. `Order` (admin DTO) ile KARIŞTIRILMAMALI: burada `customerEmail`
        MASKELENMEZ — alıcının siparişi kendi sisteminde eşleştirebilmesi bu ucun
        varlık sebebidir (bkz. §10.13.10, compliance-agent değerlendirmesine açık madde).
      required: [id, orderNumber, status, customerEmail, currency, totalCents, items, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: "ORD-LXK3F2-A1B2" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        previousStatus:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
          nullable: true
          description: "Yalnızca `ORDER_STATUS_CHANGED` olayında dolar."
        customerEmail: { type: string, format: email }
        customerName: { type: string, nullable: true }
        currency: { type: string }
        subtotalCents: { type: integer }
        discountCents: { type: integer }
        taxCents: { type: integer }
        totalCents: { type: integer }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              productSlug: { type: string, nullable: true }
              productTitle: { type: string }
              productSku: { type: string, nullable: true }
              unitPriceCents: { type: integer }
              quantity: { type: integer }
              lineTotalCents: { type: integer }

    # -------------------------------------------------------------------------
    # §10.13.5 Public API DTO'ları — admin DTO'larından AYRI ve DONDURULMUŞ kontrat
    # -------------------------------------------------------------------------
    # ORTAK KURAL (tüm Public* şemaları için, ihlali güvenlik bulgusudur):
    #   `author`, `authorId`, `seoScore`, `seoScoreIssues`, `deletedAt`, `viewCount`,
    #   `translations` (ham blob) ve `localizations` alanları BU KATMANDA DÖNMEZ.
    #   Sebep: (1) admin DTO'larındaki `author` PERSONEL E-POSTASI taşır ve üçüncü
    #   parti bir entegratöre gönderilemez, (2) dış kontrat iç refactor'lardan
    #   yalıtılmalıdır (§10.13.5).

    PublicCategory:
      type: object
      description: "Blog/ürün/portföy kategorilerinin ORTAK public gösterimi — üçü için ayrı şema açılmadı (alan kümesi birebir aynı)."
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    PublicSeo:
      type: object
      description: "Tüm public içerik DTO'larında BİREBİR aynı SEO alan kümesi (§10.2)."
      properties:
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }

    PublicImage:
      type: object
      description: "Galeri görseli — `Media` DTO'sunun public alt kümesi (dosya yolu/boyut/yükleyen bilgisi YOK)."
      required: [url, order]
      properties:
        url: { type: string }
        altText: { type: string, nullable: true }
        order: { type: integer }

    PublicPage:
      allOf:
        - $ref: "#/components/schemas/PublicSeo"
        - type: object
          required: [id, title, slug, blocks, publishedAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            slug: { type: string }
            blocks:
              type: array
              description: >
                Page-builder blokları (§10.9.6). `?locale=` ile alan bazlı fallback
                uygulanmış hâlde döner. Ham JSON'dur — **legacy `columns` düğümleri
                içerebilir**; istemci (headless dahil) `normalizePageNodes()` benzeri bir
                adımla `container`'a normalize ETMELİDİR (§10.19.7).
              items: { type: object, additionalProperties: true }
            isLegalDocument:
              type: boolean
              description: >
                `true` ve istenen dilde çeviri yoksa `blocks` **BOŞ** döner (sessiz
                fallback UYGULANMAZ — KVKK m.10 / GDPR m.12). Bu kural public API
                katmanında da AYNEN geçerlidir; bkz. `LocaleQuery`.
            publishedAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }

    PublicBlogPost:
      allOf:
        - $ref: "#/components/schemas/PublicSeo"
        - type: object
          required: [id, title, slug, contentHtml, publishedAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            slug: { type: string }
            excerpt: { type: string, nullable: true }
            contentHtml: { type: string, description: "Sunucuda sanitize edilmiş HTML (§10.8.4)." }
            coverImageUrl: { type: string, nullable: true }
            category:
              allOf:
                - $ref: "#/components/schemas/PublicCategory"
              nullable: true
            publishedAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }

    PublicProduct:
      allOf:
        - $ref: "#/components/schemas/PublicSeo"
        - type: object
          required: [id, title, slug, priceCents, currency, inStock, publishedAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            slug: { type: string }
            excerpt: { type: string, nullable: true }
            descriptionHtml: { type: string }
            priceCents: { type: integer, description: "HER ZAMAN kuruş/cent — float YOK." }
            discountPriceCents: { type: integer, nullable: true }
            currency: { type: string, example: "TRY" }
            taxRatePercent: { type: string, nullable: true, description: "Decimal(5,2), string olarak serileştirilir. KDV fiyata DAHİLDİR — sadece ayrıştırma amaçlı." }
            sku: { type: string, nullable: true }
            inStock:
              type: boolean
              description: >
                **`stockQuantity` yerine türetilmiş bir boolean döner (bağlayıcı).**
                Ham stok adedi rekabetçi/ticari bir bilgidir ve bir okuma API'sinin
                gerektirdiğinden fazlasını ifşa eder; entegratörün ihtiyacı
                "satılabilir mi?" sorusudur. Gerçek adet gerekirse admin API kullanılır.
            coverImageUrl: { type: string, nullable: true }
            images:
              type: array
              items: { $ref: "#/components/schemas/PublicImage" }
            category:
              allOf:
                - $ref: "#/components/schemas/PublicCategory"
              nullable: true
            publishedAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }

    PublicPortfolioItem:
      allOf:
        - $ref: "#/components/schemas/PublicSeo"
        - type: object
          required: [id, title, slug, order, publishedAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            slug: { type: string }
            summary: { type: string, nullable: true }
            contentHtml: { type: string }
            clientName: { type: string, nullable: true }
            projectUrl: { type: string, nullable: true }
            completedAt: { type: string, format: date-time, nullable: true }
            order: { type: integer, description: "Manuel sıra — liste ucu BUNA göre `asc` sıralar (§10.9.4)." }
            coverImageUrl: { type: string, nullable: true }
            images:
              type: array
              items: { $ref: "#/components/schemas/PublicImage" }
            category:
              allOf:
                - $ref: "#/components/schemas/PublicCategory"
              nullable: true
            publishedAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }
