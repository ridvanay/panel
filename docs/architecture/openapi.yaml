        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicPage" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "403": { $ref: "#/components/responses/ApiKeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/blog:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Yayındaki blog yazılarını listele
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LocaleQuery"
        - name: category
          in: query
          required: false
          description: "Kategori **slug**'ı (id DEĞİL — dış tüketici için id opak/anlamsızdır)."
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicBlogPost" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "403": { $ref: "#/components/responses/ApiKeyForbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/blog/categories:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Blog kategorilerini listele
      description: >
        **Rota önceliği (§10.13.5 madde 5):** bu statik segment `/public/blog/{slug}`
        parametreli rotadan ÖNCE eşleşir (Fastify radix router). Sonuç: `categories`
        slug'lı bir blog yazısı bu uçtan erişilemez olur — kabul edilmiş kısıt.
      responses:
        "200":
          description: OK
          content:
