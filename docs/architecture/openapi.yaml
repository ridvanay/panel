          description: "Çöpteki içeriği autosave etme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/blog/{postId}/restore:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags: [Blog]
      summary: Yazıyı çöpten geri yükle (ADMIN/MANAGER/EDITOR)
      responses:
        "200":
          description: Geri yüklendi
          content:
            application/json:
              schema:
                allOf:
