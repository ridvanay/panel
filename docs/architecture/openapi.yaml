                        items: { $ref: "#/components/schemas/ImportJobSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Import]
      summary: 1. ADIM — dosya yükle ve ÖNİZLEME üret (yalnızca ADMIN, İÇERİK YAZMAZ)
      description: >
        `multipart/form-data`. **Bu uç HİÇBİR Page/BlogPost/User/Media kaydı OLUŞTURMAZ.**
        Dosyayı gizli (public servis edilmeyen) bir konuma yazar, ayrıştırıp doğrular ve
        `status: PENDING` bir `ImportJob` üretir; `preview` alanı kaç kayıt bulunduğunu,
        hangi alanların eşleştiğini/eşleşmediğini ve ilk 5 örnek satırı taşır. Yazma
        2. adımda (`POST .../start`) başlar.


        **Alanlar:**

        - `file` (binary, ZORUNLU) — tek dosya.

        - `type` (string, ZORUNLU) — `#/components/schemas/ImportJobType`.


        `format` İSTEMCİDEN ALINMAZ, sunucu dosyanın gerçek içeriğinden (magic bytes +
        yapısal ayrıştırma) türetir; uzantı/`Content-Type` bilgi amaçlıdır, GÜVENİLMEZ.
        Geçerlilik matrisi (ihlal → 422): `PAGES`,`BLOG` → CSV|JSON · `WORDPRESS` → XML ·
        `PRODUCTS` → XML · `USERS` → CSV · `MEDIA` → ZIP.


        **Boyut limitleri** (global 5 MB multipart limitinin route-level override'ı —
        `request.parts({ limits })` + route `bodyLimit`, bkz. ARCHITECTURE.md §10.8.5):
        `PAGES`/`BLOG`/`USERS` 10 MB · `WORDPRESS` 50 MB · `PRODUCTS` 50 MB ·
        `MEDIA` 100 MB.
        **Her boyut aşımı İSTİSNASIZ 413 `PAYLOAD_TOO_LARGE` döner** — tip-bazlı limit de,
        100 MB'lık sert üst tavan da, Fastify core `bodyLimit`i de. 422 DÖNMEZ (bkz.
        ARCHITECTURE.md §10.8.5 "413/422 kararı").


        **Kayıt sayısı tavanları** (aşım → 422, iş oluşturulmaz): `USERS` 500 satır ·
        `PAGES`/`BLOG` 5.000 satır · `WORDPRESS` 10.000 item · `PRODUCTS` 5.000 kayıt ·
        `MEDIA` 500 dosya. `PRODUCTS`'ın tavanı `WORDPRESS`'ten DÜŞÜKTÜR: ürün satırı
        başına düşen doğrulama (fiyat/SKU tekilliği/kategori upsert) daha pahalıdır ve
        tavan, İŞLENECEK `product` item'ı üzerinden sayılır — aynı dosyadaki yazı/sayfa/
        attachment item'ları bu sayıya girmez.


        **Hız sınırı:** 10 istek / 10 dakika (route-level). Aşım → 429.


        Audit log: `import.upload` (metadata: `type`, `format`, `sizeBytes`, `totalCount`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateImportJobRequest" }
      responses:
        "201":
          description: "Dosya kabul edildi, önizleme hazır (`status: PENDING`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            Dosya yok / bozuk / `type` ile format uyuşmuyor / kayıt tavanı aşıldı /
            XML'de DOCTYPE-DTD tespit edildi veya iç içe geçme 100 seviyeyi aştı (bkz.
            ARCHITECTURE.md §10.8.6 XXE savunması) / ZIP bombası ya da güvensiz arşiv
            yolu (zip-slip) tespit edildi. `error.details` alan-bazlı açıklama taşır.


            **Bu kontrollerin HEPSİ yükleme anında yapılır ve iş OLUŞTURULMAZ** — kaynak
            dosyadan statik olarak tespit edilebilen hiçbir kusur `FAILED` bir işe
            dönüşmez. `FAILED`, yalnızca çalışma anında ortaya çıkan hatalara ayrılmıştır
            (DB hatası, sunucu yeniden başlatma). Boyut aşımı bu daldan DEĞİL, 413'ten döner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/import/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    get:
      tags: [Import]
      summary: İşin durumunu/ilerlemesini/özet raporunu getir — POLL UCU (yalnızca ADMIN)
      description: >
        Frontend bu ucu **2 saniyede bir** poll eder (WebSocket/SSE YOKTUR — projede
        realtime altyapısı yok, bkz. ARCHITECTURE.md §10.8). Worker sayaçları her 25
        kayıtta bir DB'ye yazar, dolayısıyla ilerleme çubuğu adım adım artar.


        `status` ∈ `COMPLETED|FAILED|CANCELLED` olduğunda poll durdurulur ve özet rapor
        gösterilir: "`totalCount` kayıttan `successCount` başarılı, `errorCount` hata"
        (+ `skippedCount`). Hata nedenleri için `GET .../errors`.


        Kullanıcı sayfadan ayrılabilir: iş sunucu tarafında devam eder, dönüşte bu uç
        güncel durumu verir. Bildirim, frontend'in bu ucu poll etmesiyle üretilen bir
        toast'tır (bkz. ARCHITECTURE.md §10.6 toast standardı).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Import]
      summary: İş kaydını sil — geçmişten kaldır (yalnızca ADMIN)
      description: >
        `ImportJobError` satırlarını (FK cascade) ve varsa kalan kaynak dosyayı da siler.
        **İçe aktarılmış içeriği GERİ ALMAZ** — geri alma (rollback) v1 KAPSAM DIŞIDIR;
        yanlış içe aktarım, ilgili listelerden toplu çöpe taşıma ile temizlenir
        (`POST /admin/{pages|blog}/bulk`, `action: trash`).


        `status: PROCESSING` olan iş SİLİNEMEZ → 409 (`"İşlenen bir iş silinemez. Önce
        iptal edin."`). Audit log: `import.delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İş işlenirken silinemez (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/import/jobs/{jobId}/start:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    post:
      tags: [Import]
      summary: 2. ADIM — onayla ve arka planda işlemeyi başlat (yalnızca ADMIN)
      description: >
        `PENDING` → `QUEUED` geçişi yapar ve **202 ile HEMEN döner**; yazma işlemi
        istek/yanıt döngüsünün DIŞINDA, aynı Node süreci içinde asenkron olarak yürür
        (kuyruk altyapısı yok — karar ve gerekçesi ARCHITECTURE.md §10.8'de).


        Aynı anda **yalnızca BİR iş** `PROCESSING` olabilir; ikinci iş `QUEUED`'da
        sırasını bekler. Bu, isteği başarısız KILMAZ.


        `status` `PENDING` değilse → 409 (`"Bu iş zaten başlatılmış."`) — istek
        idempotent DEĞİLDİR, çift tıklama korumasını frontend + bu 409 birlikte sağlar.


        Gövde, önizleme ekranında yapılan seçimleri taşır (alan eşleştirme + çakışma
        stratejisi). Gövde boş gönderilirse `POST /admin/import/jobs` yanıtındaki
        `preview.suggestedMapping` ve `duplicateStrategy: skip` varsayılanları uygulanır.


        Audit log: `import.start` (metadata: `type`, `totalCount`, `duplicateStrategy`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartImportJobRequest" }
      responses:
        "202":
          description: "Kabul edildi, arka planda işleniyor (`status: QUEUED`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İş `PENDING` durumunda değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/import/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    post:
      tags: [Import]
      summary: İşi iptal et (yalnızca ADMIN)
      description: >
        **İşbirlikçi (cooperative) iptaldir:** `cancelRequestedAt = now()` yazılır, worker
        bunu HER PARTİ (25 kayıt) başında kontrol eder ve fark ettiğinde durup
        `status: CANCELLED` yapar. Bu yüzden yanıt anında `status` hâlâ `PROCESSING`
        olabilir — frontend poll ederek `CANCELLED`'ı bekler.


        **O ana kadar yazılmış kayıtlar GERİ ALINMAZ** (rollback yok, bkz.
        `DELETE /admin/import/jobs/{jobId}`); sayaçlar nerede kalındığını gösterir.
        `PENDING`/`QUEUED` bir iş anında `CANCELLED` olur (hiç kayıt yazılmamıştır).


        `COMPLETED|FAILED|CANCELLED` bir iş için → 409. Audit log: `import.cancel`.
      responses:
        "200":
          description: İptal talebi alındı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İş zaten sonlanmış (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/import/jobs/{jobId}/errors:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    get:
      tags: [Import]
      summary: İşin satır-bazlı hata/atlama kayıtlarını listele (yalnızca ADMIN)
      description: >
        Özet rapordaki "3 hata" satırına tıklanınca açılan liste. Cursor sayfalı,
        `seq ASC` (dosyadaki sırayla). İş başına EN FAZLA 1.000 hata satırı saklanır;
        aşıldığında yazma durur (`ImportJob.errorCount` gerçek sayıyı saymaya devam eder)
        ve `meta.truncated: true` döner.


        Bu satırlar `rawData` içinde KİŞİSEL VERİ taşıyabilir (ör. `USERS` içe aktarımında
        e-posta) → saklama süresi ve maskeleme kuralı compliance-agent'ın alanıdır
        (bkz. ARCHITECTURE.md §10.8 "Saklama & KVKK").
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ImportJobError" }
                      meta: { $ref: "#/components/schemas/ImportJobErrorListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reports/exports:
    get:
      tags: [Reports]
      summary: Dışa aktarma işi geçmişini listele (yalnızca SiteRole=ADMIN)
      description: >
        Cursor sayfalı, `seq DESC` (en yeni önce). `type`/`status` ile filtrelenebilir.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExportJobTypeFilter"
        - $ref: "#/components/parameters/ExportJobStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ExportJob" }
                      meta: { $ref: "#/components/schemas/ExportJobListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Reports]
      summary: Yeni bir analitik rapor dışa aktarma işi oluştur (yalnızca SiteRole=ADMIN)
      description: >
        **202 ile HEMEN döner** (`status: PENDING`); rapor (CSV/PDF) süreç-içi bir worker
        tarafından arka planda üretilir — kuyruk altyapısı YOK (`/admin/import/jobs`'un
        2. adımıyla AYNI desen, bkz. ARCHITECTURE.md §10.8.1/§10.8.10). Hazır olduğunda
        `GET /{jobId}` ile durum poll edilir, `status: COMPLETED` olunca
        `GET /{jobId}/download` ile indirilir.


        `from`/`to` ZORUNLUDUR (aralık en fazla 366 gün — aşımı 422, iş HİÇ
        oluşturulmaz). `filters` yalnızca ilgili `type` için anlamlıdır: `USERS` →
        `filters.role`, `REVENUE` → `filters.subscriptionStatus`; diğer tiplerde YOK
        SAYILIR.


        **`unmaskPii`** (varsayılan `false`) — `true` verilirse `USERS`/`REVENUE`
        raporlarındaki e-posta gibi alanlar MASKELENMEDEN dönülür. Bu zaten ADMIN-only
        bir uç olduğu için AYRI bir onay akışı YOKTUR, ancak `reports.export.unmasked_pii`
        adıyla AYRI bir audit kaydı yazılır ve üretilen `ExportJob.containsPii = true`
        set edilir. Saklama süresi bu durumda KISALIR: varsayılan (maskeli) dosyalar 7
        gün, `unmaskPii: true` ile üretilenler yalnızca 48 saat saklanır (compliance-agent
        kararı, bkz. ARCHITECTURE.md §10.8.10).


        Audit log: `reports.export.create` (+ `unmaskPii: true` ise ayrıca
        `reports.export.unmasked_pii`).


        **Hız sınırı:** 10 istek / 10 dakika (route-level, pahalı DB aggregation +
        PDF/CSV üretimi tetiklediği için). Aşım → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportJobRequest" }
      responses:
        "202":
          description: "Kabul edildi, arka planda üretiliyor (`status: PENDING`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/reports/exports/{jobId}:
    parameters:
      - $ref: "#/components/parameters/ExportJobId"
    get:
      tags: [Reports]
      summary: İşin durumunu/sonucunu getir — POLL UCU (yalnızca SiteRole=ADMIN)
      description: >
        `status` `COMPLETED` olduğunda `GET .../download` ile dosya indirilebilir hâle
        gelir. `status` `FAILED` ise `errorSummary` başarısızlık nedenini taşır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reports/exports/{jobId}/download:
    parameters:
      - $ref: "#/components/parameters/ExportJobId"
    get:
      tags: [Reports]
      summary: Hazır dosyayı indir (yalnızca SiteRole=ADMIN)
      description: >
        `Content-Type` rapor formatına göre `text/csv; charset=utf-8` ya da
        `application/pdf`'tir; `Content-Disposition: attachment` ile birlikte döner
        (dosya adı `export-{type}-{jobId}.{csv|pdf}`). `storagePath` API'de ASLA
        dönmez — dosya bu uç üzerinden akıtılır.


        `status !== COMPLETED` (dosya henüz hazır değil) → 409. `expiresAt` geçmişse
        (saklama süresi dolmuşsa) → 404, `status` ne olursa olsun. Audit log:
        `reports.export.download` (metadata: `containsPii`).
      responses:
        "200":
          description: Dosya akışı
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "İş bulunamadı VEYA indirme süresi dolmuş (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Rapor henüz hazır değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /settings:
    get:
      tags: [Settings]
      security: []
      summary: Site ayarlarını oku (public)
      description: >
        Henüz hiç `PATCH /admin/settings` çağrılmadıysa (satır yok) sabit varsayılanlar
        döner: `{ siteName: "Site", logoUrl: null, homePageId: null, siteTemplate:
        SHOWCASE }` — lazy-upsert paterni (bkz. `settings.routes.ts::DEFAULTS`,
        `ARCHITECTURE.md` §10.9.5).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }

  /settings/homepage:
    get:
      tags: [Settings]
      security: []
      summary: Kök `/` rotasında render edilecek sayfayı getir (public)
      description: >
        `SiteSettings.homePageId` boşsa VEYA seçili sayfa yayında/çöpte değilse `data:
        null` döner — frontend bu durumda kendi varsayılan (SaaS pazarlama) fallback'ini
        gösterir.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        allOf: [{ $ref: "#/components/schemas/Page" }]
                        nullable: true

  /admin/settings:
    get:
      tags: [Settings]
      summary: Site ayarlarını oku (authenticated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Settings]
      summary: Site ayarlarını güncelle (yalnızca SiteRole=ADMIN)
      description: >
        Satır yoksa (ilk çağrı) `DEFAULTS` ile birlikte oluşturulur (upsert). Audit log:
        `settings.update` (`metadata.changed` = gönderilen alan adları).


        `siteTemplate` — §10.9.5 Site Şablonu (bkz. ARCHITECTURE.md). **SADECE tavsiye
        niteliğindedir**: değeri değiştirmek HİÇBİR modülü otomatik açmaz/kapatmaz,
        yalnızca frontend kurulum sihirbazının hangi modülleri/blok tiplerini
        ÖNERECEĞİNİ belirler (bkz. `SiteModule.recommendedFor`). Modül açma/kapama
        HER ZAMAN `PATCH /admin/modules/{key}` ile ayrı bir işlemdir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteSettingsRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/modules:
    get:
      tags: [Modules]
      summary: Modül listesini oku — tanım + aktif/pasif durum (ADMIN/EDITOR/VIEWER)
      description: >
        Kod içi statik `MODULE_REGISTRY`'deki HER modül tanımı (`key`/`label`/
        `description`/`recommendedFor`) `SiteModule` tablosundaki (varsa) durum
        satırıyla LEFT JOIN mantığıyla birleştirilir — registry'de olup DB'de satırı
        olmayan bir modül `defaultEnabled` değeriyle, `updatedAt: null`/`updatedBy: null`
        olarak döner (bkz. ARCHITECTURE.md §10.9.1).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SiteModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/modules/{key}:
    parameters:
      - $ref: "#/components/parameters/ModuleKey"
    patch:
      tags: [Modules]
      summary: Bir modülü aç/kapat (yalnızca SiteRole=ADMIN)
      description: >
        `key` registry'de tanımlı değilse `404 NOT_FOUND` döner. DB'de satır yoksa
        (ilk toggle) lazy-upsert ile oluşturulur. Audit log: `module.enable` /
        `module.disable` (`metadata: { key, enabled }`).


        **Kapatmanın etkisi:** ilgili modülün PUBLIC uçları (`Products`/`Portfolio`/
        `Cart`/`Checkout` tag'leri) `404 NOT_FOUND` döner — admin uçları ETKİLENMEZ,
        mevcut veri korunur (bkz. ARCHITECTURE.md §10.9.1 "neden 404, neden admin
        guard'lanmıyor").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModuleRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /modules:
    get:
      tags: [Modules]
      security: []
      summary: Aktif modül anahtarlarını oku (public)
      description: >
        Site header/nav'ının hangi modülleri (ör. "Ürünler" menü linki) göstereceğine
        karar vermek için okuduğu dar/minimal görünüm — `label`/`description`/
        `updatedBy` TAŞIMAZ.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicSiteModule" }

  /admin/products:
    get:
      tags: [Products]
      summary: Ürünleri listele — çöp filtresi + sekme sayaçları + arama (authenticated)
      description: >
        Çöp kutusu semantiği, sekme sayaçları (`meta.counts`) ve cursor sayfalama
        `Pages`/`Blog` (§10.7) ile BİREBİR AYNIDIR. EK olarak `search` — `title`/`sku`
        alanlarında büyük/küçük harf duyarsız (`contains`, `insensitive`) arama yapar.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/TrashedFilter"
        - $ref: "#/components/parameters/ContentStatusFilter"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      meta: { $ref: "#/components/schemas/ContentListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Products]
      summary: Yeni ürün oluştur (ADMIN/EDITOR)
      description: >
        `slug` verilmezse `title`'dan üretilir. `authorId` verilmezse giriş yapmış
        kullanıcı yazar olur (yalnızca ADMIN başka bir kullanıcı atayabilir — §10.7 ile
        AYNI kural). `priceCents`/`discountPriceCents` HER ZAMAN kuruş/cent cinsinden
        pozitif tam sayıdır (float KESİNLİKLE kabul edilmez). `discountPriceCents`
        verilmişse `priceCents`'ten KÜÇÜK olmalıdır, aksi halde `422
        VALIDATION_ERROR` (`error.details.discountPriceCents`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Ürün oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Products]
      summary: Ürün detayı (authenticated)
      description: "Çöpteki ürünü de döner (geri yükleme/onay ekranları için) — `deletedAt` filtresi YOKTUR."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Products]
      summary: Ürünü güncelle (ADMIN/EDITOR)
      description: >
        Her başarılı PATCH, güncellemeden önceki hali `ContentRevision` olarak kaydeder
        (`entityType: PRODUCT`, §10.1 ile AYNI mekanizma); revizyonlar
        `GET /admin/products/{productId}/revisions` ile listelenir ve
        `POST .../revisions/{revisionId}/restore` ile geri yüklenir (Page/BlogPost ile
        TAM PARİTE). Çöpteki bir ürün DÜZENLENEMEZ → `409 CONFLICT`. Fiyat/
        indirim doğrulaması `POST` ile AYNIDIR (nihai/etkin değerler üzerinden çapraz
        kontrol edilir — istekte yalnızca `discountPriceCents` gönderilse dahi mevcut
        kayıttaki `priceCents`'e göre doğrulanır).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği düzenleme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Products]
      summary: Ürünü ÇÖPE TAŞI — soft delete (ADMIN/EDITOR)
      description: "`Pages`/`Blog` (§10.7) ile BİREBİR AYNI davranış. İdempotenttir. Kalıcı silme için `DELETE .../permanent` (yalnızca ADMIN)."
      responses:
        "204": { description: Çöpe taşındı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/autosave:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Ürünü otomatik kaydet — 3sn debounce (ADMIN/EDITOR)
      description: >
        Davranış `POST /admin/pages/{pageId}/autosave` ile BİREBİR AYNI — oradaki
        açıklama (`ContentRevision` ÜRETMEZ, `AuditLog` YAZMAZ, çöpteki içerik 409)
        bağlayıcıdır. Gövde `UpdateProductRequest`'in DAR bir alt kümesidir — yalnızca
        serbest metin alanları (`title`/`excerpt`/`descriptionHtml`) korunur.
        **Fiyat/indirim/SKU/stok/durum bu uçtan DEĞİŞTİRİLEMEZ** (şema seviyesinde
        yoktur): `priceCents`/`discountPriceCents` çapraz-alan kuralı ve `sku` tekilliği
        yarım kalmış bir taslak üzerinde 3 saniyede bir doğrulanamaz; ticari alanlar
        yalnızca bilinçli `PATCH` ile yazılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutosaveProductRequest" }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AutosaveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği autosave etme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/bulk:
    post:
      tags: [Products]
      summary: Ürünlerde toplu işlem (ADMIN/EDITOR; permanent-delete yalnızca ADMIN)
      description: >
        `POST /admin/pages/bulk` ile BİREBİR AYNI gövde, aynı yanıt, aynı atlama
        kuralları, aynı ADMIN-only `permanent-delete` eşiği (EDITOR gönderirse tüm
        istek 403, kısmi uygulama YAPILMAZ). Audit action öneki `product.bulk_<action>`.


        **Atomiklik (mimar kararı — ortak helper):** `pages`/`blog` ile aynı kod yolu
        kullanılır; toplu işlem TEK bir transaction içinde çalışır ve `permanent-delete`
        dalında ilgili `ContentRevision` satırları (`entityType: PRODUCT`) aynı
        transaction'da elle silinir (polymorphic, FK YOK). Atlanan id'ler transaction'ı
        BOZMAZ — kısmi başarı bir hata değildir (200 + `skippedIds`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkContentActionRequest" }
      responses:
        "200":
          description: İşlem uygulandı (kısmi başarı dahil)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BulkContentActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [ContentRevisions]
      summary: Ürünün revizyon geçmişini listele (ADMIN/EDITOR)
      description: >
        `GET /admin/pages/{pageId}/revisions` ile BİREBİR AYNI sözleşme — liste görünümü
        `snapshot` alanını İÇERMEZ, en yeni revizyon önce gelir. Kayıtlar
        `entityType: PRODUCT` filtresiyle okunur.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContentRevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Ürünü bu revizyondaki hale geri döndür (ADMIN/EDITOR)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon olarak
        kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.


        **`Page`/`BlogPost`'tan TEK FARK — 422 dalı vardır.** Snapshot uygulanmadan ÖNCE
        `PATCH /admin/products/{productId}` ile AYNI çapraz-alan doğrulamaları
        çalıştırılır: `discountPriceCents < priceCents`
        (`products.routes.ts::assertDiscountBelowPrice`). Doğrulama düşerse hiçbir şey
        yazılmaz (transaction geri alınır) ve `422 VALIDATION_ERROR` döner. Ayrıca
        snapshot'taki `sku`/`slug` bu arada BAŞKA bir kayda geçmişse `409 CONFLICT`
        döner — geri yükleme tekilliği ASLA ihlal etmez.
      responses:
        "200":
          description: Ürün geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Snapshot'taki `slug` veya `sku` bu arada başka bir kayda geçmiş, ya da ürün
            çöpte (`error.code: CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Ürünü çöpten geri yükle (ADMIN/EDITOR)
      description: "`status` DEĞİŞMEZ. İdempotenttir — çöpte olmayan ürün için de 200 ve mevcut kayıt döner."
      responses:
        "200":
          description: Geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/permanent:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    delete:
      tags: [Products]
      summary: Ürünü KALICI sil — geri alınamaz (yalnızca ADMIN)
      description: >
        Ürün ÖNCE çöpte olmalıdır, değilse `409 CONFLICT`. Aynı transaction içinde
        `ContentRevision` satırları (polymorphic, FK YOK → elle silinir, `entityType:
        PRODUCT`) temizlenir. Audit log: `product.permanent_delete`.
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Ürün çöpte değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/products/{productId}/stock:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [Products]
      summary: Stoku ELLE düzelt (ADMIN/EDITOR)
      description: >
        Adminin manuel stok düzeltmesi içindir — checkout'un OTOMATİK stok düşürmesiyle
        (bkz. `Webhooks` tag'i, `handleOrderPaid`) KARIŞTIRILMAMALIDIR; bu uç Serializable
        transaction KULLANMAZ (basit doğrudan `UPDATE`). Audit log: `product.stock_adjust`
        (`metadata: { from, to }`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustProductStockRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/images:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Ürün galerisine görsel ekle (ADMIN/EDITOR)
      description: >
        `mediaId` galeride ZATEN varsa (`@@unique([productId, mediaId])`) `409
        CONFLICT`. Yeni satır mevcut en yüksek `order` değerinin bir fazlasına eklenir
        (galerinin SONUNA). Güncellenmiş `Product` DTO'sunu (galeri dahil) döner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProductImageRequest" }
      responses:
        "201":
          description: Galeriye eklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Ürün VEYA medya bulunamadı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Görsel zaten galeride (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/ImageId"
    delete:
      tags: [Products]
      summary: Ürün galerisinden görsel kaldır (ADMIN/EDITOR)
      description: >
        `imageId`'nin GERÇEKTEN bu `productId`'ye ait olduğu doğrulanır (IDOR
        koruması) — eşleşmezse `404 NOT_FOUND`. Güncellenmiş `Product` DTO'sunu
        (galeri dahil) döner.
      responses:
        "200":
          description: Galeriden kaldırıldı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/categories:
    get:
      tags: [Products]
      summary: Ürün kategorilerini listele (authenticated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ProductCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Products]
      summary: Yeni ürün kategorisi oluştur (ADMIN/EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductCategoryRequest" }
      responses:
        "201":
          description: Kategori oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ProductCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/ProductCategoryId"
    patch:
      tags: [Products]
      summary: Ürün kategorisini güncelle (ADMIN/EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductCategoryRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ProductCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Products]
      summary: Ürün kategorisini sil (yalnızca ADMIN)
      description: "Kategoriye bağlı ürünler `SetNull` ile kategorisiz kalır (silinmez)."
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products:
    get:
      tags: [Products]
      security: []
      summary: Yayınlanmış ürünleri listele (public)
      description: >
        Yalnızca `status: PUBLISHED` ve çöpte olmayan (`deletedAt: null`) ürünler döner.
        `products` modülü kapalıysa `404 NOT_FOUND` (bkz. `Modules` tag'i).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
        "404":
          description: "Modül kapalı VEYA kaynak yok (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /products/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProductSlug"
    get:
      tags: [Products]
      security: []
      summary: Ürün detayı — slug ile (public)
      description: "Yayınlanmamış/çöpteki/kapalı-modül ürünler için `404 NOT_FOUND`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{slug}/view:
    parameters:
      - $ref: "#/components/parameters/ProductSlug"
    post:
      tags: [Products]
      security: []
      summary: Görüntülenme sayacını artır (public, kimliksiz)
      description: "`Product.viewCount` +1 yapar. Bot/tekrar-tıklama koruması YOKTUR (v1 kapsam dışı, `Page`/`BlogPost` view sayaçlarıyla AYNI basit yaklaşım)."
      responses:
        "204": { description: Sayıldı }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/portfolio:
    get:
      tags: [Portfolio]
      summary: Portföy öğelerini listele — çöp filtresi + sekme sayaçları + arama (authenticated)
      description: >
        `Products`/`Pages`/`Blog` ile BİREBİR AYNI çöp kutusu/sekme sayacı/cursor
        sayfalama semantiği. `search` — `title`/`clientName` alanlarında büyük/küçük
        harf duyarsız arama yapar.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/TrashedFilter"
        - $ref: "#/components/parameters/ContentStatusFilter"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PortfolioItem" }
                      meta: { $ref: "#/components/schemas/ContentListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Portfolio]
      summary: Yeni portföy öğesi oluştur (ADMIN/EDITOR)
      description: >
        `slug` verilmezse `title`'dan üretilir. `order` manuel sıralama alanıdır
        (kullanıcı kararı) — `viewCount`/iç `seq` sayacıyla KARIŞTIRILMAMALIDIR, public
        liste BUNA göre `asc` sıralanır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePortfolioItemRequest" }
      responses:
        "201":
          description: Öğe oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/portfolio/{itemId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
    get:
      tags: [Portfolio]
      summary: Portföy öğesi detayı (authenticated)
      description: "Çöpteki öğeyi de döner (geri yükleme/onay ekranları için) — `deletedAt` filtresi YOKTUR."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Portfolio]
      summary: Portföy öğesini güncelle (ADMIN/EDITOR)
      description: >
        `Product` (`PATCH /admin/products/{productId}`) ile BİREBİR AYNI davranış:
        güncellemeden önceki hal `ContentRevision` olarak yazılır (`entityType:
        PORTFOLIO_ITEM`) ve `GET/POST /admin/portfolio/{itemId}/revisions[...]` ile
        listelenip geri yüklenebilir. Çöpteki bir öğe DÜZENLENEMEZ → `409 CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePortfolioItemRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği düzenleme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Portfolio]
      summary: Portföy öğesini ÇÖPE TAŞI — soft delete (ADMIN/EDITOR)
      description: "İdempotenttir. Kalıcı silme için `DELETE .../permanent` (yalnızca ADMIN)."
      responses:
        "204": { description: Çöpe taşındı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/portfolio/{itemId}/autosave:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
    post:
      tags: [Portfolio]
      summary: Portföy öğesini otomatik kaydet — 3sn debounce (ADMIN/EDITOR)
      description: >
        `POST /admin/products/{productId}/autosave` ile BİREBİR AYNI davranış
        (`ContentRevision` ÜRETMEZ, `AuditLog` YAZMAZ, çöpteki içerik 409). Gövde
        `UpdatePortfolioItemRequest`'in DAR bir alt kümesidir — yalnızca
        `title`/`summary`/`contentHtml` korunur; `status`/`slug`/`order`/`clientName`/
        `projectUrl`/`completedAt`/SEO/çeviri bu uçtan DEĞİŞTİRİLEMEZ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutosavePortfolioItemRequest" }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AutosaveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği autosave etme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/portfolio/bulk:
    post:
      tags: [Portfolio]
      summary: Portföy öğelerinde toplu işlem (ADMIN/EDITOR; permanent-delete yalnızca ADMIN)
      description: >
        `POST /admin/products/bulk` ile BİREBİR AYNI gövde, yanıt, atlama kuralları ve
        atomiklik garantisi (ortak helper, tek transaction); `permanent-delete` dalında
        `ContentRevision` satırları `entityType: PORTFOLIO_ITEM` ile temizlenir. Audit
        action öneki `portfolio_item.bulk_<action>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkContentActionRequest" }
      responses:
        "200":
          description: İşlem uygulandı (kısmi başarı dahil)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BulkContentActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/portfolio/{itemId}/revisions:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
    get:
      tags: [ContentRevisions]
      summary: Portföy öğesinin revizyon geçmişini listele (ADMIN/EDITOR)
      description: >
        `GET /admin/products/{productId}/revisions` ile BİREBİR AYNI sözleşme; kayıtlar
        `entityType: PORTFOLIO_ITEM` filtresiyle okunur.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContentRevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/portfolio/{itemId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/portfolio/{itemId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Portföy öğesini bu revizyondaki hale geri döndür (ADMIN/EDITOR)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon olarak
        kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.


        **`Product`'ın AKSİNE 422 dalı YOKTUR** — `PortfolioItem`'da doğrulanacak bir
        çapraz-alan kuralı (fiyat/indirim gibi) BULUNMAZ. Yalnızca `slug` tekilliği
        korunur: snapshot'taki `slug` bu arada başka bir kayda geçmişse `409 CONFLICT`.
      responses:
        "200":
          description: Portföy öğesi geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Snapshot'taki `slug` bu arada başka bir kayda geçmiş, ya da öğe çöpte
            (`error.code: CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/portfolio/{itemId}/restore:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
    post:
      tags: [Portfolio]
      summary: Portföy öğesini çöpten geri yükle (ADMIN/EDITOR)
      description: "`status` DEĞİŞMEZ. İdempotenttir."
      responses:
        "200":
          description: Geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/portfolio/{itemId}/permanent:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
    delete:
      tags: [Portfolio]
      summary: Portföy öğesini KALICI sil — geri alınamaz (yalnızca ADMIN)
      description: >
        Öğe ÖNCE çöpte olmalıdır, değilse `409 CONFLICT`. `ContentRevision` satırları
        (`entityType: PORTFOLIO_ITEM`) aynı transaction'da elle silinir. Audit log:
        `portfolio_item.permanent_delete`.
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Öğe çöpte değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/portfolio/{itemId}/images:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
    post:
      tags: [Portfolio]
      summary: Portföy öğesi galerisine görsel ekle (ADMIN/EDITOR)
      description: >
        `Products` (`POST /admin/products/{productId}/images`) ile BİREBİR AYNI davranış:
        `mediaId` galeride ZATEN varsa (`@@unique([portfolioItemId, mediaId])`) `409
        CONFLICT`, yeni satır galerinin SONUNA eklenir. Güncellenmiş `PortfolioItem`
        DTO'sunu (galeri dahil) döner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPortfolioImageRequest" }
      responses:
        "201":
          description: Galeriye eklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Öğe VEYA medya bulunamadı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Görsel zaten galeride (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/portfolio/{itemId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioItemId"
      - $ref: "#/components/parameters/ImageId"
    delete:
      tags: [Portfolio]
      summary: Portföy öğesi galerisinden görsel kaldır (ADMIN/EDITOR)
      description: >
        `imageId`'nin GERÇEKTEN bu `itemId`'ye ait olduğu doğrulanır (IDOR koruması) —
        eşleşmezse `404 NOT_FOUND`. Güncellenmiş `PortfolioItem` DTO'sunu (galeri
        dahil) döner.
      responses:
        "200":
          description: Galeriden kaldırıldı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/portfolio/categories:
    get:
      tags: [Portfolio]
      summary: Portföy kategorilerini listele (authenticated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PortfolioCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Portfolio]
      summary: Yeni portföy kategorisi oluştur (ADMIN/EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePortfolioCategoryRequest" }
      responses:
        "201":
          description: Kategori oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/portfolio/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/PortfolioCategoryId"
    patch:
      tags: [Portfolio]
      summary: Portföy kategorisini güncelle (ADMIN/EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePortfolioCategoryRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Portfolio]
      summary: Portföy kategorisini sil (yalnızca ADMIN)
      description: "Kategoriye bağlı öğeler `SetNull` ile kategorisiz kalır (silinmez)."
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /portfolio:
    get:
      tags: [Portfolio]
      security: []
      summary: Yayınlanmış portföy öğelerini listele (public)
      description: >
        Yalnızca `status: PUBLISHED` ve çöpte olmayan öğeler döner, **manuel `order`
        alanına göre `asc` sıralanır** (`seq`/`viewCount` DEĞİL). `portfolio` modülü
        kapalıysa `404 NOT_FOUND`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PortfolioItem" }
        "404":
          description: "Modül kapalı VEYA kaynak yok (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /portfolio/{slug}:
    parameters:
      - $ref: "#/components/parameters/PortfolioSlug"
    get:
      tags: [Portfolio]
      security: []
      summary: Portföy öğesi detayı — slug ile (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PortfolioItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /portfolio/{slug}/view:
    parameters:
      - $ref: "#/components/parameters/PortfolioSlug"
    post:
      tags: [Portfolio]
      security: []
      summary: Görüntülenme sayacını artır (public, kimliksiz)
      responses:
        "204": { description: Sayıldı }
        "404": { $ref: "#/components/responses/NotFound" }

  /cart:
    get:
      tags: [Cart]
      security: []
      summary: Sepeti oku (public, kimliksiz)
      description: >
        `cart_token` çerezi yoksa VEYA eşleşen/süresi geçmemiş bir sepet yoksa
        BOŞ sepet döner (`{ items: [], currency: null, subtotalCents: 0 }`) — hata
        DEĞİLDİR. `products` modülü kapalıysa `404 NOT_FOUND`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Cart" }
        "404":
          description: "Modül kapalı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /cart/items:
    post:
      tags: [Cart]
      security: []
      summary: Sepete ürün ekle (public, kimliksiz)
      description: >
        **Sepet cookie'si YOKSA burada lazy-create edilir** — opak bir token üretilir,
        `Cart.tokenHash` alanına SHA-256 hash'i yazılır (ham değer asla DB'ye gitmez),
        ham token `Set-Cookie: cart_token=...` ile döner (`httpOnly`, `secure` yalnızca
        prod, `sameSite: lax`, `path: /`, 30 gün — bkz. ARCHITECTURE.md §10.9.3 "misafir
        sepet"). Aynı ürün zaten sepette varsa miktar TOPLANIR (üst sınır 99).


        Sepette farklı bir para biriminden ürün varsa (`Cart.currency` != eklenecek
        ürünün `currency`'si) `409 CONFLICT`; sepet BOŞSA para birimi yeni eklenen ürüne
        göre YENİDEN belirlenir. Stokta yoksa (`stockQuantity === 0`) `409 CONFLICT`.
        Fiyat, ekleme ANINDA `Product.discountPriceCents ?? priceCents` olarak
        DONDURULUP (`CartItem.unitPriceCents`) satıra yazılır — sonraki fiyat
        değişikliklerinden ETKİLENMEZ (checkout'ta tekrar taze okunur, bkz. `Checkout`
        tag'i).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemRequest" }
      responses:
        "201":
          description: Eklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Cart" }
        "404":
          description: "Ürün bulunamadı VEYA modül kapalı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Ürün tükenmiş VEYA para birimi çakışması (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cart/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/CartItemId"
    patch:
      tags: [Cart]
      security: []
      summary: Sepet satırının miktarını güncelle (public, kimliksiz)
      description: "Yalnızca `cart_token` çerezinin SAHİP OLDUĞU sepetteki satırlar güncellenebilir — başka bir sepete ait `itemId` `404 NOT_FOUND` döner."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCartItemRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Cart]
      security: []
      summary: Sepet satırını kaldır (public, kimliksiz)
      responses:
        "204": { description: Kaldırıldı }
        "404": { $ref: "#/components/responses/NotFound" }

  /checkout/session:
    post:
      tags: [Checkout]
      security: []
      summary: Stripe Checkout oturumu oluştur (public, kimliksiz)
      description: >
        **Hız sınırı: 10 istek/dakika (IP bazlı, route-level override)** — para hareketi
        başlatan bu uca özel sıkı bir üst sınırdır (bkz. ARCHITECTURE.md §10.9.3).


        Akış: `cart_token` çerezinden sepet okunur (yok/boşsa `409 CONFLICT`, "Sepetiniz
        boş."). **GÜVENLİK: fiyat/stok istemciden (sepetteki dondurulmuş fiyattan)
        ASLA kabul edilmez** — her satır, sipariş oluşturulmadan hemen önce `Product`
        tablosundan TAZE okunur; ürün artık yayında değilse/silinmişse veya stok
        yetersizse `409 CONFLICT` (kullanıcı dostu Türkçe mesajla, ör. `"\"X\" için
        yeterli stok yok."`) — sipariş HİÇ oluşturulmaz.


        Doğrulama geçerse: `status: PENDING` bir `Order` (+ `OrderItem` satırları,
        `productTitle`/`productSku`/`unitPriceCents` SNAPSHOT olarak) oluşturulur, ardından
        Stripe'ta `mode: payment` bir Checkout Session açılır. **Fiyatlar HER ZAMAN
        `price_data` ile dinamik gönderilir — Stripe Dashboard'da önceden tanımlı bir
        `Price` ID'si ASLA kullanılmaz** (mevcut abonelik akışının aksine, bkz.
        ARCHITECTURE.md §10.9.3 "neden price_data"), çünkü ürün fiyatı/kataloğu bizim
        DB'mizde yönetilir. `success_url`/`cancel_url` `FRONTEND_URL`'e göre üretilir.
        `checkoutUrl` alanına yönlendirme sonrası ödemenin ASIL sonucu webhook (`Webhooks`
        tag'i, `checkout.session.completed`) ile işlenir — bu uç YALNIZCA oturumu açar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartCheckoutSessionRequest" }
      responses:
        "201":
          description: Checkout oturumu oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CheckoutSessionResponse" }
        "404":
          description: "Modül kapalı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Sepet boş VEYA ürün(ler) artık satın alınamıyor/stok yetersiz (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/orders:
    get:
      tags: [Orders]
      summary: Siparişleri listele (yalnızca SiteRole=ADMIN)
      description: >
        Cursor sayfalı, `seq asc`. `status` ile filtrelenebilir. **`customerEmail`
        MASKELENİR** (`lib/pii-mask.ts::maskEmail`, ör. `a***@domain.com`) — gerekçe:
        liste ekranı toplu göz atma/triage amaçlıdır, tam e-posta burada gerekli
        değildir (bkz. detay ucundaki maskesiz davranışla karşıtlık).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OrderStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
                      meta: { $ref: "#/components/schemas/OrderListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Orders]
      summary: Sipariş detayı (yalnızca SiteRole=ADMIN)
      description: >
        **`customerEmail` MASKELENMEZ** (listeden farklı olarak) — detay ekranı fiilen
        kargo/iletişim amacıyla açılır, admin'in müşteriyle iletişime geçmesi (ör.
        teslimat sorunu) için tam adrese ihtiyacı vardır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/orders/{orderId}/status:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      tags: [Orders]
      summary: Sipariş durumunu değiştir (yalnızca SiteRole=ADMIN)
      description: >
        **Yalnızca İKİ geçişe izin verilir:** `PAID -> FULFILLED` (kargoya
        verildi/teslim edildi) ve `PENDING -> CANCELLED` (admin ödeme beklenmeden
        manuel iptal eder). Başka HER durum kombinasyonu (ör. `FAILED -> FULFILLED`,
        `CANCELLED -> PAID`) `409 CONFLICT` ile reddedilir.


        **Bu uç `-> REFUNDED` hedef durumunu KABUL ETMEZ** — manuel iade AYRI bir uçtan
        (`POST /admin/orders/{orderId}/refund`) yapılır, bkz. aşağıda. Audit log:
        `order.status_change` (`metadata: { from, to }`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İzin verilmeyen durum geçişi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/orders/{orderId}/refund:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      summary: Siparişi manuel iade et (yalnızca SiteRole=ADMIN)
      description: >
        Yalnızca `PAID`/`FULFILLED` durumundaki siparişlerde çalışır — başka bir
        durumdaysa VEYA `Order.stripePaymentIntentId` yoksa `409 CONFLICT`. **Gerçek
        parayı Stripe üzerinden geri öder** (`stripe.refunds.create`,
        `stripePaymentIntentId` üzerinden) — yalnızca `Order.status`'u değiştirip
        parayı olduğu gibi bırakan "sahte" bir iade DEĞİLDİR.


        **Çifte iade / race koruması:** durum geçişi `updateMany({ where: { status: {
        in: [PAID, FULFILLED] } } })` ile ATOMİK olarak "claim" edilir — iki eşzamanlı
        istekten yalnızca BİRİ Stripe'a gerçek iade isteği gönderebilir, diğeri
        `claim.count === 0` ile `409 CONFLICT` alır ve Stripe'a HİÇ gitmez. Ayrıca
        `stripe.refunds.create`'e siparişe göre DETERMİNİSTİK bir `idempotencyKey`
        (`order-refund-{orderId}`) verilir — bir retry (ağ hatası/timeout sonrası)
        AYNI Stripe iade kaydını döner, ikinci bir gerçek para hareketi TETİKLEMEZ.
        Stripe isteği BAŞARISIZ olursa claim geri alınır (`Order.status` eski haline
        döner) ve sipariş yeniden iade edilebilir kalır. Başarılıysa `Order.status =
        REFUNDED`. Audit log: `order.refund` (`metadata: { from, to, reason,
        stripeRefundId }`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundOrderRequest" }
      responses:
        "200":
          description: İade edildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Sipariş `PAID`/`FULFILLED` durumunda değil, Stripe ödeme kaydı yok, sipariş
            durumu claim sırasında değişti VEYA Stripe iade isteğini reddetti
            (`error.code: CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      summary: Stripe webhook alıcı (imza `Stripe-Signature` header ile doğrulanır)
      description: >
        Ham (parse edilmemiş) body üzerinde `stripe.webhooks.constructEvent` ile imza
        doğrulanır — bu route kendi `application/json` content-type parser'ını
        (`parseAs: buffer`) kayıt eder, uygulamanın geri kalanındaki JSON parse'ını
        ETKİLEMEZ. İmza eksik/geçersizse VEYA `STRIPE_WEBHOOK_SECRET` tanımsızsa `400`.


        `checkout.session.completed` artık İKİ farklı akıştan gelebilir (aynı Stripe
        hesabı hem org abonelikleri hem misafir ürün siparişleri için kullanılıyor):
        `session.mode === "subscription"` ise MEVCUT abonelik akışı (davranış
        DEĞİŞMEDİ); `session.mode === "payment"` ise `Checkout` tag'inin ürettiği
        sepet siparişi akışıdır — bkz. ARCHITECTURE.md §10.9.3 "stok concurrency".


        **Sepet siparişi akışı (`payment` mode) — idempotency + stok:**
        `session.metadata.orderId` ile `Order` bulunur, stok kontrolü + düşürme +
        `Order.status` güncellemesi TEK Serializable transaction'da (`runSerializable`,
        bkz. ARCHITECTURE.md §10.9.3) ATOMIK yapılır. `order.status !== PENDING` ise
        (Stripe aynı event'i birden fazla gönderebilir; ayrıca
        `Order.stripeCheckoutSessionId` `@unique` ikinci savunma hattıdır) sessizce
        döner — stok TEKRAR düşürülmez, e-posta TEKRAR gönderilmez. Stok yetersizse
        `Order.status = FAILED`, `errorSummary: "insufficient_stock"` yazılır (throw
        EDİLMEZ — para zaten Stripe üzerinden alınmış, admin panelden manuel
        müdahale gerekir). Yeterliyse stok düşürülür, `Order.status = PAID`,
        `paidAt = now()` ve (best-effort, webhook isteğini BOZMAZ) `ORDER_CONFIRMATION`
        e-postası gönderilir.


        `checkout.session.expired` (yalnızca `PENDING` durumundaki siparişi
        `EXPIRED` yapar, `updateMany` ile idempotent) ve
        `customer.subscription.updated`/`deleted` (mevcut abonelik akışı) de bu
        ucun işlediği diğer olay tipleridir; tanınmayan olay tipleri sessizce
        (200 ile) yok sayılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: İşlendi }
        "400": { description: Geçersiz imza }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaFolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaFolderFilter:
      name: folderId
      in: query
      required: false
      description: >
        Klasör filtresi (§10.11). Verilmezse **filtre uygulanmaz** (tüm kütüphane,
        klasörlü + klasörsüz). `none` = yalnızca "Kategorisiz" (`folderId IS NULL`).
        UUID = yalnızca o klasördeki medya, ÖZYİNELEMELİ DEĞİL (alt klasörlerdekiler
        DAHİL EDİLMEZ). UUID de `none` de olmayan bir değer → `422`. Var olmayan bir
        UUID → `404` DEĞİL, boş liste + `200` (klasör silinirken açık kalan bir
        sekmenin hata göstermemesi için).
      schema:
        type: string
        description: "UUID veya `none` sabiti."
    TrashedFilter:
      name: trashed
      in: query
      required: false
      description: >
        Çöp kutusu filtresi (§10.7). `exclude` (varsayılan) = yalnızca
        `deletedAt IS NULL`; `include` = çöptekiler dahil tümü; `only` = yalnızca çöp.
      schema:
        type: string
        enum: [exclude, include, only]
        default: exclude
    ContentStatusFilter:
      name: status
      in: query
      required: false
      description: >
        Sunucu tarafı durum filtresi. v1 admin liste ekranı KULLANMAZ (sekmeler
        client-side filtreler) — API tüketicileri ve ileride sunucu-taraflı sayfalama için.
      schema: { $ref: "#/components/schemas/PageStatus" }
    TemplateKey:
      name: key
      in: path
      required: true
      description: "ör. WELCOME, PASSWORD_RESET, SYSTEM_ANNOUNCEMENT"
      schema: { type: string }
    ImportJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportJobTypeFilter:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ImportJobType" }
    ImportJobStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ImportJobStatus" }
    StatsDays:
      name: days
      in: query
      required: false
      deprecated: true
      description: >
        DEPRECATED — `from`/`to` kullanın. `from`/`to` verilmezse geriye uyumluluk
        amacıyla kullanılır (varsayılan son 30 gün, en fazla 90 gün). `from`/`to` ile
        birlikte verilirse `from`/`to` kazanır.
      schema: { type: integer, minimum: 1, maximum: 90 }
    StatsFrom:
      name: from
      in: query
      required: false
      description: "ISO-8601 (UTC) başlangıç tarihi. `to` ile BİRLİKTE verilmelidir."
      schema: { type: string, format: date-time }
    StatsTo:
      name: to
      in: query
      required: false
      description: >
        ISO-8601 (UTC) bitiş tarihi. `from` ile BİRLİKTE verilmelidir. `from`/`to`
        aralığı en fazla 366 gün olabilir ve `from` <= `to` olmalıdır — aşımı 422
        (`ValidationError`) ile reddedilir, iş/istek oluşturulmaz.
      schema: { type: string, format: date-time }
    StatsGranularity:
      name: granularity
      in: query
      required: false
      description: "`PageView`/kullanıcı/gelir günlük bucket'ının haftalık/aylık'a toplanması. Varsayılan `day`."
      schema:
        allOf:
          - $ref: "#/components/schemas/Granularity"
        default: day
    StatsCompare:
      name: compare
      in: query
      required: false
      description: >
        `true` ise bir önceki eş-uzunluktaki dönemle karşılaştırma deltası döner.
        Yalnızca `GET /admin/stats/summary` tarafından KULLANILIR — diğer `/admin/stats/*`
        uçları bu parametreyi kabul eder ama YOK SAYAR.
      schema: { type: boolean, default: false }
    ExportJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportJobTypeFilter:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ExportJobType" }
    ExportJobStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ExportJobStatus" }
    SearchQuery:
      name: search
      in: query
      required: false
      description: >
        Serbest metin arama (§10.9.2/§10.9.4) — `Products` uçlarında `title`/`sku`,
        `Portfolio` uçlarında `title`/`clientName` üzerinde büyük/küçük harf duyarsız
        (`contains`, `insensitive`) çalışır. v1 admin liste ekranı KULLANMAZ (bkz.
        `TrashedFilter`/`ContentStatusFilter` ile AYNI "API tüketicileri için" gerekçesi).
      schema: { type: string, minLength: 1 }
    ModuleKey:
      name: key
      in: path
      required: true
      description: "ör. products, portfolio (bkz. lib/module-registry.ts::MODULE_REGISTRY)"
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ProductCategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    PortfolioCategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/OrderStatus" }
    ImageId:
      name: imageId
      in: path
      required: true
      description: >
        `ProductImage`/`PortfolioImage` satır id'si — `POST/DELETE .../images` uçlarında
        `productId`/`itemId` ile BİRLİKTE kullanılır. `DELETE`'te route handler `imageId`'nin
        GERÇEKTEN o `productId`/`itemId`'ye ait olduğunu doğrular (IDOR koruması) —
        eşleşmezse (başka bir ürünün/öğenin görsel id'si verilse dahi) `404 NOT_FOUND`.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Kimlik doğrulama yok/geçersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Forbidden:
      description: Yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    NotFound:
      description: Kaynak bulunamadı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Conflict:
      description: Çakışma (ör. e-posta zaten kayıtlı)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ValidationError:
      description: Girdi doğrulama hatası
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    TooManyRequests:
      description: "Hız sınırı aşıldı (`error.code: RATE_LIMITED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    PayloadTooLarge:
      description: >
        Yüklenen dosya/istek gövdesi izin verilen boyutu aşıyor
        (`error.code: PAYLOAD_TOO_LARGE`, bkz. lib/errors.ts::PayloadTooLargeError).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            nextCursor: { type: string, nullable: true }

    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  VALIDATION_ERROR,
                  CONFLICT,
                  RATE_LIMITED,
                  PAYLOAD_TOO_LARGE,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
        createdAt: { type: string, format: date-time }

    AdminUser:
      description: "`/admin/users` uçlarında dönen genişletilmiş kullanıcı DTO'su — yalnızca ADMIN görebilir."
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            status: { type: string, enum: [ACTIVE, SUSPENDED] }
            lastLoginAt: { type: string, format: date-time, nullable: true }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        actorEmail: { type: string, nullable: true }
        action: { type: string, example: "user.role_change" }
        status: { type: string, enum: [SUCCESS, FAILURE, FORBIDDEN] }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAdminUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER], default: EDITOR }

    CreateAdminUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        setPasswordUrl: { type: string, format: uri }

    UpdateAdminUserRoleRequest:
      type: object
