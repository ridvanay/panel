  /admin/pages/{pageId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/MANAGER/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/pages/{pageId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Sayfayı bu revizyondaki hale geri döndür (SiteRole=ADMIN veya MANAGER)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon
        olarak kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.


        **§10.21 — `Pages` Katman 2: `ADMIN`, `MANAGER`. `EDITOR` → 403.** Bir
        revizyonu geri yüklemek `blocks` ağacının TAMAMINI değiştirir — tanımı gereği
        yapısal bir işlemdir ve şablon diff'i ile ifade edilemez. MANAGER'a açık olması
        ayrıcalık yükseltmesi DEĞİLDİR: geri yüklenen yapı, geçmişte ADMIN tarafından
        üretilmiş bir yapıdır; MANAGER serbest yapı KURAMAZ. Revizyonları LİSTELEMEK ve
        GÖRÜNTÜLEMEK (`GET` uçları) `EDITOR`'e de AÇIK kalır (Katman 3).


        **Çöpteki bir sayfa revizyondan geri yüklenEMEZ → `409 CONFLICT`**
        (`PATCH`/`autosave` ile AYNI kural ve aynı mesaj: `"Çöpteki içerik
        düzenlenemez. Önce geri yükleyin."`). Bu kontrol security-agent denetiminde
        eksik bulunup eklenmiştir — dört entity de (Page/BlogPost/Product/
        PortfolioItem) artık bu konuda PARİTEDEDİR (§10.1).
      responses:
        "200":
          description: Sayfa geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği revizyondan geri yükleme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  # ---------------------------------------------------------------------------
  # Blog sınıflandırma: Kategoriler (bire-çok) + Etiketler (çoka-çok, §10.14)
  #
  # ROTA ÖNCELİĞİ: `categories` ve `tags` STATİK segmentlerdir ve Fastify radix
  # router'da `/admin/blog/{postId}` parametreli rotadan ÖNCE eşleşir. Kabul edilmiş
  # kısıt (`/public/blog/categories` ile aynı): bir yazıya `categories`/`tags`
  # id'siyle erişilemez — id'ler UUID olduğu için pratikte çakışma yoktur.
  #
  # Kategori uçları KODDA ZATEN VARDI ama bu dosyada BELGELENMEMİŞTİ; etiket uçları
  # eklenirken bu kontrat boşluğu da kapatıldı.
  # ---------------------------------------------------------------------------
  /admin/blog/categories:
    get:
      tags: [Blog]
      summary: Blog kategorilerini listele (authenticated)
      description: "Sayfalanmaz, arama parametresi almaz — liste bellekte tutulur, arama frontend-only."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BlogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Blog]
      summary: Yeni blog kategorisi oluştur (ADMIN/MANAGER/EDITOR)
      description: >
        Tam editördeki "+ Yeni Kategori Oluştur" satır-içi akışı (§10.14.5) da BU ucu
        kullanır — satır-içi oluşturma için AYRI bir uç yoktur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBlogCategoryRequest" }
      responses:
        "201":
          description: Kategori oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Aynı `slug`'a sahip kategori zaten var (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/blog/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/BlogCategoryId"
    patch:
      tags: [Blog]
      summary: Blog kategorisini güncelle (ADMIN/MANAGER/EDITOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBlogCategoryRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Hedef `slug` başka bir kategoride kullanılıyor (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Blog]
      summary: Blog kategorisini sil (ADMIN veya MANAGER)
      description: "Kategoriye bağlı yazılar `SetNull` ile kategorisiz kalır (silinmez)."
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/tags:
    get:
      tags: [Blog]
      summary: Blog etiketlerini listele (authenticated)
      description: >
        §10.14.3 — sayfalanmaz, arama parametresi almaz (klasör listesiyle aynı gerekçe,
        §10.11.2). `seq ASC` sırasında döner. Her kayıt `postCount` taşır; bu sayaç TEK
        sorguda (`_count` ile) hesaplanır — etiket başına ayrı `count()` (N+1) YASAKTIR.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BlogTag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Blog]
      summary: Yeni blog etiketi oluştur (ADMIN/MANAGER/EDITOR)
      description: >
        Etiket yönetim ekranı VE editördeki satır-içi "yeni etiket" akışı (§10.14.5) aynı
        ucu kullanır. Frontend, satır-içi akışta POST'tan ÖNCE yerel listede slug eşleşmesi
        arar; bulursa istek göndermez ve var olanı seçer. Yine de `409` dönerse bu bir
        HATA olarak gösterilmez — var olan kayıt seçilir (yarış durumu).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBlogTagRequest" }
      responses:
        "201":
          description: "Etiket oluşturuldu (`postCount` = 0)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogTag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Aynı `slug`'a sahip etiket zaten var (`error.code: CONFLICT`). Global Prisma
            `P2002` işleyicisinden gelir; backend ek yakalama yazmaz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/blog/tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/BlogTagId"
    patch:
      tags: [Blog]
      summary: Blog etiketini güncelle (ADMIN/MANAGER/EDITOR)
      description: "`name` güncellenince `slug` OTOMATİK türetilmez — slug URL kimliğidir, sessizce değişmez."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBlogTagRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogTag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Hedef `slug` başka bir etikette kullanılıyor (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Blog]
      summary: Blog etiketini sil (ADMIN veya MANAGER)
      description: >
        §10.14.2 — `blog_post_tags` satırları FK cascade ile düşer; **yazılar SİLİNMEZ**,
        yalnızca bu etiketi kaybeder (`BlogCategory` silmenin `SetNull` davranışıyla aynı
        felsefe). Etiket kullanımda olsa bile silme ENGELLENMEZ; frontend onay diyaloğunda
        etkilenecek yazı sayısını (`postCount`) yazar.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [ContentRevisions]
      summary: Yazının revizyon geçmişini listele (ADMIN/MANAGER/EDITOR)
