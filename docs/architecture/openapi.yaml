openapi: 3.0.3
info:
  title: SaaS Platform API
  version: "1.0"
  description: >
    Frontend (Next.js) ve backend (Node.js/Fastify) ajanlarının uyacağı API
    kontratı. Kaynak doğruluk: bu dosya + ../shared-types.ts + ARCHITECTURE.md.
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local

tags:
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Plans
  - name: Billing
  - name: Webhooks
  - name: Health
  - name: AdminUsers
    description: Org'dan bağımsız site-geneli kullanıcı/rol yönetimi (`/admin/users`) — yalnızca SiteRole=ADMIN.
  - name: Logs
    description: Audit log (`/admin/logs`) — yalnızca SiteRole=ADMIN.
  - name: Navigation
    description: >
      Site header/nav/footer yapılandırması (`/navigation`, `/admin/navigation`).
      `/navigation` public'tir (site header/nav/footer bunu okur); `/admin/navigation`
      yönetim ekranı içindir, PUT yalnızca SiteRole=ADMIN.
  - name: ContentRevisions
    description: >
      İçerik sürüm kontrolü (`/admin/pages/{pageId}/revisions`,
      `/admin/blog/{postId}/revisions`) — bkz. ARCHITECTURE.md §10.1. Yetki eşiği,
      ilgili entity'nin (pages/blog) yazma eşiğiyle aynı (SiteRole=ADMIN veya EDITOR).
  - name: EmailTemplates
    description: >
      E-posta & bildirim şablonu yönetimi (`/admin/notifications/templates`) — bkz.
      ARCHITECTURE.md §10.3. Tüm uçlar yalnızca SiteRole=ADMIN.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      security: []
      summary: Servis sağlık kontrolü
      responses:
        "200":
          description: Servis ayakta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Yeni kullanıcı kaydı
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Kayıt başarılı, oturum açıldı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: E-posta/şifre ile giriş
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Giriş başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh cookie ile yeni access token al (rotasyonlu)
      security: []
      description: Refresh token httpOnly cookie üzerinden okunur, body gerekmez.
      responses:
        "200":
          description: Yeni access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Oturumu kapat (refresh token'ı iptal et)
      responses:
        "204": { description: Çıkış yapıldı }

  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Şifre sıfırlama e-postası gönder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: İstek alındı (e-posta enumeration önlemek için her zaman 202) }

  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Şifreyi token ile sıfırla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "204": { description: Şifre güncellendi }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Mevcut oturumun kullanıcı ve üyelik bilgisi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    get:
      tags: [Users]
      summary: Profilimi getir
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Users]
      summary: Profilimi güncelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Kendi şifremi değiştir
      description: >
        Oturum açmış kullanıcı KENDİ şifresini değiştirir (site-rol şartı YOK, `authenticate`
        yeterli). `currentPassword` argon2 ile doğrulanır; hatalıysa 401 döner ve
        `security.password_change` audit kaydı `status: FAILURE` ile yazılır. Başarılı olursa
        `passwordHash` güncellenir ve **mevcut oturum hariç** tüm `RefreshToken` kayıtları
        iptal edilir (bkz. `/admin/settings/security/2fa/disable` ile aynı politika) —
        yani diğer cihazlardaki oturumlar zorla kapanır, isteği yapan cihaz açık kalır.
        Hassas uç: route-level rate limit uygulanır (5 istek / 1 dakika).
        Şifre sıfırlama (token ile, oturumsuz) akışı için bkz. `/auth/reset-password`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Şifre değiştirildi (gövde yok) }
        "401":
          description: >
            `currentPassword` hatalı veya oturum geçersiz. Mesaj, hangi alanın hatalı
            olduğunu sızdırmayacak şekilde sabittir ("Şifre hatalı.").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /organizations:
    get:
      tags: [Organizations]
      summary: Üyesi olduğum organizasyonları listele
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
    post:
      tags: [Organizations]
      summary: Yeni organizasyon oluştur (oluşturan OWNER olur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Organization" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organizations]
      summary: Organizasyon detayı
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Organizations]
      summary: Organizasyonu güncelle (ADMIN/OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Organizations]
      summary: Organizasyonu sil (yalnızca OWNER)
      responses:
        "204": { description: Silindi }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Members]
      summary: Organizasyon üyelerini listele
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Membership" }

  /organizations/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Members]
      summary: Üye rolünü değiştir (ADMIN/OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMembershipRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Members]
      summary: Üyeyi organizasyondan çıkar (ADMIN/OWNER)
      responses:
        "204": { description: Çıkarıldı }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Invitations]
      summary: Bekleyen davetleri listele (ADMIN/OWNER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invitation" }
    post:
      tags: [Invitations]
      summary: Yeni üye davet et (ADMIN/OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Davet gönderildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Invitation" }
        "409": { $ref: "#/components/responses/Conflict" }

  /invitations/{token}/accept:
    post:
      tags: [Invitations]
      summary: Daveti kabul et (giriş yapmış kullanıcı)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Kabul edildi, üyelik oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Membership" }
        "410": { description: Davet süresi dolmuş/iptal edilmiş }

  /plans:
    get:
      tags: [Plans]
      security: []
      summary: Herkese açık plan listesi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Plan" }

  /organizations/{orgId}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Billing]
      summary: Organizasyonun abonelik durumu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Subscription" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{orgId}/subscription/checkout-session:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Billing]
      summary: Stripe Checkout oturumu oluştur (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckoutSessionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CheckoutSessionResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/subscription/portal-session:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Billing]
      summary: Stripe Billing Portal oturumu oluştur (OWNER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BillingPortalResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users:
    get:
      tags: [AdminUsers]
      summary: Site kullanıcılarını listele (yalnızca ADMIN)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [AdminUsers]
      summary: Yeni site kullanıcısı oluştur (yalnızca ADMIN)
      description: >
        Kullanılamaz rastgele bir şifreyle oluşturulur; kullanıcı gerçek şifresini
        dönen `setPasswordUrl` üzerinden belirler (MVP/dev-only: e-posta sağlayıcısı
        entegre edilene kadar bağlantı doğrudan response'ta döner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminUserRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CreateAdminUserResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [AdminUsers]
      summary: Kullanıcının rolünü değiştir (yalnızca ADMIN)
      description: >
        Hedef kullanıcı sistemdeki tek aktif ADMIN ise ve yeni rol ADMIN değilse
        409 CONFLICT döner ("en az bir yönetici kalmalı" kuralı).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserRoleRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [AdminUsers]
      summary: Kullanıcının durumunu (ACTIVE/SUSPENDED) değiştir (yalnızca ADMIN)
      description: >
        Kendi hesabınızı askıya alamazsınız (her zaman 409). Hedef kullanıcı
        sistemdeki tek aktif ADMIN ise ve yeni durum SUSPENDED ise de 409 döner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserStatusRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/logs:
    get:
      tags: [Logs]
      summary: Audit log kayıtlarını listele (yalnızca ADMIN)
      description: >
        SAPMA: diğer tüm sayfalanan listelerin aksine en yeni kayıt önce gelir
        (`orderBy seq desc` + `seq < cursor`), diğer uçlarda `orderBy seq asc` + `seq > cursor`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [SUCCESS, FAILURE, FORBIDDEN] }
        - name: action
          in: query
          required: false
          description: Öneke göre filtreler (ör. "user." → user.create, user.role_change, ...).
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditLog" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings/permissions:
    get:
      tags: [AdminUsers]
      summary: Statik rol/modül/aksiyon yetki matrisini getir (yalnızca ADMIN)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PermissionsMatrix" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /navigation:
    get:
      tags: [Navigation]
      security: []
      summary: Yayındaki navigasyon/header/footer yapılandırmasını getir (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/NavigationConfig" }

  /admin/navigation:
    get:
      tags: [Navigation]
      summary: Navigasyon/header/footer yapılandırmasını getir (yönetim ekranı)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/NavigationConfig" }
    put:
      tags: [Navigation]
      summary: Navigasyon/header/footer yapılandırmasını değiştir (yalnızca ADMIN)
      description: >
        Tam değiştirme (replace) semantiği: `navigationItems`/`socialLinks`/`footerColumns`
        gönderilen dizilerle DB'deki mevcut kayıtların tamamının yerini alır (delete-then-recreate,
        tek transaction içinde).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNavigationConfigRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/NavigationConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/stats/views:
    get:
      tags: [Stats]
      summary: Günlük sayfa/yazı görüntülenme zaman serisi
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, maximum: 90, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DailyViewStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/stats/live-visitors:
    get:
      tags: [Stats]
      summary: >
        Süreç-içi (in-memory) canlı ziyaretçi sayısı — son 60 saniye içinde
        bir görüntülenme (view) endpoint'i çağıran benzersiz IP+User-Agent sayısı.
        Dağıtık DEĞİLDİR: çoklu instance dağıtımda her process kendi sayacını tutar.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/LiveVisitors" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/stats/breakdown:
    get:
      tags: [Stats]
      summary: Belirtilen aralıktaki görüntülenmelerin cihaz türü ve ülkeye göre kırılımı
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, maximum: 90, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ViewsBreakdown" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/health:
    get:
      tags: [System]
      summary: Sistem sağlığı — DB ping/boyutu, medya depolama, sunucu belleği/yükü (yalnızca ADMIN)
      description: >
        Tüm alanlar gerçek zamanlı ölçülür (DB `SELECT 1` ping süresi, `pg_database_size`,
        `Media.sizeBytes` toplamı, Node `os`/`process` bellek-yük-uptime bilgisi) — sabit/uydurma
        değer içermez. `dbQuotaBytes`/`mediaStorageQuotaBytes`, ilgili ortam değişkeni
        (`DB_STORAGE_QUOTA_MB`/`MEDIA_STORAGE_QUOTA_MB`) tanımlı değilse `null` döner.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SystemHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/pages/{pageId}/revisions:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [ContentRevisions]
      summary: Sayfanın revizyon geçmişini listele (ADMIN/EDITOR)
      description: >
        Liste görünümü `snapshot` alanını İÇERMEZ (id, editedById, editedByName,
        createdAt) — tam snapshot için `GET .../revisions/{revisionId}`. En yeni
        revizyon önce gelir.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContentRevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/pages/{pageId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/pages/{pageId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Sayfayı bu revizyondaki hale geri döndür (ADMIN/EDITOR)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon
        olarak kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.
      responses:
        "200":
          description: Sayfa geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [ContentRevisions]
      summary: Yazının revizyon geçmişini listele (ADMIN/EDITOR)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContentRevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Yazıyı bu revizyondaki hale geri döndür (ADMIN/EDITOR)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon
        olarak kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.
      responses:
        "200":
          description: Yazı geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogPost" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/notifications/templates:
    get:
      tags: [EmailTemplates]
      summary: Tüm e-posta şablonlarını listele (yalnızca ADMIN)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/notifications/templates/{key}:
    parameters:
      - $ref: "#/components/parameters/TemplateKey"
    get:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu getir (yalnızca ADMIN)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu güncelle (yalnızca ADMIN)
      description: "Audit log: `notifications.template_update`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmailTemplateRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates/{key}/preview:
    parameters:
      - $ref: "#/components/parameters/TemplateKey"
    post:
      tags: [EmailTemplates]
      summary: Şablonu örnek değerlerle render ederek önizle (yalnızca ADMIN, DB'ye yazmaz)
      description: >
        Değişken render'ı allow-list'e dayalı, güvenli string replace ile yapılır
        (`EmailTemplate.availableVariables`) — bir template engine/`eval` kullanılmaz.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewEmailTemplateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PreviewEmailTemplateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      summary: Stripe webhook alıcı (imza `Stripe-Signature` header ile doğrulanır)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: İşlendi }
        "400": { description: Geçersiz imza }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateKey:
      name: key
      in: path
      required: true
      description: "ör. WELCOME, PASSWORD_RESET, SYSTEM_ANNOUNCEMENT"
      schema: { type: string }

  responses:
    Unauthorized:
      description: Kimlik doğrulama yok/geçersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Forbidden:
      description: Yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    NotFound:
      description: Kaynak bulunamadı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Conflict:
      description: Çakışma (ör. e-posta zaten kayıtlı)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ValidationError:
      description: Girdi doğrulama hatası
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    TooManyRequests:
      description: "Hız sınırı aşıldı (`error.code: RATE_LIMITED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            nextCursor: { type: string, nullable: true }

    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  VALIDATION_ERROR,
                  CONFLICT,
                  RATE_LIMITED,
                  PAYLOAD_TOO_LARGE,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
        createdAt: { type: string, format: date-time }

    AdminUser:
      description: "`/admin/users` uçlarında dönen genişletilmiş kullanıcı DTO'su — yalnızca ADMIN görebilir."
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            status: { type: string, enum: [ACTIVE, SUSPENDED] }
            lastLoginAt: { type: string, format: date-time, nullable: true }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        actorEmail: { type: string, nullable: true }
        action: { type: string, example: "user.role_change" }
        status: { type: string, enum: [SUCCESS, FAILURE, FORBIDDEN] }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAdminUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER], default: EDITOR }

    CreateAdminUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        setPasswordUrl: { type: string, format: uri }

    UpdateAdminUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }

    UpdateAdminUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

    PermissionsMatrix:
      type: object
      properties:
        roles:
          type: array
          items: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
        modules:
          type: array
          items:
            type: object
            properties:
              module: { type: string }
              label: { type: string }
              actions:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string, enum: [ADMIN, EDITOR, VIEWER] }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED] }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER] }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceMonthlyCents: { type: integer }
        priceYearlyCents: { type: integer }
        currency: { type: string, example: TRY }
        limits:
          type: object
          additionalProperties: { type: integer }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/Plan" }
        status: { type: string, enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED, INCOMPLETE] }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }

    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              role: { type: string, enum: [OWNER, ADMIN, MEMBER] }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/AuthTokens" }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    UpdateUserRequest:
      description: >
        Kendi profilini güncelleme (`PATCH /users/me`). Yalnızca `name` ve `avatarUrl`
        değiştirilebilir — `email`, `role`, `status` BU UÇTAN DEĞİŞTİRİLEMEZ (rol/durum
        için bkz. `/admin/users/{userId}/role|status`). `avatarUrl: null` gönderilirse
        avatar kaldırılır (boş string `""` GEÇERSİZDİR, 422 döner).
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri, nullable: true }

    ChangePasswordRequest:
      description: >
        `POST /users/me/change-password` gövdesi. `newPassword` kuralı `RegisterRequest`
        ve `/auth/reset-password` ile AYNIDIR (min 8 karakter) — tek kaynak: bu kontrat.
        `newPassword === currentPassword` ise 422 (`details.newPassword`) döner.
        Yeni şifre tekrarı (`confirm`) YALNIZCA istemci tarafı doğrulamasıdır, gövdede
        GÖNDERİLMEZ.
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    UpdateOrganizationRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER] }

    UpdateMembershipRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }

    CreateCheckoutSessionRequest:
      type: object
      required: [planId, billingCycle, successUrl, cancelUrl]
      properties:
        planId: { type: string, format: uuid }
        billingCycle: { type: string, enum: [monthly, yearly] }
        successUrl: { type: string, format: uri }
        cancelUrl: { type: string, format: uri }

    CheckoutSessionResponse:
      type: object
      properties:
        checkoutUrl: { type: string, format: uri }

    BillingPortalResponse:
      type: object
      properties:
        portalUrl: { type: string, format: uri }

    NavigationItem:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string }
        order: { type: integer }

    SocialLink:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [TWITTER, GITHUB, LINKEDIN, INSTAGRAM, FACEBOOK, YOUTUBE, OTHER] }
        url: { type: string }
        order: { type: integer }

    FooterLink:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string }
        order: { type: integer }

    FooterColumn:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        order: { type: integer }
        links:
          type: array
          items: { $ref: "#/components/schemas/FooterLink" }

    NavigationConfig:
      type: object
      properties:
        headerCtaLabel: { type: string, nullable: true }
        headerCtaHref: { type: string, nullable: true }
        footerCopyrightText: { type: string, nullable: true }
        navigationItems:
          type: array
          items: { $ref: "#/components/schemas/NavigationItem" }
        socialLinks:
          type: array
          items: { $ref: "#/components/schemas/SocialLink" }
        footerColumns:
          type: array
          items: { $ref: "#/components/schemas/FooterColumn" }

    UpdateNavigationConfigRequest:
      description: >
        Tam değiştirme (replace) semantiği — `navigationItems`/`socialLinks`/`footerColumns`
        dizileri gönderilen haliyle mevcut kayıtların tamamının yerini alır; `id` alanları
        istemciden gönderilmez (sunucu yeniden üretir).
      type: object
      required: [navigationItems, socialLinks, footerColumns]
      properties:
        headerCtaLabel: { type: string, maxLength: 60, nullable: true }
        headerCtaHref:
          type: string
          maxLength: 500
          nullable: true
          description: "yalnızca http(s)://, / veya # ile başlayan yollar kabul edilir"
        footerCopyrightText: { type: string, maxLength: 200, nullable: true }
        navigationItems:
          type: array
          maxItems: 20
          items:
            type: object
            required: [label, href, order]
            properties:
              label: { type: string, minLength: 1, maxLength: 80 }
              href: { type: string, minLength: 1, maxLength: 500 }
              order: { type: integer, minimum: 0 }
        socialLinks:
          type: array
          maxItems: 15
          items:
            type: object
            required: [platform, url, order]
            properties:
              platform: { type: string, enum: [TWITTER, GITHUB, LINKEDIN, INSTAGRAM, FACEBOOK, YOUTUBE, OTHER] }
              url: { type: string, minLength: 1, maxLength: 500 }
              order: { type: integer, minimum: 0 }
        footerColumns:
          type: array
          maxItems: 8
          items:
            type: object
            required: [title, order, links]
            properties:
              title: { type: string, minLength: 1, maxLength: 80 }
              order: { type: integer, minimum: 0 }
              links:
                type: array
                maxItems: 20
                items:
                  type: object
                  required: [label, href, order]
                  properties:
                    label: { type: string, minLength: 1, maxLength: 80 }
                    href: { type: string, minLength: 1, maxLength: 500 }
                    order: { type: integer, minimum: 0 }


    DailyViewStats:
      type: object
      properties:
        date: { type: string, format: date, example: "2026-07-30" }
        pageViews: { type: integer }
        postViews: { type: integer }

    LiveVisitors:
      type: object
      properties:
        count:
          type: integer
          description: >
            Son 60 saniye içinde bir görüntülenme endpoint'ini çağıran benzersiz
            IP+User-Agent sayısı (süreç-içi/in-memory, dağıtık değil).

    DeviceBreakdownEntry:
      type: object
      properties:
        type: { type: string, enum: [MOBILE, DESKTOP, TABLET, UNKNOWN] }
        count: { type: integer }

    CountryBreakdownEntry:
      type: object
      properties:
        country:
          type: string
          description: >
            ISO 3166-1 alpha-2 ülke kodu, bilinmiyorsa "UNKNOWN"; ilk 10 dışında
            kalan ülkelerin toplamı "OTHER" olarak tek satırda döner.
        count: { type: integer }

    ViewsBreakdown:
      type: object
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceBreakdownEntry" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountryBreakdownEntry" }

    SystemHealth:
      type: object
      description: Tüm alanlar gerçek zamanlı ölçülür — sabit/uydurma değer içermez.
      properties:
        dbPingMs: { type: number, description: "`SELECT 1` sorgusunun ölçülen süresi (ms)" }
        dbSizeBytes: { type: number, description: "`pg_database_size(current_database())`" }
        dbQuotaBytes:
          type: number
          nullable: true
          description: "DB_STORAGE_QUOTA_MB tanımlı değilse null"
        mediaStorageBytes: { type: number, description: "Media.sizeBytes toplamı" }
        mediaStorageQuotaBytes:
          type: number
          nullable: true
          description: "MEDIA_STORAGE_QUOTA_MB tanımlı değilse null"
        memoryUsedBytes: { type: number }
        memoryTotalBytes: { type: number }
        processMemoryBytes: { type: number, description: "process.memoryUsage().rss" }
        loadAverage:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
          description: "os.loadavg() — [1dk, 5dk, 15dk]; Windows'ta her zaman [0,0,0] döner (platform kısıtı)"
        platform: { type: string, example: "linux" }
        uptimeSeconds: { type: number }
        checkedAt: { type: string, format: date-time }

    BlogCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    Page:
      description: >
        `/admin/pages` ve `/pages` uçlarında dönen sayfa DTO'su. `translations.EN`
        yalnızca override'ları taşır (bkz. ARCHITECTURE.md §10.5); `?locale=EN` ile
        okunan public GET'lerde bu alanlar zaten TR'ye alan-bazlı fallback edilmiş
        olarak gelir.
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          description: "ör. { \"EN\": { \"title\": \"...\", \"blocks\": [...] } } — bkz. shared-types.ts::PageTranslations"
          additionalProperties:
            type: object
            additionalProperties: true
        publishedAt: { type: string, format: date-time, nullable: true }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BlogPost:
      description: >
        `/admin/blog` ve `/blog` uçlarında dönen yazı DTO'su. `translations.EN` yalnızca
        override'ları taşır (bkz. ARCHITECTURE.md §10.5).
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        contentHtml: { type: string }
        coverImageUrl: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        category:
          allOf:
            - $ref: "#/components/schemas/BlogCategory"
          nullable: true
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        ogTitle: { type: string, nullable: true }
        ogImageUrl: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        noIndex: { type: boolean }
        translations:
          type: object
          description: "ör. { \"EN\": { \"title\": \"...\", \"contentHtml\": \"...\" } } — bkz. shared-types.ts::BlogPostTranslations"
          additionalProperties:
            type: object
            additionalProperties: true
        publishedAt: { type: string, format: date-time, nullable: true }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContentEntityType:
      type: string
      enum: [PAGE, BLOG_POST]

    ContentRevisionSummary:
      description: >
        Revizyon liste görünümü — `snapshot` alanını İÇERMEZ (bkz. ARCHITECTURE.md §10.1).
      type: object
      properties:
        id: { type: string, format: uuid }
        editedById: { type: string, format: uuid, nullable: true }
        editedByName: { type: string, description: "silinen kullanıcı için okunabilir ad snapshot'ı" }
        createdAt: { type: string, format: date-time }

    ContentRevision:
      allOf:
        - $ref: "#/components/schemas/ContentRevisionSummary"
        - type: object
          properties:
            entityType: { $ref: "#/components/schemas/ContentEntityType" }
            entityId: { type: string }
            snapshot:
              type: object
              description: >
                Güncellemeden HEMEN ÖNCEKİ tam alan seti — Page için `{ title, slug,
                blocks, seoTitle, seoDescription, ogTitle, ogImageUrl, canonicalUrl,
                noIndex, translations }`; BlogPost için `{ title, slug, excerpt,
                contentHtml, coverImageUrl, categoryId, seoTitle, seoDescription,
                ogTitle, ogImageUrl, canonicalUrl, noIndex, translations }`.
              additionalProperties: true

    EmailTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: WELCOME }
        name: { type: string }
        subject: { type: string }
        bodyHtml: { type: string }
        availableVariables:
          type: array
          items: { type: string }
          description: "salt bilgi amaçlı, ör. [\"user_name\", \"reset_link\"]"
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    UpdateEmailTemplateRequest:
      type: object
      properties:
        subject: { type: string, minLength: 1 }
        bodyHtml: { type: string }

    PreviewEmailTemplateRequest:
      type: object
      required: [sampleValues]
      properties:
        sampleValues:
          type: object
          additionalProperties: { type: string }

    PreviewEmailTemplateResponse:
      type: object
      properties:
        renderedSubject: { type: string }
        renderedHtml: { type: string }
