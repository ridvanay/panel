        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (ADMIN/MANAGER/EDITOR)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/blog/{postId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Yazıyı bu revizyondaki hale geri döndür (ADMIN/MANAGER/EDITOR)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon
        olarak kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.


        **Çöpteki bir yazı revizyondan geri yüklenEMEZ → `409 CONFLICT`**
        (`POST /admin/pages/{pageId}/revisions/{revisionId}/restore` ile BİREBİR AYNI
        kural ve mesaj).
      responses:
        "200":
          description: Yazı geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BlogPost" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği revizyondan geri yükleme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/media:
    get:
      tags: [Media]
      summary: Yüklenen görselleri listele (authenticated)
      description: >
        Cursor sayfalı, `seq ASC` (diğer içerik listeleriyle aynı yön) — çöp kutusu
        semantiği YOKTUR (`Media` soft-delete DESTEKLEMEZ, `DELETE` kalıcıdır).


        **`folderId` filtresi (§10.11):** SUNUCU tarafındadır (tür/tarih/dosya adı
        filtrelerinin aksine — onlar frontend-only kalır). Gerekçe: klasör seçimi
        sayfalamanın KAPSAMINI değiştirir; client-side filtrelenirse `meta.nextCursor`
        döngüsü her klasör değişiminde tüm kütüphaneyi yeniden çekmek zorunda kalır.
        Filtre ÖZYİNELEMELİ DEĞİLDİR — yalnızca doğrudan o klasördeki medya döner
        (alt klasörlerdekiler DAHİL EDİLMEZ), böylece dönen kayıt sayısı ilgili
        `MediaFolder.mediaCount` ile BİREBİR aynıdır.


        **Hız sınırı:** 120 istek / 1 dakika (route-level, diğer admin GET uçlarının
        paylaştığı global limitten BAĞIMSIZ — hızlı veri dökümü/scraping'e karşı
        savunma derinliği VE bu ucun diğer admin trafiğinin (health polling, dashboard)
        global bütçeyi tüketmesinden bağımsız erişilebilir kalması için, bkz.
        `logs.routes.ts::LOGS_RATE_LIMIT` ile AYNI desen). Aşım → 429.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MediaFolderFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Media]
      summary: Görsel yükle (ADMIN/MANAGER/EDITOR)
      description: >
        `multipart/form-data`, tek dosya. Editör (blog/sayfa) içerik bloklarına ve
        kapak görseline BURADAN eklenir.


        **Güvenlik — çift doğrulama:** yalnızca JPEG/PNG/WEBP/GIF kabul edilir. SVG
        kasıtlı olarak allow-list'te YOKTUR: metin tabanlıdır, magic byte imzası
        taşımaz ve içine `<script>` gömülebildiği için depolanmış-XSS riski taşır.
        `file`'ın beyan ettiği `Content-Type` GÜVENİLMEZ — gerçek tür, dosya
        içeriğinin ilk baytlarından (magic bytes) tespit edilir; beyan edilenle
        UYUŞMUYORSA ya da tanınmıyorsa/SVG ise istek `422` ile reddedilir
        (`POST /admin/import/jobs` ile AYNI kod yolu, bkz. `lib/mime-detect.ts`).


        **Boyut limiti:** global multipart limiti (`MAX_UPLOAD_BYTES`, 5 MB) —
        `POST /admin/import/jobs`'un aksine bu ucun kendine özgü bir route-level
        override'ı YOKTUR. Aşım → `413 PAYLOAD_TOO_LARGE`.


        **Klasör (§10.11):** opsiyonel `folderId` alanı gönderilirse yükleme doğrudan
        o klasöre düşer (kullanıcı bir klasörün içindeyken yüklediğinde beklenen
        davranış); gönderilmezse `folderId: null` = "Kategorisiz". Klasör bulunamazsa
        `404` — bu kontrol dosya DİSKE YAZILMADAN ÖNCE yapılır, aksi hâlde DB kaydı
        olmayan yetim dosya kalır.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadMediaRequest" }
      responses:
        "201":
          description: Yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`folderId` gönderildi ama böyle bir klasör YOK (dosya diske yazılmadan reddedilir)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            Dosya yok / desteklenmeyen tür beyan edildi / dosya içeriği tanınan bir
            görsel biçimiyle eşleşmiyor (SVG dahil) / beyan edilen tür ile tespit
            edilen tür UYUŞMUYOR (`error.details.file`) / `folderId` UUID değil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    patch:
      tags: [Media]
      summary: Görselin alt metnini güncelle (ADMIN/MANAGER/EDITOR)
      description: >
        Faz 2 içerik editörü — editör içi görsellerde erişilebilirlik/SEO alt metni
        zorunluluğu. v1'de TEK güncellenebilir alan `altText`'tir; dosyanın kendisi,
        `url`/`filename`/`mimeType` DEĞİŞTİRİLEMEZ (yeniden yüklemek gerekir).


        **Bu uç `folderId` KABUL ETMEZ (karar, §10.11)** — klasör değiştirmenin TEK
        yolu `POST /admin/media/move`'dur. Gerekçe: taşımanın tekil ve toplu hâli tek
        kod yolunda kalsın, "kısmi başarı" semantiği tek yerde tanımlansın ve istemci
        tarafında "hangi ucu kullanayım?" ikiliği doğmasın. Gövdeye `folderId`
        eklenirse `422` (bilinmeyen alan).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMediaAltTextRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Media]
      summary: Görseli KALICI sil — geri alınamaz (ADMIN veya MANAGER)
      description: >
        `Media` soft-delete DESTEKLEMEZ (Page/BlogPost'un aksine `deletedAt`/çöp kutusu
        YOKTUR) — bu uç DB kaydını VE depolanan dosyayı KALICI olarak siler. Dosya
        silme en iyi-çaba (best-effort) yapılır: depolama katmanındaki hata istek
        sonucunu ETKİLEMEZ (DB kaydı yine de silinir).
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # MEDYA KLASÖRLERİ (§10.11) — AJAN KAPSAM NOTU (architect, bağlayıcı)
  #
  #   db-agent       : `MediaFolder` modeli (id, seq, name, parentId, createdAt),
  #                    self-relation onDelete: SetNull, `Media.folderId` nullable FK
  #                    onDelete: SetNull, @@index([parentId]) + @@index([folderId]),
  #                    tek migration. İş kuralı/validasyon YAZMAZ.
  #   backend-agent  : Aşağıdaki 5 uç + Zod şemaları + mapper (`toMediaFolderDto`).
  #                    Derinlik/döngü/isim-çakışması kurallarını UYGULAR, şema TASARLAMAZ.
  #   frontend-agent : Klasör ağacı paneli (admin medya sayfası + MediaPicker AYNI
  #                    veri kaynağı), `folderId` query'si ile listeleme, seçim
  #                    kısayolları (shift/ctrl/cmd + Ctrl+A), "Klasöre Taşı" aksiyonu.
  #   ui-designer    : Ağaç satırı / seçim çubuğu / "Kategorisiz" durumu için
  #                    tasarım tokenleri + boş-durum metinleri. Kod YAZMAZ.
  #   qa-agent       : Klasör silme → medyanın Kategorisiz'e düşmesi, alt klasörün
  #                    köke çıkması, kısmi başarı (skippedIds) senaryoları.
  #
  # Fastify yönlendirme notu: `/admin/media/folders` ve `/admin/media/move` STATİK
  # segmentlerdir; find-my-way statik segmenti `/:mediaId` parametresine göre ÖNCELİKLİ
  # eşleştirir — çakışma YOKTUR (ayrıca `mediaId` uuid doğrulandığı için "folders"
  # zaten 422 verirdi).
  # ---------------------------------------------------------------------------

  /admin/media/folders:
    get:
      tags: [Media]
      summary: Medya klasörlerini listele — DÜZ dizi + parentId (authenticated)
      description: >
        **Karar — düz (flat) dizi, iç içe JSON ağacı DEĞİL** (`NavigationItem` ile AYNI
        patern, bkz. §10.10.1): (1) DB zaten satır bazlıdır, ağaç yazma anında
        düzleştirilmek zorunda kalırdı; (2) özyinelemeli şema Zod/`fastify-type-provider-zod`
        tarafında `z.lazy` + tip çıkarımı sorunları doğurur ve OpenAPI istemci üreticilerinde
        kırılgandır; (3) tüketici (admin sayfası VE `MediaPicker`) ağacı tek geçişte
        `parentId`'ye göre kurar. Sunucu `(parentId NULLS FIRST, name ASC)` sıralar —
        kök klasörler her zaman alt klasörlerden ÖNCE gelir, tek geçişli ağaç kurulumu
        güvenlidir.


        **Sayfalama YOKTUR** (cursor/limit almaz) — v1 varsayımı klasör sayısının küçük
        (~200 altı) olmasıdır ve ağaç panelinin doğru çizilebilmesi için TÜM düğümlere
        aynı anda ihtiyaç vardır. Aynı gerekçeyle **klasör adı araması FRONTEND-only'dir**
        (query param YOKTUR): tüm liste zaten bellektedir, sunucuya gitmek ek gecikme
        dışında bir şey kazandırmaz.


        `mediaCount` her klasörün DOĞRUDAN içindeki medya sayısıdır (alt klasörler HARİÇ)
        ve tek sorguda (`include: { _count: { select: { media: true } } }`) hesaplanır —
        N+1 sorgu YASAK. "Kategorisiz" (`folderId IS NULL`) bir klasör kaydı DEĞİLDİR,
        listede DÖNMEZ; sayısı gerekiyorsa `GET /admin/media?folderId=none` ile alınır.


        **Hız sınırı:** `GET /admin/media` ile AYNI (120 istek / 1 dakika) — `MediaPicker`
        her açılışında bu ucu çağırır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MediaFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Media]
      summary: Klasör oluştur (ADMIN/MANAGER/EDITOR)
      description: >
        Yetki eşiği `POST /admin/media` (yükleme) ile AYNI — klasör oluşturmak
        içerik düzenleme işidir, yıkıcı değildir.


        `parentId` verilirse hedef klasörün KENDİ `parentId`'si null OLMALIDIR
        (maksimum derinlik 2 — kök + bir alt seviye, §10.11) → aksi hâlde `422`.
        Aynı `parentId` altında büyük/küçük harf duyarsız aynı isim → `409 CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMediaFolderRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/MediaFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`parentId` gönderildi ama böyle bir klasör YOK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Aynı üst klasör altında aynı isim (case-insensitive) — `error.code: CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/media/folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/MediaFolderId"
    patch:
      tags: [Media]
      summary: Klasörü yeniden adlandır / başka klasörün altına taşı (ADMIN/MANAGER/EDITOR)
      description: >
        En az bir alan gönderilmelidir (`name` ve/veya `parentId`); ikisi de yoksa `422`.
        `parentId: null` gönderilmesi "klasörü köke taşı" demektir — alanın HİÇ
        gönderilmemesi ise "üst klasörü değiştirme" demektir (ikisi FARKLIDIR).


        Doğrulama kuralları (hepsi `422`, `error.details` ile):

        - klasör kendi `parentId`'si olamaz;

        - hedef üst klasörün `parentId`'si null OLMALIDIR (derinlik 2);

        - klasörün KENDİ alt klasörleri varsa başka bir klasörün altına taşınamaz
          (derinlik aşımı) — önce alt klasörler köke taşınmalıdır.


        Bu üç kural birlikte döngüyü (cycle) YAPISAL olarak imkânsız kılar; özyinelemeli
        ata (ancestor) gezintisi GEREKMEZ. İsim çakışması → `409`.


        **Not (v1 kapsam):** frontend v1'de yalnızca yeniden adlandırmayı zorunlu olarak
        sunar; klasör taşıma UI'ı (sürükle-bırak) opsiyoneldir — kontrat şimdiden hazırdır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMediaFolderRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/MediaFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Aynı üst klasör altında aynı isim (case-insensitive) — `error.code: CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Media]
      summary: Klasörü sil — içindeki medya SİLİNMEZ (ADMIN veya MANAGER)
      description: >
        Yetki eşiği `DELETE /admin/media/{mediaId}` ile AYNI (ADMIN veya MANAGER) — klasör
        silmek medyayı yok etmese de organizasyon bilgisini geri alınamaz biçimde kaybeder.


        **Silmenin iki yan etkisi de KAYIPSIZDIR (karar, §10.11):**

        - **İçindeki medya:** `Media.folderId` `SetNull` ile boşalır → görseller
          "Kategorisiz"e düşer. Görseller ASLA silinmez, disk dosyalarına DOKUNULMAZ.

        - **Alt klasörler:** CASCADE **DEĞİL** — alt klasörlerin `parentId`'si `SetNull`
          ile boşalır, yani KÖKE çıkarlar (içerikleriyle birlikte korunurlar). Cascade
          reddedildi: tek bir tıklamayla görünmeyen bir alt ağacın tüm organizasyonunu
          silmek, "medyayı silmiyoruz" güvencesiyle çelişen sürpriz bir veri kaybı
          olurdu; ayrıca derinlik 2 sınırında alt klasörün köke çıkması HER ZAMAN
          geçerli bir durumdur (ek doğrulama gerekmez).


        Her iki etki de FK `onDelete: SetNull` ile DB seviyesinde ifade edilir — servis
        katmanında elle `updateMany` GEREKMEZ (backend-agent döngü yazmasın).


        İstemci, silme onay diyaloğunda etkiyi açıkça yazmalıdır ("N görsel Kategorisiz'e
        taşınacak, M alt klasör en üst seviyeye çıkacak").
      responses:
        "204": { description: "Silindi (medya ve alt klasörler korundu)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/media/move:
    post:
      tags: [Media]
      summary: Medyayı klasöre taşı — tekil ve toplu TEK uç (ADMIN/MANAGER/EDITOR)
      description: >
        **Karar — ayrı bir `/move-bulk` ucu YOKTUR:** gövde her zaman `mediaIds` dizisi
        alır, tekil taşıma tek elemanlı dizidir. Gerekçe: taşıma mantığı (varlık kontrolü,
        hedef klasör doğrulaması, kısmi başarı) tek kod yolunda kalır; iki uç iki ayrı
        davranış sapması ve iki ayrı test yüzeyi demektir. `POST /admin/pages/bulk`
        ailesiyle aynı felsefe.


        **Kısmi başarı bir hata DEĞİLDİR:** bulunamayan id'ler `skippedIds`'e düşer,
        yanıt yine `200`. Zaten hedef klasörde olan medya "taşındı" sayılır (idempotent,
        `movedCount`'a dahildir) — atlanmaz.


        `folderId: null` = "Kategorisiz'e taşı" (klasörden çıkar). Alan ZORUNLUDUR ama
        değeri null OLABİLİR; hiç gönderilmemesi `422`'dir (kazara "klasörden çıkarma"
        olmasın diye niyet açıkça belirtilmelidir).


        Hedef klasör verilmiş ama YOKSA istek TAMAMEN reddedilir (`404`) — kısmi
        uygulama YAPILMAZ. Yazma tek `updateMany` ile yapılır (id başına sorgu YASAK).


        **AuditLog yazılmaz (v1 kararı):** mevcut medya modülünde upload/delete de audit
        yazmıyor; taşıma daha az yıkıcı bir işlem olduğu için tutarlılık korunur. İleride
        eklenirse eylem öneki `media.move` olacaktır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveMediaRequest" }
      responses:
        "200":
          description: Taşındı (kısmi başarı dahil)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/MoveMediaResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Hedef klasör (`folderId`) bulunamadı — hiçbir medya taşınmadı."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates:
    get:
      tags: [EmailTemplates]
      summary: Tüm e-posta şablonlarını listele (ADMIN veya MANAGER)
      description: >
        Özet DTO döner — `blocks`/`bodyHtml` DÖNMEZ (liste görünümünde gereksiz, büyük
        olabilir). Sıralama `seq ASC`. Sayfalama YOKTUR (şablon sayısı doğası gereği azdır).
      parameters:
        - name: purpose
          in: query
          required: false
          schema: { $ref: "#/components/schemas/EmailTemplatePurpose" }
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EmailTemplateSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [EmailTemplates]
      summary: Yeni e-posta şablonu oluştur (ADMIN veya MANAGER)
      description: >
        `editorMode` her zaman `BLOCKS`'tur (yeni şablonlar RAW oluşturulamaz).
        Oluşturulan şablon `isActive=false`, `isSystem=false`, `key=null` başlar.
        Audit log: `notifications.template_create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmailTemplateRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates/variables:
    get:
      tags: [EmailTemplates]
      summary: Bir amaç için geçerli sistem değişkenlerini listele (ADMIN veya MANAGER)
      description: >
        `lib/email-variables.ts` statik registry'sinden beslenir (DB tablosu DEĞİLDİR) —
        `lib/permissions-matrix.ts`/`lib/module-registry.ts` ile AYNI desen. Frontend
        değişken listesini HARDCODE ETMEZ. Şablon HENÜZ OLUŞTURULMADAN (yeni şablon
        sihirbazı) kullanılır; var olan bir şablonun değişkenleri zaten
        `EmailTemplate.variables` alanında döner.


        `purpose=CONTACT_FORM_NOTIFICATION` verildiğinde yanıt, iletişim formunun
        alanlarından türetilen (`source: "contact-field"`) değişkenleri de İÇERİR.


        DİKKAT (backend-agent): bu statik segment `/{templateId}` param segmentiyle aynı
        seviyededir; Fastify radix router statiği önceler, `templateId` yine de
        `uuid` ile doğrulanmalıdır.
      parameters:
        - name: purpose
          in: query
          required: true
          schema: { $ref: "#/components/schemas/EmailTemplatePurpose" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EmailVariableDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates/preview:
    post:
      tags: [EmailTemplates]
      summary: Kaydedilmemiş taslağı render ederek önizle (ADMIN veya MANAGER, DURUMSUZ, DB'ye YAZMAZ)
      description: >
        Editörde her değişiklikte (500 ms debounce) çağrılır; kaydetmeyi ZORUNLU KILMAZ.
        İki render motoru (istemci + sunucu) sürüklenme demektir — WYSIWYG'in tek
        doğruluk kaynağı bu uçtur (bkz. ARCHITECTURE.md §10.16.11).


        Değişken render'ı allow-list'e dayalı, güvenli string replace ile yapılır
        (`lib/template-render.ts`) — bir template engine/`eval` KULLANILMAZ. Değer
        verilmeyen değişkenler için registry'deki `sampleValue` kullanılır.


        Dönen `renderedHtml` satır-içi (`inline`) stil içerir ve
        `lib/html-sanitize.ts::sanitizeRichHtml`'den GEÇMEZ (geçemez — `style` allow-list
        dışıdır, bkz. §10.16.4). İstemci bunu `dangerouslySetInnerHTML` ile BASMAZ;
        `<iframe sandbox="" srcDoc={html}>` içinde gösterir.


        Rate limit: 120/dakika (`EMAIL_TEMPLATE_PREVIEW_RATE_LIMIT`, IP değil oturum bazlı
        global admin trafiğine ek — security-agent denetimi: uç DB'ye yazmasa da her çağrıda
        site ayarları + hukuki sayfa sorgusu çalıştırır, önceden route-level bir üst sınırı
        yoktu).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewEmailTemplateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PreviewEmailTemplateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/notifications/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/EmailTemplateId"
    get:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu getir (ADMIN veya MANAGER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu güncelle (ADMIN veya MANAGER)
      description: >
        `bodyHtml` YALNIZCA `editorMode=RAW` şablonlarda kabul edilir; `BLOCKS`
        şablonunda gönderilirse 422. `blocks` ise yalnızca `BLOCKS` modunda kabul edilir.
        `purpose`/`editorMode`/`key`/`isSystem`/`availableVariables` BU UÇTAN
        DEĞİŞTİRİLEMEZ.


        **`isActive`** (qa-agent bulgusu, 2026-08-17 — kullanılabilirlik kilitlenmesi
        düzeltmesi): YALNIZCA `purpose=CUSTOM` şablonlarda bu uçtan kabul edilir (`purpose
        != CUSTOM` iken gönderilirse 422 — o durumda aktiflik YALNIZCA `/activate`'in
        transaction'ıyla değişir, bkz. §10.16.3 teklik kuralı). `CUSTOM`'da teklik kuralı
        UYGULANMADIĞI için (birden çok CUSTOM şablon aynı anda aktif olabilir) burada bir
        transaction'a gerek YOKTUR. Bu alan olmadan bir CUSTOM şablon bir kez aktif
        edildikten sonra ASLA deaktif/silinemiyordu (`DELETE` `isActive=true` iken
        koşulsuz 409 döner) — kalıcı bir kilitlenmeydi; CUSTOM bir şablonu silmenin yolu
        önce `PATCH { isActive: false }`, sonra `DELETE`'tir.


        Şablon metinlerindeki tüm `{{...}}` kalıpları izinli değişken setine karşı
        doğrulanır; tanımsız bir değişken varsa istek 422 ile REDDEDİLİR (aksi halde
        kullanıcı hatayı ancak gerçek e-posta gittikten sonra fark ederdi).


        Audit log: `notifications.template_update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmailTemplateRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [EmailTemplates]
      summary: Bir e-posta şablonunu sil (ADMIN veya MANAGER)
      description: >
        `isSystem=true` → 403 (seed'lenmiş çekirdek şablon silinemez).
        `isActive=true` → 409 (önce başka bir şablon aktifleştirilmeli; aksi halde ilgili
        gönderim akışı sessizce ölürdü). `purpose != CUSTOM` şablonlarda bu, başka bir
        şablonu `POST .../activate` ile aktifleştirerek çözülür; `purpose = CUSTOM`
        şablonlarda `PATCH .../{templateId}` ile `{ isActive: false }` göndererek de
        çözülebilir (bkz. `UpdateEmailTemplateRequest.isActive`).
        Audit log: `notifications.template_delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Aktif şablon silinemez."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/notifications/templates/{templateId}/activate:
    parameters:
      - $ref: "#/components/parameters/EmailTemplateId"
    post:
      tags: [EmailTemplates]
      summary: Şablonu amacının aktif şablonu yap (ADMIN veya MANAGER)
      description: >
        Tek transaction içinde aynı `purpose`'a sahip diğer şablonlar pasifleştirilir,
        sonra hedef aktifleştirilir (§10.16.3). `purpose=CUSTOM` şablonlarda teklik kuralı
        UYGULANMAZ — `isActive` yalnızca "kullanılabilir" anlamı taşır.
        Audit log: `notifications.template_activate`.
      responses:
        "200":
          description: Aktifleştirildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/notifications/templates/{templateId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/EmailTemplateId"
    post:
      tags: [EmailTemplates]
      summary: Şablonu kopyala (ADMIN veya MANAGER)
      description: >
        Kopya `isSystem=false`, `isActive=false`, `key=null` ve adı `"<ad> (kopya)"`
        olarak oluşturulur. Sistem şablonlarını bozmadan denemek için birincil yol
        (§10.16.1 — şablon revizyon geçmişi bilinçli olarak kapsam dışı).
        Audit log: `notifications.template_duplicate`.
      responses:
        "201":
          description: Kopyalandı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/EmailTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/notifications/templates/{templateId}/test-send:
    parameters:
      - $ref: "#/components/parameters/EmailTemplateId"
    post:
      tags: [EmailTemplates]
      summary: KAYDEDİLMİŞ şablonu örnek verilerle kendi adresine gönder (ADMIN veya MANAGER)
      description: >
        **Gövde `to` alanı KABUL ETMEZ** — alıcı her zaman isteği yapan kullanıcının
        e-posta adresidir. ADMIN arkasında bile "keyfi HTML'i keyfi adrese gönder" ucu bir
        spam-relay/phishing vektörüdür (§10.16.6, bağlayıcı güvenlik kararı).


        Kaydedilmiş satır üzerinden çalışır (taslak DEĞİL): gerçekten gönderilecek olan
        şey test edilir. Rate limit: 3/dakika (`EMAIL_TEST_SEND_RATE_LIMIT`).
        Audit log: `notifications.template_test_send` — metadata'ya alıcı adresi YAZILMAZ.


        SMTP başarısız olursa 502 `EMAIL_DELIVERY_FAILED` (bkz. `lib/errors.ts`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestSendEmailTemplateRequest" }
      responses:
        "200":
          description: Gönderildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/TestSendEmailTemplateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: "SMTP gönderimi başarısız (`EMAIL_DELIVERY_FAILED`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  # ---- §10.16 İletişim Formu — ADMIN ----

  /admin/contact/form:
    get:
      tags: [ContactForms]
      summary: İletişim formu yapılandırmasını getir (ADMIN veya MANAGER)
      description: >
        Tek (singleton) kayıt — `SiteSettings`/`SiteAppearance` ile AYNI lazy-upsert
        deseni: satır yoksa varsayılanlar döner, DB'ye yazılmaz.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContactForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [ContactForms]
      summary: İletişim formu yapılandırmasını güncelle (ADMIN veya MANAGER)
      description: "Audit log: `contact.form_update` (metadata: değişen alan ADLARI, DEĞERLERİ değil)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactFormRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContactForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/contact/form/fields:
    put:
      tags: [ContactForms]
      summary: Form alanlarını TAM DEĞİŞTİR (ADMIN veya MANAGER)
      description: >
        `PUT /admin/navigation` ile AYNI tam-değiştirme (full replace) deseni — gövdedeki
        dizi mevcut alanların TAMAMININ yerine geçer, `order` dizideki indekstir.


        Doğrulama (hepsi 422): `key`'ler tekil olmalı ve `^[a-z][a-z0-9_]{0,39}$`
        kalıbına uymalı; **üç sistem alanının (`name`, `email`, `message`) hepsi
        bulunmalı** ve `type`'ları değişmemiş olmalıdır. Sistem alanını silme denemesi
        SESSİZCE YOK SAYILMAZ, açıkça hata verir.


        Alan `key`'leri `CONTACT_FORM_NOTIFICATION` şablonunda `{{key}}` değişkeni olarak
        OTOMATİK görünür (§10.16.5) — ayrıca bir işlem gerekmez.


        Audit log: `contact.fields_update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceContactFormFieldsRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContactFormField" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/contact/submissions:
    get:
      tags: [ContactForms]
      summary: Form gönderimlerini listele (SiteRole=ADMIN veya MANAGER)
      description: >
        Cursor sayfalı, `seq DESC` (en yeni önce). `data` alanı liste yanıtında DÖNMEZ
        (detayda döner). `q` ad/e-posta üzerinde `contains` araması yapar.


        KVKK: e-posta adresi admin listesinde MASKELENMEZ (iş gereği — admin cevap
        yazacak). `ipAddress`/`userAgent` 30 gün sonra `null`'lanır (§10.16.10).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ContactSubmissionStatus" }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContactSubmissionSummary" }
                      meta:
                        type: object
                        properties:
                          nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/contact/submissions/{submissionId}:
    parameters:
      - $ref: "#/components/parameters/ContactSubmissionId"
    get:
      tags: [ContactForms]
      summary: Bir gönderimin detayını getir (SiteRole=ADMIN veya MANAGER)
      description: >
        Yan etkisizdir — okundu İŞARETLEMEZ (bunun için `PATCH .../{submissionId}`
        `status: READ`). Yan etkili GET, önyükleme/prefetch ile istem dışı tetiklenir.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContactSubmission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [ContactForms]
      summary: Gönderim durumunu güncelle (SiteRole=ADMIN veya MANAGER)
      description: >
        `READ`'e geçişte `readAt`/`readById` doldurulur.
        Audit log: `contact.submission_status_change` (metadata'ya ziyaretçi
        adı/e-postası/mesajı YAZILMAZ — yalnızca `targetId` + durum geçişi).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactSubmissionRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContactSubmission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [ContactForms]
      summary: Gönderimi kalıcı sil (ADMIN veya MANAGER)
      description: >
        Geri alınamaz — çöp kutusu YOKTUR. KVKK silme talebinin (veri sahibi hakkı)
        karşılığıdır. Audit log: `contact.submission_delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- §10.16 İletişim Formu — PUBLIC (kimlik doğrulama YOK) ----

  /contact/form:
    get:
      tags: [ContactForms]
      summary: Public iletişim formu tanımı (kimlik doğrulama YOK)
      description: >
        `isEnabled=false` ise **404** döner. Yanıt iç yapılandırmayı SIZDIRMAZ:
        `notifyEmail`, `notificationTemplateId`, `retentionDays` alanları DÖNMEZ.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicContactForm" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contact/submissions:
    post:
      tags: [ContactForms]
      summary: İletişim formunu gönder (kimlik doğrulama YOK)
      description: >
        Rate limit: 5/dakika, IP tabanlı (`CONTACT_SUBMIT_RATE_LIMIT`).
        `values` serileştirilmiş boyutu ≤ 32 KB.


        Davranış sırası (§10.16.8): (1) form kapalıysa 404 · (2) honeypot (`website`)
        doluysa **201 (sahte başarı)** + kayıt `status: SPAM` + e-posta GÖNDERİLMEZ ·
        (3) `consentRequired && consent !== true` → 422 · (4) alan bazlı doğrulama,
        TANIMSIZ anahtarlar sessizce atılır (kayda girmez) · (5) kayıt yazılır ·
        (6) bildirim e-postası gönderilir.


        **SMTP hatası isteği DÜŞÜRMEZ**: `notificationError` doldurulur, `app.log.error`
        yazılır, yanıt yine **201**. Ziyaretçi bizim SMTP arızamızın bedelini ödemez —
        gönderim kaydı tek doğruluk kaynağıdır, e-posta ondan TÜRETİLİR.


        Ziyaretçinin girdiği `email` HİÇBİR ZAMAN SMTP `to`/`from`/`Reply-To` başlığına
        konmaz (başlık enjeksiyonu); yalnızca gövdede değişken olarak, HTML-escape
        edilerek basılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactSubmissionRequest" }
      responses:
        "201":
          description: Alındı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CreateContactSubmissionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/import/jobs:
    get:
      tags: [Import]
      summary: İçe aktarma işi geçmişini listele (yalnızca ADMIN)
      description: >
        Cursor sayfalı, `seq DESC` (en yeni önce) sıralı. `preview` alanı liste
        görünümünde DÖNMEZ (büyük olabilir) — detay için `GET /admin/import/jobs/{jobId}`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ImportJobTypeFilter"
        - $ref: "#/components/parameters/ImportJobStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ImportJobSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Import]
      summary: 1. ADIM — dosya yükle ve ÖNİZLEME üret (yalnızca ADMIN, İÇERİK YAZMAZ)
      description: >
        `multipart/form-data`. **Bu uç HİÇBİR Page/BlogPost/User/Media kaydı OLUŞTURMAZ.**
        Dosyayı gizli (public servis edilmeyen) bir konuma yazar, ayrıştırıp doğrular ve
        `status: PENDING` bir `ImportJob` üretir; `preview` alanı kaç kayıt bulunduğunu,
        hangi alanların eşleştiğini/eşleşmediğini ve ilk 5 örnek satırı taşır. Yazma
        2. adımda (`POST .../start`) başlar.


        **Alanlar:**

        - `file` (binary, ZORUNLU) — tek dosya.

        - `type` (string, ZORUNLU) — `#/components/schemas/ImportJobType`.


        `format` İSTEMCİDEN ALINMAZ, sunucu dosyanın gerçek içeriğinden (magic bytes +
        yapısal ayrıştırma) türetir; uzantı/`Content-Type` bilgi amaçlıdır, GÜVENİLMEZ.
        Geçerlilik matrisi (ihlal → 422): `PAGES`,`BLOG` → CSV|JSON · `WORDPRESS` → XML ·
        `PRODUCTS` → XML · `USERS` → CSV · `MEDIA` → ZIP.


        **Boyut limitleri** (global 5 MB multipart limitinin route-level override'ı —
        `request.parts({ limits })` + route `bodyLimit`, bkz. ARCHITECTURE.md §10.8.5):
        `PAGES`/`BLOG`/`USERS` 10 MB · `WORDPRESS` 50 MB · `PRODUCTS` 50 MB ·
        `MEDIA` 100 MB.
        **Her boyut aşımı İSTİSNASIZ 413 `PAYLOAD_TOO_LARGE` döner** — tip-bazlı limit de,
        100 MB'lık sert üst tavan da, Fastify core `bodyLimit`i de. 422 DÖNMEZ (bkz.
        ARCHITECTURE.md §10.8.5 "413/422 kararı").


        **Kayıt sayısı tavanları** (aşım → 422, iş oluşturulmaz): `USERS` 500 satır ·
        `PAGES`/`BLOG` 5.000 satır · `WORDPRESS` 10.000 item · `PRODUCTS` 5.000 kayıt ·
        `MEDIA` 500 dosya. `PRODUCTS`'ın tavanı `WORDPRESS`'ten DÜŞÜKTÜR: ürün satırı
        başına düşen doğrulama (fiyat/SKU tekilliği/kategori upsert) daha pahalıdır ve
        tavan, İŞLENECEK `product` item'ı üzerinden sayılır — aynı dosyadaki yazı/sayfa/
        attachment item'ları bu sayıya girmez.


        **Hız sınırı:** 10 istek / 10 dakika (route-level). Aşım → 429.


        Audit log: `import.upload` (metadata: `type`, `format`, `sizeBytes`, `totalCount`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateImportJobRequest" }
      responses:
        "201":
          description: "Dosya kabul edildi, önizleme hazır (`status: PENDING`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            Dosya yok / bozuk / `type` ile format uyuşmuyor / kayıt tavanı aşıldı /
            XML'de DOCTYPE-DTD tespit edildi veya iç içe geçme 100 seviyeyi aştı (bkz.
            ARCHITECTURE.md §10.8.6 XXE savunması) / ZIP bombası ya da güvensiz arşiv
            yolu (zip-slip) tespit edildi. `error.details` alan-bazlı açıklama taşır.


            **Bu kontrollerin HEPSİ yükleme anında yapılır ve iş OLUŞTURULMAZ** — kaynak
            dosyadan statik olarak tespit edilebilen hiçbir kusur `FAILED` bir işe
            dönüşmez. `FAILED`, yalnızca çalışma anında ortaya çıkan hatalara ayrılmıştır
            (DB hatası, sunucu yeniden başlatma). Boyut aşımı bu daldan DEĞİL, 413'ten döner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/import/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    get:
      tags: [Import]
      summary: İşin durumunu/ilerlemesini/özet raporunu getir — POLL UCU (yalnızca ADMIN)
      description: >
        Frontend bu ucu **2 saniyede bir** poll eder (WebSocket/SSE YOKTUR — projede
        realtime altyapısı yok, bkz. ARCHITECTURE.md §10.8). Worker sayaçları her 25
        kayıtta bir DB'ye yazar, dolayısıyla ilerleme çubuğu adım adım artar.


        `status` ∈ `COMPLETED|FAILED|CANCELLED` olduğunda poll durdurulur ve özet rapor
        gösterilir: "`totalCount` kayıttan `successCount` başarılı, `errorCount` hata"
        (+ `skippedCount`). Hata nedenleri için `GET .../errors`.


        Kullanıcı sayfadan ayrılabilir: iş sunucu tarafında devam eder, dönüşte bu uç
        güncel durumu verir. Bildirim, frontend'in bu ucu poll etmesiyle üretilen bir
        toast'tır (bkz. ARCHITECTURE.md §10.6 toast standardı).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Import]
      summary: İş kaydını sil — geçmişten kaldır (yalnızca ADMIN)
      description: >
        `ImportJobError` satırlarını (FK cascade) ve varsa kalan kaynak dosyayı da siler.
        **İçe aktarılmış içeriği GERİ ALMAZ** — geri alma (rollback) v1 KAPSAM DIŞIDIR;
        yanlış içe aktarım, ilgili listelerden toplu çöpe taşıma ile temizlenir
        (`POST /admin/{pages|blog}/bulk`, `action: trash`).


        `status: PROCESSING` olan iş SİLİNEMEZ → 409 (`"İşlenen bir iş silinemez. Önce
        iptal edin."`). Audit log: `import.delete`.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İş işlenirken silinemez (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/import/jobs/{jobId}/start:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    post:
      tags: [Import]
      summary: 2. ADIM — onayla ve arka planda işlemeyi başlat (yalnızca ADMIN)
      description: >
        `PENDING` → `QUEUED` geçişi yapar ve **202 ile HEMEN döner**; yazma işlemi
        istek/yanıt döngüsünün DIŞINDA, aynı Node süreci içinde asenkron olarak yürür
        (kuyruk altyapısı yok — karar ve gerekçesi ARCHITECTURE.md §10.8'de).


        Aynı anda **yalnızca BİR iş** `PROCESSING` olabilir; ikinci iş `QUEUED`'da
        sırasını bekler. Bu, isteği başarısız KILMAZ.


        `status` `PENDING` değilse → 409 (`"Bu iş zaten başlatılmış."`) — istek
        idempotent DEĞİLDİR, çift tıklama korumasını frontend + bu 409 birlikte sağlar.


        Gövde, önizleme ekranında yapılan seçimleri taşır (alan eşleştirme + çakışma
        stratejisi). Gövde boş gönderilirse `POST /admin/import/jobs` yanıtındaki
        `preview.suggestedMapping` ve `duplicateStrategy: skip` varsayılanları uygulanır.


        Audit log: `import.start` (metadata: `type`, `totalCount`, `duplicateStrategy`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartImportJobRequest" }
      responses:
        "202":
          description: "Kabul edildi, arka planda işleniyor (`status: QUEUED`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İş `PENDING` durumunda değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/import/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    post:
      tags: [Import]
      summary: İşi iptal et (yalnızca ADMIN)
      description: >
        **İşbirlikçi (cooperative) iptaldir:** `cancelRequestedAt = now()` yazılır, worker
        bunu HER PARTİ (25 kayıt) başında kontrol eder ve fark ettiğinde durup
        `status: CANCELLED` yapar. Bu yüzden yanıt anında `status` hâlâ `PROCESSING`
        olabilir — frontend poll ederek `CANCELLED`'ı bekler.


        **O ana kadar yazılmış kayıtlar GERİ ALINMAZ** (rollback yok, bkz.
        `DELETE /admin/import/jobs/{jobId}`); sayaçlar nerede kalındığını gösterir.
        `PENDING`/`QUEUED` bir iş anında `CANCELLED` olur (hiç kayıt yazılmamıştır).


        `COMPLETED|FAILED|CANCELLED` bir iş için → 409. Audit log: `import.cancel`.
      responses:
        "200":
          description: İptal talebi alındı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "İş zaten sonlanmış (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/import/jobs/{jobId}/errors:
    parameters:
      - $ref: "#/components/parameters/ImportJobId"
    get:
      tags: [Import]
      summary: İşin satır-bazlı hata/atlama kayıtlarını listele (yalnızca ADMIN)
      description: >
        Özet rapordaki "3 hata" satırına tıklanınca açılan liste. Cursor sayfalı,
        `seq ASC` (dosyadaki sırayla). İş başına EN FAZLA 1.000 hata satırı saklanır;
        aşıldığında yazma durur (`ImportJob.errorCount` gerçek sayıyı saymaya devam eder)
        ve `meta.truncated: true` döner.


        Bu satırlar `rawData` içinde KİŞİSEL VERİ taşıyabilir (ör. `USERS` içe aktarımında
        e-posta) → saklama süresi ve maskeleme kuralı compliance-agent'ın alanıdır
        (bkz. ARCHITECTURE.md §10.8 "Saklama & KVKK").
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ImportJobError" }
                      meta: { $ref: "#/components/schemas/ImportJobErrorListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reports/exports:
    get:
      tags: [Reports]
      summary: Dışa aktarma işi geçmişini listele (yalnızca SiteRole=ADMIN)
      description: >
        Cursor sayfalı, `seq DESC` (en yeni önce). `type`/`status` ile filtrelenebilir.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExportJobTypeFilter"
        - $ref: "#/components/parameters/ExportJobStatusFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ExportJob" }
                      meta: { $ref: "#/components/schemas/ExportJobListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Reports]
      summary: Yeni bir analitik rapor dışa aktarma işi oluştur (yalnızca SiteRole=ADMIN)
      description: >
        **202 ile HEMEN döner** (`status: PENDING`); rapor (CSV/PDF) süreç-içi bir worker
        tarafından arka planda üretilir — kuyruk altyapısı YOK (`/admin/import/jobs`'un
        2. adımıyla AYNI desen, bkz. ARCHITECTURE.md §10.8.1/§10.8.10). Hazır olduğunda
        `GET /{jobId}` ile durum poll edilir, `status: COMPLETED` olunca
        `GET /{jobId}/download` ile indirilir.


        `from`/`to` ZORUNLUDUR (aralık en fazla 366 gün — aşımı 422, iş HİÇ
        oluşturulmaz). `filters` yalnızca ilgili `type` için anlamlıdır: `USERS` →
        `filters.role`, `REVENUE` → `filters.subscriptionStatus`; diğer tiplerde YOK
        SAYILIR.


        **`unmaskPii`** (varsayılan `false`) — `true` verilirse `USERS`/`REVENUE`
        raporlarındaki e-posta gibi alanlar MASKELENMEDEN dönülür. Bu zaten ADMIN-only
        bir uç olduğu için AYRI bir onay akışı YOKTUR, ancak `reports.export.unmasked_pii`
        adıyla AYRI bir audit kaydı yazılır ve üretilen `ExportJob.containsPii = true`
        set edilir. Saklama süresi bu durumda KISALIR: varsayılan (maskeli) dosyalar 7
        gün, `unmaskPii: true` ile üretilenler yalnızca 48 saat saklanır (compliance-agent
        kararı, bkz. ARCHITECTURE.md §10.8.10).


        Audit log: `reports.export.create` (+ `unmaskPii: true` ise ayrıca
        `reports.export.unmasked_pii`).


        **Hız sınırı:** 10 istek / 10 dakika (route-level, pahalı DB aggregation +
        PDF/CSV üretimi tetiklediği için). Aşım → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportJobRequest" }
      responses:
        "202":
          description: "Kabul edildi, arka planda üretiliyor (`status: PENDING`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/reports/exports/{jobId}:
    parameters:
      - $ref: "#/components/parameters/ExportJobId"
    get:
      tags: [Reports]
      summary: İşin durumunu/sonucunu getir — POLL UCU (yalnızca SiteRole=ADMIN)
      description: >
        `status` `COMPLETED` olduğunda `GET .../download` ile dosya indirilebilir hâle
        gelir. `status` `FAILED` ise `errorSummary` başarısızlık nedenini taşır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/reports/exports/{jobId}/download:
    parameters:
      - $ref: "#/components/parameters/ExportJobId"
    get:
      tags: [Reports]
      summary: Hazır dosyayı indir (yalnızca SiteRole=ADMIN)
      description: >
        `Content-Type` rapor formatına göre `text/csv; charset=utf-8` ya da
        `application/pdf`'tir; `Content-Disposition: attachment` ile birlikte döner
        (dosya adı `export-{type}-{jobId}.{csv|pdf}`). `storagePath` API'de ASLA
        dönmez — dosya bu uç üzerinden akıtılır.


        `status !== COMPLETED` (dosya henüz hazır değil) → 409. `expiresAt` geçmişse
        (saklama süresi dolmuşsa) → 404, `status` ne olursa olsun. Audit log:
        `reports.export.download` (metadata: `containsPii`).
      responses:
        "200":
          description: Dosya akışı
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "İş bulunamadı VEYA indirme süresi dolmuş (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "409":
          description: "Rapor henüz hazır değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /settings:
    get:
      tags: [Settings]
      security: []
      summary: Site ayarlarını oku (public)
      description: >
        Henüz hiç `PATCH /admin/settings` çağrılmadıysa (satır yok) sabit varsayılanlar
        döner: `{ siteName: "Site", logoUrl: null, homePageId: null, siteTemplate:
        SHOWCASE }` — lazy-upsert paterni (bkz. `settings.routes.ts::DEFAULTS`,
        `ARCHITECTURE.md` §10.9.5).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }

  /settings/homepage:
    get:
      tags: [Settings]
      security: []
      summary: Kök `/` rotasında render edilecek sayfayı getir (public)
      description: >
        `SiteSettings.homePageId` boşsa VEYA seçili sayfa yayında/çöpte değilse `data:
        null` döner — frontend bu durumda kendi varsayılan (SaaS pazarlama) fallback'ini
        gösterir.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        allOf: [{ $ref: "#/components/schemas/Page" }]
                        nullable: true

  /admin/settings:
    get:
      tags: [Settings]
      summary: Site ayarlarını oku (authenticated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Settings]
      summary: Site ayarlarını güncelle (yalnızca SiteRole=ADMIN)
      description: >
        Satır yoksa (ilk çağrı) `DEFAULTS` ile birlikte oluşturulur (upsert). Audit log:
        `settings.update` (`metadata.changed` = gönderilen alan adları).


        `siteTemplate` — §10.9.5 Site Şablonu (bkz. ARCHITECTURE.md). **SADECE tavsiye
        niteliğindedir**: değeri değiştirmek HİÇBİR modülü otomatik açmaz/kapatmaz,
        yalnızca frontend kurulum sihirbazının hangi modülleri/blok tiplerini
        ÖNERECEĞİNİ belirler (bkz. `SiteModule.recommendedFor`). Modül açma/kapama
        HER ZAMAN `PATCH /admin/modules/{key}` ile ayrı bir işlemdir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteSettingsRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------------------
  # SİTE ÖZELLEŞTİRME (§10.12) — AJAN KAPSAM NOTU (architect, bağlayıcı)
  #
  #   db-agent       : İKİ yeni singleton tablo (`SiteAppearance`, `SiteCustomCode`),
  #                    TEK migration. `SiteSettings`'e HİÇBİR kolon EKLENMEZ ve mevcut
  #                    hiçbir kolonu DEĞİŞTİRİLMEZ (§10.12.2 gerekçe). Renk/font/enum
  #                    alanları TİPLİ kolondur — JSON blob YASAK. Tek FK:
  #                    `SiteAppearance.pageHeaderBackgroundMediaId` → `Media`,
  #                    `onDelete: SetNull` (görsel silinince banner sade metne düşer,
  #                    500 vermez). `SiteCustomCode` audit kolonları (`cssUpdatedById`,
  #                    `jsUpdatedById`) → `User`, `onDelete: SetNull`. İş kuralı/rol
  #                    kontrolü/uzunluk doğrulaması YAZMAZ.
  #   backend-agent  : Aşağıdaki 7 uç + Zod şemaları + mapper (`toSiteAppearanceDto`,
  #                    `toPublicSiteAppearanceDto`, `toSiteCustomCodeDto`) + statik
  #                    `lib/appearance-presets.ts` registry'si (MODULE_REGISTRY ile
  #                    AYNI patern). Lazy-upsert `DEFAULTS` deseni `settings.routes.ts`
  #                    ile birebir aynıdır. `acknowledged` kuralını, kill-switch'i ve
  #                    audit kaydını UYGULAR; şema TASARLAMAZ, güvenlik POLİTİKASI
  #                    BELİRLEMEZ (politika: security-agent + §10.12.6).
  #   frontend-agent : `/admin/appearance` paneli (9 bölüm, bölüm-başına Kaydet),
  #                    `(site)` layout'unda token/font/özel kod enjeksiyonu,
  #                    `(site)/not-found.tsx`, ORTAK `useUnsavedChangesGuard` hook'unu
  #                    ÇIKARIR ve mevcut `/admin/navigation` + `/admin/settings`
  #                    sayfalarını bu hook'a taşır (§10.12.8 — refactor KAPSAMDADIR).
  #                    Canlı önizleme MEVCUT `SiteHeader`/`SiteFooter` bileşenleriyle
  #                    yapılır — YENİ bir önizleme bileşeni YAZILMAZ.
  #   ui-designer    : `--site-*` token isim listesi, ön ayar (preset) paletleri,
  #                    kontrast uyarı eşiği (WCAG AA), font eşleştirme tablosu,
  #                    bakım/404/çerez bandı boş-durum metinleri. Kod YAZMAZ.
  #   security-agent : §10.12.6 özel CSS/JS tehdit modeli denetimi — rol eşiği,
  #                    `acknowledged` akışı, `</script>` kaçışı, kill-switch, audit
  #                    hash'i, CSP etkileşimi. Politikayı SIKILAŞTIRABİLİR, GEVŞETEMEZ.
  #   compliance-agent: Çerez bandı v1 "bilgilendirme" olarak tanımlıdır, ONAY YÖNETİCİSİ
  #                    DEĞİLDİR (hiçbir script'i engellemez) — KVKK/GDPR açısından UI
  #                    metninin bunu yanlış vaat etmediğini doğrular (§10.12.5).
  #   qa-agent       : Özel JS'in admin paneline SIZMADIĞI (yalnızca `(site)` layout),
  #                    `acknowledged: false` → 422, EDITOR → 403, bakım modunda
  #                    `/admin`'in ERİŞİLEBİLİR kaldığı, ortak unsaved-guard'ın
  #                    mevcut iki sayfada REGRESYON yaratmadığı senaryoları.
  #
  # Rota sınırı: `/admin/settings` = sitenin NASIL ÇALIŞTIĞI + hesap/organizasyon;
  # `/admin/appearance` = sitenin NASIL GÖRÜNDÜĞÜ; `/admin/navigation` = NEREYE
  # gidildiği + site kimliği (logo/slogan) + footer/sosyal hesap linkleri.
  # Bir alan YALNIZCA TEK bir ekranda düzenlenir; diğer ekranlar derin link verir
  # (bkz. §10.12.1 — Logo & Marka ve Sosyal Hesap Linkleri TAŞINMAZ).
  # ---------------------------------------------------------------------------

  /appearance:
    get:
      tags: [Appearance]
      security: []
      summary: Site görünüm ayarlarını oku (public)
      description: >
        `(site)` layout'unun SSR sırasında çağırdığı TEK uç — renk/tipografi
        token'ları, sayfa başlığı düzeni, görünüm anahtarları, 404 metinleri ve
        özel CSS/JS aynı yanıtta döner. Ayrı bir `/appearance/custom-code` public
        ucu KASITLI olarak YOKTUR: her public sayfa render'ı ikinci bir gidiş-dönüş
        ödemek zorunda kalırdı.


        Satır yoksa (hiç kaydedilmemiş) sabit `DEFAULTS` döner — `GET /settings`
        ile AYNI lazy-upsert paterni, 404 DÖNMEZ.


        **`customCss`/`customJs` bu public yanıtta yer alır ve bu bir sızıntı
        DEĞİLDİR** — bu kod zaten her ziyaretçinin HTML kaynağına gömülerek
        yayınlanır. `CUSTOM_CODE_ENABLED=false` ortamlarında (kill switch,
        §10.12.6) `customJs` HER ZAMAN `null` döner.


        **Önbellek:** tüketici `next: { revalidate: 60 }` kullanır (`GET /settings`
        ile AYNI) — görünüm değişikliği siteye en geç 60 saniyede yansır; admin
        paneli kullanıcıya bunu YAZAR. `cache: "no-store"` YASAKTIR (her public
        sayfa render'ında ek istek demektir).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicSiteAppearance" }

  /admin/appearance:
    get:
      tags: [Appearance]
      summary: Site görünüm ayarlarını oku (SiteRole=ADMIN/MANAGER/EDITOR)
      description: >
        Public yanıta EK olarak `presetKey` ve `updatedAt` döner. Okuma eşiği panel
        kapısıdır (`ADMIN`/`MANAGER`/`EDITOR`; CUSTOMER/USER → 403) — panel salt-okunur
        görüntülenebilir. Yazma: `PATCH` ADMIN veya MANAGER, özel CSS/JS yalnızca ADMIN
        (bkz. `Appearance` tag'i).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteAppearance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Appearance]
      summary: Site görünüm ayarlarını güncelle (yalnızca SiteRole=ADMIN)
      description: >
        Satır yoksa (ilk çağrı) `DEFAULTS` ile birlikte oluşturulur (upsert) —
        `PATCH /admin/settings` ile AYNI desen. Tüm alanlar opsiyoneldir; yalnızca
        GÖNDERİLEN alanlar yazılır. Audit log: `appearance.update`
        (`metadata.changed` = gönderilen alan adları).


        **Panelin 9 bölümünün HEPSİ bu TEK ucu kullanır** — bölüm başına ayrı uç
        YOKTUR (özel CSS/JS hariç, bkz. `/admin/appearance/custom-code/*`). "Bölüm
        başına Kaydet" bir ARAYÜZ kavramıdır: her bölüm yalnızca kendi alanlarını
        gönderir, kısmi PATCH semantiği bunu doğal olarak karşılar. 9 ayrı uç, 9
        ayrı Zod şeması ve zamanla birbirinden sapan 9 kod yolu demek olurdu.


        **Tema ön ayarı (preset) uygulama bir SUNUCU işlemi DEĞİLDİR:** istemci
        `GET /admin/appearance/presets`'ten değerleri alır, formu doldurur ve
        kullanıcı Kaydet dediğinde bu uca `presetKey` ile BİRLİKTE tüm alanları
        gönderir. `presetKey` yalnızca "en son hangi ön ayardan başlandı" bilgisidir,
        CANLI BİR BAĞ DEĞİLDİR — ön ayar sonradan değişirse kayıtlı renkler
        değişmez. Kullanıcı tek bir rengi elle değiştirirse istemci `presetKey`'i
        `null` (özel) gönderir.


        **Kontrast (WCAG) sunucuda ZORLANMAZ:** renk seçimi öznel bir tasarım
        kararıdır ve sert bir 422 kullanıcıyı kilitlerdi. İstemci, kontrast oranı
        AA eşiğinin altındaysa seçicinin yanında ENGELLEMEYEN bir uyarı gösterir
        (bkz. §10.12.4, ui-designer eşiği tanımlar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteAppearanceRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteAppearance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`pageHeaderBackgroundMediaId` ile gönderilen medya bulunamadı (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/appearance/presets:
    get:
      tags: [Appearance]
      summary: Tema ön ayarlarını listele — statik registry (authenticated)
      description: >
        Kod içi statik `lib/appearance-presets.ts` listesi — `MODULE_REGISTRY` ve
        `PERMISSIONS_MATRIX` ile AYNI patern (bkz. `GET /admin/settings/permissions`,
        o da statik bir matrisi API üzerinden sunar). DB tablosu YOKTUR.


        **Neden frontend sabiti değil de sunucu ucu (karar):** ön ayar, doğrudan
        bu kontratın alanlarına yazılacak DEĞERLER içerir (renk kodları, `SiteFont`
        enum'u). Frontend sabiti olsaydı, sunucu tarafı doğrulamadan bağımsız
        evrilir ve enum'da olmayan bir font içeren bir ön ayar kaydedilirken 422
        verirdi. Sunucu sahipliği tek doğruluk kaynağını ve test edilebilirliği
        garanti eder.


        **Public DEĞİLDİR:** ziyaretçi sitesi ön ayar TANIMLARINI asla okumaz,
        yalnızca uygulanmış (kaydedilmiş) değerleri `GET /appearance`'tan alır.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AppearancePreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/appearance/reset:
    post:
      tags: [Appearance]
      summary: Görünüm ayarlarını varsayılana/ön ayara döndür (yalnızca SiteRole=ADMIN)
      description: >
        Kullanıcı renk/tipografi ayarlarını bozduğunda geri dönüş kapısı. Gövde boşsa
        (`presetKey` yok) fabrika `DEFAULTS`'una, `presetKey` verilirse o ön ayarın
        değerlerine döner.


        **Özel CSS/JS bu işlemden ETKİLENMEZ** (bilinçli karar): "renklerimi
        sıfırla" niyeti, kullanıcının elle yazdığı kodu sessizce silmeyi ASLA
        kapsamaz. Özel kodu temizlemek için ilgili PUT ucuna boş değer gönderilir.
        Audit log: `appearance.reset` (`metadata.presetKey`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetAppearanceRequest" }
      responses:
        "200":
          description: Sıfırlandı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteAppearance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Bilinmeyen `presetKey` (`error.code: NOT_FOUND`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/appearance/custom-code:
    get:
      tags: [Appearance]
      summary: Özel CSS/JS'i ve denetim izini oku (authenticated)
      description: >
        CSS ve JS gövdeleri + kim/ne zaman güncelledi bilgisi. Okuma eşiği
        authenticated'tır: bu kod zaten public HTML kaynağında görünür olduğundan
        okumayı ADMIN'e kısıtlamak GÜVENLİK TİYATROSU olurdu. Yazma eşiği ise
        yalnızca ADMIN'dir (aşağıdaki PUT uçları) — arayüz, ADMIN olmayan kullanıcıya
        editörü salt-okunur gösterir.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteCustomCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/appearance/custom-code/css:
    put:
      tags: [Appearance]
      summary: Özel CSS'i tamamen değiştir (yalnızca SiteRole=ADMIN)
      description: >
        **PUT (PATCH değil):** gövde tek bir metin belgesinin TAMAMIDIR, kısmi
        birleştirme semantiği yoktur.


        **Neden EDITOR DEĞİL (hakemlik kararı, §10.12.6):** EDITOR'a global CSS
        yazma yetkisi verip renk seçiciyi yasaklamak tutarsız olurdu; ayrıca CSS
        tek başına bir saldırı yüzeyidir — `position: fixed` kaplama ile
        clickjacking, `content: url(...)` ile dışarı veri sızdırma, yasal
        uyarıları/çerez bandını `display: none` ile gizleme. Bu panelin TÜM yazma
        uçları ADMIN'dir.


        **`acknowledged` kuralı:** `css` BOŞ DEĞİLSE gövdede `acknowledged: true`
        ZORUNLUDUR; eksik/`false` ise `422 VALIDATION_ERROR` döner. Kodu TEMİZLEMEK
        (`null` veya `""`) onay GEREKTİRMEZ — kod kaldırmak her zaman güvenlidir.
        Bu alan, arayüzdeki "bu kodun ne yaptığını anlıyorum" onay kutusunun
        kontrattaki karşılığıdır ve sunucu tarafında ZORLANIR (yalnızca arayüzde
        kalan bir onay, doğrudan API çağrısıyla atlanabilirdi).


        Audit log: `appearance.custom_css.update`, `metadata: { length, sha256,
        acknowledged }`. **Kod gövdesi audit metadata'sına YAZILMAZ** — 50 KB'lık
        bir blob'u denetim kaydında çoğaltmak yerine sha256 özeti tutulur.


        **Hız sınırı:** 10 istek / 1 dakika. Aşım → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomCssRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteCustomCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            SiteRole ADMIN değil VEYA `CUSTOM_CODE_ENABLED=false` (kill switch,
            §10.12.6) — `error.code: FORBIDDEN`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/appearance/custom-code/js:
    put:
      tags: [Appearance]
      summary: Özel JS'i tamamen değiştir (yalnızca SiteRole=ADMIN, en yüksek risk)
      description: >
        **Bu kontrattaki EN YÜKSEK RİSKLİ yazma ucudur:** kaydedilen metin, her
        ziyaretçinin tarayıcısında sitenin kendi kaynağından çalışır. Ayrı bir uç
        olmasının sebebi, rol/onay/denetim politikasını CSS'ten bağımsız
        sıkılaştırabilmek ve tek bir gövde içinde alan-başına rol kontrolü yapma
        anti-paterninden kaçınmaktır (rol, `requireSiteRole` preHandler'ı ile uç
        seviyesinde zorlanır).


        Kurallar CSS ucuyla AYNI (`acknowledged` zorunluluğu, sha256 audit,
        10 istek/dakika) + şu farklar:

        - Kill switch `CUSTOM_CODE_ENABLED=false` iken bu uç 403 döner VE
          `GET /appearance` `customJs: null` döner.

        - Audit action: `appearance.custom_js.update`.

        - Maksimum uzunluk 20.000 karakter (CSS'te 50.000) — bu metin her sayfanın
          HTML'ine gömülür, doğrudan sayfa ağırlığıdır.


        **Sunucu tarafı "sanitizasyon" BİLİNÇLİ OLARAK YAPILMAZ (karar):** keyfi
        JavaScript'i anlamlı biçimde temizlemek teorik olarak imkânsızdır ve kısmi
        bir temizleyici, olmayan bir güvenliğe dair yanlış güven yaratırdı. Koruma
        katmanları bunun yerine: yetenek kısıtı (yalnızca ADMIN), açık onay
        (`acknowledged`), denetim izi (sha256 + aktör), hız sınırı ve kill switch.


        **CSP notu (security-agent):** şu an `@fastify/helmet` `contentSecurityPolicy:
        false` ile çalışıyor. İleride CSP açılırsa bu satır-içi (inline) script
        bloğu bir nonce veya sha256 kaynağı gerektirir — özet zaten denetim için
        hesaplandığından yeniden kullanılabilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomJsRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteCustomCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            SiteRole ADMIN değil VEYA `CUSTOM_CODE_ENABLED=false` (kill switch) —
            `error.code: FORBIDDEN`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/modules:
    get:
      tags: [Modules]
      summary: Modül listesini oku — tanım + aktif/pasif durum (ADMIN/MANAGER/EDITOR)
      description: >
        Kod içi statik `MODULE_REGISTRY`'deki HER modül tanımı (`key`/`label`/
        `description`/`recommendedFor`) `SiteModule` tablosundaki (varsa) durum
        satırıyla LEFT JOIN mantığıyla birleştirilir — registry'de olup DB'de satırı
        olmayan bir modül `defaultEnabled` değeriyle, `updatedAt: null`/`updatedBy: null`
        olarak döner (bkz. ARCHITECTURE.md §10.9.1).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SiteModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/modules/{key}:
    parameters:
      - $ref: "#/components/parameters/ModuleKey"
    patch:
      tags: [Modules]
      summary: Bir modülü aç/kapat (yalnızca SiteRole=ADMIN)
      description: >
        `key` registry'de tanımlı değilse `404 NOT_FOUND` döner. DB'de satır yoksa
        (ilk toggle) lazy-upsert ile oluşturulur. Audit log: `module.enable` /
        `module.disable` (`metadata: { key, enabled }`).


        **Kapatmanın etkisi:** ilgili modülün PUBLIC uçları (`Products`/`Portfolio`/
        `Cart`/`Checkout` tag'leri) `404 NOT_FOUND` döner — admin uçları ETKİLENMEZ,
        mevcut veri korunur (bkz. ARCHITECTURE.md §10.9.1 "neden 404, neden admin
        guard'lanmıyor").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModuleRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SiteModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /modules:
    get:
      tags: [Modules]
      security: []
      summary: Aktif modül anahtarlarını oku (public)
      description: >
        Site header/nav'ının hangi modülleri (ör. "Ürünler" menü linki) göstereceğine
        karar vermek için okuduğu dar/minimal görünüm — `label`/`description`/
        `updatedBy` TAŞIMAZ.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicSiteModule" }

  /admin/products:
    get:
      tags: [Products]
      summary: Ürünleri listele — çöp filtresi + sekme sayaçları + arama (authenticated)
      description: >
        Çöp kutusu semantiği, sekme sayaçları (`meta.counts`) ve cursor sayfalama
        `Pages`/`Blog` (§10.7) ile BİREBİR AYNIDIR. EK olarak `search` — `title`/`sku`
        alanlarında büyük/küçük harf duyarsız (`contains`, `insensitive`) arama yapar.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/TrashedFilter"
        - $ref: "#/components/parameters/ContentStatusFilter"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      meta: { $ref: "#/components/schemas/ContentListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Products]
      summary: Yeni ürün oluştur (SiteRole=ADMIN veya MANAGER)
      description: >
        `slug` verilmezse `title`'dan üretilir. `authorId` verilmezse giriş yapmış
        kullanıcı yazar olur (yalnızca ADMIN başka bir kullanıcı atayabilir — §10.7 ile
        AYNI kural). `priceCents`/`discountPriceCents` HER ZAMAN kuruş/cent cinsinden
        pozitif tam sayıdır (float KESİNLİKLE kabul edilmez). `discountPriceCents`
        verilmişse `priceCents`'ten KÜÇÜK olmalıdır, aksi halde `422
        VALIDATION_ERROR` (`error.details.discountPriceCents`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Ürün oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Products]
      summary: Ürün detayı (authenticated)
      description: "Çöpteki ürünü de döner (geri yükleme/onay ekranları için) — `deletedAt` filtresi YOKTUR."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Products]
      summary: Ürünü güncelle (SiteRole=ADMIN veya MANAGER)
      description: >
        Her başarılı PATCH, güncellemeden önceki hali `ContentRevision` olarak kaydeder
        (`entityType: PRODUCT`, §10.1 ile AYNI mekanizma); revizyonlar
        `GET /admin/products/{productId}/revisions` ile listelenir ve
        `POST .../revisions/{revisionId}/restore` ile geri yüklenir (Page/BlogPost ile
        TAM PARİTE). Çöpteki bir ürün DÜZENLENEMEZ → `409 CONFLICT`. Fiyat/
        indirim doğrulaması `POST` ile AYNIDIR (nihai/etkin değerler üzerinden çapraz
        kontrol edilir — istekte yalnızca `discountPriceCents` gönderilse dahi mevcut
        kayıttaki `priceCents`'e göre doğrulanır).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği düzenleme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Products]
      summary: Ürünü ÇÖPE TAŞI — soft delete (SiteRole=ADMIN veya MANAGER)
      description: "`Pages`/`Blog` (§10.7) ile BİREBİR AYNI davranış. İdempotenttir. Kalıcı silme için `DELETE .../permanent` (ADMIN veya MANAGER)."
      responses:
        "204": { description: Çöpe taşındı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/autosave:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Ürünü otomatik kaydet — 3sn debounce (SiteRole=ADMIN veya MANAGER)
      description: >
        Davranış `POST /admin/pages/{pageId}/autosave` ile BİREBİR AYNI — oradaki
        açıklama (`ContentRevision` ÜRETMEZ, `AuditLog` YAZMAZ, çöpteki içerik 409)
        bağlayıcıdır. Gövde `UpdateProductRequest`'in DAR bir alt kümesidir — yalnızca
        serbest metin alanları (`title`/`excerpt`/`descriptionHtml`) korunur.
        **Fiyat/indirim/SKU/stok/durum bu uçtan DEĞİŞTİRİLEMEZ** (şema seviyesinde
        yoktur): `priceCents`/`discountPriceCents` çapraz-alan kuralı ve `sku` tekilliği
        yarım kalmış bir taslak üzerinde 3 saniyede bir doğrulanamaz; ticari alanlar
        yalnızca bilinçli `PATCH` ile yazılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutosaveProductRequest" }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AutosaveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Çöpteki içeriği autosave etme girişimi (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/bulk:
    post:
      tags: [Products]
      summary: Ürünlerde toplu işlem (SiteRole=ADMIN veya MANAGER)
      description: >
        `POST /admin/pages/bulk` ile BİREBİR AYNI gövde, aynı yanıt, aynı atlama
        kuralları; ucun TAMAMI ADMIN/MANAGER eşiğindedir (EDITOR gönderirse tüm
        istek 403, kısmi uygulama YAPILMAZ). Audit action öneki `product.bulk_<action>`.


        **Atomiklik (mimar kararı — ortak helper):** `pages`/`blog` ile aynı kod yolu
        kullanılır; toplu işlem TEK bir transaction içinde çalışır ve `permanent-delete`
        dalında ilgili `ContentRevision` satırları (`entityType: PRODUCT`) aynı
        transaction'da elle silinir (polymorphic, FK YOK). Atlanan id'ler transaction'ı
        BOZMAZ — kısmi başarı bir hata değildir (200 + `skippedIds`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkContentActionRequest" }
      responses:
        "200":
          description: İşlem uygulandı (kısmi başarı dahil)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BulkContentActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [ContentRevisions]
      summary: Ürünün revizyon geçmişini listele (SiteRole=ADMIN veya MANAGER)
      description: >
        `GET /admin/pages/{pageId}/revisions` ile BİREBİR AYNI sözleşme — liste görünümü
        `snapshot` alanını İÇERMEZ, en yeni revizyon önce gelir. Kayıtlar
        `entityType: PRODUCT` filtresiyle okunur.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ContentRevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [ContentRevisions]
      summary: Bir revizyonun tam snapshot'ını getir (SiteRole=ADMIN veya MANAGER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/ContentRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [ContentRevisions]
      summary: Ürünü bu revizyondaki hale geri döndür (SiteRole=ADMIN veya MANAGER)
      description: >
        Geri dönüş de geri alınabilsin diye önce mevcut state yeni bir revizyon olarak
        kaydedilir, ardından hedef revizyonun snapshot'ı uygulanır.


        **`Page`/`BlogPost`'tan TEK FARK — 422 dalı vardır.** Snapshot uygulanmadan ÖNCE
        `PATCH /admin/products/{productId}` ile AYNI çapraz-alan doğrulamaları
        çalıştırılır: `discountPriceCents < priceCents`
        (`products.routes.ts::assertDiscountBelowPrice`). Doğrulama düşerse hiçbir şey
        yazılmaz (transaction geri alınır) ve `422 VALIDATION_ERROR` döner. Ayrıca
        snapshot'taki `sku`/`slug` bu arada BAŞKA bir kayda geçmişse `409 CONFLICT`
        döner — geri yükleme tekilliği ASLA ihlal etmez.
      responses:
        "200":
          description: Ürün geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Snapshot'taki `slug` veya `sku` bu arada başka bir kayda geçmiş, ya da ürün
            çöpte (`error.code: CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Ürünü çöpten geri yükle (SiteRole=ADMIN veya MANAGER)
      description: "`status` DEĞİŞMEZ. İdempotenttir — çöpte olmayan ürün için de 200 ve mevcut kayıt döner."
      responses:
        "200":
          description: Geri yüklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/permanent:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    delete:
      tags: [Products]
      summary: Ürünü KALICI sil — geri alınamaz (ADMIN veya MANAGER)
      description: >
        Ürün ÖNCE çöpte olmalıdır, değilse `409 CONFLICT`. Aynı transaction içinde
        `ContentRevision` satırları (polymorphic, FK YOK → elle silinir, `entityType:
        PRODUCT`) temizlenir. Audit log: `product.permanent_delete`.
      responses:
        "204": { description: Kalıcı olarak silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Ürün çöpte değil (`error.code: CONFLICT`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  /admin/products/{productId}/stock:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [Products]
      summary: Stoku ELLE düzelt (SiteRole=ADMIN veya MANAGER)
      description: >
        Adminin manuel stok düzeltmesi içindir — checkout'un OTOMATİK stok düşürmesiyle
        (bkz. `Webhooks` tag'i, `handleOrderPaid`) KARIŞTIRILMAMALIDIR; bu uç Serializable
        transaction KULLANMAZ (basit doğrudan `UPDATE`). Audit log: `product.stock_adjust`
        (`metadata: { from, to }`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustProductStockRequest" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/products/{productId}/images:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Ürün galerisine görsel ekle (SiteRole=ADMIN veya MANAGER)
      description: >
        `mediaId` galeride ZATEN varsa (`@@unique([productId, mediaId])`) `409
        CONFLICT`. Yeni satır mevcut en yüksek `order` değerinin bir fazlasına eklenir
        (galerinin SONUNA). Güncellenmiş `Product` DTO'sunu (galeri dahil) döner.
      requestBody:
        required: true
