  /public/products/categories:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Ürün kategorilerini listele
      description: "`products` modülü kapalıysa `404`. Rota önceliği `/public/blog/categories` ile aynı."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PublicCategory" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/products/{slug}:
    parameters:
      - $ref: "#/components/parameters/PublicSlug"
      - $ref: "#/components/parameters/LocaleQuery"
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Ürün detayı — slug ile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicProduct" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "403": { $ref: "#/components/responses/ApiKeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/portfolio:
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Yayındaki portföy öğelerini listele
      description: >
        **Manuel `order asc` ile sıralanır** (`seq`/`publishedAt` DEĞİL) — mevcut
        `/portfolio` ucuyla aynı (§10.9.4). `portfolio` modülü kapalıysa `404`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LocaleQuery"
        - name: category
          in: query
          required: false
