        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/portfolio/{slug}:
    parameters:
      - $ref: "#/components/parameters/PublicSlug"
      - $ref: "#/components/parameters/LocaleQuery"
    get:
      tags: [PublicApi]
      security: [{ apiKeyAuth: [] }]
      summary: Portföy öğesi detayı — slug ile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PublicPortfolioItem" }
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "403": { $ref: "#/components/responses/ApiKeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        §10.13.4 — YALNIZCA `/api/v1/public/*` katmanında geçerlidir. Ham anahtar
        formatı `cmsk_<12hex>_<64hex>` (82 karakter). `Authorization: Bearer <key>`
        biçimi **KABUL EDİLMEZ** (bağlayıcı karar — kimlik bilgisi türlerinin
        karışmasını yapısal olarak engeller). Anahtar geçersiz/iptal edilmiş/süresi
        dolmuşsa `401`; scope yetersizse `403`. Hata mesajı "yok" ile "yanlış"
        ayrımını YAPMAZ (numaralandırma koruması).

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaFolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaFolderFilter:
      name: folderId
      in: query
      required: false
      description: >
        Klasör filtresi (§10.11). Verilmezse **filtre uygulanmaz** (tüm kütüphane,
        klasörlü + klasörsüz). `none` = yalnızca "Kategorisiz" (`folderId IS NULL`).
        UUID = yalnızca o klasördeki medya, ÖZYİNELEMELİ DEĞİL (alt klasörlerdekiler
        DAHİL EDİLMEZ). UUID de `none` de olmayan bir değer → `422`. Var olmayan bir
        UUID → `404` DEĞİL, boş liste + `200` (klasör silinirken açık kalan bir
        sekmenin hata göstermemesi için).
      schema:
        type: string
        description: "UUID veya `none` sabiti."
    TrashedFilter:
      name: trashed
      in: query
      required: false
      description: >
        Çöp kutusu filtresi (§10.7). `exclude` (varsayılan) = yalnızca
        `deletedAt IS NULL`; `include` = çöptekiler dahil tümü; `only` = yalnızca çöp.
      schema:
        type: string
        enum: [exclude, include, only]
        default: exclude
    ContentStatusFilter:
      name: status
      in: query
      required: false
      description: >
        Sunucu tarafı durum filtresi. v1 admin liste ekranı KULLANMAZ (sekmeler
        client-side filtreler) — API tüketicileri ve ileride sunucu-taraflı sayfalama için.
      schema: { $ref: "#/components/schemas/PageStatus" }
    TemplateKey:
      name: key
      in: path
      required: true
      deprecated: true
      description: >
        KULLANIMDAN KALDIRILDI (§10.16.6) — şablonlar artık `id` (uuid) ile adreslenir,
        bkz. `EmailTemplateId`. Kullanıcının oluşturduğu şablonların `key`'i `null`'dır.
      schema: { type: string }
    EmailTemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactSubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportJobTypeFilter:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ImportJobType" }
    ImportJobStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ImportJobStatus" }
    StatsDays:
      name: days
      in: query
      required: false
      deprecated: true
      description: >
        DEPRECATED — `from`/`to` kullanın. `from`/`to` verilmezse geriye uyumluluk
        amacıyla kullanılır (varsayılan son 30 gün, en fazla 90 gün). `from`/`to` ile
        birlikte verilirse `from`/`to` kazanır.
      schema: { type: integer, minimum: 1, maximum: 90 }
    StatsFrom:
      name: from
      in: query
      required: false
      description: "ISO-8601 (UTC) başlangıç tarihi. `to` ile BİRLİKTE verilmelidir."
      schema: { type: string, format: date-time }
    StatsTo:
      name: to
      in: query
      required: false
      description: >
        ISO-8601 (UTC) bitiş tarihi. `from` ile BİRLİKTE verilmelidir. `from`/`to`
        aralığı en fazla 366 gün olabilir ve `from` <= `to` olmalıdır — aşımı 422
        (`ValidationError`) ile reddedilir, iş/istek oluşturulmaz.
      schema: { type: string, format: date-time }
    StatsGranularity:
      name: granularity
      in: query
      required: false
      description: "`PageView`/kullanıcı/gelir günlük bucket'ının haftalık/aylık'a toplanması. Varsayılan `day`."
      schema:
        allOf:
          - $ref: "#/components/schemas/Granularity"
        default: day
    StatsCompare:
      name: compare
      in: query
      required: false
      description: >
        `true` ise bir önceki eş-uzunluktaki dönemle karşılaştırma deltası döner.
        Yalnızca `GET /admin/stats/summary` tarafından KULLANILIR — diğer `/admin/stats/*`
        uçları bu parametreyi kabul eder ama YOK SAYAR.
      schema: { type: boolean, default: false }
    ExportJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportJobTypeFilter:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ExportJobType" }
    ExportJobStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ExportJobStatus" }
    SearchQuery:
      name: search
      in: query
      required: false
      description: >
        Serbest metin arama (§10.9.2/§10.9.4) — `Products` uçlarında `title`/`sku`,
        `Portfolio` uçlarında `title`/`clientName` üzerinde büyük/küçük harf duyarsız
        (`contains`, `insensitive`) çalışır. v1 admin liste ekranı KULLANMAZ (bkz.
        `TrashedFilter`/`ContentStatusFilter` ile AYNI "API tüketicileri için" gerekçesi).
      schema: { type: string, minLength: 1 }
    ModuleKey:
      name: key
      in: path
      required: true
      description: "ör. products, portfolio (bkz. lib/module-registry.ts::MODULE_REGISTRY)"
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ProductCategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlogCategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlogTagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    PortfolioCategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/OrderStatus" }
    LocaleCode:
      name: code
      in: path
      required: true
      description: "BCP-47 dil kodu, küçük harf (`tr`, `en`, `de`, `en-gb`)."
      schema: { type: string, pattern: "^[a-z]{2,3}(-[a-z0-9]{2,8})?$" }
    LocaleQuery:
      name: locale
      in: query
      required: false
      description: >
        İçeriğin hangi dilde döneceği. Verilmezse VEYA varsayılan dile eşitse kanonik
        kolonlar aynen döner. Bilinmeyen/devre dışı bir kod verilirse **hata DEĞİL**,
        sessizce varsayılan dil kullanılır (`400` DÖNMEZ) — gerekçe: locale, URL'den
        türeyen bir sunum tercihidir; geçersiz bir dil yüzünden içerik sayfası
        çökmemelidir. Rota düzeyinde 404 kararını frontend `[lang]` segmenti verir.


        **Alan bazlı fallback:** istenen dilde bulunmayan/boş her alan tek tek
        varsayılan dilden doldurulur — kısmi çeviri GEÇERLİDİR (bkz. `Content Fallback`).


        **TEK İSTİSNA — `Page.isLegalDocument: true`:** hukuki belgelerde fallback
        UYGULANMAZ, gövde boş döner (KVKK m.10 / GDPR m.12). Bkz.
        `Page.isLegalDocument`.
      schema: { type: string, pattern: "^[a-z]{2,3}(-[a-z0-9]{2,8})?$" }
      example: en
    ImageId:
      name: imageId
      in: path
      required: true
      description: >
        `ProductImage`/`PortfolioImage` satır id'si — `POST/DELETE .../images` uçlarında
        `productId`/`itemId` ile BİRLİKTE kullanılır. `DELETE`'te route handler `imageId`'nin
        GERÇEKTEN o `productId`/`itemId`'ye ait olduğunu doğrular (IDOR koruması) —
        eşleşmezse (başka bir ürünün/öğenin görsel id'si verilse dahi) `404 NOT_FOUND`.
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ApiKeyStatus" }
    OutboundWebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookDeliveryStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
    WebhookEventFilter:
      name: event
      in: query
      required: false
      schema: { $ref: "#/components/schemas/WebhookEvent" }
    PublicSlug:
      name: slug
      in: path
      required: true
      description: >
        İstenen dildeki slug. Çözümleme `/pages/{slug}` ile BİREBİR AYNIDIR
        (§10.13.5 madde 4): (1) `ContentSlug(locale, slug)` tam eşleşme,
        (2) varsayılan dildeki kanonik `slug` kolonu. İkisi de tutmazsa `404`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Kimlik doğrulama yok/geçersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Forbidden:
      description: Yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    NotFound:
      description: Kaynak bulunamadı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    Conflict:
      description: Çakışma (ör. e-posta zaten kayıtlı)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ValidationError:
      description: Girdi doğrulama hatası
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    TooManyRequests:
      description: "Hız sınırı aşıldı (`error.code: RATE_LIMITED`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    PayloadTooLarge:
      description: >
        Yüklenen dosya/istek gövdesi izin verilen boyutu aşıyor
        (`error.code: PAYLOAD_TOO_LARGE`, bkz. lib/errors.ts::PayloadTooLargeError).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ApiKeyUnauthorized:
      description: >
        `X-Api-Key` eksik, formata uymuyor, bilinmiyor, iptal edilmiş veya süresi
        dolmuş (`error.code: UNAUTHORIZED`). **Mesaj bu durumları AYIRT ETMEZ** —
        tek ve sabit bir metin döner ("Geçersiz veya eksik API anahtarı.");
        numaralandırma/oracle davranışı engellenir (§10.13.4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
    ApiKeyForbidden:
      description: >
        Anahtar geçerli ama `scope` yetersiz (`error.code: FORBIDDEN`). v1'de tüm
        public uçlar `READ` istediği için pratikte oluşmaz; kontrat ileride yazma
        uçları eklendiğinde davranışın belirsiz kalmaması için ŞİMDİDEN tanımlıdır
        (§10.13.4 madde 5).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }

  headers:
    RateLimitLimit:
      description: >
        §10.13.6 — **Katman 2'nin (doğrulanmış anahtar başına kota)** üst sınırı.
        Katman 1 (IP tabanı, 300/dk) bilinçli olarak yansıtılmaz: entegratör için
        anlamlı olan kendi anahtarının kotasıdır, IP tabanı sessiz bir güvenlik
        tabanıdır.
      schema: { type: integer, example: 120 }
    RateLimitRemaining:
      description: "Geçerli pencerede kalan istek hakkı (anahtar kotası)."
      schema: { type: integer, example: 118 }
    RateLimitReset:
      description: "Pencerenin sıfırlanmasına kalan saniye."
      schema: { type: integer, example: 42 }

  schemas:
    # -------------------------------------------------------------------------
    # Localization (§10.5 — bkz. .claude/architect-scope-i18n.md)
    # -------------------------------------------------------------------------
    Locale:
      type: object
      description: >
        Desteklenen bir dil. **Bu bir VERİ satırıdır, kod sabiti DEĞİLDİR** — yeni dil
        eklemek migration gerektirmez (kabul kriteri).
      required: [code, label, nativeLabel, isDefault, enabled, sortOrder]
      properties:
        code:
          type: string
          description: "BCP-47, küçük harf. Birincil anahtar; oluşturulduktan sonra DEĞİŞMEZ."
          example: en
        label:
          type: string
          description: "Yönetim panelinde gösterilen ad (panel dilinde) — ör. \"İngilizce\"."
        nativeLabel:
          type: string
          description: "Dilin kendi adı — site dil değiştiricide BU gösterilir (ör. \"English\")."
        isDefault:
          type: boolean
          description: >
            Varsayılan/kanonik dil. **Tam olarak BİR** locale `true` olabilir (DB'de
            partial unique index ile zorlanır). Bu dil URL'de prefix ALMAZ ve içerik
            tablolarındaki kanonik kolonlarda saklanır.
        enabled:
          type: boolean
          description: "`false` ise public `/locales` yanıtında ve `[lang]` rota uzayında YER ALMAZ; içerik çevirileri KORUNUR (silinmez)."
        sortOrder:
          type: integer
          description: "Dil değiştiricideki görüntülenme sırası (artan)."
        hreflang:
          type: string
          nullable: true
          description: >
            `<link rel="alternate" hreflang="...">` ve sitemap `alternates` için
            kullanılacak değer. Boşsa `code` kullanılır. Bölgesel hedefleme gereken
            durumlar içindir (ör. `code: en` iken `hreflang: en-GB`).
        translatedContentCount:
          type: integer
          readOnly: true
          description: >
            Bu dilde EN AZ BİR alanı çevrilmiş içerik sayısı (`ContentSlug` satır
            sayısı). YALNIZCA `/admin/locales` yanıtlarında döner — silme onay
            diyaloğunun etkisini göstermek için.

    LocaleUpsertRequest:
      type: object
      required: [code, label, nativeLabel]
      properties:
        code: { type: string, pattern: "^[a-z]{2,3}(-[a-z0-9]{2,8})?$" }
        label: { type: string, minLength: 1 }
        nativeLabel: { type: string, minLength: 1 }
        enabled: { type: boolean, default: false }
        sortOrder: { type: integer, default: 0 }
        hreflang: { type: string, nullable: true }

    LocaleUpdateRequest:
      type: object
      description: "`code` KASITLI olarak yoktur — değiştirilemez (bkz. uç açıklaması)."
      properties:
        label: { type: string, minLength: 1 }
        nativeLabel: { type: string, minLength: 1 }
        enabled: { type: boolean }
        isDefault: { type: boolean }
        sortOrder: { type: integer }
        hreflang: { type: string, nullable: true }

    ContentLocalization:
      type: object
      description: >
        Bir içeriğin TEK bir dildeki yayın durumu ve slug'ı. Her içerik DTO'su
        (`Page`, `BlogPost`, `Product`, `PortfolioItem`) `localizations` dizisinde
        BUNLARI döner — hreflang etiketleri, sitemap `alternates` ve site dil
        değiştiricisi TEK bir istekle bu diziden beslenir (N+1 istek YOK).
      required: [locale, slug, translated]
      properties:
        locale: { type: string, example: en }
        slug:
          type: string
          description: >
            Bu dildeki slug. İçerik bu dilde çevrilmemişse (`translated: false`)
            varsayılan dilin slug'ı döner — URL her zaman çözümlenebilir kalır.
          example: about-us
        translated:
          type: boolean
          description: >
            `true` = bu dilde gerçek bir çeviri VAR (en azından başlık). `false` =
            içerik bu dilde varsayılan dile düşüyor.


            **SEO kuralı (bağlayıcı):** `translated: false` olan diller için hreflang
            alternate ÜRETİLMEZ ve sitemap'e girmez — aksi halde Google'a birebir
            aynı içerik farklı URL'lerde duplicate olarak sunulmuş olur.

    ContentTranslations:
      type: object
      description: >
        İçeriğin çeviri gölgesi. Anahtar = locale kodu (küçük harf), değer = yalnızca
        OVERRIDE edilen alanlar. Kanonik/varsayılan dil BU OBJEDE YER ALMAZ — o,
        tablonun kendi kolonlarındadır.


        **Kısmi olabilir:** eksik her alan varsayılan dilden gelir. `PATCH` uçları bu
        alanı **shallow merge** eder (locale bazında): gönderilen locale'in objesi tam
        replace edilir, gönderilmeyen locale'ler KORUNUR. Bir dilin çevirisini silmek
        için o locale anahtarını `null` gönderin.
      additionalProperties:
        type: object
        description: "Çevrilebilir alanlar — entity'ye göre değişir (bkz. aşağıdaki örnek)."
        properties:
          title: { type: string }
          slug:
            type: string
            description: >
              Bu dile ÖZEL slug (ör. TR `hakkimizda` ↔ EN `about-us`). Yazıldığında
              backend `ContentSlug` tablosunda `(locale, slug)` benzersizliğini
              doğrular; çakışırsa `409 CONFLICT`. Verilmezse kanonik slug kullanılır.
          seoTitle: { type: string }
          seoDescription: { type: string }
          ogTitle: { type: string }
          canonicalUrl: { type: string, nullable: true }
          excerpt: { type: string, description: "BlogPost/Product" }
          summary: { type: string, description: "PortfolioItem" }
          contentHtml: { type: string, description: "BlogPost/PortfolioItem — sanitize edilir" }
          descriptionHtml: { type: string, description: "Product — sanitize edilir" }
          blocks:
            type: array
            items: { type: object }
            description: >
              YALNIZCA Page — kanonik `blocks` alanıyla TAM OLARAK AYNI şemadan
              (`PageBlockListSchema`, §10.19) geçer: derinlik ≤4, konteyner başına ≤24
              çocuk, toplam ≤300 düğüm, gövde ≤256 KB, `container`/`columns`/`gallery`
              şekil doğrulaması VE aynı sanitize kuralları. Bu, `translations` yolunun
              ana `blocks` yolundan daha gevşek bir DoS/XSS yüzeyi açmaması içindir.
      example:
        en:
          title: About Us
          slug: about-us
          seoDescription: Learn more about our company.

    ApiSuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            nextCursor: { type: string, nullable: true }

    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              # `BAD_REQUEST` ve `EMAIL_DELIVERY_FAILED` backend'de (`lib/errors.ts::ApiErrorCode`)
              # ZATEN üretiliyordu ama bu enum'da EKSİKTİ — sözleşme drift'i kapatıldı
              # (`PAYLOAD_TOO_LARGE` için daha önce yapılan düzeltmenin aynısı).
              enum:
                [
                  BAD_REQUEST,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  VALIDATION_ERROR,
                  CONFLICT,
                  RATE_LIMITED,
                  PAYLOAD_TOO_LARGE,
                  EMAIL_DELIVERY_FAILED,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        role:
          type: string
          enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER]
          description: >
            §10.21 — site-geneli rol. Panel erişimi olan roller: `ADMIN`, `MANAGER`,
            `EDITOR`. `CUSTOMER` ve `USER` `/admin/*` altındaki hiçbir uca erişemez (403).
            Yeni kayıtların varsayılanı `USER`'dır (sıfırdan kurulan ortamda İLK hesap
            `ADMIN`). Tam yetki matrisi: kök seviyedeki `x-site-rbac` bloğu +
            `.claude/architect-scope-rbac-5-tier.md` §5.
        canUseAdvancedBuilder:
          type: boolean
          readOnly: true
          description: >
            §10.21 — bu kullanıcı sayfa bloklarının **YAPISINI** değiştirebilir mi
            (ekleme/silme/taşıma, `container.settings`, `reveal`, `custom-html`).
            TÜRETİLMİŞ ve SALT-OKUNUR; doğrudan yazılamaz ve **ayarlanamaz**.


            `canUseAdvancedBuilder = (role === "ADMIN")`


            **BREAKING (§10.21):** v1'de bu alan kullanıcı-başı bir bayraktan
            (`User.advancedBuilderEnabled`) türüyordu. O kolon, o kolonu değiştiren uç
            (`PATCH /admin/users/{userId}/builder-access`) ve `AdminUser.advancedBuilderEnabled`
            DTO alanı **KALDIRILDI** — 5 rollü modelde ADMIN dışında hiçbir rol `true`
            olamayacağı için bayrak ölü kolona dönüşmüştü
            (gerekçe: `.claude/architect-scope-rbac-5-tier.md` §3).


            **Bu alan yalnızca UI'ın doğru kontrolleri göstermesi içindir, bir güvenlik
            kontrolü DEĞİLDİR.** Sunucu her yazma isteğinde bağımsız olarak yeniden
            hesaplar; istemcinin kontrolleri gizlemesine GÜVENİLMEZ.
        createdAt: { type: string, format: date-time }

    AdminUser:
      description: "`/admin/users` uçlarında dönen genişletilmiş kullanıcı DTO'su — yalnızca SiteRole=ADMIN görebilir (MANAGER dahil hiç kimse)."
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            status:
              type: string
              enum: [ACTIVE, SUSPENDED, DELETED]
              description: >
                `DELETED` yumuşak silmeyi ifade eder (bkz. `DELETE /admin/users/{userId}`).
                Bu değer yalnızca DELETE/restore uçlarıyla oluşur — `PATCH /status`
                gövdesinde KABUL EDİLMEZ. `DELETED` kullanıcılar listede yalnızca
                `includeDeleted=true` ile görünür.
            lastLoginAt: { type: string, format: date-time, nullable: true }
            deletedAt:
              type: string
              format: date-time
              nullable: true
              description: >
                Yumuşak silme zaman damgası. `status: DELETED` ise dolu, aksi hâlde
                `null`. Geri alma (`restore`) bu alanı tekrar `null` yapar.

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        actorEmail: { type: string, nullable: true }
        action: { type: string, example: "user.role_change" }
        status: { type: string, enum: [SUCCESS, FAILURE, FORBIDDEN] }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateAdminUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role:
          type: string
          enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER]
          default: EDITOR
          description: >
            Varsayılan `EDITOR` — panel rolleri içindeki EN DAR olanı (yalnızca blog +
            medya + sayfa içeriği). `CUSTOMER`/`USER` da geçerli hedeflerdir (panel erişimi
            OLMAYAN hesabı elle sağlamak için).

    CreateAdminUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        setPasswordUrl: { type: string, format: uri }

    UpdateAdminUserRoleRequest:
      description: >
        §10.21 — `PATCH /admin/users/{userId}/role` gövdesi. **Yalnızca SiteRole=ADMIN
        çağırabilir** (MANAGER dahil hiç kimse — dikey ayrıcalık yükseltmesi riski).
        Hedef rol 5 değerin HERHANGİ biri olabilir; `CUSTOMER`/`USER`'a düşürmek panel
        erişimini geri almanın (ban/downgrade) doğru aracıdır. Son aktif `ADMIN`'i başka
        HERHANGİ bir role çekmek `409 CONFLICT` verir (`assertNotLastActiveAdmin`).
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER] }

    UpdateAdminUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          description: >
            `DELETED` BİLEREK dışarıda bırakılmıştır (bkz. `DELETE /admin/users/{userId}`)
            — bu enum `AdminUser.status` okuma enum'undan DAR olmalıdır.

    PermissionsMatrix:
      type: object
      properties:
        roles:
          type: array
          items: { type: string, enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER] }
        modules:
          type: array
          items:
            type: object
            properties:
              module: { type: string }
              label: { type: string }
              actions:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string, enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER] }
        capabilities:
          type: array
          description: >
            ROLDEN TÜRETİLMEYEN yetenek ekseni. **§10.21 itibarıyla bu eksende
            KULLANICI-BAŞI verilebilen HİÇBİR yetenek KALMAMIŞTIR** — tek üye olan
            `advancedBuilder` artık saf bir rol türevidir (`alwaysGrantedTo: ["ADMIN"]`,
            `grantableTo: []`). Dizi, şekli bozup "Yetkiler" ekranını kırmamak ve ileride
            gerçek bir `Permission` tablosu geldiğinde sözleşme yerini hazır tutmak için
            KORUNMUŞTUR. `grantableTo` boş olduğu için UI hiçbir yetenek anahtarı
            (Switch) render etmez.
          items:
            type: object
            properties:
              key:
                type: string
                enum: [advancedBuilder]
                description: "İkinci bir yetenek eklemeden ÖNCE architect'e eskale edilir — bkz. `.claude/architect-scope-page-editor-roles.md` §1.7 (kural §10.21'de de geçerlidir)."
              label: { type: string, example: "Gelişmiş Düzenleyici" }
              alwaysGrantedTo:
                type: array
                description: "Bu yeteneğin rolden ötürü HER ZAMAN etkin olduğu roller. `advancedBuilder` için: `[\"ADMIN\"]`."
                items: { type: string, enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER] }
              grantableTo:
                type: array
                description: "Yöneticinin bu yeteneği kullanıcı başına açıp kapatabildiği roller. `advancedBuilder` için artık BOŞ dizidir (§10.21)."
                items: { type: string, enum: [ADMIN, MANAGER, EDITOR, CUSTOMER, USER] }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        ownerId: { type: string, format: uuid }
