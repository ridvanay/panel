      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

    PermissionsMatrix:
      type: object
      properties:
        roles:
          type: array
          items: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
        modules:
          type: array
          items:
            type: object
            properties:
              module: { type: string }
              label: { type: string }
              actions:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string, enum: [ADMIN, EDITOR, VIEWER] }

    Organization:
      type: object
