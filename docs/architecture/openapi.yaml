  /admin/import/jobs:
    get:
      tags: [Import]
      summary: İçe aktarma işi geçmişini listele (yalnızca ADMIN)
      description: >
        Cursor sayfalı, `seq DESC` (en yeni önce) sıralı. `preview` alanı liste
        görünümünde DÖNMEZ (büyük olabilir) — detay için `GET /admin/import/jobs/{jobId}`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ImportJobTypeFilter"
        - $ref: "#/components/parameters/ImportJobStatusFilter"
      responses:
