<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <!-- Paket M (2026-10-23) — doktor profil başlığı varsayılan arka planı. Projede üretildi, telifsizdir.
       Marka renkleri #2951A0 → #4ab9e1; yumuşak dalgalar, ince EKG çizgisi, noktalı ızgara ve soyut ağ. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2951A0"/>
      <stop offset="0.55" stop-color="#2f6fb8"/>
      <stop offset="1" stop-color="#4ab9e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#glow)"/>
  <rect x="960" y="0" width="640" height="300" fill="url(#dots)"/>

  <!-- Yumuşak dalgalar -->
  <path d="M0 360 C 220 300 420 420 680 370 S 1120 280 1360 330 S 1560 380 1600 360 L1600 480 L0 480 Z" fill="#ffffff" fill-opacity="0.07"/>
  <path d="M0 400 C 260 350 480 450 760 410 S 1180 330 1420 380 S 1580 420 1600 410 L1600 480 L0 480 Z" fill="#ffffff" fill-opacity="0.08"/>
  <path d="M0 440 C 300 410 560 470 860 445 S 1300 400 1600 440 L1600 480 L0 480 Z" fill="#ffffff" fill-opacity="0.10"/>

  <!-- İnce EKG çizgisi -->
  <polyline points="0,250 380,250 420,250 440,226 462,276 486,180 510,300 532,240 552,250 900,250 930,250 950,230 968,268 990,200 1012,286 1030,244 1048,250 1600,250"
            fill="none" stroke="url(#fadeRight)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Soyut ağ / teknoloji çizgileri -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <path d="M1180 90 L1290 140 L1400 96 L1490 160 L1560 120"/>
    <path d="M1290 140 L1330 210 L1450 220 L1490 160"/>
    <path d="M1180 90 L1150 170 L1240 200 L1330 210"/>
    <circle cx="1450" cy="300" r="120" stroke-opacity="0.10"/>
    <circle cx="1450" cy="300" r="180" stroke-opacity="0.07"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45">
    <circle cx="1180" cy="90" r="3.5"/>
    <circle cx="1290" cy="140" r="4"/>
    <circle cx="1400" cy="96" r="3"/>
    <circle cx="1490" cy="160" r="4"/>
    <circle cx="1560" cy="120" r="3"/>
    <circle cx="1330" cy="210" r="3"/>
    <circle cx="1450" cy="220" r="3.5"/>
    <circle cx="1150" cy="170" r="2.5"/>
    <circle cx="1240" cy="200" r="2.5"/>
  </g>

  <!-- Sol üstte hafif artı (tıbbi) motifi -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="96" y="54" width="18" height="58" rx="4"/>
    <rect x="76" y="74" width="58" height="18" rx="4"/>
    <rect x="222" y="120" width="10" height="32" rx="3"/>
    <rect x="211" y="131" width="32" height="10" rx="3"/>
  </g>
</svg>
