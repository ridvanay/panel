<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <title>Modern Mimarlık &amp; İnşaat — Şablon Önizleme Mockup'ı</title>
  <desc>
    Admin paneli "Hazır Şablonlar" galeri kartı için soyut kompozit mockup. Gerçek metin/görsel
    içermez; yalnızca şablonun bölüm ritmini (koyu header, gradyanlı hero, krem hizmet kartları,
    koyu footer) palet renkleriyle temsil eder. ui-designer TASARIM SPESİFİKASYONU olarak üretti —
    NIHAI preview.webp'ye dönüştürme backend-agent/frontend-agent'ın işidir (bkz. DESIGN-NOTES.md
    "Önizleme görseli" bölümü); bu SVG çalışma zamanında SERVİS EDİLMEZ, yalnızca kaynak/referanstır.
  </desc>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C4B42"/>
      <stop offset="100%" stop-color="#1F2124"/>
    </linearGradient>
  </defs>

  <!-- Sayfa zemini -->
  <rect x="0" y="0" width="1200" height="750" fill="#F6F5F2"/>

  <!-- Header (secondaryColor, sticky koyu bar) -->
  <rect x="0" y="0" width="1200" height="56" fill="#1F2124"/>
  <rect x="32" y="20" width="120" height="16" rx="3" fill="#F6F5F2"/>
  <rect x="640" y="24" width="60" height="8" rx="2" fill="#9AA0A6"/>
  <rect x="720" y="24" width="60" height="8" rx="2" fill="#9AA0A6"/>
  <rect x="800" y="24" width="60" height="8" rx="2" fill="#9AA0A6"/>
  <rect x="1040" y="16" width="128" height="24" rx="12" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!-- Hero (gradyan, sol-alt başlık + pill CTA) -->
  <rect x="0" y="56" width="1200" height="290" fill="url(#heroGrad)"/>
  <rect x="48" y="220" width="90" height="20" rx="10" fill="#C9A227" opacity="0.25"/>
  <rect x="48" y="256" width="420" height="22" rx="3" fill="#FFFFFF"/>
  <rect x="48" y="286" width="320" height="14" rx="3" fill="#FFFFFF" opacity="0.7"/>
  <rect x="48" y="312" width="150" height="26" rx="13" fill="#1F2124" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="1080" cy="180" r="70" fill="#C9A227" opacity="0.08"/>
  <g stroke="#C9A227" stroke-width="1.5" fill="none" opacity="0.3">
    <rect x="980" y="160" width="50" height="120"/>
    <rect x="1050" y="120" width="40" height="160"/>
  </g>
  <circle cx="560" cy="330" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="576" cy="330" r="3" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="592" cy="330" r="3" fill="#FFFFFF" opacity="0.4"/>

  <!-- 3'lü hizmet kartı şeridi -->
  <g>
    <rect x="48" y="382" width="336" height="150" rx="8" fill="#FFFFFF"/>
    <rect x="432" y="382" width="336" height="150" rx="8" fill="#EFE6CE"/>
    <rect x="816" y="382" width="336" height="150" rx="8" fill="#FFFFFF"/>
    <g fill="none" stroke="#1C4B42" stroke-width="1.5">
      <circle cx="216" cy="424" r="16"/>
      <circle cx="600" cy="424" r="16"/>
      <circle cx="984" cy="424" r="16"/>
    </g>
    <rect x="96" y="458" width="240" height="10" rx="2" fill="#1F2124" opacity="0.85"/>
    <rect x="96" y="476" width="200" height="8" rx="2" fill="#1F2124" opacity="0.45"/>
    <rect x="480" y="458" width="240" height="10" rx="2" fill="#1F2124" opacity="0.85"/>
    <rect x="480" y="476" width="200" height="8" rx="2" fill="#1F2124" opacity="0.45"/>
    <rect x="864" y="458" width="240" height="10" rx="2" fill="#1F2124" opacity="0.85"/>
    <rect x="864" y="476" width="200" height="8" rx="2" fill="#1F2124" opacity="0.45"/>
  </g>

  <!-- Portföy grid ipucu -->
  <g>
    <rect x="480" y="566" width="240" height="14" rx="3" fill="#1F2124" opacity="0.8"/>
    <rect x="48" y="600" width="258" height="90" rx="6" fill="#FFFFFF" stroke="#E5E1D8"/>
    <rect x="322" y="600" width="258" height="90" rx="6" fill="#FFFFFF" stroke="#E5E1D8"/>
    <rect x="596" y="600" width="258" height="90" rx="6" fill="#FFFFFF" stroke="#E5E1D8"/>
    <rect x="870" y="600" width="258" height="90" rx="6" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>

  <!-- Footer (koyu, 4 sütun ipucu) -->
  <rect x="0" y="710" width="1200" height="40" fill="#1F2124"/>
  <rect x="48" y="724" width="60" height="10" rx="2" fill="#9AA0A6"/>
  <rect x="330" y="724" width="60" height="10" rx="2" fill="#9AA0A6"/>
  <rect x="612" y="724" width="60" height="10" rx="2" fill="#9AA0A6"/>
  <rect x="894" y="724" width="60" height="10" rx="2" fill="#9AA0A6"/>
</svg>
