<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <title>Global TeleHealth / Online Clinic — Şablon Önizleme Mockup'ı</title>
  <desc>
    Admin paneli "Hazır Şablonlar" galeri kartı için soyut kompozit mockup. Gerçek metin/fotoğraf
    İÇERMEZ (gerçek insan görseli/AI üretimi YASAK — [DTI] §9.3); yalnızca şablonun bölüm ritmini
    (koyu header, sürekli uyarı şeridi, teal→okyanus mavisi gradyanlı hero + randevu ızgarası
    ipucu, güven rozetleri, uzmanlık ızgarası, doktor kartları, koyu footer) palet renkleriyle
    temsil eder — bkz. `.claude/design-notes-telehealth.md`. Bu SVG çalışma zamanında Media boru
    hattından GEÇMEZ, doğrudan statik olarak servis edilir (`modern-architecture`/`ecommerce-pro`
    preview.svg dosyalarıyla AYNI devir-teslim kararı, [DTI] §4.5 tadilatı).
  </desc>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Sayfa zemini -->
  <rect x="0" y="0" width="1200" height="750" fill="#F8FAFC"/>

  <!-- Header (secondaryColor, koyu bar) -->
  <rect x="0" y="0" width="1200" height="56" fill="#0F172A"/>
  <circle cx="24" cy="28" r="5" fill="#0F766E"/>
  <rect x="36" y="20" width="110" height="16" rx="3" fill="#F8FAFC"/>
  <rect x="620" y="24" width="56" height="8" rx="2" fill="#94A3B8"/>
  <rect x="700" y="24" width="56" height="8" rx="2" fill="#94A3B8"/>
  <rect x="780" y="24" width="56" height="8" rx="2" fill="#94A3B8"/>
  <rect x="1030" y="16" width="138" height="24" rx="12" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>

  <!-- Acil durum uyarı şeridi — sürekli, kapatılamaz (design-notes §9.1) -->
  <rect x="0" y="56" width="1200" height="20" fill="#FEF3C7"/>
  <circle cx="450" cy="66" r="6" fill="none" stroke="#92400E" stroke-width="1.4"/>
  <line x1="450" y1="63" x2="450" y2="67" stroke="#92400E" stroke-width="1.4"/>
  <circle cx="450" cy="70" r="0.8" fill="#92400E"/>
  <rect x="470" y="62" width="260" height="8" rx="2" fill="#92400E" opacity="0.75"/>

  <!-- Hero (teal→okyanus mavisi gradyan, 76-330) -->
  <rect x="0" y="76" width="1200" height="254" fill="url(#heroGrad)"/>
  <rect x="48" y="112" width="190" height="20" rx="10" fill="#FFFFFF" opacity="0.18"/>
  <rect x="48" y="148" width="460" height="26" rx="4" fill="#FFFFFF"/>
  <rect x="48" y="184" width="330" height="13" rx="2" fill="#FFFFFF" opacity="0.75"/>
  <rect x="48" y="212" width="168" height="34" rx="17" fill="#FFFFFF"/>

  <!-- EKG / nabız çizgisi (tele-sağlık motifi) -->
  <path d="M 700 200 L 750 200 L 768 158 L 788 242 L 806 200 L 880 200" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>

  <!-- Yumuşak derinlik glow -->
  <circle cx="1080" cy="130" r="90" fill="#FFFFFF" opacity="0.06"/>

  <!-- Mini randevu slot ızgarası ipucu -->
  <g>
    <rect x="960" y="224" width="192" height="76" rx="10" fill="#FFFFFF" opacity="0.10"/>
    <rect x="972" y="236" width="44" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <rect x="1026" y="236" width="44" height="18" rx="9" fill="#FFFFFF"/>
    <rect x="1080" y="236" width="44" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <rect x="972" y="264" width="44" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <rect x="1026" y="264" width="44" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <rect x="1080" y="264" width="44" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>
  </g>

