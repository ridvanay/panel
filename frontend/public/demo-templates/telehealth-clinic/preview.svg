    </g>
    <rect x="64" y="536" width="136" height="8" rx="2" fill="#0F172A" opacity="0.6"/>
    <rect x="248" y="536" width="136" height="8" rx="2" fill="#0F172A" opacity="0.6"/>
    <rect x="432" y="536" width="136" height="8" rx="2" fill="#0F172A" opacity="0.6"/>
    <rect x="616" y="536" width="136" height="8" rx="2" fill="#0F172A" opacity="0.6"/>
    <rect x="800" y="536" width="136" height="8" rx="2" fill="#0F172A" opacity="0.6"/>
    <rect x="984" y="536" width="136" height="8" rx="2" fill="#0F172A" opacity="0.6"/>
  </g>

  <!-- 4'lü doktor kartı şeridi (572-702) — monogram avatar, GERÇEK insan görseli YOK -->
  <g>
    <rect x="48" y="572" width="258" height="130" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="330" y="572" width="258" height="130" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="612" y="572" width="258" height="130" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="894" y="572" width="258" height="130" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>

    <circle cx="88" cy="612" r="24" fill="url(#avatarGrad)"/>
    <circle cx="370" cy="612" r="24" fill="url(#avatarGrad)"/>
    <circle cx="652" cy="612" r="24" fill="url(#avatarGrad)"/>
    <circle cx="934" cy="612" r="24" fill="url(#avatarGrad)"/>
    <text x="88" y="618" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AY</text>
    <text x="370" y="618" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">MK</text>
    <text x="652" y="618" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">SD</text>
    <text x="934" y="618" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">EK</text>

    <rect x="64" y="654" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>
    <rect x="346" y="654" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>
    <rect x="628" y="654" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>
    <rect x="910" y="654" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>

    <rect x="64" y="670" width="140" height="8" rx="2" fill="#0F172A" opacity="0.45"/>
    <rect x="346" y="670" width="140" height="8" rx="2" fill="#0F172A" opacity="0.45"/>
    <rect x="628" y="670" width="140" height="8" rx="2" fill="#0F172A" opacity="0.45"/>
    <rect x="910" y="670" width="140" height="8" rx="2" fill="#0F172A" opacity="0.45"/>

    <rect x="64" y="688" width="90" height="9" rx="2" fill="#0F766E" opacity="0.85"/>
    <rect x="346" y="688" width="90" height="9" rx="2" fill="#0369A1" opacity="0.85"/>
    <rect x="628" y="688" width="90" height="9" rx="2" fill="#0F766E" opacity="0.85"/>
    <rect x="910" y="688" width="90" height="9" rx="2" fill="#0369A1" opacity="0.85"/>
