  <g>
    <rect x="48" y="478" width="168" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="232" y="478" width="168" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="416" y="478" width="168" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="600" y="478" width="168" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="784" y="478" width="168" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="968" y="478" width="168" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g fill="none" stroke-width="1.5">
      <circle cx="76" cy="502" r="12" stroke="#0F766E"/>
      <circle cx="260" cy="502" r="12" stroke="#0369A1"/>
      <circle cx="444" cy="502" r="12" stroke="#0F766E"/>
      <circle cx="628" cy="502" r="12" stroke="#0369A1"/>
      <circle cx="812" cy="502" r="12" stroke="#0F766E"/>
