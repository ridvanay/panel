  <!-- Footer (koyu, 4 sütun ipucu) -->
  <rect x="0" y="710" width="1200" height="40" fill="#0F172A"/>
  <rect x="48" y="724" width="60" height="10" rx="2" fill="#94A3B8"/>
  <rect x="330" y="724" width="60" height="10" rx="2" fill="#94A3B8"/>
  <rect x="612" y="724" width="60" height="10" rx="2" fill="#94A3B8"/>
