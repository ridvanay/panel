    <rect x="120" y="378" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>
    <rect x="120" y="396" width="220" height="8" rx="2" fill="#0F172A" opacity="0.45"/>
    <rect x="496" y="378" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>
    <rect x="496" y="396" width="220" height="8" rx="2" fill="#0F172A" opacity="0.45"/>
    <rect x="872" y="378" width="180" height="10" rx="2" fill="#0F172A" opacity="0.8"/>
    <rect x="872" y="396" width="220" height="8" rx="2" fill="#0F172A" opacity="0.45"/>
  </g>

