    <rect x="424" y="354" width="352" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="800" y="354" width="352" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g fill="none" stroke="#0F766E" stroke-width="1.6">
