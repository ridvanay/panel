name: CI

# master'a açılan PR'larda ve master'a push'larda tetiklenir (bkz. INFRA.md — branch
# protection kurulumu). `workflow_call` ile deploy.yml (CD) bu workflow'u "pre-deploy
# doğrulama" adımı olarak yeniden kullanır — production'a giden hiçbir kod bu kontrollerden
# geçmeden ilerlemez.
on:
  push:
    branches: [master, main, release]
  pull_request:
    branches: [master, main, release]
  workflow_call:

# Aynı branch/PR için önceki (henüz bitmemiş) CI çalışmasını iptal eder — kaynak israfını önler.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # tests/setup/global-setup.ts, saas_test veritabanını localhost:5432'deki postgres/postgres
    # kimlik bilgileriyle (bkz. backend/tests/setup/global-setup.ts) kendisi oluşturup migrate
    # ediyor — bu yüzden servis container'ı bu kimlik bilgileriyle ayağa kalkmalı.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # NOT: Bu adım job-level DATABASE_URL set ETMEZ, sadece bu tek adıma özel env kullanır.
      # Aksi halde process.env.DATABASE_URL, aşağıdaki "Test" adımında .env.test'in
      # (dotenv, var olan process.env değişkenlerini override etmez) DATABASE_URL=saas_test
      # değerini geçersiz kılar ve testler yanlış veritabanına bağlanır.
      - name: Prisma migrate deploy (sanity check — migration'ların temiz bir DB'ye uygulandığını doğrular)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # tests/setup/env.ts .env.test'i yükler (NODE_ENV=test, DATABASE_URL=saas_test);
      # tests/setup/global-setup.ts saas_test DB'sini yukarıdaki aynı Postgres servisinde
      # oluşturup migrate eder.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # src/lib/env.ts zaten bu değerleri varsayılan olarak kullanıyor — burada açıkça
          # veriliyor ki CI ortamı ile lokal/.env.local.example arasında sürüklenme olmasın.
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Registry'ye push YAPMAZ — sadece Dockerfile'ların bozulmadığını doğrular
      # (build cache GitHub Actions cache backend'i ile hızlandırılır).
      - name: Build image (verification only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: saas-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
