<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Ferah Ev Yaşam – Depolama Kategori Kartı (Raf/Izgara Deseni)</title>
  <desc>Üretim kaynağı — çalışma zamanında OKUNMAZ/servis EDİLMEZ. Çıktı build-template-assets.ts::buildEpCategoryCard("grid", ...) ile PNG'ye render edilir.</desc>
  <defs>
    <linearGradient id="bg-depolama" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="900" fill="url(#bg-depolama)"/>
  <!-- düzenli ızgara/raf çizgileri — istiflenmiş dikdörtgen modül deseni, secondaryColor -->
  <g stroke="#0F172A" stroke-width="2" fill="none" opacity="0.2">
    <line x1="192" y1="180" x2="192" y2="720"/>
    <line x1="336" y1="180" x2="336" y2="720"/>
    <line x1="480" y1="180" x2="480" y2="720"/>
    <line x1="624" y1="180" x2="624" y2="720"/>
    <line x1="768" y1="180" x2="768" y2="720"/>
    <line x1="912" y1="180" x2="912" y2="720"/>
    <line x1="1056" y1="180" x2="1056" y2="720"/>
    <line x1="192" y1="180" x2="1056" y2="180"/>
    <line x1="192" y1="288" x2="1056" y2="288"/>
    <line x1="192" y1="396" x2="1056" y2="396"/>
    <line x1="192" y1="504" x2="1056" y2="504"/>
    <line x1="192" y1="612" x2="1056" y2="612"/>
    <line x1="192" y1="720" x2="1056" y2="720"/>
  </g>
</svg>
