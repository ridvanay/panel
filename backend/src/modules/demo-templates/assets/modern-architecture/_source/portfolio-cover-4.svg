<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Modern Mimarlık – Portföy Kapağı 4 (Silüet Kümesi)</title>
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(45 0.5 0.5)">
      <stop offset="0%" stop-color="#1C4B42"/>
      <stop offset="100%" stop-color="#1F2124"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="900" fill="url(#bg4)"/>
