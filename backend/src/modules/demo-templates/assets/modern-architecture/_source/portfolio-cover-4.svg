    <line x1="700" y1="740" x2="840" y2="740"/>
    <line x1="860" y1="520" x2="970" y2="520"/>
    <line x1="860" y1="580" x2="970" y2="580"/>
    <line x1="860" y1="640" x2="970" y2="640"/>
    <line x1="860" y1="700" x2="970" y2="700"/>
    <line x1="990" y1="670" x2="1110" y2="670"/>
    <line x1="990" y1="720" x2="1110" y2="720"/>
