<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Modern Mimarlık – Hakkımızda Görseli</title>
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F5F2"/>
      <stop offset="100%" stop-color="#EFE6CE"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="900" fill="url(#aboutBg)"/>
  <!-- yumuşak "ışık" dairesi -->
  <circle cx="900" cy="220" r="260" fill="#C9A227" opacity="0.12"/>
  <!-- ince çizgi mimari cephe / kat planı motifu -->
  <g stroke="#1C4B42" stroke-width="2" fill="none" opacity="0.55" stroke-linejoin="round" stroke-linecap="round">
    <rect x="300" y="360" width="600" height="420"/>
    <line x1="300" y1="500" x2="900" y2="500"/>
    <line x1="300" y1="640" x2="900" y2="640"/>
    <line x1="450" y1="360" x2="450" y2="780"/>
    <line x1="600" y1="360" x2="600" y2="780"/>
    <line x1="750" y1="360" x2="750" y2="780"/>
    <rect x="330" y="390" width="90" height="80"/>
    <rect x="480" y="390" width="90" height="80"/>
    <rect x="630" y="390" width="90" height="80"/>
    <rect x="780" y="390" width="90" height="80"/>
  </g>
  <!-- ince altın ölçü/kotasyon çizgileri: "blueprint" hissi -->
  <g stroke="#C9A227" stroke-width="1.5" opacity="0.5">
    <line x1="300" y1="820" x2="900" y2="820"/>
    <line x1="300" y1="810" x2="300" y2="830"/>
    <line x1="900" y1="810" x2="900" y2="830"/>
    <line x1="960" y1="360" x2="960" y2="780"/>
    <line x1="950" y1="360" x2="970" y2="360"/>
    <line x1="950" y1="780" x2="970" y2="780"/>
  </g>
</svg>
