# Kök docker-compose.yml — tam yığın (DB + backend + frontend) lokal geliştirme/entegrasyon
# ortamı. Sadece veritabanına ihtiyaç duyan backend geliştirmesi için `backend/docker-compose.yml`
# (db-only) kullanmaya devam edebilirsiniz — bu dosya ikisini birbirinin yerine geçmez, ek bir
# "her şey bir arada" seçenektir. Servisler arasında zero-downtime/rolling deploy stratejisi
# için bkz. INFRA.md.
#
# Kullanım:
#   docker compose up --build
#   Backend:  http://localhost:4000/api/v1  (healthcheck: /api/v1/healthz)
#   Frontend (tarayıcıda AÇILACAK adres): http://siteadi.localhost:3000 (healthcheck host
#     içeriden http://127.0.0.1:3000/api/health ile kontrol eder, bkz. aşağıdaki healthcheck).
#   Hekim portalı (opsiyonel, subdomain izolasyonu): http://doktor.siteadi.localhost:3000
#     (`.claude/architect-scope-doctor-subdomain.md` §6.3/§6.4 — `*.localhost` tarayıcı
#     tarafından otomatik 127.0.0.1'e çözülür, hosts dosyası/yönetici hakkı GEREKMEZ; sade
#     `http://localhost:3000` de hâlâ çalışır ama hekim oturumu sayfa yenilemesinde ölür,
#     çünkü `doktor.localhost` ile `localhost` farklı site sayılır — §6.1 deneyi).
#   LiveKit (Tele-Sağlık görüntülü konsültasyon, YEREL/self-hosted, 2026-09-15 — bkz. `livekit`
#     servisinin yorumu ve `backend/.env.example`'daki LiveKit bölümü): ws://siteadi.localhost:7880
#
# NOT: backend servisi `backend/.env` dosyasını `env_file` ile okur — bu dosya repoya girmez
# (.gitignore), her geliştirici kendi `.env.example`'ından türetir.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_dev
    ports:
      - "5432:5432"
    volumes:
      - saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # docker-compose ağında Postgres servisi "db" host adıyla erişilir — .env'deki
      # DATABASE_URL genelde localhost'a işaret eder, burada override edilir.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/saas_dev?schema=public
      # DOCTOR_FRONTEND_URL BİLİNÇLİ OLARAK burada override EDİLMEZ (FRONTEND_URL ile AYNI
      # gerekçe, bkz. aşağıdaki not): opsiyonel bir CORS allow-list origin'idir, `backend/.env`
      # (env_file'dan, `.env.example`'daki güncel `siteadi.localhost` değeriyle) zaten doğru
      # tarayıcı-erişilebilir değeri taşır — burada hardcode etmek, `NEXT_PUBLIC_DOCTOR_URL`
      # tanımsızken subdomain modunu kapatan geriye dönük uyumluluk anahtarını (bkz.
      # `.claude/architect-scope-doctor-subdomain.md` §3.4) `environment:` bloğunun `env_file`'a
      # göre önceliği yüzünden devre dışı bırakılamaz hale getirirdi.
      PORT: 4000
      # env_file (.env) NODE_ENV=development taşıyor ve env_file, environment'tan ÖNCE
      # işlense de compose bu bloktaki değeri üstün tutar — Dockerfile'daki
      # `ENV NODE_ENV=production`'ın .env tarafından ezilmemesi için burada da açıkça set edilir
      # (aksi halde production'a özgü zorunlu kontroller — bkz. src/lib/keys.ts JWT anahtarı,
      # SMTP zorunluluğu — devre dışı kalır ve her restart'ta geçici JWT anahtarı üretilir).
      NODE_ENV: production
      # KRİTİK: FRONTEND_URL BURADA OVERRIDE EDİLMEZ — bu değer CORS `origin` kontrolünü
      # (plugins/security.ts) VE kullanıcıya giden e-posta/checkout/davet linklerini de besliyor,
      # hepsi TARAYICININ eriştiği adrese (backend/.env'deki varsayılan http://localhost:3000)
      # ihtiyaç duyar. Önceki bir turda bu buraya `http://frontend:3000` (Docker ağ adı) olarak
      # set edilmişti — bu, revalidation webhook'unu düzeltirken CORS'u kırdı (tarayıcının
      # Origin'i asla "http://frontend:3000" olamaz, dolayısıyla TÜM istekler — login DAHİL —
      # preflight'ta reddedilip ağ hatası gibi görünüyordu). Doğru çözüm: aşağıdaki AYRI,
      # SUNUCUDAN SUNUCUYA özel değişken.
      #
      # DATABASE_URL ile AYNI gerekçe: backend/.env'deki bu değer container'ın İÇİNDEN bakınca
      # kendisini işaret eder, frontend servisini DEĞİL — src/lib/revalidate.ts'in on-demand ISR
      # webhook'u (POST /api/revalidate) SADECE bunu kullanır, CORS/e-posta linklerini ETKİLEMEZ.
      INTERNAL_FRONTEND_URL: http://frontend:3000
      # LiveKit (Tele-Sağlık, YEREL/self-hosted geliştirme — 2026-09-15 kararı, bkz. aşağıdaki
      # `livekit` servisi ve `backend/.env.example`'daki güncellenmiş LiveKit yorumu). DATABASE_URL
      # İLE AYNI gerekçeyle burada `environment:` ile override edilir (env_file: ./backend/.env
      # zaten bu üçünü taşıyabilir, ama bu compose'un kendi kendine yeten/tekrarlanabilir bir
      # "clone edip `docker compose up` de, LiveKit dahil her şey çalışsın" deneyimi sunması
      # hedeflendi). NOT: backend, token üretimi için LiveKit sunucusuna ağ üzerinden HİÇ
      # bağlanmaz (`src/modules/telehealth/lib/livekit.ts::createMeetingToken()` JWT'yi
      # `livekit-server-sdk`'nin `AccessToken` sınıfıyla tamamen yerel imzalar) — bu yüzden
      # LIVEKIT_URL container-içi bir ağ adı (`ws://livekit:7880`) DEĞİL, TARAYICININ erişeceği
      # `ws://siteadi.localhost:7880` olmalı (bu değer olduğu gibi `serverUrl` alanı olarak
      # tarayıcıya döner, bkz. FRONTEND_URL'in yukarıdaki notuyla AYNI "sunucu-taraflı config ama
      # tarayıcı-erişilebilir değer" deseni). Anahtarlar aşağıdaki `livekit` servisinin
      # `--keys` argümanıyla BİREBİR eşleşmeli.
      LIVEKIT_URL: ws://siteadi.localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret_livekit_local_dev_key_32bytes
    ports:
      - "4000:4000"
    volumes:
      # Yerel medya deposu (STORAGE_DRIVER=local) container yeniden oluşturulduğunda kaybolmasın.
      - saas_uploads:/app/uploads
      # Tele-Sağlık ÖZEL (private) belge deposu — sağlık verisi (şikâyet notu eki, reçete/tahlil/
      # radyoloji belgesi). BİLİNÇLİ OLARAK `saas_uploads`tan (yukarıdaki satır) AYRI, KENDİ
      # named volume'ü — `PRIVATE_UPLOAD_DIR`, `/app/uploads`ın (public, `@fastify/static` ile
      # auth'suz servis edilen) ALT DİZİNİ DEĞİLDİR, kardeş bir dizindir (`/app/storage/
      # private-uploads`). Bu volume `/app/uploads` içine MOUNT EDİLMEZ — aksi halde
      # `@fastify/static`'in `root: UPLOAD_DIR` taraması onu da servis eder ve KVKK md.6 özel
      # nitelikli veri koruması sessizce delinir (bkz. .claude/compliance-notes-telehealth.md
      # "TUR 2" KRİTİK ŞART). Backup stratejisi ve dosya izinleri için INFRA.md.
      - saas_private_uploads:/app/storage/private-uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tarayıcı doğrudan host'taki 4000 portuna erişir (backend container'ının iç ağ adı
        # "backend" tarayıcıdan çözülemez) — bu yüzden localhost, docker network adı değil.
        # Host şeması `.claude/architect-scope-doctor-subdomain.md` §6.3/§6.4 kararınca
        # `siteadi.localhost`'a taşındı — hekim portalı (`/doctor/**`) subdomain izolasyonunun
        # refresh çerezi (SameSite=Strict) taşıyabilmesi için frontend ve backend'in AYNI kayıt
        # edilebilir üst alan adı altında olması ZORUNLUDUR (§6.1 deneyi, §6.2 kararı) — bu artık
        # yalnızca bare-metal değil, Docker Compose için de geçerlidir (tarayıcı ikisinde de aynı
        # host şemasını görür).
        NEXT_PUBLIC_API_URL: http://siteadi.localhost:4000/api/v1
        NEXT_PUBLIC_SITE_URL: http://siteadi.localhost:3000
        # Hekim portalı (`/doctor/**`) subdomain izolasyonu — YENİ. NEXT_PUBLIC_SITE_URL ile AYNI
        # desen (build-time inline edilir, runtime `environment:` YETMEZ). TANIMSIZ bırakılırsa
        # özelliğin tamamı devre dışı kalır (§3.4 geriye dönük uyumluluk) — bu compose şablonunda
        # özelliği örneklemek için dolu bırakıldı.
        NEXT_PUBLIC_DOCTOR_URL: http://doktor.siteadi.localhost:3000
        # DİĞER İKİSİNİN TAM TERSİ: bu SADECE next/image'in KENDİ sunucu-taraflı optimize fetch'i
        # (frontend container'ının İÇİNDE çalışır, `/_next/image` route'u) içindir — backend'in
        # `Media.url`'i tarayıcıya göre mutlaklaştırdığı `localhost:4000`'e o container'dan
        # ULAŞILAMAZ (INTERNAL_API_URL'in server-fetch için çözdüğü AYNI sorun, bkz. o satırın notu
        # ve frontend/src/lib/env.ts::INTERNAL_MEDIA_ORIGIN). Tarayıcı bu host'u HİÇBİR ZAMAN
        # doğrudan çözmeye çalışmaz (next/image optimize edilen görseller için DAİMA aynı-origin
        # `/_next/image?url=...` ister) — bu yüzden `INTERNAL_API_URL`'in aksine NEXT_PUBLIC_*
        # build-arg'ı olması güvenlidir/gereklidir (bkz. frontend/src/lib/image-hosts.ts notu).
        NEXT_PUBLIC_INTERNAL_MEDIA_URL: http://backend:4000
    # backend servisiyle AYNI desen (bkz. dosya başındaki NOT) — frontend/.dockerignore
    # `.env*`'i imaja HİÇ almaz (bkz. src/app/api/revalidate/route.ts'in REVALIDATE_SECRET'ı),
    # bu yüzden runtime env'i env_file ile enjekte etmek gerekiyor.
    env_file:
      - ./frontend/.env.local
    environment:
      # Next.js'in SUNUCU TARAFI kodu (Server Component'ler, proxy.ts, lib/api/server-*.ts)
      # frontend container'ının İÇİNDE Node.js runtime'ında çalışır — yukarıdaki
      # NEXT_PUBLIC_API_URL (localhost:4000) sadece TARAYICI için doğrudur, container'ın kendi
      # localhost'unda backend dinlemiyor. Sunucu taraflı fetch'ler backend'e Docker network adı
      # ("backend") üzerinden erişmeli. NEXT_PUBLIC_* olmadığı için build-time inline edilmez,
      # istek anında process.env.INTERNAL_API_URL ile okunur.
      INTERNAL_API_URL: http://backend:4000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # LiveKit (Tele-Sağlık görüntülü konsültasyon) — YEREL/self-hosted geliştirme seçeneği,
  # 2026-09-15 KARARI (bkz. `backend/.env.example`'daki güncellenmiş LiveKit yorumu): önceki
  # mimari karar ("LiveKit sunucusu bu compose'a DAHİL DEĞİLDİR ve self-host EDİLMEYECEKTİR")
  # BİLİNÇLİ OLARAK tersine çevrildi — bu artık LiveKit Cloud/harici kuruluma bir ALTERNATİF
  # DEĞİL, yerel geliştirme için EK bir seçenektir. Production'da HÂLÂ LiveKit Cloud
  # (https://cloud.livekit.io) veya harici, doğru şekilde ölçeklenmiş bir kurulum ÖNERİLİR — bu
  # tek-node `--dev` modu SADECE tek makinelik yerel geliştirme için uygundur (TURN kapalı,
  # sabit tek UDP portu, tek node — prod'da yatay ölçekleme/TURN/TLS gerektirir).
  #
  # `backend`'in `depends_on`una eklenmez: backend, token üretimi için LiveKit sunucusuna ağ
  # üzerinden HİÇ bağlanmaz (`backend/src/modules/telehealth/lib/livekit.ts` JWT'yi tamamen
  # yerel imzalar, integration-agent'ın TEK SAHASI — bu compose dosyası o dosyaya dokunmaz).
  #
  # `--dev` modu: tek-node yerel senaryo için LiveKit'in kendi resmi kısayolu — sabit tek bir
  # UDP portu (7882) kullanır, TURN'ü kapatır, loopback/tek-node `node_ip` çözümlemesini
  # basitleştirir (self-host'ta en yaygın tuzak: sinyalleşme başarılı olur ama doğru
  # node_ip/UDP port yapılandırması yoksa kamera/mikrofon medyası karşı tarafa HİÇBİR ZAMAN
  # ulaşmaz — `--dev` bunu ortadan kaldırır). `--keys` argümanı `--dev`'in kendi varsayılan
  # `devkey`/`secret` çiftini, backend'in yukarıdaki LIVEKIT_API_KEY/LIVEKIT_API_SECRET
  # değerleriyle BİREBİR eşleşen özel bir anahtar/sır çiftiyle EZER.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command:
      - "--dev"
      - "--keys"
      - "devkey: secret_livekit_local_dev_key_32bytes"
    ports:
      - "7880:7880"     # HTTP/WebSocket sinyalleşme — LIVEKIT_URL (ws://siteadi.localhost:7880) bunu gösterir
      - "7881:7881"     # TCP — ICE/TURN fallback
      - "7882:7882/udp" # WebRTC medyası (RTP/UDP) — `--dev` modunun sabit tek-node UDP mux portu.
                         # BU SATIR OLMADAN sinyalleşme/token üretimi çalışır GÖRÜNÜR ama
                         # kamera/mikrofon akışı container dışına ASLA çıkamaz (yaygın self-host
                         # tuzağı, bkz. yukarıdaki not).

volumes:
  saas_pgdata:
  saas_uploads:
  # Tele-Sağlık private belge deposu (sağlık verisi) — bkz. backend servisinin volumes bloğundaki
  # yorum ve INFRA.md "Tele-Sağlık özel (private) belge deposu" bölümü.
  saas_private_uploads:
